name: One-shot Finish Turn React bridge

on:
  push:
    branches:
      - agent/battle-input-responsive-consistency-v3
    paths:
      - .github/workflows/one-shot-finish-turn-react-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/battle-input-responsive-consistency-v3
          fetch-depth: 0

      - name: Patch battle state bridge
        run: python .github/scripts/patch-finish-turn-react-bridge.py

      - name: Commit patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/patch-finish-turn-react-bridge.py
          rm .github/workflows/one-shot-finish-turn-react-bridge.yml
          git config user.name aurevane-release-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix: hand Finish Turn directly to battle state"
          git push origin HEAD:agent/battle-input-responsive-consistency-v3
