name: Format semantic battle log branch

on:
  push:
    branches:
      - agent/battle-log-semantic-colors

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-log-semantic-colors
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed Battle Log files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-log-feed.module.css \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-runtime-context.tsx \
            apps/web/src/components/battle/battle-status-effect-assist.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx
      - name: Commit formatting
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-log-feed.module.css \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-runtime-context.tsx \
            apps/web/src/components/battle/battle-status-effect-assist.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format semantic battle log files"
          git push origin HEAD:agent/battle-log-semantic-colors
