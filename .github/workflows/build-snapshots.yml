name: Shared Build Snapshots

on:
  pull_request:
    paths:
      - 'packages/game-core/src/combat/build-snapshot.ts'
      - 'packages/game-core/src/combat/build-snapshot.test.ts'
      - 'packages/game-core/src/combat/recruit-ai.ts'
      - 'packages/game-core/package.json'
      - 'apps/web/src/server/character/character-combat-build-snapshot.ts'
      - 'apps/web/src/server/character/character-combat-build-snapshot.test.ts'
      - 'apps/web/src/server/battle/build-snapshotted-battle-session-repository.ts'
      - 'apps/web/src/server/battle/build-snapshotted-battle-session-repository.test.ts'
      - 'apps/web/src/server/battle/battle-session-service.ts'
      - 'apps/web/src/server/battle/battle-session-service.test.ts'
      - 'apps/web/src/server/battle/pvp-lobby-quality-service.ts'
      - 'apps/web/src/server/battle/pvp-lobby-quality-service.test.ts'
      - 'apps/web/src/app/api/battles/route.ts'
      - 'apps/web/src/app/api/pvp/lobbies/[lobbyId]/start/route.ts'
      - '.github/workflows/build-snapshots.yml'
  push:
    branches:
      - main
      - 'agent/p3-7-*'
    paths:
      - 'packages/game-core/src/combat/build-snapshot.ts'
      - 'packages/game-core/src/combat/build-snapshot.test.ts'
      - 'packages/game-core/src/combat/recruit-ai.ts'
      - 'packages/game-core/package.json'
      - 'apps/web/src/server/character/character-combat-build-snapshot.ts'
      - 'apps/web/src/server/character/character-combat-build-snapshot.test.ts'
      - 'apps/web/src/server/battle/build-snapshotted-battle-session-repository.ts'
      - 'apps/web/src/server/battle/build-snapshotted-battle-session-repository.test.ts'
      - 'apps/web/src/server/battle/battle-session-service.ts'
      - 'apps/web/src/server/battle/battle-session-service.test.ts'
      - 'apps/web/src/server/battle/pvp-lobby-quality-service.ts'
      - 'apps/web/src/server/battle/pvp-lobby-quality-service.test.ts'
      - 'apps/web/src/app/api/battles/route.ts'
      - 'apps/web/src/app/api/pvp/lobbies/[lobbyId]/start/route.ts'
      - '.github/workflows/build-snapshots.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exact formatting diff
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/build-snapshotted-battle-session-repository.ts \
            apps/web/src/server/battle/build-snapshotted-battle-session-repository.test.ts \
            apps/web/src/server/battle/pvp-lobby-quality-service.test.ts
          git diff -- \
            apps/web/src/server/battle/build-snapshotted-battle-session-repository.ts \
            apps/web/src/server/battle/build-snapshotted-battle-session-repository.test.ts \
            apps/web/src/server/battle/pvp-lobby-quality-service.test.ts
          exit 1
