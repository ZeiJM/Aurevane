name: Shared Build Snapshots

on:
  push:
    branches:
      - 'agent/p3-7-*'
    paths:
      - 'packages/game-core/src/combat/build-snapshot.ts'
      - 'packages/game-core/src/combat/build-snapshot.test.ts'
      - '.github/workflows/build-snapshots.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exact formatting diff
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/build-snapshot.ts \
            packages/game-core/src/combat/build-snapshot.test.ts
          git diff -- \
            packages/game-core/src/combat/build-snapshot.ts \
            packages/game-core/src/combat/build-snapshot.test.ts
          exit 1
