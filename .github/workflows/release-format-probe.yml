name: Release format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/web/e2e/battle-wasd-backtracking.pw.ts \
            apps/web/e2e/character-favorite-techniques.pw.ts \
            apps/web/e2e/discipline-sigil-art.pw.ts \
            apps/web/e2e/pvp-move-backtracking.pw.ts
          git diff -- \
            apps/web/e2e/battle-wasd-backtracking.pw.ts \
            apps/web/e2e/character-favorite-techniques.pw.ts \
            apps/web/e2e/discipline-sigil-art.pw.ts \
            apps/web/e2e/pvp-move-backtracking.pw.ts
