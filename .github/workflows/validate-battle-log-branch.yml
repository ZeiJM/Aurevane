name: Validate battle log branch

on:
  push:
    branches:
      - agent/battle-log-narrative-polish

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        run: |
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-log-presentation.ts \
            apps/web/src/components/battle/battle-log-presentation.test.ts
      - name: Lint changed files
        run: |
          pnpm exec eslint \
            apps/web/src/components/battle/battle-log-presentation.ts \
            apps/web/src/components/battle/battle-log-presentation.test.ts \
            --max-warnings=0
      - name: Run battle log presentation tests
        run: pnpm --filter @aurevane/web exec vitest run src/components/battle/battle-log-presentation.test.ts
      - name: Typecheck web app
        run: pnpm --filter @aurevane/web typecheck
