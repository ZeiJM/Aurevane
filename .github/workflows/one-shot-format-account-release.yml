name: One-shot account release formatter

on:
  push:
    branches:
      - release/account-safety-20260823

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/account-safety-20260823
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format account release files
        run: pnpm exec prettier --write apps/web/e2e/account-entry.pw.ts apps/web/src/components/account/account-access-panel.tsx apps/web/e2e/pv1f-test-helpers.ts
      - name: Commit formatting
        run: |
          git config user.name "AUREVANE Format Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/e2e/account-entry.pw.ts apps/web/src/components/account/account-access-panel.tsx apps/web/e2e/pv1f-test-helpers.ts
          git diff --cached --quiet && exit 0
          git commit -m "Format account safety release"
          git push origin HEAD:release/account-safety-20260823
