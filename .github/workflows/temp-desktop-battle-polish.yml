name: Temporary desktop battle polish helper

on:
  push:
    branches:
      - fix/desktop-battle-header-log-polish-20260824

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-battle-header-log-polish-20260824
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply surgical desktop battle changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/web/src/components/battle/desktop-battle-log-dock.tsx',
              'const [open, setOpen] = useState(true)',
              'const [open, setOpen] = useState(false)',
          )

          log_css = Path('apps/web/src/components/battle/battle-log-panel.module.css')
          log_css.write_text(log_css.read_text() + r'''

          /* desktop-integrated-log-v2: reserve a comfortable reading lane inside the battlefield
             while keeping the board and combatant rails on their own pointer/layout planes. */
          @media (min-width: 821px) {
            :global(#battlefield[data-desktop-battle-log-open='true']) {
              --battle-log-dock-width: clamp(14rem, 16.5vw, 18.5rem);
            }

            :global(#battlefield[data-desktop-battle-log-open='true'] > div:first-child) {
              padding-right: calc(var(--battle-log-dock-width) + 1rem) !important;
              padding-left: clamp(0.38rem, 0.7vw, 0.68rem) !important;
            }

            :global(#battlefield[data-desktop-battle-log-open='true'] > [data-docked-battle-log='true']) {
              top: 0.72rem !important;
              right: 0.72rem !important;
              bottom: 2.72rem !important;
              width: var(--battle-log-dock-width) !important;
            }
          }

          .docked .panel {
            border-color: rgba(207, 169, 93, 0.36);
            border-radius: var(--av-radius-md);
            background:
              radial-gradient(circle at 100% 0, rgba(207, 169, 93, 0.055), transparent 11rem),
              linear-gradient(180deg, rgba(7, 10, 14, 0.975), rgba(4, 7, 10, 0.965));
            box-shadow:
              inset 0 0 0 1px rgba(255, 255, 255, 0.018),
              0 0.55rem 1.5rem rgba(0, 0, 0, 0.24);
          }

          .docked .panel header {
            padding: 0.56rem 0.68rem;
            border-bottom-color: rgba(207, 169, 93, 0.18);
            background: linear-gradient(180deg, rgba(207, 169, 93, 0.045), rgba(255, 255, 255, 0.012));
          }
          ''')

          spectator_css = Path('apps/web/src/components/battle/pvp-battle-chat-bridge.module.css')
          spectator_css.write_text(spectator_css.read_text() + r'''

          /* desktop-footer-utility-shape-v2 */
          @media (min-width: 821px) {
            :global(main[data-pvp-battle='true'] > footer) .footerPresenceButton {
              min-height: 2.05rem !important;
              padding: 0.38rem 0.72rem !important;
              border-radius: 999px !important;
            }
          }
          ''')

          pvp_header_css = Path('apps/web/src/components/battle/battle-stabilization-polish.module.css')
          pvp_header_css.write_text(pvp_header_css.read_text() + r'''

          /* desktop-centered-header-v3: equal outer tracks keep AP + Victory truly centered while
             Battle identity and Round / Combat Log remain independently anchored. */
          @media (min-width: 821px) {
            :global(main[data-pvp-battle='true'][data-pvp-desktop-parity='true'] > header) {
              grid-template-columns:
                minmax(10rem, 1fr)
                minmax(22rem, 28rem)
                8.4rem
                minmax(10rem, 1fr) !important;
              gap: 0.55rem !important;
            }

            :global(main[data-pvp-battle='true'][data-pvp-desktop-parity='true'] > header > :first-child) {
              grid-column: 1 !important;
              justify-self: start !important;
            }

            :global([data-pvp-header-economy='true']) {
              grid-column: 2 !important;
              grid-row: 1 !important;
              width: 100% !important;
              max-width: none !important;
              justify-self: stretch !important;
            }

            :global([data-pvp-header-victory-mirror='true']) {
              grid-column: 3 !important;
              grid-row: 1 !important;
              width: 8.4rem !important;
              min-width: 8.4rem !important;
              min-height: 2.2rem !important;
              justify-self: stretch !important;
              border-radius: 999px !important;
            }

            :global(
              main[data-pvp-battle='true'][data-pvp-desktop-parity='true']
                > header
                > button:not([data-pvp-header-victory-mirror='true'])
            ) {
              grid-column: 4 !important;
              grid-row: 1 !important;
              justify-self: end !important;
            }
          }
          ''')

          ai_header_css = Path('apps/web/src/components/battle/battle-lesson-coach.module.css')
          ai_header_css.write_text(ai_header_css.read_text() + r'''

          /* desktop-centered-battle-header-v3 */
          @media (min-width: 881px) {
            :global(header:has(> button[aria-label^='Victory conditions'])) {
              grid-template-columns:
                minmax(10rem, 1fr)
                minmax(22rem, 28rem)
                8.4rem
                minmax(10rem, 1fr) !important;
              gap: 0.55rem !important;
            }

            :global(header:has(> button[aria-label^='Victory conditions']) > :first-child) {
              grid-column: 1 !important;
              grid-row: 1 !important;
              justify-self: start !important;
            }

            :global(
              header:has(> button[aria-label^='Victory conditions']) > [data-battle-economy-panel='true']
            ) {
              grid-column: 2 !important;
              grid-row: 1 !important;
              width: 100% !important;
              max-width: none !important;
              justify-self: stretch !important;
            }

            :global(header:has(> button[aria-label^='Victory conditions']) > .guidedReopen) {
              position: static !important;
              grid-column: 3 !important;
              grid-row: 1 !important;
              width: 8.4rem !important;
              min-width: 8.4rem !important;
              min-height: 2.15rem !important;
              align-self: center !important;
              justify-self: stretch !important;
              border-radius: 999px !important;
            }

            :global(
              header:has(> button[aria-label^='Victory conditions']) > button[class*='roundButton']
            ) {
              grid-column: 4 !important;
              grid-row: 1 !important;
              justify-self: end !important;
            }
          }
          ''')

          test_path = 'apps/web/e2e/battle-experience.pw.ts'
          old_log_test = '''  const roundButton = page.getByRole('button', { name: /Round .*Combat Log/ })
          const battleLog = page.getByTestId('battle-log-panel')
          if (testInfo.project.name === 'mobile-chromium') {
            await roundButton.click()
          }
          await expect(battleLog).toBeVisible()
          await expect(battleLog).toContainText(characterName)
          await expect(battleLog).toContainText(/moved|Guard/)
          await expect(battleLog).not.toContainText(/\\bv\\d+\\b/)
          await expect(battleLog).not.toContainText('rollBasisPoints')
          if (testInfo.project.name === 'mobile-chromium') {
            await page.getByRole('button', { name: 'Close battle log' }).click()
          } else {
            await roundButton.click()
            await expect(battleLog).toHaveCount(0)
            await roundButton.click()
            await expect(battleLog).toBeVisible()
          }
          '''
          new_log_test = '''  const roundButton = page.getByRole('button', { name: /Round .*Combat Log/ })
          const battleLog = page.getByTestId('battle-log-panel')
          if (testInfo.project.name === 'mobile-chromium') {
            await roundButton.click()
          } else {
            await expect(battleLog).toHaveCount(0)
            await roundButton.click()
          }
          await expect(battleLog).toBeVisible()
          await expect(battleLog).toContainText(characterName)
          await expect(battleLog).toContainText(/moved|Guard/)
          await expect(battleLog).not.toContainText(/\\bv\\d+\\b/)
          await expect(battleLog).not.toContainText('rollBasisPoints')
          if (testInfo.project.name === 'mobile-chromium') {
            await page.getByRole('button', { name: 'Close battle log' }).click()
          } else {
            await roundButton.click()
            await expect(battleLog).toHaveCount(0)
          }
          '''
          replace_once(test_path, old_log_test, new_log_test)

          header_anchor = '''  await expect(page.getByText(/100 AP/).first()).toBeVisible()
          const fittedBoard = battlefield.locator('[data-board-auto-fit="5x3"]')
          '''
          header_assertion = '''  await expect(page.getByText(/100 AP/).first()).toBeVisible()
          if (testInfo.project.name !== 'mobile-chromium') {
            const geometry = await page.evaluate(() => {
              const track = document.querySelector<HTMLElement>(
                '[role="progressbar"][aria-label="Action Economy remaining"]',
              )
              const economy = track?.parentElement
              const header = economy?.closest('header')
              const victory = header?.querySelector<HTMLButtonElement>(
                'button[aria-label^="Victory conditions"]',
              )
              const round = Array.from(header?.querySelectorAll<HTMLButtonElement>('button') ?? []).find(
                (button) => button.textContent?.includes('Combat Log'),
              )
              if (!header || !economy || !victory || !round) return null
              const headerRect = header.getBoundingClientRect()
              const economyRect = economy.getBoundingClientRect()
              const victoryRect = victory.getBoundingClientRect()
              const roundRect = round.getBoundingClientRect()
              return {
                headerCenter: headerRect.left + headerRect.width / 2,
                pairCenter: (economyRect.left + victoryRect.right) / 2,
                economyRight: economyRect.right,
                victoryLeft: victoryRect.left,
                victoryRight: victoryRect.right,
                victoryHeight: victoryRect.height,
                victoryRadius: Number.parseFloat(window.getComputedStyle(victory).borderTopLeftRadius),
                roundLeft: roundRect.left,
              }
            })
            expect(geometry).not.toBeNull()
            if (geometry) {
              expect(Math.abs(geometry.pairCenter - geometry.headerCenter)).toBeLessThan(3)
              expect(geometry.victoryLeft).toBeGreaterThanOrEqual(geometry.economyRight)
              expect(geometry.roundLeft).toBeGreaterThan(geometry.victoryRight)
              expect(geometry.victoryRadius).toBeGreaterThanOrEqual(geometry.victoryHeight / 2 - 2)
            }
          }
          const fittedBoard = battlefield.locator('[data-board-auto-fit="5x3"]')
          '''
          replace_once(test_path, header_anchor, header_assertion)
          PY
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/battle/desktop-battle-log-dock.tsx
          apps/web/src/components/battle/battle-log-panel.module.css
          apps/web/src/components/battle/pvp-battle-chat-bridge.module.css
          apps/web/src/components/battle/battle-stabilization-polish.module.css
          apps/web/src/components/battle/battle-lesson-coach.module.css
          apps/web/e2e/battle-experience.pw.ts
      - name: Commit product changes and remove helper
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git rm .github/workflows/temp-desktop-battle-polish.yml
          rm -f .github/desktop-battle-polish-trigger
          git add -A
          git commit -m "Apply desktop battle polish batch"
          git push origin HEAD:fix/desktop-battle-header-log-polish-20260824
