name: Resonance Build

on:
  pull_request:
    paths:
      - 'packages/game-core/src/combat/resonance.ts'
      - 'packages/game-core/src/combat/resonance.test.ts'
      - 'packages/game-core/src/combat/pv1f-resonance.ts'
      - 'packages/game-core/src/combat/pv1f-resonance.test.ts'
      - 'packages/game-core/src/combat/pv1f-action-economy.ts'
      - 'packages/game-core/src/combat/pv1f-action-economy.test.ts'
      - 'packages/game-core/src/combat/mature-skills.ts'
      - 'packages/game-core/package.json'
      - 'apps/web/src/server/character/character-build-service.ts'
      - 'apps/web/src/server/character/character-build-service.test.ts'
      - 'apps/web/src/server/character/supabase-character-build-repository.ts'
      - 'apps/web/src/app/game/character/page.tsx'
      - 'apps/web/src/components/character/character-profile-shell.tsx'
      - 'apps/web/src/components/character/character-skill-build-panel.tsx'
      - 'apps/web/src/app/game/battle/[battleSessionId]/page.tsx'
      - 'apps/web/src/components/battle/battle-runtime.ts'
      - 'apps/web/src/components/battle/battle-client-boundary.tsx'
      - 'apps/web/src/components/battle/battle-resonance-indicator.tsx'
      - 'apps/web/src/components/battle/battle-resonance-indicator.module.css'
      - '.github/workflows/resonance-build.yml'
  push:
    branches:
      - main
      - 'agent/p3-5-*'
    paths:
      - 'packages/game-core/src/combat/resonance.ts'
      - 'packages/game-core/src/combat/resonance.test.ts'
      - 'packages/game-core/src/combat/pv1f-resonance.ts'
      - 'packages/game-core/src/combat/pv1f-resonance.test.ts'
      - 'packages/game-core/src/combat/pv1f-action-economy.ts'
      - 'packages/game-core/src/combat/pv1f-action-economy.test.ts'
      - 'packages/game-core/src/combat/mature-skills.ts'
      - 'packages/game-core/package.json'
      - 'apps/web/src/server/character/character-build-service.ts'
      - 'apps/web/src/server/character/character-build-service.test.ts'
      - 'apps/web/src/server/character/supabase-character-build-repository.ts'
      - 'apps/web/src/app/game/character/page.tsx'
      - 'apps/web/src/components/character/character-profile-shell.tsx'
      - 'apps/web/src/components/character/character-skill-build-panel.tsx'
      - 'apps/web/src/app/game/battle/[battleSessionId]/page.tsx'
      - 'apps/web/src/components/battle/battle-runtime.ts'
      - 'apps/web/src/components/battle/battle-client-boundary.tsx'
      - 'apps/web/src/components/battle/battle-resonance-indicator.tsx'
      - 'apps/web/src/components/battle/battle-resonance-indicator.module.css'
      - '.github/workflows/resonance-build.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused formatting
        run: |
          pnpm exec prettier --check \
            packages/game-core/src/combat/resonance.ts \
            packages/game-core/src/combat/resonance.test.ts \
            packages/game-core/src/combat/pv1f-resonance.ts \
            packages/game-core/src/combat/pv1f-resonance.test.ts \
            packages/game-core/package.json \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            'apps/web/src/app/game/battle/[battleSessionId]/page.tsx' \
            apps/web/src/components/battle/battle-runtime.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-resonance-indicator.tsx \
            apps/web/src/components/battle/battle-resonance-indicator.module.css
      - name: Focused lint
        run: |
          pnpm exec eslint \
            packages/game-core/src/combat/resonance.ts \
            packages/game-core/src/combat/resonance.test.ts \
            packages/game-core/src/combat/pv1f-resonance.ts \
            packages/game-core/src/combat/pv1f-resonance.test.ts \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            'apps/web/src/app/game/battle/[battleSessionId]/page.tsx' \
            apps/web/src/components/battle/battle-runtime.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-resonance-indicator.tsx
      - name: Game core typecheck
        run: pnpm --filter @aurevane/game-core typecheck
      - name: Focused web typecheck
        run: |
          trap 'rm -f apps/web/tsconfig.p35-ci.json' EXIT
          cat > apps/web/tsconfig.p35-ci.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "next-env.d.ts",
              ".next/types/**/*.ts",
              "src/server/character/character-build-service.ts",
              "src/server/character/character-build-service.test.ts",
              "src/server/character/supabase-character-build-repository.ts",
              "src/app/game/character/page.tsx",
              "src/components/character/character-profile-shell.tsx",
              "src/components/character/character-skill-build-panel.tsx",
              "src/app/game/battle/[battleSessionId]/page.tsx",
              "src/components/battle/battle-runtime.ts",
              "src/components/battle/battle-client-boundary.tsx",
              "src/components/battle/battle-resonance-indicator.tsx"
            ],
            "exclude": ["node_modules"]
          }
          JSON
          pnpm --filter @aurevane/web exec next typegen
          pnpm --filter @aurevane/web exec tsc --noEmit -p tsconfig.p35-ci.json
      - name: Focused P3.5 tests
        run: |
          pnpm --filter @aurevane/game-core exec vitest run \
            src/combat/resonance.test.ts \
            src/combat/pv1f-resonance.test.ts \
            src/combat/pv1f-action-economy.test.ts \
            src/combat/mature-skills.test.ts
          pnpm --filter @aurevane/web exec vitest run \
            src/server/character/character-build-service.test.ts
      - name: Production workspace build
        run: pnpm build
