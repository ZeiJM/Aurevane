name: One-shot PvP lint fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'preview/finesse-silver-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/finesse-silver-20260821
          fetch-depth: 0
      - name: Schedule the initial rail refresh asynchronously
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/pvp-desktop-parity.tsx')
          text = path.read_text()
          old = """    const focus = () => void refreshBattle()\n    window.addEventListener('focus', focus)\n    void refreshBattle()\n"""
          new = """    const focus = () => void refreshBattle()\n    window.addEventListener('focus', focus)\n    scheduleRefresh()\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected PvP rail refresh block was not found exactly once.')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit lint fix
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/battle/pvp-desktop-parity.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix initial PvP rail refresh scheduling"
          git push origin HEAD:preview/finesse-silver-20260821
