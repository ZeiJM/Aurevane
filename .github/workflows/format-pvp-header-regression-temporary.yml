name: Temporary PvP release formatter

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/fix-pvp-header-board-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-pvp-header-board-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize release files
        run: |
          pnpm exec prettier --write apps/web/e2e/pvp-header-board-parity.pw.ts
          pnpm exec prettier --write apps/web/src/components/battle/pvp-ai-action-visual-parity.module.css
      - name: Commit formatting to feature branch
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/e2e/pvp-header-board-parity.pw.ts apps/web/src/components/battle/pvp-ai-action-visual-parity.module.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format PvP header and action styles"
          git push origin HEAD:agent/fix-pvp-header-board-parity
