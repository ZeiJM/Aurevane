name: One-shot character creation scale formatting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format character creation scale css'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format the blocking CSS file
        run: |
          pnpm exec prettier --write apps/web/src/app/character-creation-scale.css
          rm .github/workflows/format-character-creation-scale-once.yml
      - name: Commit formatting and remove this workflow
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format character creation scale css"
          git push origin HEAD:main
