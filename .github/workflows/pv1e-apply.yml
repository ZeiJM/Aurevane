  max-height: calc(100dvh - 5.5rem);
  isolation: isolate;
}

@media (max-width: 640px) {
  .panel {
    top: calc(4rem + env(safe-area-inset-top, 0px));
  }
}
''')

          # Public/read-only shell gets the same persistent header/footer behavior where present.
          public_css = Path('apps/web/src/components/public-information/public-information-shell.module.css')
          public_css.write_text(public_css.read_text() + r'''

/* PV-1E: persistent shell chrome on public information surfaces. */
.masthead {
  z-index: 500;
}

.footer {
  position: sticky;
  bottom: 0;
  z-index: 450;
  margin-top: var(--av-space-5);
  backdrop-filter: blur(1rem);
}
''')

          # Tactical Hall should read like a compact game launcher rather than a zoomed document.
          launch_css = Path('apps/web/src/components/battle/battle-launch.module.css')
          launch_css.write_text(launch_css.read_text() + r'''

/* PV-1E: denser Tactical Hall framing. */
.page {
  place-items: start center;
  padding: clamp(0.65rem, 1.5vw, 1.25rem);
}

.panel {
  width: min(100%, 86rem);
  grid-template-columns: minmax(11rem, 0.42fr) minmax(0, 1.58fr);
}

.vista,
.vistaImage {
  min-height: 29rem;
}

.copy {
  align-content: start;
  gap: 0.78rem;
  padding: clamp(1rem, 2vw, 1.65rem);
}

.copy h1 {
  font-size: clamp(2rem, 4vw, 3rem);
}

.lede {
  font-size: clamp(0.82rem, 1.2vw, 0.95rem);
  line-height: 1.5;
}

.recordChoice {
  min-height: 6.65rem;
  padding: 0.72rem;
}

.record {
  gap: 0.62rem;
  padding: 0.8rem;
}

.rules span {
  padding: 0.38rem 0.55rem;
  font-size: 0.56rem;
}

.primary,
.secondary {
  min-height: 2.7rem;
  padding: 0.62rem 0.85rem;
}
''')

          # Battle interaction wording, simplified action economy, compact three-column cockpit,
          # direct final-facing commit, and visible movement trail.
          battle_path = 'apps/web/src/components/battle/battle-experience-v2.tsx'
          battle = read(battle_path)
          battle = battle.replace(
              "return `FACING → END TURN · Choose the direction you want to protect, then Confirm. You will end the turn facing ${provisionalFacing} ${facingGlyph(provisionalFacing)}.`",
              "return `FINAL FACING · Choose the direction you want to protect. Selecting a direction immediately ends the turn. Current choice: ${provisionalFacing} ${facingGlyph(provisionalFacing)}.`",
              1,
          )
          battle = battle.replace(
              "'Battle ready. Use Move, then an Action, choose Facing, and End Turn.'",
              "'Battle ready. Move, spend your Action if desired, then choose final Facing to end the turn.'",
              1,
          )
          battle = battle.replace(
              "  const actionReady = currentTurn?.actionState === 'ready'\n  const previewLegal = preview?.preview.legal ?? false\n  const finalTurnLegal = finalTurnPreview?.legal ?? false\n  const planningDisabled =\n    !playerTurn || battleState.lifecycle !== 'active' || commitPending || recruitPending\n  const commandLegal = mode === 'end-turn' ? finalTurnLegal : previewLegal\n  const hasPendingCommand = mode === 'end-turn' ? Boolean(finalTurnPreview) : Boolean(pendingIntent)\n",
              "  const actionReady = currentTurn?.actionState === 'ready'\n  const actionEconomyPercent = playerTurn && actionReady ? 100 : 0\n  const previewLegal = preview?.preview.legal ?? false\n  const planningDisabled =\n    !playerTurn || battleState.lifecycle !== 'active' || commitPending || recruitPending\n",
              1,
          )
          battle = battle.replace(
              "body.finalTurnPreview.legal\n            ? `Ready to end the turn facing ${facing} ${facingGlyph(facing)}. Confirm when you are finished moving and acting.`",
              "body.finalTurnPreview.legal\n            ? `Final-facing mode ready. Choose north, east, south, or west; selecting the direction commits it and ends the turn.`",
              1,
          )
          battle = battle.replace(
              "  const commitFinalTurn = useCallback(async () => {\n    if (commitLock.current || commitPending || !finalTurnPreview?.legal) return\n    commitLock.current = true\n    setCommitPending(true)\n",
              "  const commitFinalTurn = useCallback(async (facingOverride?: Facing) => {\n    const facing = facingOverride ?? provisionalFacing\n    if (commitLock.current || commitPending || (!facingOverride && !finalTurnPreview?.legal)) return\n    commitLock.current = true\n    setCommitPending(true)\n",
              1,
          )
          battle = battle.replace('          facing: provisionalFacing,', '          facing,', 1)
          battle = battle.replace(
              "        `Turn ended facing ${provisionalFacing} ${facingGlyph(provisionalFacing)}. Recruit turn begins.`,",
              "        `Turn ended facing ${facing} ${facingGlyph(facing)}. Recruit turn begins.`,",
              1,
          )
          battle = battle.replace(
              "  const previewFacing = useCallback(\n    (facing: Facing) => {\n      if (!playerTurn || commitPending || recruitPending) return\n      setProvisionalFacing(facing)\n      setMode('end-turn')\n      void requestFinalTurnPreview(facing)\n    },\n    [commitPending, playerTurn, recruitPending, requestFinalTurnPreview],\n  )",
              "  const previewFacing = useCallback(\n    (facing: Facing) => {\n      if (!playerTurn || commitPending || recruitPending) return\n      setProvisionalFacing(facing)\n      setMode('end-turn')\n      setFinalTurnPreview(null)\n      setNotice(`Final facing selected: ${facing} ${facingGlyph(facing)}. Ending turn…`)\n      void commitFinalTurn(facing)\n    },\n    [commitFinalTurn, commitPending, playerTurn, recruitPending],\n  )",
              1,
          )
          battle = battle.replace(
              "      } else if (event.key === 'Enter') {\n        if (mode === 'end-turn' && finalTurnPreview?.legal) {\n          event.preventDefault()\n          void commitFinalTurn()\n        } else if (preview?.preview.legal && pendingIntent) {\n          event.preventDefault()\n          void commitIntent()\n        }\n      }",
              "      } else if (event.key === 'Enter' && preview?.preview.legal && pendingIntent) {\n        event.preventDefault()\n        void commitIntent()\n      }",
              1,
          )

          # Remove the old full-width combat HUD; the same status cards are rehomed beside the board.
          hud_start = battle.index('        <section className={styles.combatHud} aria-label="Combatant status and turn flow">')
          hud_end = battle.index('        <section className={styles.feedbackBanner}', hud_start)
          battle = battle[:hud_start] + battle[hud_end:]

          stage_old = '        <div className={styles.stage}>\n'
          stage_new = '''        <div className={styles.stage}>
          <aside className={styles.playerRail} aria-label="Player and ally status">
            {combatantCard(
              playerCombatant,
              playerPlacement,
              playerStatuses,
              currentTurn?.combatantId === playerId,
              () => setSelectedUnitId(playerId),
            )}
            <div className={styles.turnFlow} aria-label="Action economy">
              <div className={styles.economyHeader}>
                <span>Action Economy</span>
                <strong>{actionEconomyPercent}%</strong>
              </div>
              <div className={styles.economyTrack} aria-hidden="true">
                <span
                  className={styles.economyFill}
                  style={{ width: `${actionEconomyPercent}%` }}
                />
              </div>
              <div className={styles.economyCosts}>
                <span>Move <b>0%</b></span>
                <span>Attack <b>100%</b></span>
                <span>Guard <b>100%</b></span>
                <span>Facing <b>0% + end</b></span>
              </div>
              <small className={styles.economyNote}>
                Movement is a separate positional pool: {playerTurn ? `${currentTurn?.movementRemaining ?? 0}/${currentTurn?.movementMaximum ?? 0}` : 'wait'} remaining.
              </small>
            </div>
          </aside>
'''
          if stage_old not in battle:
              raise SystemExit('Battle stage opening was not found')
          battle = battle.replace(stage_old, stage_new, 1)

          inspector_open = '          <aside className={styles.inspector} aria-label="Context inspector">\n'
          battle = battle.replace(
              inspector_open,
              '''          <div className={styles.enemyRail} aria-label="Enemy status">
            {combatantCard(
              recruitCombatant,
              recruitPlacement,
              recruitStatuses,
              currentTurn?.combatantId === recruitId,
              () => setSelectedUnitId(recruitId),
            )}
            <aside className={styles.inspector} aria-label="Context inspector">
''',
              1,
          )
          battle = battle.replace(
              '          </aside>\n        </div>\n\n        <section className={styles.commandDeck}',
              '            </aside>\n          </div>\n        </div>\n\n        <section className={styles.commandDeck}',
              1,
          )

          battle = battle.replace(
              "                  gridTemplateColumns: `repeat(${tactical.width}, minmax(3.6rem, 1fr))`,\n                  gridTemplateRows: `repeat(${tactical.height}, minmax(3.6rem, 1fr))`,\n                  minWidth: `${Math.max(30, tactical.width * 5.2)}rem`,\n                  aspectRatio: `${tactical.width} / ${tactical.height}`,",
              "                  gridTemplateColumns: `repeat(${tactical.width}, clamp(3.15rem, 4.5vw, 4.6rem))`,\n                  gridTemplateRows: `repeat(${tactical.height}, clamp(3.15rem, 4.5vw, 4.6rem))`,\n                  width: 'max-content',",
              1,
          )
          battle = battle.replace(
              '                  const inPath = pathTiles.has(key)\n',
              '                  const inPath = pathTiles.has(key)\n                  const pathIndex = path.findIndex((point) => positionsEqual(point, tile.position))\n',
              1,
          )
          battle = battle.replace(
              '                      </span>\n                      {placement ? (',
              '                      </span>\n                      {pathIndex > 0 ? (\n                        <span className={styles.pathMarker} aria-hidden="true">{pathIndex}</span>\n                      ) : null}\n                      {placement ? (',
              1,
          )

          battle = battle.replace('<small>Terrain &amp; unit info</small>', '<small>Free · terrain &amp; unit info</small>', 1)
          battle = battle.replace('<small>Green tiles · Action stays READY</small>', '<small>0% Action · uses Movement</small>', 1)
          battle = battle.replace('<small>Spend Action on one enemy</small>', '<small>100% Action · one enemy</small>', 1)
          battle = battle.replace('<small>-20% incoming · spends Action</small>', '<small>100% Action · -20% incoming</small>', 1)
          battle = battle.replace('<strong>Facing / End Turn</strong>\n                <small>Choose direction, then Confirm</small>', '<strong>Finish Turn</strong>\n                <small>0% Action · choose facing to finish</small>', 1)
          battle = battle.replace(
              "                    <strong>{actionReady ? 'READY' : 'SPENT'}</strong>",
              "                    <strong>{actionReady ? '100%' : '0%'}</strong>",
              1,
          )
          battle = battle.replace(
              "              onClick={() => {\n                if (mode === 'end-turn') void commitFinalTurn()\n                else void commitIntent()\n              }}\n              disabled={\n                !hasPendingCommand ||\n                !commandLegal ||\n                previewPending ||\n                commitPending ||\n                recruitPending\n              }\n            >\n              {commitPending ? 'Committing…' : 'Confirm command'} <kbd>Enter</kbd>",
              "              onClick={() => void commitIntent()}\n              disabled={\n                !pendingIntent ||\n                !previewLegal ||\n                previewPending ||\n                commitPending ||\n                recruitPending\n              }\n            >\n              {commitPending ? 'Committing…' : 'Confirm action'} <kbd>Enter</kbd>",
              1,
          )
          write(battle_path, battle)

          battle_css = Path('apps/web/src/components/battle/battle-experience-v2.module.css')
          battle_css.write_text(battle_css.read_text() + r'''

/* PV-1E: compact RPG cockpit with side status rails and a bounded battlefield. */
.content {
  width: min(100%, 90rem);
  gap: 0.7rem;
  padding: clamp(0.55rem, 1.1vw, 0.85rem);
}

.feedbackBanner {
  min-height: 2.7rem;
  padding: 0.5rem 0.65rem;
}

.stage {
  display: grid;
  grid-template-columns: minmax(12.5rem, 15rem) minmax(0, 1fr) minmax(12.5rem, 15rem);
  gap: 0.72rem;
  align-items: start;
}

