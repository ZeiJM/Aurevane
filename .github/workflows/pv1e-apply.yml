  background: rgba(5, 7, 11, 0.97);
  backdrop-filter: blur(0.8rem);
}

@media (max-width: 1180px) {
  .stage {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .battlefield {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .playerRail,
  .enemyRail {
    grid-row: 2;
  }

  .enemyRail .inspector {
    max-height: 22rem;
  }

  .commandBody {
    grid-template-columns: 1fr auto;
  }

