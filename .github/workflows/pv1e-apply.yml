  grid-column: 1 / -1;
  grid-template-columns: auto 1fr;
  min-width: 0;
  justify-content: start;
  justify-items: start;
  padding: 0.35rem 0 0;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  border-left: 0;
}

.turnFlow {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.5rem;
  padding: 0.65rem;
}

.economyHeader {
  display: flex;
