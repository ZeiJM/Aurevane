name: PV-1E consolidated UX correction

on:
  push:
    branches:
      - agent/pv-1e-compact-shell-battle-cockpit

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply PV-1E corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, value: str) -> None:
              Path(path).write_text(value)

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              if old not in source:
                  raise SystemExit(f'Expected source fragment missing in {path}: {old[:100]!r}')
              write(path, source.replace(old, new, 1))

          # Remove the temporary deployment-forcing artifacts now that the corrected preview was promoted.
          marker = Path('apps/web/PRODUCTION_REDEPLOY_MARKER.md')
          if marker.exists():
              marker.unlink()
          replace_once(
              'apps/web/package.json',
              '"version": "0.0.0-pv1-retest"',
              '"version": "0.0.0"',
          )

          # Keep the authenticated shell controls always reachable and fold Practice into Account State navigation.
          shell_path = 'apps/web/src/components/shell/authenticated-game-shell.tsx'
          shell = read(shell_path)
          start = shell.index('          {character ? (\n            <nav className={styles.gameNav}')
          end = shell.index('      </aside>', start)
          replacement = '''          {character ? (
            <nav className={styles.gameNav} aria-label="Character and game navigation">
              <Link href="/game/character">Character Profile</Link>
              <Link href="/game/battle">Tactical Hall</Link>
              <Link href="/game/settings/controls">Controls &amp; Keybinds</Link>
              {practicePlan || trainingReport ? (
                <details className={styles.practiceDrawer} data-testid="practice-drawer">
                  <summary>
                    <span>Wayfarer&apos;s Practice</span>
                    <strong>Training &amp; rested progress</strong>
                  </summary>
                  <div className={styles.practiceBody}>
                    {practicePlan ? <PracticePlanCard practice={practicePlan} /> : null}
                    {trainingReport ? <TrainingReportCard report={trainingReport} /> : null}
                  </div>
                </details>
              ) : null}
            </nav>
          ) : null}
        </Surface>

'''
          shell = shell[:start] + replacement + shell[end:]
          write(shell_path, shell)

          shell_css = Path('apps/web/src/components/shell/authenticated-game-shell.module.css')
          shell_css.write_text(shell_css.read_text() + r'''

/* PV-1E: persistent, denser authenticated game shell. */
.masthead {
  position: sticky;
  top: 0;
  z-index: 500;
  min-height: 4rem;
}

.footer {
  position: sticky;
  bottom: 0;
  z-index: 450;
  min-height: 2.35rem;
  margin-top: 0;
  backdrop-filter: blur(1rem);
}

.main {
  width: min(100%, 96rem);
  gap: 0.9rem;
  padding: clamp(0.75rem, 1.8vw, 1.5rem);
}

.primaryCard {
  min-height: 0;
  padding: clamp(1.25rem, 2.8vw, 2.5rem);
}

.primaryCard h1 {
  margin: 0.6rem 0 0.8rem;
  font-size: clamp(2.25rem, 4vw, 3.8rem);
}

.characterState {
  margin-top: clamp(1rem, 2.5vw, 2rem);
  padding: clamp(1rem, 2vw, 1.5rem);
}

.statusCard {
  padding: clamp(1rem, 2vw, 1.35rem);
}

.gameNav {
  gap: 0.42rem;
}

.practiceDrawer {
  overflow: hidden;
  border: 1px solid var(--av-border);
  border-radius: var(--av-radius-sm);
  color: var(--av-text);
  background: rgba(255, 255, 255, 0.018);
}

.practiceDrawer > summary {
  display: flex;
  min-height: 2.7rem;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
  padding: 0.65rem 0.75rem;
  cursor: pointer;
  list-style: none;
}

.practiceDrawer > summary::-webkit-details-marker {
  display: none;
}

.practiceDrawer > summary::after {
  color: var(--av-brass-300);
  content: '→';
  font: 700 0.65rem/1 var(--av-font-mono);
}

.practiceDrawer[open] > summary::after {
  content: '↓';
}

.practiceDrawer > summary span {
  color: var(--av-brass-300);
  font: 700 0.58rem/1 var(--av-font-mono);
  letter-spacing: 0.035em;
  text-transform: uppercase;
}

.practiceDrawer > summary strong {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.practiceDrawer[open] > summary {
  border-bottom: 1px solid var(--av-border);
  background: rgba(207, 169, 93, 0.055);
}

.practiceBody {
  display: grid;
  gap: 0.65rem;
  max-height: min(35rem, calc(100dvh - 12rem));
  padding: 0.65rem;
  overflow: auto;
}

@media (max-width: 800px) {
  .masthead {
    min-height: 3.75rem;
  }

  .footer {
    min-height: 2.5rem;
  }
}
''')

          # Sound settings must sit above every page layer, not inside the content stacking context.
          audio_css = Path('apps/web/src/components/audio/audio-settings-menu.module.css')
          audio_css.write_text(audio_css.read_text() + r'''

/* PV-1E: sound menu is a true top-layer utility surface. */
.root {
  z-index: 900;
}

.panel {
  position: fixed;
  top: 4.65rem;
  right: max(1rem, env(safe-area-inset-right, 0px));
