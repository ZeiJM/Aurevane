  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.economyHeader strong {
  color: var(--av-brass-200);
  font: 800 0.9rem/1 var(--av-font-mono);
}

.economyTrack {
  height: 0.62rem;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.055);
}

.economyFill {
  display: block;
