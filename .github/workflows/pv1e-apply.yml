  border: 1px solid rgba(255, 255, 255, 0.055);
  border-radius: 0.32rem;
  color: var(--av-text-dim);
  background: rgba(255, 255, 255, 0.018);
  font: 650 0.48rem/1.2 var(--av-font-mono);
