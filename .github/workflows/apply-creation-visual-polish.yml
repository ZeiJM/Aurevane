name: Apply Creation visual polish

on:
  push:
    branches:
      - agent/creation-subject-reconciliation
    paths:
      - .github/workflows/apply-creation-visual-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creation-subject-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Append bounded visual corrections
        shell: bash
        run: |
          css='apps/web/src/components/character/character-creation-experience.module.css'
          ! grep -q 'Subject reconciliation visual polish.' "$css"
          cat >> "$css" <<'CSS'

          /* Subject reconciliation visual polish. */
          .disciplineStep .attributeCard > div:first-child {
            grid-template-columns: minmax(6rem, 0.35fr) minmax(12rem, 1fr) minmax(9rem, 0.6fr);
            gap: 0.65rem;
          }

          .disciplineStep .attributeCard > div:first-child > small:last-child {
            min-width: 0;
          }

          .reviewStep .reviewWorkspace {
            align-items: start;
          }

          .reviewStep .reviewPortrait {
            min-height: 0;
            aspect-ratio: 1;
          }

          .reviewStep .reviewGrid > div {
            background: rgba(255, 253, 247, 0.62);
          }

          .reviewStep .reviewGrid dt {
            color: #776d5f;
          }

          .reviewStep .reviewGrid dd {
            color: #29241d;
          }

          .reviewStep .submitState {
            color: #655f54;
          }

          :is(.disciplineStep, .reviewStep) .actions button:first-child {
            border-color: rgba(94, 73, 42, 0.28);
            color: #3d3426;
            background: rgba(255, 253, 247, 0.62);
          }

          @media (max-width: 760px) {
            .disciplineStep .attributeCard > div:first-child {
              grid-template-columns: 1fr;
            }
          }
          CSS
          pnpm exec prettier --write "$css"
      - name: Verify CSS-only diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'apps/web/src/components/character/character-creation-experience.module.css'
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/components/character/character-creation-experience.module.css
          git commit -m 'ui: polish Creation subject readability'
          git push origin HEAD:agent/creation-subject-reconciliation
