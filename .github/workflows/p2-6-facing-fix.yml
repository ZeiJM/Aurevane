name: P2.6 facing fix

on:
  push:
    branches:
      - agent/p2-6-recruit-ai-tactical-hall

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-6-recruit-ai-tactical-hall
      - name: Skip redundant facing candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/game-core/src/combat/recruit-ai.ts')
          text = path.read_text()
          old = """  if (nearestEnemy) {
    const preferredFacing = facingToward(actorPlacement.position, nearestEnemy.position)
    for (const facing of FACINGS) {
      if (facing !== preferredFacing) continue
      pushCandidate(candidates, profile, {
        intent: { kind: 'face', facing },
        reason: 'face-threat',
        utility: profile.facingUtility + (knowledge.finalFacing === facing ? -4 : 0),
        stableKey: `face:${facing}`,
      })
    }
  }
"""
          new = """  if (nearestEnemy) {
    const preferredFacing = facingToward(actorPlacement.position, nearestEnemy.position)
    if (knowledge.finalFacing !== preferredFacing) {
      pushCandidate(candidates, profile, {
        intent: { kind: 'face', facing: preferredFacing },
        reason: 'face-threat',
        utility: profile.facingUtility,
        stableKey: `face:${preferredFacing}`,
      })
    }
  }
"""
          if old not in text:
              raise SystemExit('Expected facing candidate block not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-core/src/combat/recruit-ai.ts
          git commit -m "P2.6 skip redundant Recruit facing decision"
          git push origin HEAD:agent/p2-6-recruit-ai-tactical-hall
