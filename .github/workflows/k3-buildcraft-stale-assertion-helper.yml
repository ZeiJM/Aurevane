name: K3 Buildcraft Stale Assertion Helper

on:
  push:
    branches:
      - agent/combat-k3-buildcraft-stale-assertion-helper-20260915

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out exact K3 candidate
        shell: bash
        run: |
          git fetch origin agent/combat-k3-effect-provenance-reconcile-20260915
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "1f666c3e340208c39391036b118c25f7ae0c1622"
      - name: Patch stale untargeted Barrier forecast assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/p3-8-representative-buildcraft.pw.ts')
          text = path.read_text()
          old = "  await expect(forecast).toContainText('Guarded')\n  await expect(forecast).not.toContainText('Success 100%')"
          new = "  await expect(forecast).toContainText('Select an ally.')\n  await expect(forecast).not.toContainText('Success 100%')"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale forecast assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify surgical test-only diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "apps/web/e2e/p3-8-representative-buildcraft.pw.ts"
          git diff -- apps/web/e2e/p3-8-representative-buildcraft.pw.ts
      - name: Commit and push result branch
        shell: bash
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git commit -m "test: align untargeted Barrier forecast assertion"
          git push origin HEAD:agent/combat-k3-buildcraft-stale-assertion-result-20260915
