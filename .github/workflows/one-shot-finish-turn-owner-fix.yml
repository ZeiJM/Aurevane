name: One-shot Finish Turn ownership patch

on:
  push:
    branches:
      - agent/final-facing-hotkey-reliability-v2
    paths:
      - .github/workflows/one-shot-finish-turn-owner-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-facing-hotkey-reliability-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Make desktop Finish Turn ownership deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('apps/web/src/components/battle/battle-keyboard-assist.tsx'),
              Path('apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx'),
          ]
          old = """        // Desktop Move / Attack / Guard / Recovery belong to BattleSelfActionQuickCommitAssist.\n        // Mobile keeps this existing handler because the shared quick-commit owner is desktop-only.\n        if (isSharedCategoryAction(action) && window.matchMedia('(min-width: 821px)').matches) return\n"""
          new = """        // Desktop category actions and Finish Turn belong to persistent shared owners.\n        // Mobile keeps this existing handler because those owners are desktop-only.\n        if (\n          (isSharedCategoryAction(action) || action === 'endTurn') &&\n          window.matchMedia('(min-width: 821px)').matches\n        )\n          return\n"""

          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one ownership block, found {count}')
              path.write_text(text.replace(old, new))
          PY
      - name: Format only PR-owned files
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/battle-self-action-quick-commit.pw.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-finish-turn-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx
      - name: Commit patch and remove this workflow
        run: |
          rm .github/workflows/one-shot-finish-turn-owner-fix.yml
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/e2e/battle-self-action-quick-commit.pw.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-finish-turn-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx \
            .github/workflows/one-shot-finish-turn-owner-fix.yml
          git commit -m "fix: make Finish Turn hotkey ownership deterministic"
          git push origin HEAD:agent/final-facing-hotkey-reliability-v2
