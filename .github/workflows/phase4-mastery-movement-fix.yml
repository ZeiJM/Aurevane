name: Phase4 mastery movement maintenance

# One-shot repair for the local earned-Mastery browser fixture.
on:
  push:
    branches:
      - 'agent/phase4-audit-implementation'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-audit-implementation
          fetch-depth: 0
      - name: Exclude occupied tiles from movement candidate selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/phase4-mastery.pw.ts')
          text = path.read_text()
          old = ".filter((tile) => tile.xy)"
          new = ".filter((tile) => tile.xy && !tile.label.includes('occupied by'))"
          if old not in text:
              raise SystemExit('Expected Mastery movement filter not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/phase4-mastery.pw.ts
          git commit -m 'Fix Mastery browser movement fixture'
          git push origin HEAD:agent/phase4-audit-implementation
