name: K4 Barrier RED Test Format

on:
  push:
    branches:
      - agent/combat-k4-barrier-red-format-20260915

permissions:
  contents: write

jobs:
  format-red-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out formatting workbench
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact Barrier RED head
        run: |
          git fetch origin agent/combat-k4-barrier-20260915
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "96b991d1e53b4034df70431fe5e1fcf2d7b28a81"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format RED test files only
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/combat-barrier.test.ts \
            apps/web/src/components/character/skill-detail-presentation.test.ts
          git diff --check
          git diff --name-only > /tmp/changed.txt
          if grep -vE '^(packages/game-core/src/combat/combat-barrier\.test\.ts|apps/web/src/components/character/skill-detail-presentation\.test\.ts)$' /tmp/changed.txt; then
            echo "Unexpected non-test formatting delta"
            cat /tmp/changed.txt
            exit 1
          fi
          grep -q '^packages/game-core/src/combat/combat-barrier\.test\.ts$' /tmp/changed.txt

      - name: Push test-only formatting to Barrier RED branch
        run: |
          git config user.name "AUREVANE K4 Workbench"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/game-core/src/combat/combat-barrier.test.ts \
            apps/web/src/components/character/skill-detail-presentation.test.ts
          git commit -m "test: format Barrier RED contracts"
          git push origin HEAD:agent/combat-k4-barrier-20260915
