name: K4 Barrier RED Proof

on:
  push:
    branches:
      - agent/combat-k4-barrier-red-format-20260915

permissions:
  contents: read

jobs:
  prove-skill-details-red:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RED proof workbench
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact formatted Barrier RED head
        run: |
          git fetch origin agent/combat-k4-barrier-20260915
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "90056e5f9a63547f8d40da7da2e3719086013b2e"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify RED Skill Details assertion
        run: pnpm --filter @aurevane/web test -- skill-detail-presentation.test.ts
