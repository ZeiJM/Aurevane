name: Materialize Road to Aurevane runtime asset

on:
  push:
    branches:
      - agent/site-music-full-asset-repair-20260923

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Stage full Road to Aurevane asset'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Decode and verify exact runtime asset
        shell: bash
        run: |
          set -euo pipefail
          target='apps/web/public/media/audio/music/road-to-aurevane.webm'
          cat .site-music-staging/part-*.b64 | tr -d '\r\n' | base64 --decode > "$target"
          test "$(stat -c%s "$target")" = '3499767'
          echo 'ad8fdfaa528c0f54472c5decd9cd0cadbf83bd737f9377e1e82fad6b70bfae8a  '"$target" | sha256sum -c -
          node -e "const fs=require('fs');const b=fs.readFileSync(process.argv[1]);if(b.subarray(0,4).toString('hex')!=='1a45dfa3')process.exit(1)" "$target"

      - name: Commit only verified binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .site-music-staging
          git rm .github/workflows/materialize-site-music-asset.yml
          git add apps/web/public/media/audio/music/road-to-aurevane.webm
          git commit -m 'Media: materialize full Road to Aurevane runtime asset'
          git push origin HEAD:agent/site-music-full-asset-repair-20260923
