name: Temporary P3.1 validation fixer

on:
  push:
    branches:
      - agent/p3-1-discipline-build-authority

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run temporary P3.1 fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-1-discipline-build-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply focused P3.1 corrections
        run: echo '' | base64 -d | python
      - name: Format P3.1 TypeScript and CSS
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/src/app/api/character/build/primary/route.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-primary-build-panel.module.css \
            apps/web/src/components/character/character-primary-build-panel.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            packages/game-core/src/character/discipline-build.test.ts \
            packages/game-core/src/character/discipline-build.ts
      - name: Commit focused corrections
        run: |
          git config user.name 'AUREVANE Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            supabase/migrations/20260903031500_p31_discipline_build_authority.sql \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/src/app/api/character/build/primary/route.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-primary-build-panel.module.css \
            apps/web/src/components/character/character-primary-build-panel.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            packages/game-core/src/character/discipline-build.test.ts \
            packages/game-core/src/character/discipline-build.ts \
            docs/ROADMAP.md \
            docs/ROADMAP_PERFORMANCE_SCALING.md
          git diff --cached --check
          git commit -m 'Fix P3.1 validation defects and reconcile Phase 3 roadmaps'
          git push origin HEAD:agent/p3-1-discipline-build-authority
