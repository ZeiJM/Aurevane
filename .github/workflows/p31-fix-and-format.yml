name: Temporary P3.1 validation fixer

on:
  push:
    branches:
      - agent/p3-1-discipline-build-authority

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Retry temporary P3.1 fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-1-discipline-build-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply focused P3.1 corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one regex match in {path}: {pattern[:120]!r}; got {count}')
              file.write_text(updated)

          migration = 'supabase/migrations/20260903031500_p31_discipline_build_authority.sql'
          replace_once(
              migration,
              '  update app_private.character_active_builds\n  set\n',
              '  update app_private.character_active_builds build\n  set\n',
          )
          replace_once(
              migration,
              '  where character_id = v_build.character_id;\n',
              '  where build.character_id = v_build.character_id;\n',
          )

          e2e = 'apps/web/e2e/character-primary-build.pw.ts'
          replace_once(
              e2e,
              "  const attributesBefore = Object.fromEntries(\n    await Promise.all(\n      ATTRIBUTE_IDS.map(async (id) => [\n        id,\n        await page.getByTestId(`profile-attribute-${id}`).locator('strong').innerText(),\n      ]),\n    ),\n  )\n",
              "  const attributesBefore = new Map(\n    await Promise.all(\n      ATTRIBUTE_IDS.map(\n        async (id) =>\n          [\n            id,\n            await page.getByTestId(`profile-attribute-${id}`).locator('strong').innerText(),\n          ] as const,\n      ),\n    ),\n  )\n",
          )
          e2e_path = Path(e2e)
          e2e_text = e2e_path.read_text()
          old_loop = '  for (const [id, value] of Object.entries(attributesBefore)) {'
          if e2e_text.count(old_loop) != 2:
              raise SystemExit('Expected exactly two attribute-preservation loops')
          e2e_path.write_text(e2e_text.replace(old_loop, '  for (const [id, value] of attributesBefore) {'))

          roadmap = 'docs/ROADMAP.md'
          replace_once(roadmap, '**Synchronized:** 2026-08-26', '**Synchronized:** 2026-09-03')
          replace_once(
              roadmap,
              '| Phase 2 — Tactical Combat & Battle Platform | 🧪 Implementation mature; Owner testing / PV-1 exit open | Combat, AI, direct PvP and spectation foundations are delivered and being tested. |\n| Phase 3 — Signature Buildcraft Foundation | 🔜 Next major feature phase | Begins only after explicit Phase-2 closure. |',
              '| Phase 2 — Tactical Combat & Battle Platform | ✅ Closed / PV-1 passed | Mature combat, AI, direct PvP and spectation foundations are preserved for reuse. |\n| Phase 3 — Signature Buildcraft Foundation | 🛠️ Active — P3.1 | Phase 3 is active on the formally closed Phase-2 baseline. |',
          )
          regex_once(
              roadmap,
              r'## Current decision boundary\n\n.*?\n\n## Automatic performance/scaling checkpoints',
              '''## Current decision boundary

AUREVANE is now in **Phase 3 — Signature Buildcraft Foundation**. Phase 2 is formally closed and its battle platform is a preserved dependency, not active redesign scope.

Active now:

- execute one canonical Phase-3 ticket at a time from `docs/PHASE_3_TICKETS.md`;
- begin with P3.1 Discipline build authority + Primary profiles;
- reuse compatible Phase-1 character/profile foundations and the mature Phase-2 battle platform;
- run behavior-preserving performance/security checks at the Phase-3 build-state boundaries.

Not allowed by default:

- reopening or redesigning Phase-2 systems without a genuine regression;
- pulling later Phase-3 tickets or Phase-4+ content into P3.1 without a tightly coupled prerequisite;
- Vercel deployment unless separately authorized by the Owner.

## Automatic performance/scaling checkpoints''',
          )
          replace_once(
              roadmap,
              '1. the current Phase-2 stabilization/PV-1 exit review;',
              '1. the completed Phase-2 stabilization/PV-1 exit review, retained as the comparison baseline;',
          )
          regex_once(
              roadmap,
              r'## Phase-2 exit\n\n.*?\n\n---\n\n# 3\. Canonical build and combat direction',
              '''## Phase-2 exit — completed 2026-09-03

Phase 2 is formally closed. PV-1 reconciliation, repository cleanup, the performance/security checkpoint and the Phase-3 handoff were completed on `main` at `20ed23527695f5320345428587472be7248e7ac7`.

Phase 3 therefore inherits the existing combat/PvP/spectator platform. Phase activation still does **not** authorize a Vercel deployment.

---

# 3. Canonical build and combat direction''',
          )
          replace_once(roadmap, '## 🧪 Phase 2 — Tactical Combat & Battle Platform', '## ✅ Phase 2 — Tactical Combat & Battle Platform')
          regex_once(
              roadmap,
              r'### Remaining\n\nOwner testing and formal Phase-2/PV-1 exit decision\..*?\*\*Status:\*\* implementation mature and substantially above original minimum; Owner testing/PV-1 open\.',
              '''### Closeout

Phase 2 is formally closed and PV-1 is reconciled. Genuine regressions may still be fixed, but the delivered combat/battle platform is not reopened for redesign by default.

Performance diagnosis continues only through the behavior-preserving checkpoint contract above.

**Status:** ✅ Closed; mature reusable platform for Phase 3.''',
          )
          replace_once(roadmap, '## 🔜 Phase 3 — Signature Buildcraft Foundation', '## 🛠️ Phase 3 — Signature Buildcraft Foundation')
          regex_once(
              roadmap,
              r'```text\nOWNER TESTING / PHASE-2 STABILIZATION.*?The frontier, Rekindling replay systems and Owner-created Anomalies are approved long-horizon direction, not active Phase-2 scope\.',
              '''```text
PHASE 2 CLOSED / PV-1 RECONCILED
        ↓
PHASE 3 ACTIVE
        ↓
P3.1 Discipline build authority + Primary profiles
        ↓
P3.2–P3.8 in canonical ticket order
```

The immediate development priority is therefore:

> **Complete P3.1 on the preserved Phase-2 platform, then proceed one canonical Phase-3 ticket at a time.**

Automatic performance/scaling checkpoints continue at the defined future boundaries; they are maintenance/hardening work, not permission to expand feature scope.

The frontier, Rekindling replay systems and Owner-created Anomalies remain approved long-horizon direction, not active P3.1 scope.''',
          )

          perf = 'docs/ROADMAP_PERFORMANCE_SCALING.md'
          replace_once(
              perf,
              '- current Phase-2 stabilization / PV-1 exit;',
              '- completed Phase-2 stabilization / PV-1 exit checkpoint, retained as the comparison baseline;',
          )
          replace_once(perf, '# 5. Phase-2 work', '# 5. Phase-2 checkpoint — closed baseline')
          replace_once(
              perf,
              'Phase 2 is still a stabilization/PV-1 boundary, so performance work is intentionally narrow.',
              'Phase 2 is formally closed. The work below is retained as the measured PV-1/Phase-2 comparison baseline; Phase-3 checkpoints must preserve those authority and behavior guarantees.',
          )
          regex_once(
              perf,
              r'```text\nCURRENT PHASE-2 STABILIZATION.*?Version-aware reads / selective consolidation / Realtime only when evidence justifies them\n```',
              '''```text
PHASE-2 CHECKPOINT COMPLETE                  2026-09-03
  ↓
PHASE 3 ACTIVE
  ↓
P3.1 authoritative build-state boundary
  ↓
Measure build-state read/write behavior and preserve server authority
  ↓
Future automatic performance checkpoints at phase/scale boundaries
  ↓
Version-aware reads / selective consolidation / Realtime only when evidence justifies them
```''',
          )
          PY
      - name: Format P3.1 TypeScript and CSS
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/src/app/api/character/build/primary/route.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-primary-build-panel.module.css \
            apps/web/src/components/character/character-primary-build-panel.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            packages/game-core/src/character/discipline-build.test.ts \
            packages/game-core/src/character/discipline-build.ts
      - name: Commit focused corrections
        run: |
          git config user.name 'AUREVANE Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            supabase/migrations/20260903031500_p31_discipline_build_authority.sql \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/src/app/api/character/build/primary/route.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-primary-build-panel.module.css \
            apps/web/src/components/character/character-primary-build-panel.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            packages/game-core/src/character/discipline-build.test.ts \
            packages/game-core/src/character/discipline-build.ts \
            docs/ROADMAP.md \
            docs/ROADMAP_PERFORMANCE_SCALING.md
          git diff --cached --check
          git commit -m 'Fix P3.1 validation defects and reconcile Phase 3 roadmaps'
          git push origin HEAD:agent/p3-1-discipline-build-authority
