name: A03 Format Preview

on:
  pull_request:
    paths:
      - 'packages/game-core/src/combat/**'
      - '.github/workflows/a03-format-preview.yml'

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format A03 files and print patch
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/combat-critical.ts \
            packages/game-core/src/combat/combat-critical.test.ts \
            packages/game-core/src/combat/stat-driven-combat.ts \
            packages/game-core/src/combat/essence.ts \
            packages/game-core/src/combat/essence.test.ts \
            packages/game-core/src/combat/phase4-balance-harness.ts \
            packages/game-core/src/combat/phase4-balance-harness.test.ts
          git diff -- \
            packages/game-core/src/combat/combat-critical.ts \
            packages/game-core/src/combat/combat-critical.test.ts \
            packages/game-core/src/combat/stat-driven-combat.ts \
            packages/game-core/src/combat/essence.ts \
            packages/game-core/src/combat/essence.test.ts \
            packages/game-core/src/combat/phase4-balance-harness.ts \
            packages/game-core/src/combat/phase4-balance-harness.test.ts
          test -z "$(git status --short)"
