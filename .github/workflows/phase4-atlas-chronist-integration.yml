name: Phase 4 Atlas Chronist integration

on:
  push:
    branches:
      - 'agent/phase4-discipline-atlas-mastery'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-discipline-atlas-mastery
          fetch-depth: 0

      - name: Merge audited Chronist implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/phase4-audit-implementation

          set +e
          git merge --no-ff --no-commit origin/agent/phase4-audit-implementation
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort || true)"
          if [ -n "$conflicts" ]; then
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(\.github/scripts/verify-p4-mastery\.sh|\.github/workflows/representative-buildcraft\.yml|docs/PHASE_4_TICKETS\.md)$' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Unexpected integration conflicts:' >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
          elif [ "$merge_status" -ne 0 ]; then
            echo 'Merge failed without ordinary file conflicts.' >&2
            exit 1
          fi

          git checkout HEAD -- .github/scripts/verify-p4-mastery.sh
          git checkout HEAD -- .github/workflows/representative-buildcraft.yml
          git checkout HEAD -- docs/PHASE_4_TICKETS.md
          git add .github/scripts/verify-p4-mastery.sh .github/workflows/representative-buildcraft.yml docs/PHASE_4_TICKETS.md

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git diff --check
          git status --short
          git commit -m 'Merge Chronist runtime into Discipline Atlas branch'
          git push origin HEAD:agent/phase4-discipline-atlas-mastery
