name: Character roster source checkpoint

on:
  push:
    branches:
      - agent/character-roster-hq-continuation
    paths:
      - .github/workflows/character-roster-source-checkpoint.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/roster-source"
          git rev-parse HEAD > "$RUNNER_TEMP/roster-source/commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/roster-source/source.zip" HEAD
      - name: Export the pinned standalone formatter
        shell: bash
        run: npm pack --ignore-scripts prettier@3.9.6 --pack-destination "$RUNNER_TEMP/roster-source"
      - uses: actions/upload-artifact@v4
        with:
          name: character-roster-source
          path: ${{ runner.temp }}/roster-source
          retention-days: 1
