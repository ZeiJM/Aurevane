name: P2.7 format new files once

on:
  push:
    branches:
      - "agent/p2-7-combat-usability-battlefield-proof"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[p2.7-format-new]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p2-7-combat-usability-battlefield-proof
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format P2.7 files
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/battle-usability.pw.ts \
            apps/web/src/components/battle/battle-abort-controls.tsx \
            apps/web/src/components/battle/battle-launch.tsx \
            apps/web/src/server/battle/battle-abort-service.ts \
            packages/game-core/src/combat/battle-exit.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add \
            apps/web/e2e/battle-usability.pw.ts \
            apps/web/src/components/battle/battle-abort-controls.tsx \
            apps/web/src/components/battle/battle-launch.tsx \
            apps/web/src/server/battle/battle-abort-service.ts \
            packages/game-core/src/combat/battle-exit.ts
          git commit -m 'P2.7 format battlefield and abort files [p2.7-format-new]'
          git push origin HEAD:agent/p2-7-combat-usability-battlefield-proof
