name: Copy AI workbench

on:
  push:
    branches:
      - review/copy-ai-75f4633

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin implementation recipe and exact RED source
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/copy-ai-implementation.py /tmp/copy-ai-implementation.py
          git fetch --depth=5 origin 81f58739502b2804a884c50b08939f275b363dd6
          git checkout --detach 81f58739502b2804a884c50b08939f275b363dd6
          test "$(git rev-parse HEAD)" = 81f58739502b2804a884c50b08939f275b363dd6
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 75f4633e3dfc0e074616299915fb23c1489b811f
          test "$(git ls-remote origin refs/heads/agent/combat-k4-copy-ai-75f4633 | cut -f1)" = 81f58739502b2804a884c50b08939f275b363dd6
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Implement clone-aware AI scoring
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/copy-ai-implementation.py
          pnpm exec prettier --write packages/game-core/src/combat/recruit-ai-build.ts
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/recruit-ai-copy-utility.test.ts
      - name: Focused GREEN verification
        run: |
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run \
            src/combat/recruit-ai-copy-utility.test.ts \
            src/combat/recruit-ai-build.test.ts \
            src/combat/recruit-ai.test.ts \
            src/combat/combat-status-copy-composition.test.ts \
            src/combat/combat-status-copy.test.ts \
            src/combat/combat-poison-copy.test.ts \
            src/combat/combat-burn-copy.test.ts \
            src/combat/combat-bleed-copy.test.ts \
            src/combat/pv1f-action-economy.test.ts
      - name: Full repository verification
        run: pnpm check
      - name: Retain only the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          expected = {
            'docs/COMBAT.md',
            'packages/game-core/src/combat/recruit-ai-build.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/recruit-ai-copy-utility.test.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 75f4633e3dfc0e074616299915fb23c1489b811f
          test "$(git ls-remote origin refs/heads/agent/combat-k4-copy-ai-75f4633 | cut -f1)" = 81f58739502b2804a884c50b08939f275b363dd6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/COMBAT.md packages/game-core/src/combat/recruit-ai-build.ts
          git diff --cached --check
          git commit -m 'feat(combat): score Amplify and Curse projections in Recruit AI'
          git push origin HEAD:refs/heads/agent/combat-k4-copy-ai-75f4633
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "VERIFIED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          test -z "$(git status --porcelain)"
