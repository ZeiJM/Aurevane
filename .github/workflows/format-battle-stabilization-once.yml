name: One-shot battle stabilization formatting

on:
  push:
    branches:
      - fix/battle-complete-stabilization-20260823
    paths:
      - .github/workflows/format-battle-stabilization-once.yml
      - apps/web/src/components/battle/ai-battle-pvp-visual-sync.module.css
      - apps/web/src/components/battle/battle-session-client-boundary.tsx
      - apps/web/src/components/battle/battle-stabilization-polish.module.css
      - apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx
      - apps/web/src/components/battle/pvp-battle-chat-bridge.tsx
      - apps/web/src/components/battle/pvp-battle-client-boundary.tsx
      - apps/web/src/components/battle/pvp-lobby-modal.tsx
      - apps/web/src/components/battle/pvp-spectator-experience.tsx
      - apps/web/src/server/player-profile/recent-emojis-service.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-complete-stabilization-20260823
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format touched battle files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/ai-battle-pvp-visual-sync.module.css \
            apps/web/src/components/battle/battle-session-client-boundary.tsx \
            apps/web/src/components/battle/battle-stabilization-polish.module.css \
            apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx \
            apps/web/src/components/battle/pvp-battle-chat-bridge.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            apps/web/src/server/player-profile/recent-emojis-service.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "aurevane-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/ai-battle-pvp-visual-sync.module.css \
            apps/web/src/components/battle/battle-session-client-boundary.tsx \
            apps/web/src/components/battle/battle-stabilization-polish.module.css \
            apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx \
            apps/web/src/components/battle/pvp-battle-chat-bridge.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            apps/web/src/server/player-profile/recent-emojis-service.ts
          git commit -m "Format battle stabilization changes"
          git push origin HEAD:fix/battle-complete-stabilization-20260823
