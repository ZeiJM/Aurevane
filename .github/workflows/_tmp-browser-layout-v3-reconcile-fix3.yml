name: Temporary browser layout v3 reconcile fix3

on:
  push:
    branches:
      - agent/browser-layout-v3-regression-reconcile-fix3-20260915

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-layout-v3-regression-reconcile-fix3-20260915
          fetch-depth: 0

      - name: Guard exact fix base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "399d45ff122b8deaa4f6835407f144169299ddaa"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/_tmp-browser-layout-v3-reconcile-fix3.yml"

      - name: Patch nested directory reachability contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/e2e/desktop-experience.pw.ts')
          text = path.read_text()
          old = """    await list.hover()\n    await page.mouse.wheel(0, 100_000)\n    await expect(last).toBeInViewport({ ratio: 1 })\n    const scroll = await page.evaluate(() => window.scrollY)\n    expect(scroll).toBe(0)\n    await last.click()"""
          new = """    const roster = page.locator(rosterPanelSelector)\n    await roster.evaluate((element) => {\n      element.scrollTop = 0\n    })\n    await list.evaluate((element) => {\n      element.scrollTop = 0\n    })\n    await last.scrollIntoViewIfNeeded()\n    await expect(last).toBeInViewport({ ratio: 1 })\n    const [rosterScrollTop, listScrollTop] = await Promise.all([\n      roster.evaluate((element) => element.scrollTop),\n      list.evaluate((element) => element.scrollTop),\n    ])\n    expect(rosterScrollTop + listScrollTop).toBeGreaterThan(0)\n    const scroll = await page.evaluate(() => window.scrollY)\n    expect(scroll).toBe(0)\n    await last.click()"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one nested-scroll block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and statically verify nested-scroll repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/web/e2e/desktop-experience.pw.ts
          pnpm exec prettier --check apps/web/e2e/desktop-experience.pw.ts
          pnpm typecheck
          git diff --check

      - name: Commit only the repaired browser test
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-browser-layout-v3-reconcile-fix3.yml
          git add .github/workflows/_tmp-browser-layout-v3-reconcile-fix3.yml apps/web/e2e/desktop-experience.pw.ts
          actual="$(git diff --cached --name-only | grep -v '^.github/workflows/_tmp-browser-layout-v3-reconcile-fix3.yml$')"
          test "$actual" = "apps/web/e2e/desktop-experience.pw.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: prove nested directory scroll reachability"
          git push origin HEAD:agent/browser-layout-v3-regression-reconcile-fix3-20260915