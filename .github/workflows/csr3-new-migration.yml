name: CSR3 New Migration

on:
  push:
    branches:
      - agent/combat-csr3-historical-privacy-20260917
    paths:
      - .github/workflows/csr3-new-migration.yml

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr3-historical-privacy-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Generate migration
        run: pnpm exec supabase migration new csr3_battle_history_privacy
      - name: Commit generated migration
        run: |
          rm .github/workflows/csr3-new-migration.yml
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add supabase/migrations .github/workflows/csr3-new-migration.yml
          git diff --cached --check
          git commit -m 'chore(db): create CSR-3 history privacy migration'
          git push origin HEAD:agent/combat-csr3-historical-privacy-20260917
