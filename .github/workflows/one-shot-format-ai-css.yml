name: One-shot AI CSS formatter

on:
  push:
    branches:
      - fix/battle-log-neutral-space-20260824

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format AI battle layout CSS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-log-neutral-space-20260824
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/battle/ai-battle-pvp-visual-sync.module.css
      - run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add apps/web/src/components/battle/ai-battle-pvp-visual-sync.module.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format AI battle layout CSS"
          git push origin HEAD:fix/battle-log-neutral-space-20260824
