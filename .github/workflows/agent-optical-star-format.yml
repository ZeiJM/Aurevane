name: Agent optical star format

on:
  push:
    branches:
      - agent/optical-favorite-star-centering

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optical-favorite-star-centering
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier result
        run: |
          pnpm exec prettier apps/web/e2e/character-favorite-techniques.pw.ts --write
          if git diff --quiet -- apps/web/e2e/character-favorite-techniques.pw.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/character-favorite-techniques.pw.ts
          git commit -m "Format optical star regression"
          git push origin HEAD:agent/optical-favorite-star-centering
