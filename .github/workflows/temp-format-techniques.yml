name: Temporary Techniques Formatter

on:
  push:
    branches:
      - 'test/disable-discipline-attunement-cooldowns-20260905'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format redesigned Techniques files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            apps/web/src/components/character/character-skill-build-panel.module.css

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            apps/web/src/components/character/character-skill-build-panel.module.css
          git commit -m 'Format Techniques redesign'
          git push origin HEAD:${{ github.ref_name }}
