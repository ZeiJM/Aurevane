name: One-shot preview formatting

on:
  push:
    branches:
      - preview/finesse-silver-20260821

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format preview batch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/finesse-silver-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format preview batch
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/portrait-ratio-standardization.css \
            apps/web/src/components/battle/ai-battle-pvp-visual-sync.tsx \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.module.css \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.tsx \
            apps/web/src/components/battle/battle-status-effect-assist.module.css \
            apps/web/src/components/battle/battle-status-effect-assist.tsx \
            apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx \
            apps/web/src/components/battle/pvp-desktop-parity.module.css \
            apps/web/src/components/battle/pvp-desktop-parity.tsx \
            apps/web/src/components/battle/pvp-quick-commit-assist.tsx
      - name: Commit formatted sources
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/app/portrait-ratio-standardization.css \
            apps/web/src/components/battle/ai-battle-pvp-visual-sync.tsx \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.module.css \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.tsx \
            apps/web/src/components/battle/battle-status-effect-assist.module.css \
            apps/web/src/components/battle/battle-status-effect-assist.tsx \
            apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx \
            apps/web/src/components/battle/pvp-desktop-parity.module.css \
            apps/web/src/components/battle/pvp-desktop-parity.tsx \
            apps/web/src/components/battle/pvp-quick-commit-assist.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format preview batch"
          git push origin HEAD:preview/finesse-silver-20260821
