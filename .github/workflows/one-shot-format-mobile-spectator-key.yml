name: One-shot mobile spectator key formatting

on:
  push:
    branches:
      - fix/mobile-pvp-spectator-key-20260824

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format mobile spectator key fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-pvp-spectator-key-20260824
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/battle/pvp-battle-shell-parity-fix.module.css
      - name: Commit formatter output
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add apps/web/src/components/battle/pvp-battle-shell-parity-fix.module.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format mobile spectator key fix"
          git push origin HEAD:fix/mobile-pvp-spectator-key-20260824
