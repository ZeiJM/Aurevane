name: One-shot Finish Turn formatting

on:
  push:
    branches:
      - agent/final-facing-hotkey-reliability-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-facing-hotkey-reliability-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Finish Turn owner
        run: pnpm exec prettier --write apps/web/src/components/battle/battle-finish-turn-keyboard-assist.tsx
      - name: Commit formatting and remove this workflow
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/format-finish-turn-hotkey-once.yml
          git add apps/web/src/components/battle/battle-finish-turn-keyboard-assist.tsx
          git commit -m "chore: format Finish Turn hotkey owner"
          git push origin HEAD:agent/final-facing-hotkey-reliability-v2
