name: Patch Desktop Battle Rails

on:
  push:
    branches:
      - 'fix/desktop-six-combatant-rails-20260823'
    paths:
      - '.github/workflows/patch-desktop-battle-rails.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-six-combatant-rails-20260823

      - name: Remove synchronous effect state reset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/pvp-six-combatant-rails.tsx')
          text = path.read_text()
          old = """    if (!desktop) {\n      setContentTarget(null)\n      return\n    }\n\n"""
          new = """    if (!desktop) return\n\n"""
          if old not in text:
              raise SystemExit('Expected desktop effect block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/pvp-six-combatant-rails.tsx
          git commit -m 'Avoid synchronous state reset in desktop rail effect'
          git push origin HEAD:fix/desktop-six-combatant-rails-20260823
