name: P2.7 one-shot cleanup

on:
  push:
    branches:
      - "agent/p2-7-combat-usability-battlefield-proof"

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[p2.7-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p2-7-combat-usability-battlefield-proof
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix narrowed attack target and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/battle-experience.tsx')
          text = path.read_text()
          old = """        const targetPlacement = tactical.placements.find(\n          (placement) => placement.combatantId === committedIntent.target.combatantId,\n        )\n"""
          new = """        const targetCombatantId = committedIntent.target.combatantId\n        const targetPlacement = tactical.placements.find(\n          (placement) => placement.combatantId === targetCombatantId,\n        )\n"""
          if old not in text and 'const targetCombatantId = committedIntent.target.combatantId' not in text:
              raise SystemExit('Expected target narrowing site not found')
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/server/battle/battle-final-turn-service.ts
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-experience.tsx apps/web/src/server/battle/battle-final-turn-service.ts
          git commit -m 'P2.7 format final-turn cockpit and fix target narrowing [p2.7-cleanup]'
          git push origin HEAD:agent/p2-7-combat-usability-battlefield-proof
