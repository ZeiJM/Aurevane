name: CSR2 RED Test Oracle

on:
  push:
    branches:
      - agent/csr2-red-test-oracle-20260917

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aurevane/web exec vitest run src/server/battle/battle-live-viewer-projection.test.ts
