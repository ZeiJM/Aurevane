name: P2.7 abort UI one-shot

on:
  push:
    branches:
      - "agent/p2-7-combat-usability-battlefield-proof"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p2.7-abort-ui]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p2-7-combat-usability-battlefield-proof
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch abort UX and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/battle-experience.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'Expected {label} anchor not found')
              text = text.replace(old, new, 1)

          replace_once(
              "import type { BattleIntent } from '@aurevane/validation/combat/battle-session'\nimport { useCallback, useEffect, useMemo, useRef, useState } from 'react'\n",
              "import type { BattleIntent } from '@aurevane/validation/combat/battle-session'\nimport { useRouter } from 'next/navigation'\nimport { useCallback, useEffect, useMemo, useRef, useState } from 'react'\n",
              'router import',
          )
          replace_once(
              "export function BattleExperience({ initialBattle }: BattleExperienceProps) {\n  const [battle, setBattle] = useState(initialBattle)\n",
              "export function BattleExperience({ initialBattle }: BattleExperienceProps) {\n  const router = useRouter()\n  const [battle, setBattle] = useState(initialBattle)\n",
              'router state',
          )
          replace_once(
              "  const [recruitPending, setRecruitPending] = useState(false)\n  const [notice, setNotice] = useState<string>('Authoritative state loaded.')\n",
              "  const [recruitPending, setRecruitPending] = useState(false)\n  const [abortPending, setAbortPending] = useState(false)\n  const [abortConfirming, setAbortConfirming] = useState(false)\n  const [notice, setNotice] = useState<string>('Authoritative state loaded.')\n",
              'abort state',
          )

          abort_function = r'''  const abortExercise = useCallback(async () => {
    if (abortPending || battleState.lifecycle !== 'active') return
    setAbortPending(true)
    resetPlanning()
    try {
      const response = await fetch(`/api/battles/${battle.battleSessionId}/abort`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          idempotencyKey: crypto.randomUUID(),
          expectedBattleVersion: battle.battleVersion,
        }),
      })
      const body = (await response.json()) as { battle?: BattleSessionView } & ApiErrorBody
      if (!response.ok || !body.battle) {
        await handleApiFailure(response, body, 'The practice exercise could not be aborted.')
        return
      }
      setBattle(body.battle)
      setAbortConfirming(false)
      setNotice(`Exercise aborted at authoritative battle version ${body.battle.battleVersion}.`)
      router.push('/game/battle')
      router.refresh()
    } catch (error) {
      setNotice(error instanceof Error ? error.message : 'The practice exercise could not be aborted.')
    } finally {
      setAbortPending(false)
    }
  }, [
    abortPending,
    battle.battleSessionId,
    battle.battleVersion,
    battleState.lifecycle,
    handleApiFailure,
    resetPlanning,
    router,
  ])

'''
          replace_once(
              "  useEffect(() => {\n    if (\n      !playerTurn &&\n",
              abort_function + "  useEffect(() => {\n    if (\n      !playerTurn &&\n",
              'abort function insertion',
          )

          replace_once(
              "      if (event.key === 'Escape') {\n        event.preventDefault()\n        resetPlanning()\n        setNotice('Planning cleared. No command was committed.')\n        return\n      }\n\n      if (!playerTurn || battleState.lifecycle !== 'active' || commitPending || recruitPending) return\n",
              "      if (event.key === 'Escape') {\n        event.preventDefault()\n        if (abortConfirming) {\n          setAbortConfirming(false)\n          setNotice('Abort cancelled. The exercise remains active.')\n          return\n        }\n        resetPlanning()\n        setNotice('Planning cleared. No command was committed.')\n        return\n      }\n\n      if (abortConfirming) return\n      if (!playerTurn || battleState.lifecycle !== 'active' || commitPending || recruitPending || abortPending) return\n",
              'escape and shortcut guard',
          )
          replace_once(
              "    battleState.lifecycle,\n    chooseMode,\n",
              "    abortConfirming,\n    abortPending,\n    battleState.lifecycle,\n    chooseMode,\n",
              'keyboard dependencies',
          )
          replace_once(
              "  const planningDisabled =\n    !playerTurn || battleState.lifecycle !== 'active' || commitPending || recruitPending\n",
              "  const planningDisabled =\n    !playerTurn ||\n    battleState.lifecycle !== 'active' ||\n    commitPending ||\n    recruitPending ||\n    abortPending ||\n    abortConfirming\n",
              'planning disabled',
          )
          replace_once(
              '        aria-busy={recruitPending}\n',
              '        aria-busy={recruitPending || abortPending}\n',
              'aria busy',
          )

          old_tail = '''        </div>
      </section>

      {battleState.lifecycle === 'completed' ? <BattleCompletionPanel battle={battle} /> : null}
'''
          new_tail = '''        </div>

        {battleState.lifecycle === 'active' ? (
          <div className={styles.commitRow} data-testid="abort-exercise-controls">
            {abortConfirming ? (
              <>
                <p className={styles.emptyText}>
                  Abort ends this practice as ABORTED. You receive no Character XP, Mastery, loot,
                  Crowns, PvP rating, or normal completion rewards.
                </p>
                <button
                  type="button"
                  className={styles.cancelButton}
                  onClick={() => {
                    setAbortConfirming(false)
                    setNotice('Abort cancelled. The exercise remains active.')
                  }}
                  disabled={abortPending}
                >
                  Stay in Battle
                </button>
                <button
                  type="button"
                  className={styles.confirmButton}
                  data-testid="confirm-abort-exercise"
                  onClick={() => void abortExercise()}
                  disabled={abortPending || commitPending || recruitPending}
                >
                  {abortPending ? 'Aborting…' : 'Confirm Abort Exercise'}
                </button>
              </>
            ) : (
              <button
                type="button"
                className={styles.cancelButton}
                data-testid="abort-exercise"
                onClick={() => {
                  resetPlanning()
                  setAbortConfirming(true)
                  setNotice('Confirm Abort Exercise or stay in the battle.')
                }}
                disabled={abortPending || commitPending || recruitPending}
              >
                Abort Exercise
              </button>
            )}
          </div>
        ) : null}
      </section>

      {battleState.lifecycle === 'abandoned' ? (
        <section className={styles.commandDeck} data-testid="aborted-exercise-result">
          <div className={styles.panelHeading}>
            <span>Tactical Hall</span>
            <strong>Exercise aborted</strong>
          </div>
          <p className={styles.emptyText}>
            This practice ended without normal progression, loot, Crowns, or rating rewards.
          </p>
          <div className={styles.commitRow}>
            <button
              type="button"
              className={styles.confirmButton}
              onClick={() => router.push('/game/battle')}
            >
              Return to Tactical Hall
            </button>
          </div>
        </section>
      ) : null}

      {battleState.lifecycle === 'completed' ? <BattleCompletionPanel battle={battle} /> : null}
'''
          replace_once(old_tail, new_tail, 'abort UI tail')
          replace_once(
              '          disabled={commitPending || recruitPending}\n',
              '          disabled={commitPending || recruitPending || abortPending}\n',
              'footer refetch disable',
          )

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/components/battle/battle-experience.tsx
      - name: Commit abort UX
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No abort UI changes required.'
            exit 0
          fi
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-experience.tsx
          git commit -m 'P2.7 add confirmed Abort Exercise UX [p2.7-abort-ui]'
          git push origin HEAD:agent/p2-7-combat-usability-battlefield-proof
