name: Temporary spectator formatter

on:
  push:
    branches:
      - fix/spectator-battle-parity-20260823

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spectator-battle-parity-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format spectator component
        run: pnpm exec prettier --write apps/web/src/components/battle/pvp-spectator-experience.tsx
      - name: Commit formatting
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/battle/pvp-spectator-experience.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format spectator component"
          git push origin HEAD:fix/spectator-battle-parity-20260823
