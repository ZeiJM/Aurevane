name: Agent battlefield token visual validation

on:
  pull_request:
    paths:
      - 'apps/web/src/components/battle/battlefield-presentation-bundle.module.css'
      - 'apps/web/src/components/battle/battlefield-presentation-bundle.test.ts'
      - '.github/workflows/agent-battlefield-token-visual-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format focused files and show required diff
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battlefield-presentation-bundle.module.css \
            apps/web/src/components/battle/battlefield-presentation-bundle.test.ts
          git diff -- \
            apps/web/src/components/battle/battlefield-presentation-bundle.module.css \
            apps/web/src/components/battle/battlefield-presentation-bundle.test.ts
      - name: Run focused regression test
        run: >-
          pnpm --filter @aurevane/web exec vitest run
          src/components/battle/battlefield-presentation-bundle.test.ts
