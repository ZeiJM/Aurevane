name: P3.8 Format Owned Files

on:
  push:
    branches:
      - 'agent/p3-8-representative-buildcraft-slice'
    paths:
      - '.github/workflows/p38-format-owned-files.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-8-representative-buildcraft-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format owned files
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/mature-skills.ts \
            apps/web/src/app/api/character/build/pv2-test-kit/route.ts \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'P3.8 owned files already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/game-core/src/combat/mature-skills.ts \
            apps/web/src/app/api/character/build/pv2-test-kit/route.ts \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git commit -m 'Format P3.8 owned files'
          git push origin HEAD:agent/p3-8-representative-buildcraft-slice
