name: Agent format repair

on:
  push:
    branches:
      - agent/a3-ui-polish-followup

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[agent-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/a3-ui-polish-followup
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh stale browser selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/e2e/battle-experience.pw.ts')
          text = path.read_text()
          text = text.replace("name: 'Choose a battle.'", "name: 'Choose your arena.'")
          text = re.sub(
              r"  const requestedUiArt = page\.locator\(\n    '\[data-media-status=\"requested\"\]\[data-media-request=\"ART-UI-001\"\]',\n  \)\n  expect\(await requestedUiArt\.count\(\)\)\.toBeGreaterThan\(0\)\n",
              '',
              text,
          )
          text = text.replace(
              "await page.getByRole('button', { name: /AI Sparring/ }).click()",
              "await page.getByLabel('Battle mode').selectOption('recruit-sparring')",
          )
          text = text.replace(
              "await page.getByRole('button', { name: /Guided Fundamentals/ }).click()",
              "await page.getByLabel('Battle mode').selectOption('guided-fundamentals')",
          )
          text = text.replace("{ name: /Win battle/ }", "{ name: /Victory conditions/i }")
          text = text.replace("{ name: 'Win the battle' }", "{ name: /Victory conditions/i }")
          path.write_text(text)

          path = Path('apps/web/e2e/battle-usability.pw.ts')
          text = path.read_text()
          old = re.compile(
              r"  const battleChooser = page\.getByRole\('navigation', \{ name: 'Choose Battle Hall battle' \}\).*?  await enterBattle\.click\(\)\n",
              re.S,
          )
          replacement = """  await expect(page.getByRole('heading', { name: 'Choose your arena.' })).toBeVisible()\n  const battleMode = page.getByLabel('Battle mode')\n  await expect(battleMode).toHaveValue('')\n  await expect(page.getByRole('button', { name: 'Enter Battle' })).toHaveCount(0)\n\n  await battleMode.selectOption('recruit-sparring')\n  await expect(page.getByText('Duel Yard', { exact: true }).first()).toBeVisible()\n  await expect(page.getByRole('heading', { name: 'AI Sparring' })).toBeVisible()\n  const enterBattle = page.getByRole('button', { name: 'Enter Battle' })\n  await expect(enterBattle).toBeEnabled()\n  await enterBattle.click()\n"""
          text, count = old.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace stale battle-usability Battle Hall block')
          path.write_text(text)

          path = Path('apps/web/e2e/navigation-menu-position.pw.ts')
          text = path.read_text()
          needle = "  expect(menuBox.y).toBeGreaterThan(page.viewportSize()!.height / 2)\n"
          addition = needle + "\n  await trigger.click()\n  await expect(menu).toBeHidden()\n  await expect(trigger).toHaveAttribute('aria-expanded', 'false')\n"
          if needle not in text:
              raise SystemExit('Could not find navigation assertion insertion point')
          text = text.replace(needle, addition, 1)
          path.write_text(text)
          PY

      - name: Format implementation batch
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/api/pvp/lobbies/[lobbyId]/ready/route.ts \
            apps/web/src/app/api/pvp/lobbies/route.ts \
            apps/web/src/components/battle/battle-launch.module.css \
            apps/web/src/components/battle/battle-launch.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/pvp-battle-experience.module.css \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.module.css \
            apps/web/src/components/battle/pvp-lobby-modal.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.module.css \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            apps/web/src/server/battle/pvp-lobby-service.ts \
            apps/web/e2e/battle-experience.pw.ts \
            apps/web/e2e/battle-usability.pw.ts \
            apps/web/e2e/navigation-menu-position.pw.ts
          git diff --check

      - name: Commit repair to implementation branch
        run: |
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -- \
            apps/web/src/app/api/pvp/lobbies/[lobbyId]/ready/route.ts \
            apps/web/src/app/api/pvp/lobbies/route.ts \
            apps/web/src/components/battle/battle-launch.module.css \
            apps/web/src/components/battle/battle-launch.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/pvp-battle-experience.module.css \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.module.css \
            apps/web/src/components/battle/pvp-lobby-modal.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.module.css \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            apps/web/src/server/battle/pvp-lobby-service.ts \
            apps/web/e2e/battle-experience.pw.ts \
            apps/web/e2e/battle-usability.pw.ts \
            apps/web/e2e/navigation-menu-position.pw.ts
          if git diff --cached --quiet; then
            echo 'No formatting repair required.'
            exit 0
          fi
          git commit -m 'chore: format PvP batch and refresh browser selectors [agent-format]'
          git push origin HEAD:agent/a3-ui-polish-followup
