name: Temporary Battle Log V2 formatter

on:
  push:
    branches:
      - feat/battle-log-v2-narration-20260824

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/battle-log-v2-narration-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Battle Log V2 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-log-feed.module.css \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-presentation.ts \
            apps/web/src/components/battle/battle-log-presentation.test.ts
      - name: Commit formatting
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-log-feed.module.css \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-presentation.ts \
            apps/web/src/components/battle/battle-log-presentation.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format Battle Log V2"
          git push origin HEAD:feat/battle-log-v2-narration-20260824

# Temporary workflow; remove after formatting is committed.
