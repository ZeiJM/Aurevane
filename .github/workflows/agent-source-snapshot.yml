name: Agent source snapshot
on:
  push:
    branches: [agent/desktop-viewport-fit]
    paths: [.github/workflows/agent-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: |
          git archive --format=tar.gz HEAD -o source.tar.gz
          git fetch --depth=1 origin main
          git archive --format=tar.gz FETCH_HEAD -o main.tar.gz
          git rev-parse HEAD FETCH_HEAD > snapshot-shas.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            source.tar.gz
            main.tar.gz
            snapshot-shas.txt
          retention-days: 1
