name: A1 temporary AP copy cleanup

on:
  push:
    branches:
      - agent/a1-feedback-holistic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/a1-feedback-holistic

      - name: Normalize remaining battle AP copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()
          replacements = {
            "`Path ready: ${result.actionEconomyCost}% Action Economy. ${result.actionEconomyAfter}% will remain.`": "`Path ready: ${result.actionEconomyCost} AP. ${result.actionEconomyAfter} AP will remain.`",
            "'Guard ready: costs 30% and reduces incoming damage by 15% for 2 turns.'": "'Guard ready: costs 30 AP and reduces incoming damage by 15% for 2 turns.'",
            "'Recover ready: costs 50% and restores 10% of maximum HP immediately.'": "'Recover ready: costs 50 AP and restores 10% of maximum HP immediately.'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one AP copy match: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git rm .github/workflows/a1-temporary-ap-copy-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize remaining battle AP copy"
          git push origin HEAD:agent/a1-feedback-holistic
