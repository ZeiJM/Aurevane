name: Verify Burn GREEN

on:
  push:
    branches:
      - agent/combat-overhaul-task4-burn
    paths:
      - .github/workflows/agent-burn-green.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact isolated revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply current Burn runtime
        run: python .github/agent-burn-green.py
      - name: Normalize changed source formatting
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/actions.ts \
            packages/game-core/src/combat/combat-dots.ts \
            packages/game-core/src/combat/combat-authoring-validation.ts \
            packages/game-core/src/combat/pv1f-action-economy.ts \
            packages/game-core/src/combat/gameplay-tags.ts \
            packages/game-core/src/combat/combat-burn-rework.test.ts \
            apps/web/src/components/character/skill-detail-presentation.ts
      - name: Run focused Burn contract
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-burn-rework.test.ts
      - name: Run repository quality gates
        run: pnpm check
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Remove temporary verifier files
        run: |
          rm .github/agent-burn-green.py
          rm .github/workflows/agent-burn-red.yml
          rm .github/workflows/agent-burn-green.yml
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/game-core/src/combat/actions.ts \
            packages/game-core/src/combat/combat-dots.ts \
            packages/game-core/src/combat/combat-authoring-validation.ts \
            packages/game-core/src/combat/pv1f-action-economy.ts \
            packages/game-core/src/combat/gameplay-tags.ts \
            packages/game-core/src/combat/combat-burn-rework.test.ts \
            apps/web/src/components/character/skill-detail-presentation.ts \
            .github/agent-burn-green.py \
            .github/workflows/agent-burn-red.yml \
            .github/workflows/agent-burn-green.yml
          git commit -m 'feat: implement current burn pressure'
          git push origin HEAD:agent/combat-overhaul-task4-burn
