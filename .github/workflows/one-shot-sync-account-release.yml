name: One-shot account release sync

on:
  push:
    branches:
      - release/account-safety-20260823

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/account-safety-20260823
          fetch-depth: 0
      - name: Merge latest main
        run: |
          set -euo pipefail
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:release/account-safety-20260823
