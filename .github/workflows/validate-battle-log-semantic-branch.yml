name: Validate semantic battle log branch

on:
  push:
    branches:
      - agent/battle-log-semantic-colors

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        run: |
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-log-feed.module.css \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-runtime-context.tsx \
            apps/web/src/components/battle/battle-status-effect-assist.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx
      - name: Lint changed files
        working-directory: apps/web
        run: |
          pnpm exec eslint \
            src/components/battle/battle-client-boundary.tsx \
            src/components/battle/battle-log-feed.tsx \
            src/components/battle/battle-runtime-context.tsx \
            src/components/battle/battle-status-effect-assist.tsx \
            src/components/battle/desktop-battle-log-dock.tsx \
            --max-warnings=0
      - name: Run Battle Log tests
        run: |
          pnpm --filter @aurevane/web exec vitest run \
            src/components/battle/battle-log-feed.test.tsx \
            src/components/battle/battle-log-presentation.test.ts
      - name: Typecheck web app
        run: pnpm --filter @aurevane/web typecheck
