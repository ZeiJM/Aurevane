name: Apply PvP CPU v2 once

on:
  push:
    branches:
      - fix/pvp-high-cpu-surgical-v2-20260825

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cpu-v2-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pvp-high-cpu-surgical-v2-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Apply remaining surgical polling changes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          def replace_span(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f"{path}: start marker not found")
              last = text.find(end, first)
              if last < 0:
                  raise SystemExit(f"{path}: end marker not found")
              last += len(end)
              file.write_text(text[:first] + replacement + text[last:])

          replace_once(
              'apps/web/src/components/battle/pvp-battle-experience.tsx',
              'const WAITING_PLAYER_POLL_MS = 350',
              'const WAITING_PLAYER_POLL_MS = 1000',
          )

          spectator = 'apps/web/src/components/battle/pvp-spectator-experience.tsx'
          replace_once(
              spectator,
              'const MOVE_COST_PER_TERRAIN_POINT = 25',
              'const MOVE_COST_PER_TERRAIN_POINT = 25\nconst SPECTATOR_REFRESH_MS = 850',
          )

          refresh_effect = indent(dedent("""\
          useEffect(() => {
            let cancelled = false
            let timer: number | null = null
            let controller: AbortController | null = null

            const schedule = () => {
              if (cancelled) return
              timer = window.setTimeout(() => void refresh(), SPECTATOR_REFRESH_MS)
            }

            const refresh = async () => {
              controller = new AbortController()

              try {
                const response = await fetch(
                  `/api/pvp/spectate/${encodeURIComponent(spectator.battleKey)}`,
                  { cache: 'no-store', signal: controller.signal },
                )
                const body = (await response.json()) as ApiBody
                if (!response.ok || !body.spectator || cancelled || controller.signal.aborted) {
                  if (!cancelled) {
                    setConnectionNote(body.error?.message ?? 'Arena link interrupted. Retrying…')
                  }
                  return
                }
                setSpectator(body.spectator)
                if (body.participantTitles) setParticipantTitles(body.participantTitles)
                setConnectionNote(null)
              } catch (refreshError) {
                if (
                  !cancelled &&
                  !(refreshError instanceof DOMException && refreshError.name === 'AbortError')
                ) {
                  setConnectionNote('Arena link interrupted. Retrying…')
                }
              } finally {
                controller = null
                schedule()
              }
            }

            schedule()
            return () => {
              cancelled = true
              controller?.abort()
              if (timer !== null) window.clearTimeout(timer)
            }
          }, [spectator.battleKey])"""), '  ')

          replace_span(
              spectator,
              "  useEffect(() => {\n    let cancelled = false\n    const refresh = async () => {",
              "  }, [spectator.battleKey])",
              refresh_effect,
          )

          log_effect = indent(dedent("""\
          useEffect(() => {
            let cancelled = false
            const controller = new AbortController()

            const refreshLog = async () => {
              try {
                const params = new URLSearchParams({ after: '0', includeLog: '1' })
                const response = await fetch(
                  `/api/pvp/battles/${encodeURIComponent(battle.battleSessionId)}/chat?${params.toString()}`,
                  { cache: 'no-store', signal: controller.signal },
                )
                const body = (await response.json()) as ApiBody
                if (cancelled || controller.signal.aborted) return
                if (!response.ok) {
                  setBattleLogError(body.error?.message ?? 'Battle log is temporarily unavailable.')
                  return
                }
                if (body.battleLog) setBattleLog(body.battleLog)
                setBattleLogError(null)
              } catch (refreshError) {
                if (
                  !cancelled &&
                  !(refreshError instanceof DOMException && refreshError.name === 'AbortError')
                ) {
                  setBattleLogError('Battle log interrupted. Retrying…')
                }
              }
            }

            void refreshLog()
            return () => {
              cancelled = true
              controller.abort()
            }
          }, [battle.battleSessionId, battle.battleVersion])"""), '  ')

          replace_span(
              spectator,
              "  useEffect(() => {\n    let cancelled = false\n    let timer: number | null = null\n\n    const refreshLog = async () => {",
              "  }, [battle.battleSessionId])",
              log_effect,
          )

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format touched source
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            apps/web/src/components/battle/pvp-battle-quality-controls.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            'apps/web/src/app/api/pvp/battles/[battleSessionId]/chat/route.ts'

      - name: Typecheck web app
        run: pnpm --filter @aurevane/web typecheck

      - name: Commit source changes
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            apps/web/src/components/battle/pvp-battle-quality-controls.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            'apps/web/src/app/api/pvp/battles/[battleSessionId]/chat/route.ts'
          git diff --cached --check
          git commit -m "fix: reduce PvP polling pressure v2 [cpu-v2-applied]"
          git push origin HEAD:fix/pvp-high-cpu-surgical-v2-20260825
