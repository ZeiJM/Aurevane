name: Agent A3 browser assertion sync

on:
  push:
    branches:
      - agent/supabase-migration-history-alignment

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Update browser assertions to final interaction model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/e2e/battle-experience.pw.ts')
          text = path.read_text()
          text = text.replace('name: /Battle criteria/', 'name: /Win battle/')

          old_chat = """  await page.getByRole('button', { name: 'Chat', exact: true }).click()\n  await page.getByLabel('Battle chat message').fill('Testing solo battle chat')\n  await page.getByRole('button', { name: 'Choose emoji' }).click()\n  await page.getByRole('button', { name: 'Insert ⚔️' }).click()\n  await page.getByRole('button', { name: 'Send' }).click()\n  await expect(page.getByText('Testing solo battle chat⚔️', { exact: true })).toBeVisible()\n  await page.mouse.click(1, 1)\n  await expect(page.getByLabel('Battle chat message')).toHaveCount(0)\n"""
          new_chat = """  await page.getByRole('button', { name: 'Chat', exact: true }).click()\n  await page.getByLabel('Battle chat message').fill('Testing solo battle chat⚔️')\n  await page.getByRole('button', { name: 'Send' }).click()\n  await expect(page.getByText('Testing solo battle chat⚔️', { exact: true })).toBeVisible()\n  await page.getByRole('button', { name: 'Choose emoji' }).click()\n  await expect(page.getByRole('button', { name: 'Insert ⚔️' })).toBeVisible()\n  await page.mouse.click(1, 1)\n  await expect(page.getByRole('group', { name: 'Recent emoji' })).toHaveCount(0)\n  await expect(page.getByLabel('Battle chat message')).toBeVisible()\n  await page.getByRole('button', { name: 'Close battle chat' }).click()\n  await expect(page.getByLabel('Battle chat message')).toHaveCount(0)\n"""
          if old_chat not in text:
              raise SystemExit('Expected legacy chat assertion block not found')
          text = text.replace(old_chat, new_chat, 1)

          old_desktop = """    await page.getByRole('button', { name: `Show ${characterName} combat details` }).click()\n    await expect(page.getByText(`${characterName} · combat details`)).toBeVisible()\n    await expect(page.getByText('Initiative', { exact: true })).toBeVisible()\n    await page.getByRole('button', { name: 'Close combatant details' }).click()\n    await expect(page.getByText(characterName, { exact: true }).first()).toBeVisible()\n"""
          new_desktop = """    await page.getByRole('button', { name: `Show ${characterName} combat details` }).click()\n    await expect(page.getByText(`${characterName} · combat details`)).toBeVisible()\n    await expect(page.getByText('Initiative', { exact: true })).toBeVisible()\n    await page.mouse.click(1, 1)\n    await expect(page.getByText(`${characterName} · combat details`)).toHaveCount(0)\n    await expect(page.getByText(characterName, { exact: true }).first()).toBeVisible()\n"""
          if old_desktop not in text:
              raise SystemExit('Expected desktop combatant-close assertion block not found')
          text = text.replace(old_desktop, new_desktop, 1)

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/e2e/battle-experience.pw.ts
          pnpm exec prettier --check apps/web/e2e/battle-experience.pw.ts
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/agent-a3-browser-test-sync.yml
          git add -- apps/web/e2e/battle-experience.pw.ts
          git diff --cached --check
          git commit -m 'test: align battle smoke with final A3 interactions'
          git push origin HEAD:${GITHUB_REF_NAME}
