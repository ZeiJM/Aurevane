name: P3.2 docs reconcile once

on:
  push:
    branches:
      - agent/p3-2-secondary-attunement
    paths:
      - '.github/workflows/p32-docs-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify P3.2 candidate ancestor
        run: git merge-base --is-ancestor 'cb56db299da74d3c6376a460dafa35c621dfa898' HEAD

      - name: Reconcile active Phase 3 status
        run: |
          python .github/scripts/p32-docs-reconcile-once.py
          git diff --check

      - name: Commit durable reconciliation
        run: |
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add TASKS.md docs/ROADMAP.md AGENTS.md
          git commit -m 'Reconcile active P3.2 phase status'
          git push origin HEAD:agent/p3-2-secondary-attunement
