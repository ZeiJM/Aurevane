name: Active status copy workbench

on:
  push:
    branches:
      - review/active-status-copy-b7ad993

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7ad993209afe1348c0a14030ee81026eb646dbd
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify protected refs and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b7ad993209afe1348c0a14030ee81026eb646dbd
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = b7ad993209afe1348c0a14030ee81026eb646dbd
          test "$(git ls-remote origin refs/heads/agent/combat-k4-active-status-copy-b7ad993 | cut -f1)" = b7ad993209afe1348c0a14030ee81026eb646dbd
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core test
      - name: Preserve prior draft tests and reconcile only the obsolete ID expectation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 53e1c8840077efbab5f66789857ac4afc3e3590b
          for name in combat-status-copy.test.ts combat-status-copy-publication.test.ts; do
            path="packages/game-core/src/combat/$name"
            test ! -e "$path"
            git show "53e1c8840077efbab5f66789857ac4afc3e3590b:$path" > "$path"
          done
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/game-core/src/combat/combat-status-copy.test.ts')
          text = path.read_text()
          old = "expect(copied.instanceId).toContain(':copy:1')"
          assert text.count(old) == 1
          text = text.replace(old, """expect(copied.instanceId).toBe(
            `effect-copy:${JSON.stringify([
              input.action.triggerChainId, input.action.actionDefinitionId,
              input.effectOrdinal, input.targetCombatantId, input.copyOrdinal,
            ])}`,
          )""")
          path.write_text(text)
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-status-copy.test.ts packages/game-core/src/combat/combat-status-copy-publication.test.ts
          pnpm exec eslint packages/game-core/src/combat/combat-status-copy.test.ts packages/game-core/src/combat/combat-status-copy-publication.test.ts
          pnpm --filter @aurevane/game-core typecheck
      - name: Classify actual missing-feature RED and retain test-only source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @aurevane/game-core exec vitest run --reporter=json --outputFile=/tmp/status-copy-red.json
          outcome=$?
          set -e
          test "$outcome" -ne 0
          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/status-copy-red.json').read_text())
          allowed = {'combat-status-copy.test.ts', 'combat-status-copy-publication.test.ts'}
          failures = [suite for suite in data['testResults'] if suite['status'] == 'failed']
          assert failures and all(Path(suite['name']).name in allowed for suite in failures)
          assert data['numPassedTests'] >= 1597
          assert data['numFailedTests'] > 0
          print('VALID_RED: all previous core tests remain green; only new copy contracts fail')
          print('passed=', data['numPassedTests'], 'failed=', data['numFailedTests'], 'total=', data['numTotalTests'])
          for suite in failures:
              for test in suite['assertionResults']:
                  if test['status'] == 'failed':
                      print('RED_ASSERTION:', test['fullName'])
                      print('\n'.join(test.get('failureMessages', []))[:380])
          PY
          git diff --exit-code
          python3 <<'PY'
          import subprocess
          files = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert files == {'packages/game-core/src/combat/combat-status-copy.test.ts', 'packages/game-core/src/combat/combat-status-copy-publication.test.ts'}, files
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = b7ad993209afe1348c0a14030ee81026eb646dbd
          test "$(git ls-remote origin refs/heads/agent/combat-k4-active-status-copy-b7ad993 | cut -f1)" = b7ad993209afe1348c0a14030ee81026eb646dbd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/game-core/src/combat/combat-status-copy.test.ts packages/game-core/src/combat/combat-status-copy-publication.test.ts
          git diff --cached --check
          git commit -m 'test(combat): reconcile active status copying contracts on merged copy identities'
          git push origin HEAD:refs/heads/agent/combat-k4-active-status-copy-b7ad993
          echo "VALID_RED_SOURCE=$(git rev-parse HEAD)"
          git diff --exit-code
          test -z "$(git status --porcelain)"
