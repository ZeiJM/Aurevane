name: Active status copy workbench

on:
  push:
    branches:
      - review/active-status-copy-b7ad993

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5523f409922a1956714ccc0a8a62d333296546f
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact candidate and locked setup
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = c5523f409922a1956714ccc0a8a62d333296546f
          test "$(git rev-parse HEAD^{tree})" = f82e6ce78fbd0e07f2edbe94b2a612f2f56fab3f
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Extra transfer boundaries on real candidate
        shell: bash
        run: |
          set -euo pipefail
          file=packages/game-core/src/combat/combat-status-copy.test.ts
          trap 'git restore --source=HEAD -- "$file"' EXIT
          cat >> "$file" <<'TEST'

          describe('Review-only active status copying boundaries', () => {
            const vectors = [1, 2, 3].flatMap((incoming) => [0, 1, 2, 3].flatMap((existing) =>
              [1, 4].flatMap((donorTicks) => [1, 4].map((receiverTicks) => ({ incoming, existing, donorTicks, receiverTicks })))))
            it.each(vectors)('preserves bounded copied state for %j', ({ incoming, existing, donorTicks, receiverTicks }) => {
              const state = world([
                { combatantId: 'target', statuses: [row(POSITIVE, { stacks: incoming, remainingOwnerTurnStarts: donorTicks })] },
                { combatantId: 'actor', statuses: existing ? [row(POSITIVE, { stacks: existing, remainingOwnerTurnStarts: receiverTicks })] : [] },
              ])
              const before = JSON.stringify(state)
              const result = cast(state, 'amplify', CONTENT, context())
              expect(statuses(result.state, 'actor')[0]).toMatchObject({
                stacks: Math.min(3, incoming + existing), remainingOwnerTurnStarts: Math.max(donorTicks, existing ? receiverTicks : 0),
                sourceCombatantId: 'actor', statusVersion: 1,
              })
              expect(statuses(result.state, 'target')).toEqual(statuses(state, 'target'))
              expect(JSON.stringify(state)).toBe(before)
              expect(validateCombatEncounterState(JSON.parse(JSON.stringify(result.state)))).toEqual([])
            })
            it.each([{ statusVersion: 2 }, { stacks: 4 }, { remainingOwnerTurnStarts: 5 }])('rejects malformed receiver state %j', (patch) => {
              const state = world([{ combatantId: 'target', statuses: [row(POSITIVE)] },
                { combatantId: 'actor', statuses: [row(POSITIVE, patch)] }])
              expect(() => cast(state, 'amplify')).toThrow()
            })
            it('merges safe-integer maximum stacks without an overflowing intermediate sum', () => {
              const definition = { ...POSITIVE, maximumStacks: Number.MAX_SAFE_INTEGER, damageTakenMultiplierBasisPoints: 10_000 }
              const state = world([{ combatantId: 'target', statuses: [row(definition, { stacks: Number.MAX_SAFE_INTEGER })] },
                { combatantId: 'actor', statuses: [row(definition, { stacks: Number.MAX_SAFE_INTEGER })] }])
              expect(statuses(cast(state, 'amplify', { statuses: [definition] }).state, 'actor')[0]?.stacks).toBe(Number.MAX_SAFE_INTEGER)
            })
            it('a copy of a copy names the immediate donor and prior recipient', () => {
              const donor = row(POSITIVE, { provenance: origin('target') })
              const first = cast(world([{ combatantId: 'target', statuses: [donor] }]), 'amplify', CONTENT, context())
              const firstCopy = statuses(first.state, 'actor')[0]
              const next = advance(first.state)
              const action = copying('amplify')
              const result = executeCombatAction(next, action, { kind: 'unit', combatantId: 'actor' }, CONTENT,
                context(action.id, 'target', 'chain:second-copy'))
              expect(statuses(result.state, 'target')[0]?.provenance).toMatchObject({
                copiedFromInstanceId: firstCopy?.provenance?.instanceId,
                inheritedFromInstanceId: donor.provenance?.instanceId,
              })
              expect(validateCombatEncounterState(result.state)).toEqual([])
            })
            it('chooses stable Mark lineage on tied source durations without reattributing another receiver source', () => {
              const first = row(MARK, { sourceCombatantId: 'other', provenance: origin('actor', 0, 'chain:mark-other') })
              const targetOrigin = createCombatEffectInstanceProvenance({ action: context('test.original', 'target', 'chain:mark-target').provenance,
                targetCombatantId: 'actor', effectOrdinal: 0, createdRound: 1, createdTurn: 1 })
              const second = row(MARK, { sourceCombatantId: 'target', provenance: targetOrigin })
              const retained = row(MARK, { provenance: origin('target', 0, 'chain:retained') })
              const state = world([{ combatantId: 'actor', statuses: [second, first] }, { combatantId: 'target', statuses: [retained] }])
              const result = cast(state, 'curse', CONTENT, context('test.curse'))
              expect(statuses(result.state, 'target').find((entry) => entry.sourceCombatantId === 'actor')?.provenance?.copiedFromInstanceId).toBe(first.provenance?.instanceId)
              expect(statuses(result.state, 'target').find((entry) => entry.sourceCombatantId === 'other')).toBe(statuses(state, 'target')[0])
            })
            it('copied HP/MP Absorb and Reflect work together without firing during the copy itself', () => {
              const hp: CombatStatusDefinition = { ...POSITIVE, id: 'test.absorb-hp', maximumStacks: 1,
                damageTakenMultiplierBasisPoints: 10_000, reactionClass: 'reactive', absorbHpBasisPoints: 2_500 }
              const mp: CombatStatusDefinition = { ...hp, id: 'test.absorb-mp', absorbHpBasisPoints: undefined, absorbMpBasisPoints: 2_500 }
              const content = { statuses: [hp, mp, REFLECT] }
              const state = world([{ combatantId: 'target', statuses: [row(hp), row(mp), row(REFLECT)] }])
              const copied = cast(state, 'amplify', content, context())
              expect(copied.events.some((event) => event.event === 'damage_applied' || event.event === 'healing_applied')).toBe(false)
              expect(new Set(statuses(copied.state, 'actor').map((entry) => entry.provenance?.instanceId)).size).toBe(3)
              const result = executeCombatAction(advance(copied.state, content), attack(), { kind: 'unit', combatantId: 'actor' }, content)
              expect(result.state.tactical.battle.combatants.find((unit) => unit.id === 'actor')).toMatchObject({ hp: 85, mp: 21 })
              expect(result.state.tactical.battle.combatants.find((unit) => unit.id === 'target')?.hp).toBe(95)
            })
            it('a copied legacy-periodic status retains its remaining ticks and expires normally', () => {
              const definition: CombatStatusDefinition = { ...POSITIVE, id: 'test.legacy-recovery', maximumStacks: 1,
                damageTakenMultiplierBasisPoints: 10_000, reactionClass: 'periodic', endOfTurn: { type: 'healing', amount: 4 } }
              const content = { statuses: [definition] }
              const base = world([{ combatantId: 'target', statuses: [row(definition)] }])
              const state = { ...base, tactical: { ...base.tactical, battle: { ...base.tactical.battle,
                combatants: base.tactical.battle.combatants.map((unit) => unit.id === 'actor' ? { ...unit, hp: 80 } : unit) } } }
              let next = cast(state, 'amplify', content, context()).state
              next = advance(next, content)
              expect(statuses(next, 'actor')[0]?.remainingOwnerTurnStarts).toBe(1)
              for (let index = 0; index < 3; index += 1) next = advance(next, content)
              expect(statuses(next, 'actor')).toEqual([])
              expect(next.tactical.battle.combatants.find((unit) => unit.id === 'actor')?.hp).toBe(88)
            })
            it('per-target copying from an ally does not roll hostile accuracy', () => {
              const state = world([{ combatantId: 'other', statuses: [row(POSITIVE)] }], 0)
              const action = copying('amplify', { accuracyMode: 'per-target' })
              const result = executeCombatAction(state, action, { kind: 'unit', combatantId: 'other' }, CONTENT, context(action.id))
              expect(statuses(result.state, 'actor')).toHaveLength(1)
              expect(result.state.tactical.battle.rng).toEqual(state.tactical.battle.rng)
            })
            it('does not ignore a missing donor catalog entry', () => {
              const state = world([{ combatantId: 'target', statuses: [row(POSITIVE), row(REFLECT)] }])
              expect(() => cast(state, 'amplify', { statuses: [REFLECT] })).toThrow()
            })
            it.each(['amplify', 'curse'] as const)('respects disallowed team selection for %s', (mode) => {
              const donorId = mode === 'amplify' ? 'target' : 'actor'
              const definition = mode === 'amplify' ? POSITIVE : NEGATIVE
              const state = world([{ combatantId: donorId, statuses: [row(definition)] }])
              const action = copying(mode, { target: { ...attack().target, teamPolicy: 'ally', friendlyFire: 'allies-only' } })
              const before = JSON.stringify(state)
              expect(evaluateCombatAction(state, action, TARGET, CONTENT).legal).toBe(false)
              expect(() => executeCombatAction(state, action, TARGET, CONTENT)).toThrow()
              expect(JSON.stringify(state)).toBe(before)
            })
          })
          TEST
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-status-copy.test.ts src/combat/combat-status-copy-publication.test.ts src/combat/combat-copy-provenance.test.ts src/combat/combat-mark-blind.contract.test.ts src/combat/combat-reflect.test.ts src/combat/combat-absorb-hp.test.ts src/combat/combat-absorb-mp.test.ts src/combat/combat-effect-provenance.test.ts src/combat/combat-effect-provenance-state.test.ts src/combat/combat-skill-accuracy.test.ts src/combat/actions.test.ts src/combat/mature-skills.test.ts src/combat/pv1f-action-economy.test.ts src/combat/mature-skill-lifecycle.test.ts
          git restore --source=HEAD -- "$file"
          trap - EXIT
      - name: Compare complete historical forecasts and subsequent turns against the prior shared source
        shell: bash
        run: |
          set -euo pipefail
          file=packages/game-core/src/combat/combat-status-copy-compatibility-review.test.ts
          test ! -e "$file"
          python3 <<'PY'
          from pathlib import Path
          original = Path('packages/game-core/src/combat/combat-status-copy.test.ts').read_text()
          header = original.split("describe('Amplify Curse active-status copying: public command contract'")[0]
          Path('packages/game-core/src/combat/combat-status-copy-compatibility-review.test.ts').write_text(header)
          PY
          cat >> "$file" <<'TEST'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { executeStatDrivenAttack, forecastStatDrivenAttack } from './stat-driven-combat'
          it('matches full historical output for 45 ordinary command and turn sequences', () => {
            const results: unknown[] = []
            for (const accuracy of [0, 1_500, 5_000, 8_500, 10_000]) {
              for (const variant of ['plain', 'guard', 'mark']) {
                for (const mode of ['automatic', 'per-target', 'basic']) {
                  const initial = variant === 'plain' ? [] : [{ combatantId: 'target', statuses: [variant === 'guard'
                    ? row(POSITIVE) : row(MARK, { sourceCombatantId: 'actor' })] }]
                  const state = world(initial, accuracy)
                  const action: CombatActionDefinition = mode === 'basic' ? { ...attack(), sourceType: 'basic-attack' }
                    : { ...attack(), accuracyMode: mode === 'automatic' ? 'automatic' : 'per-target' }
                  const forecast = mode === 'basic' ? forecastStatDrivenAttack(state, action, TARGET, CONTENT)
                    : evaluateCombatAction(state, action, TARGET, CONTENT)
                  const transition = mode === 'basic' ? executeStatDrivenAttack(state, action, TARGET, CONTENT)
                    : executeCombatAction(state, action, TARGET, CONTENT, context(action.id, 'actor', 'chain:compatibility'))
                  let next: CombatEncounterState = transition.state
                  const turns: unknown[] = []
                  for (let index = 0; index < 4; index += 1) { next = advance(next); turns.push(next) }
                  results.push({ accuracy, variant, mode, forecast, transition, turns })
                }
              }
            }
            expect(results).toHaveLength(45)
            const output = JSON.stringify(results)
            const path = '/tmp/active-copy-historical-output.json'
            if (process.env.COPY_REVIEW_CAPTURE === '1') writeFileSync(path, output)
            else expect(output).toBe(readFileSync(path, 'utf8'))
          })
          TEST
          modules=(packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/actions.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/combat-effect-provenance.ts packages/game-core/src/combat/mature-skills.ts packages/game-core/src/combat/pv1f-action-economy.ts)
          trap 'git restore --source=HEAD -- "${modules[@]}"; rm -f "$file"' EXIT
          git restore --source=b7ad993209afe1348c0a14030ee81026eb646dbd -- "${modules[@]}"
          COPY_REVIEW_CAPTURE=1 pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-status-copy-compatibility-review.test.ts
          git restore --source=HEAD -- "${modules[@]}"
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-status-copy-compatibility-review.test.ts
          rm "$file"
          trap - EXIT
          echo 'HISTORICAL_COMPARISONS=45 matched complete forecast, command output and four following turn states'
      - name: Confirm unchanged source and restricted scope after review
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 0152285c38ba56978cbcb591604d9d05e452624f HEAD -- packages/game-core/src/combat/combat-status-copy.test.ts packages/game-core/src/combat/combat-status-copy-publication.test.ts apps/web/src/components/character/skill-status-copy-description.test.ts
          git diff --exit-code b7ad993209afe1348c0a14030ee81026eb646dbd HEAD -- .github pnpm-lock.yaml package.json supabase packages/game-core/src/combat/combat-kernel-types.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/status-content.ts packages/game-core/src/combat/phase4-roster.ts
          test "$(git diff --name-only b7ad993209afe1348c0a14030ee81026eb646dbd HEAD | wc -l)" = 12
          git diff --check b7ad993209afe1348c0a14030ee81026eb646dbd HEAD
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'REVIEWED_SOURCE=c5523f409922a1956714ccc0a8a62d333296546f'
