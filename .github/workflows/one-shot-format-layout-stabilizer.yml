name: One-shot layout stabilizer formatting

on:
  push:
    branches:
      - agent/battle-input-responsive-consistency-v3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-input-responsive-consistency-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format layout stabilizer
        run: pnpm exec prettier --write apps/web/src/components/battle/battle-cockpit-layout-stabilizer.tsx
      - name: Commit formatting and remove helper
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-format-layout-stabilizer.yml
          git add apps/web/src/components/battle/battle-cockpit-layout-stabilizer.tsx
          git commit -m "style: format battle cockpit layout stabilizer"
          git push origin HEAD:agent/battle-input-responsive-consistency-v3
