          plan.write_text('''# Skill Accuracy Kernel Implementation Plan

          > For agentic workers: use superpowers:executing-plans. This is the first independently verified slice of the approved accuracy / Mark / Blind group.

          **Goal:** Resolve opted-in Skills using one deterministic roll per hostile unit while preserving existing command effects, costs, reactions and historical behavior.

          **Architecture:** A shared probability helper reads committed stat profiles. The public wrapper validates and resolves target rolls; an engine-owned recipient filter skips missed hostile recipients inside the existing effect sequence. No second damage resolver or authored hit-result override is introduced.

          **Tech Stack:** Existing TypeScript, Vitest, pnpm and GitHub Actions; no dependency changes.

          **Spec:** `docs/superpowers/specs/2026-09-12-reactive-effects-accuracy-discipline-rebalance-design.md`, section 9. Mark/Blind status mechanics and complete presentation/AI publication remain following slices.

          ## Global constraints

          Server-owned state and deterministic RNG; optional backward-compatible fields; immutable published catalogs; no deployment; never merge diagnostic workbench branches. Use the exact verified shared base and expected-head merge locks. Ordinary automatic behavior and the Basic Attack adapter remain compatible.

          ## Task 1: Per-target accuracy runtime

          - [x] Verify shared baseline and read command, authoring, provenance and mature Skill entry points.
          - [x] Write public-entry-point tests; correct the fixture type annotation; observe 40 assertion-only RED failures with 1,443 passing tests.
          - [ ] Add `combat-skill-accuracy.ts`: common authoring validation, pure hit probability, stable hostile recipient forecasts and deterministic rolls.
          - [ ] Wire public `actions.ts` and the engine-owned commit recipient filter in `actions-legacy.ts`; exclude missed recipients from K3 provenance assignment.
          - [ ] Forward optional fields through `mature-skills.ts`; reuse probability math in the existing Basic Attack adapter without changing its execution behavior.
          - [ ] Run focused tests, typecheck and full `pnpm check`; inspect exact source/file scope and retain the source-only candidate.
          - [ ] Review and pass all exact-head PR workflows, merge into shared combat, then verify exact merge-head Quality and Database checks. PR receipts record this integration stage.

          ## Interfaces and follow-on boundary

          `CombatAccuracyAuthoring` defines optional accuracy mode and modifier. `forecastCombatSkillAccuracy` adds `targetHitChances` and `projectionsAssumeHits` only to legal opted-in previews. `rollCombatSkillAccuracy` consumes the same chances and returns immutable RNG state, accuracy receipts and missed recipient IDs. `calculateHitChanceBasisPoints` remains the shared arithmetic function also re-exported by the historical Basic Attack module.

          Mark/Blind requires separate source-specific state, refresh/nonstack validation, historical Mark compatibility and integration into this same probability function. Player-facing conditional forecasts, AI expected-value scoring and content publication are not certified by this kernel ticket.
          '''.replace('\n          ','\n'))
          helper=root/'combat-skill-accuracy.ts'
          assert not helper.exists()
          helper.write_text('''import { advanceBattleRng } from './battle-state'
          import type { CombatActionDefinition, CombatActionEvaluation, CombatEncounterState } from './actions'

          const BASIS_POINTS = 10_000
          export const COMBAT_SKILL_ACCURACY_RULES_VERSION = 1 as const

          export interface CombatAccuracyAuthoring {
            readonly accuracyMode?: 'automatic' | 'per-target'
            readonly accuracyModifierBasisPoints?: number
          }

          export interface CombatTargetHitChance {
            targetCombatantId: string
            hitChanceBasisPoints: number
          }

          export interface CombatSkillAccuracyResolvedEvent extends CombatTargetHitChance {
            event: 'combat_accuracy_resolved'
            actionId: string
            sourceCombatantId: string
            rollBasisPoints: number
            hit: boolean
            accuracyRulesVersion: typeof COMBAT_SKILL_ACCURACY_RULES_VERSION
          }

          export function validateCombatAccuracyDefinition(
            definition: CombatAccuracyAuthoring & { readonly sourceType?: string },
          ): void {
            if (definition.accuracyMode !== undefined &&
                definition.accuracyMode !== 'automatic' && definition.accuracyMode !== 'per-target') {
              throw new TypeError('Combat accuracy mode is not supported.')
            }
            if (definition.accuracyModifierBasisPoints !== undefined &&
                (!Number.isSafeInteger(definition.accuracyModifierBasisPoints) ||
                 Math.abs(definition.accuracyModifierBasisPoints) > 3_000)) {
              throw new RangeError('Combat accuracy modifier must be an integer within +/-3000 basis points.')
            }
            if (definition.sourceType === 'basic-attack' && definition.accuracyMode !== undefined) {
              throw new TypeError('Basic Attack retains its existing accuracy adapter; explicit Skill accuracy mode is not supported.')
            }
          }

          /** Shared arithmetic only. Callers validate committed ratings and authored modifiers. */
          export function calculateHitChanceBasisPoints(
            actor: { accuracy: number },
            target: { evasion: number },
            modifierBasisPoints = 0,
          ): number {
            return Math.max(0, Math.min(BASIS_POINTS, actor.accuracy - target.evasion + modifierBasisPoints))
          }

          /** Forecasts outcomes conditional on hits, never samples or exposes the next RNG draw. */
          export function forecastCombatSkillAccuracy(
            state: CombatEncounterState,
            action: CombatActionDefinition,
            evaluation: CombatActionEvaluation,
          ): CombatActionEvaluation {
            validateCombatAccuracyDefinition(action)
            if (!evaluation.legal || !evaluation.actorId || action.accuracyMode !== 'per-target') return evaluation
            const actorId = evaluation.actorId
            const actor = state.tactical.battle.combatants.find((unit) => unit.id === actorId)
            if (!actor) throw new TypeError('Combat accuracy requires the committed acting combatant.')
            const recipients = new Set<string>()
            for (const effect of action.effects) {
              if (effect.type === 'create-terrain' || effect.recipient === 'actor') continue
              if (effect.recipient === 'primary-unit') {
                if (evaluation.primaryCombatantId) recipients.add(evaluation.primaryCombatantId)
              } else {
                for (const id of evaluation.affectedCombatantIds) recipients.add(id)
              }
            }
            const hostileIds = [...recipients].filter((id) => {
              const target = state.tactical.battle.combatants.find((unit) => unit.id === id)
              if (!target) throw new TypeError('Combat accuracy requires a committed recipient.')
              return target.hp > 0 && target.teamId !== actor.teamId
            }).sort((left, right) => left < right ? -1 : left > right ? 1 : 0)
            const targetHitChances = hostileIds.length === 0 ? [] : (() => {
              const accuracy = committedRating(state, actorId, 'accuracy')
              return hostileIds.map((targetCombatantId) => ({
                targetCombatantId,
                hitChanceBasisPoints: calculateHitChanceBasisPoints(
                  { accuracy },
                  { evasion: committedRating(state, targetCombatantId, 'evasion') },
                  action.accuracyModifierBasisPoints ?? 0,
                ),
              }))
            })()
            return { ...evaluation, targetHitChances, projectionsAssumeHits: true }
          }

          /** Called only with server-owned state after ordinary legality. Results are never authored. */
          export function rollCombatSkillAccuracy(
            state: CombatEncounterState,
            action: CombatActionDefinition,
            evaluation: CombatActionEvaluation | null,
          ): { state: CombatEncounterState; events: readonly CombatSkillAccuracyResolvedEvent[]; missedCombatantIds: ReadonlySet<string> } {
            const missedCombatantIds = new Set<string>()
            const events: CombatSkillAccuracyResolvedEvent[] = []
            if (!evaluation?.legal || !evaluation.actorId || action.accuracyMode !== 'per-target') {
              return { state, events, missedCombatantIds }
            }
            const forecast = forecastCombatSkillAccuracy(state, action, evaluation)
            let rng = state.tactical.battle.rng
            for (const chance of forecast.targetHitChances ?? []) {
              const draw = advanceBattleRng(rng)
              rng = draw.state
              const rollBasisPoints = draw.value % BASIS_POINTS
              const hit = rollBasisPoints < chance.hitChanceBasisPoints
              if (!hit) missedCombatantIds.add(chance.targetCombatantId)
              events.push({ event: 'combat_accuracy_resolved', actionId: action.id,
                sourceCombatantId: evaluation.actorId, ...chance, rollBasisPoints, hit,
                accuracyRulesVersion: COMBAT_SKILL_ACCURACY_RULES_VERSION })
            }
            return {
              state: events.length === 0 ? state : {
                ...state, tactical: { ...state.tactical, battle: { ...state.tactical.battle, rng } },
              },
              events,
              missedCombatantIds,
            }
          }

          function committedRating(state: CombatEncounterState, combatantId: string, field: 'accuracy' | 'evasion'): number {
            const profiles = state.statBridge?.combatants
            if (!profiles || !Array.isArray(profiles)) throw new TypeError('Combat accuracy requires committed stat profiles.')
            const matches = profiles.filter((row) => row.combatantId === combatantId)
            if (matches.length !== 1) throw new TypeError('Combat accuracy requires exactly one committed profile per recipient.')
            const value = matches[0]?.[field]
            if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < 0 || value > BASIS_POINTS) {
              throw new RangeError(`Combat accuracy ${field} must be an integer between 0 and 10000 basis points.`)
            }
            return value
          }
          '''.replace('\n          ','\n'))
