name: Skill accuracy workbench
on:
  push:
    branches: [review/skill-accuracy-workbench-20260915]
permissions:
  contents: read
jobs:
  accuracy-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3ed624e97a7472aa0f7fc3ad0ea2f97b729059d
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Review exact candidate without retaining synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e3ed624e97a7472aa0f7fc3ad0ea2f97b729059d
          test "$(git rev-parse HEAD^{tree})" = 0e0c6e6eb67d32bf67745fe9384251d75b328ac6
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('packages/game-core/src/combat')
          tests=root/'combat-skill-accuracy.test.ts'
          original=tests.read_bytes()
          old_actions=root/'actions-accuracy-review-baseline.ts'
          old_stats=root/'stat-driven-accuracy-review-baseline.ts'
          assert not old_actions.exists() and not old_stats.exists()
          additions='''
          import * as historicalActions from './actions-accuracy-review-baseline'
          import * as historicalStats from './stat-driven-accuracy-review-baseline'
          import { executeStatDrivenAttack, forecastStatDrivenAttack } from './stat-driven-combat'
          import type { CombatStatusDefinition } from './actions'

          const reviewSeeds = [1, 2, 3, 17, 53, 77, 1000, 4_294_967_295]
          const reviewVectors = reviewSeeds.flatMap((seed) => [-1500, 0, 1500].map((modifier) => ({ seed, modifier })))
          it.each(reviewVectors)('review seeded intermediate probability resolves exactly %j', ({ seed, modifier }) => {
            const initial = world(6000, 1000, seed)
            const before = JSON.stringify(initial)
            const command = { ...action(), accuracyModifierBasisPoints: modifier }
            const draw = advanceBattleRng(initial.tactical.battle.rng)
            const expectedChance = 5000 + modifier
            const expectedHit = draw.value % 10000 < expectedChance
            const preview = evaluateCombatAction(initial, command, SELECT, CONTENT)
            const result = cast(initial, command)
            expect(preview.targetHitChances).toEqual([{ targetCombatantId: 'target', hitChanceBasisPoints: expectedChance }])
            expect(rolls(result.events)).toEqual([{ event: 'combat_accuracy_resolved', actionId: command.id,
              sourceCombatantId: 'actor', targetCombatantId: 'target', hitChanceBasisPoints: expectedChance,
              rollBasisPoints: draw.value % 10000, hit: expectedHit, accuracyRulesVersion: 1 }])
            expect(unit(result.state).hp).toBe(expectedHit ? 80 : 100)
            expect(result.state.statusState.find((row) => row.combatantId === 'target')?.statuses.length).toBe(expectedHit ? 1 : 0)
            expect(result.state.tactical.battle.rng).toEqual(draw.state)
            expect(JSON.stringify(initial)).toBe(before)
            expect(cast(initial, command)).toEqual(result)
            expect(() => JSON.stringify(result)).not.toThrow()
            expect(result.state).not.toHaveProperty('missedCombatantIds')
          })
          it('review target sorting is independent of primary-recipient insertion order', () => {
            const initial = world(10000, 10000)
            const command = action([{ type: 'damage', recipient: 'primary-unit', amount: 20 },
              { type: 'damage', recipient: 'affected-units', amount: 7 }])
            command.target = { ...command.target, shape: { kind: 'circle', radius: 1 } }
            const result = executeCombatAction(initial, command, { kind: 'unit', combatantId: 'z-target' }, CONTENT)
            expect(rolls(result.events).map((event) => [event.targetCombatantId, event.hit])).toEqual([['target', false], ['z-target', true]])
            expect(unit(result.state).hp).toBe(100)
            expect(unit(result.state, 'z-target').hp).toBe(73)
          })
          it('review a mixed-hit area only stamps provenance on the successful enemy', () => {
            const initial = existingDebuff(world(10000, 10000))
            const before = initial.statusState.find((row) => row.combatantId === 'target')
            const command = action([{ type: 'apply-status', recipient: 'affected-units', statusId: 'test.debuff', stacks: 1 }])
            command.target = { ...command.target, shape: { kind: 'circle', radius: 1 } }
            const result = cast(initial, command, context())
            expect(result.state.statusState.find((row) => row.combatantId === 'target')).toEqual(before)
            expect(result.state.statusState.find((row) => row.combatantId === 'z-target')?.statuses[0]?.provenance)
              .toMatchObject({ effectOrdinal: 0, targetCombatantId: 'z-target' })
          })
          it('review a successful Barrier-blocked hit still applies its debuff', () => {
            const initial: CombatEncounterState = world(10000, 0)
            initial.effectState = { ...normalizeCombatEffectState(undefined), barriers: [{ targetCombatantId: 'target', sourceCombatantId: 'target', sourceActionId: 'review.barrier', amount: 20 }] }
            const result = cast(initial)
            expect(unit(result.state).hp).toBe(100)
            expect(result.state.statusState.find((row) => row.combatantId === 'target')?.statuses[0]?.statusId).toBe('test.debuff')
            expect(rolls(result.events)[0]).toMatchObject({ hit: true })
          })
          it.each([0, 10000])('review only a successful roll can trigger HP/MP Absorb and Reflect at chance %s', (accuracy) => {
            const base = world(accuracy, 0)
            const reactive: CombatStatusDefinition = { id: 'review.reactive', version: 1, maximumStacks: 1,
              durationOwnerTurnStarts: 2, damageTakenMultiplierBasisPoints: 10000, polarity: 'positive', reactionClass: 'reactive',
              absorbHpBasisPoints: 2500, absorbMpBasisPoints: 2500, reflectBasisPoints: 2500 }
            const initial: CombatEncounterState = { ...base, statusState: base.statusState.map((row) => row.combatantId === 'target'
              ? { ...row, statuses: [{ statusId: reactive.id, statusVersion: 1, stacks: 1, remainingOwnerTurnStarts: 2, sourceCombatantId: 'target' }] } : row) }
            const result = executeCombatAction(initial, action(), SELECT, { statuses: [...CONTENT.statuses, reactive] })
            expect(unit(result.state)).toMatchObject({ hp: accuracy ? 85 : 100, mp: accuracy ? 25 : 20 })
            expect(unit(result.state, 'actor').hp).toBe(accuracy ? 55 : 60)
            expect(result.state.effectState?.damageHistory ?? []).toEqual(accuracy ? [{ combatantId: 'target', round: 1, amount: 20 }] : [])
            expect(rolls(result.events)).toHaveLength(1)
          })
          it.each([0, 10000])('review capped Vengeance shares probability without changing its starting history at %s', (accuracy) => {
            const initial: CombatEncounterState = world(accuracy, 0)
            initial.effectState = { ...normalizeCombatEffectState(undefined), damageHistory: [{ combatantId: 'actor', round: 1, amount: 40 }] }
            const command = action([{ type: 'damage', recipient: 'primary-unit', amount: 0,
              vengeance: { conversionBasisPoints: 5000, maximumDamage: 13 } }])
            const preview = evaluateCombatAction(initial, command, SELECT, CONTENT)
            expect(preview.vengeanceBasis?.[0]?.rawDamage).toBe(13)
            expect(preview.targetHitChances).toEqual([{ targetCombatantId: 'target', hitChanceBasisPoints: accuracy }])
            const result = cast(initial, command)
            expect(unit(result.state).hp).toBe(accuracy ? 87 : 100)
            expect(result.state.effectState?.damageHistory.filter((row) => row.combatantId === 'actor')).toEqual(initial.effectState.damageHistory)
          })
          const badRatings = [undefined, NaN, Infinity, -1, 0.5, 10001].flatMap((value) =>
            (['accuracy', 'evasion'] as const).map((field) => ({ value, field })))
          it.each(badRatings)('review invalid relevant committed rating fails closed %j', ({ value, field }) => {
            const initial: CombatEncounterState = world()
            const profiles = initial.statBridge?.combatants
            if (!profiles) throw new Error('Missing review profiles')
            const id = field === 'accuracy' ? 'actor' : 'target'
            initial.statBridge = { ...initial.statBridge, combatants: profiles.map((row) => row.combatantId === id ? { ...row, [field]: value } : row) }
            const before = JSON.stringify(initial)
            expect(() => cast(initial)).toThrow(/accuracy/i)
            expect(JSON.stringify(initial)).toBe(before)
          })
          it('review duplicate relevant profiles cannot choose a convenient rating', () => {
            const initial: CombatEncounterState = world()
            const profiles = initial.statBridge?.combatants
            if (!profiles?.[0]) throw new Error('Missing review profiles')
            initial.statBridge = { ...initial.statBridge, combatants: [...profiles, { ...profiles[0], accuracy: 10000 }] }
            expect(() => cast(initial)).toThrow(/accuracy/i)
          })
          const ordinaryVectors = [0, 1, 20, 150].flatMap((amount) =>
            (['automatic', undefined] as const).flatMap((accuracyMode) => [false, true].map((withContext) => ({ amount, accuracyMode, withContext }))))
          it.each(ordinaryVectors)('review full historical ordinary transition remains identical %j', ({ amount, accuracyMode, withContext }) => {
            const initial = world()
            const command = { ...action([{ type: 'damage', recipient: 'primary-unit', amount }, { type: 'healing', recipient: 'actor', amount: 5 }]), accuracyMode }
            const ctx = withContext ? context() : undefined
            expect(evaluateCombatAction(initial, command, SELECT, CONTENT)).toEqual(historicalActions.evaluateCombatAction(initial, command, SELECT, CONTENT))
            expect(executeCombatAction(initial, command, SELECT, CONTENT, ctx)).toEqual(historicalActions.executeCombatAction(initial, command, SELECT, CONTENT, ctx))
          })
          const basicVectors = reviewSeeds.flatMap((seed) => [0, 6000, 10000].map((accuracy) => ({ seed, accuracy })))
          it.each(basicVectors)('review historical Basic Attack preview and complete result remain identical %j', ({ seed, accuracy }) => {
            const initial = world(accuracy, 0, seed)
            const command: CombatActionDefinition = { ...action([{ type: 'damage', recipient: 'primary-unit', amount: 20 }]),
              sourceType: 'basic-attack', accuracyMode: undefined, cost: { spendsAction: true, mp: 0 } }
            expect(forecastStatDrivenAttack(initial, command, SELECT, CONTENT)).toEqual(historicalStats.forecastStatDrivenAttack(initial, command, SELECT, CONTENT))
            expect(executeStatDrivenAttack(initial, command, SELECT, CONTENT)).toEqual(historicalStats.executeStatDrivenAttack(initial, command, SELECT, CONTENT))
          })
          '''
          try:
              for path,source_name in [(old_actions,'actions.ts'),(old_stats,'stat-driven-combat.ts')]:
                  path.write_bytes(subprocess.check_output(['git','show',f'aff99544a68173437469573907b0f36e1687e9bf:packages/game-core/src/combat/{source_name}']))
              tests.write_text(original.decode()+additions)
              subprocess.run(['pnpm','--filter','@aurevane/game-core','typecheck'],check=True)
              subprocess.run(['pnpm','--filter','@aurevane/game-core','exec','vitest','run',
                *['src/combat/'+name for name in ['combat-skill-accuracy.test.ts','combat-vengeance.test.ts','combat-reflect.test.ts',
                'combat-absorb-mp.test.ts','combat-absorb-hp.test.ts','combat-absorb-hp-command.test.ts','combat-barrier.test.ts',
                'combat-damage-history-runtime.test.ts','combat-resolution-provenance.test.ts','pv1f-action-economy.test.ts',
                'actions-stat-scaled-damage.test.ts','combat-burn-backlash.test.ts','stat-driven-combat.test.ts','mature-skills.test.ts','combat-authoring-validation.test.ts']]],check=True)
          finally:
              tests.write_bytes(original)
              old_actions.unlink(missing_ok=True)
              old_stats.unlink(missing_ok=True)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Verify original contract, restricted source and unchanged catalogs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check aff99544a68173437469573907b0f36e1687e9bf...HEAD
          git diff --exit-code c091f40c7396ce7972c71ce99800379be6396f43...HEAD -- packages/game-core/src/combat/combat-skill-accuracy.test.ts
          git diff --exit-code aff99544a68173437469573907b0f36e1687e9bf...HEAD -- apps .github packages/game-core/src/combat/pv1f-action-economy.ts packages/game-core/src/combat/combat-damage-history.ts packages/game-core/src/combat/combat-effect-provenance.ts packages/game-core/src/combat/advanced-discipline-content.ts packages/game-core/src/combat/foundation-trio-skills.ts packages/game-core/src/combat/ironfist-skills.ts
          test "$(git diff --name-only aff99544a68173437469573907b0f36e1687e9bf...HEAD | wc -l)" -eq 9
