          p.write_text("import { validateCombatAccuracyDefinition, forecastCombatSkillAccuracy, rollCombatSkillAccuracy, type CombatAccuracyAuthoring, type CombatTargetHitChance } from './combat-skill-accuracy'\n"+p.read_text())
          replace_once(p,"extends Omit<legacy.CombatActionDefinition, 'effects'> {","extends Omit<legacy.CombatActionDefinition, 'effects'>, CombatAccuracyAuthoring {")
          replace_once(p,'      mysticPower?: number\n','      mysticPower?: number\n      accuracy?: number\n      evasion?: number\n')
          replace_once(p,'  vengeanceBasis?: readonly CombatVengeanceBasis[]\n','  vengeanceBasis?: readonly CombatVengeanceBasis[]\n  targetHitChances?: readonly CombatTargetHitChance[]\n  projectionsAssumeHits?: true\n')
          replace_once(p,'  const materialized = materializeVengeanceDamage(state, action)','  validateCombatAccuracyDefinition(action)\n  const materialized = materializeVengeanceDamage(state, action)')
          replace_once(p,"  return evaluation.legal && materialized.basis.length > 0\n    ? { ...evaluation, vengeanceBasis: materialized.basis }\n    : evaluation","  const preview = evaluation.legal && materialized.basis.length > 0\n    ? { ...evaluation, vengeanceBasis: materialized.basis }\n    : evaluation\n  return forecastCombatSkillAccuracy(state, action, preview)")
          replace_once(p,'  const round = state.tactical.battle.round\n  const actorId','  validateCombatAccuracyDefinition(action)\n  const round = state.tactical.battle.round\n  const actorId')
          replace_once(p,'  const evaluation = context\n','  const evaluation = context || action.accuracyMode === \'per-target\'\n')
          replace_once(p,'  let triggerGuard = context?.triggerGuard','  const accuracy = rollCombatSkillAccuracy(state, action, evaluation)\n  let triggerGuard = context?.triggerGuard')
          replace_once(p,'  const transition = legacy.executeCombatAction(\n    state,','  const committedTransition = legacy.executeCombatAction(\n    accuracy.state,')
          replace_once(p,'    },\n  )\n  if (!context || !evaluation) return transition',"    },\n    accuracy.missedCombatantIds,\n  )\n  const transition = accuracy.events.length > 0\n    ? { ...committedTransition, events: [...accuracy.events, ...committedTransition.events] }\n    : committedTransition\n  if (!context || !evaluation) return transition\n  // A miss must not reattribute an existing status or persistent effect.\n  const provenanceEvaluation = accuracy.missedCombatantIds.size === 0 ? evaluation : {\n    ...evaluation,\n    primaryCombatantId: evaluation.primaryCombatantId && accuracy.missedCombatantIds.has(evaluation.primaryCombatantId)\n      ? null : evaluation.primaryCombatantId,\n    affectedCombatantIds: evaluation.affectedCombatantIds.filter((id) => !accuracy.missedCombatantIds.has(id)),\n  }")
          replace_once(p,'attachCombatEffectProvenance(state, transition.state, action, evaluation, context)','attachCombatEffectProvenance(state, transition.state, action, provenanceEvaluation, context)')
          p=root/'actions-legacy.ts'
          p.write_text("import type { CombatSkillAccuracyResolvedEvent } from './combat-skill-accuracy'\n"+p.read_text())
          replace_once(p,'export type CombatResolutionEvent =\n  | TacticalBattleEvent','export type CombatResolutionEvent =\n  | CombatSkillAccuracyResolvedEvent\n  | TacticalBattleEvent')
          replace_once(p,'  ) => CombatResolutionTransition,\n): CombatResolutionTransition {\n  const evaluation = evaluateCombatAction','  ) => CombatResolutionTransition,\n  missedCombatantIds?: ReadonlySet<string>,\n): CombatResolutionTransition {\n  const evaluation = evaluateCombatAction')
          replace_once(p,'    evaluation.affectedTiles,\n    action,\n    content,\n  )','    evaluation.affectedTiles,\n    action,\n    content,\n    missedCombatantIds,\n  )')
          replace_once(p,'  affectedTiles: readonly GridPosition[],\n  action: CombatActionDefinition,\n  content: CombatContentCatalog,\n): CombatResolutionTransition & {','  affectedTiles: readonly GridPosition[],\n  action: CombatActionDefinition,\n  content: CombatContentCatalog,\n  missedCombatantIds?: ReadonlySet<string>,\n): CombatResolutionTransition & {')
          replace_once(p,'    )) {\n      const before = nextState','    )) {\n      // Engine-owned target roll gates every unit effect, not just damage packets.\n      if (missedCombatantIds?.has(recipientId)) continue\n      const before = nextState')
          p=root/'combat-authoring-validation.ts'
          p.write_text("import { validateCombatAccuracyDefinition } from './combat-skill-accuracy'\n"+p.read_text())
          replace_once(p,"declare module './actions' {\n  interface CombatActionDefinition {\n    accuracyMode?: 'automatic' | 'per-target'\n    accuracyModifierBasisPoints?: number\n  }\n}\n\n",'')
          replace_once(p,"  if (action.accuracyMode !== undefined) {\n    knownString(action.accuracyMode, ['automatic', 'per-target'], 'accuracy mode')\n  }\n  if (action.accuracyModifierBasisPoints !== undefined) {\n    signedSafeIntegerWithin(\n      action.accuracyModifierBasisPoints,\n      3_000,\n      'accuracy modifier basis points',\n    )\n  }","  validateCombatAccuracyDefinition(action)")
          replace_once(p,"function signedSafeIntegerWithin(value: unknown, maximumMagnitude: number, field: string): void {\n  if (!Number.isSafeInteger(value) || Math.abs(value as number) > maximumMagnitude) {\n    throw new RangeError(`${field} must be within +/-${maximumMagnitude}.`)\n  }\n}\n\n",'')
          p=root/'mature-skills.ts'
          p.write_text("import { validateCombatAccuracyDefinition, type CombatAccuracyAuthoring } from './combat-skill-accuracy'\n"+p.read_text())
          replace_once(p,'export interface MatureSkillDefinition {','export interface MatureSkillDefinition extends CombatAccuracyAuthoring {')
          replace_once(p,'  try {\n    validateGameplayActionMetadata(definition)','  try {\n    validateCombatAccuracyDefinition(definition)\n    validateGameplayActionMetadata(definition)')
          replace_once(p,'    effects: resolved.effects,\n  }\n}',"    effects: resolved.effects,\n    ...(resolved.accuracyMode !== undefined ? { accuracyMode: resolved.accuracyMode } : {}),\n    ...(resolved.accuracyModifierBasisPoints !== undefined\n      ? { accuracyModifierBasisPoints: resolved.accuracyModifierBasisPoints } : {}),\n  }\n}")
          p=root/'stat-driven-combat.ts'
          p.write_text("import { calculateHitChanceBasisPoints } from './combat-skill-accuracy'\nexport { calculateHitChanceBasisPoints } from './combat-skill-accuracy'\n"+p.read_text())
          replace_once(p,'export function calculateHitChanceBasisPoints(\n  actor: StatDrivenCombatProfileV1,\n  target: StatDrivenCombatProfileV1,\n): number {\n  return Math.max(0, Math.min(COMBAT_BASIS_POINTS, actor.accuracy - target.evasion))\n}\n\n','')
          p=Path('docs/COMBAT.md')
          heading='# AUREVANE Combat Design Bible\n'
          assert p.read_text().startswith(heading)
          boundary='''

          ## P4.K4 Skill accuracy kernel boundary — 2026-09-15

          Skills may explicitly opt into `accuracyMode: per-target`; `automatic` or omitted mode retains historical automatic resolution. The existing signed `accuracyModifierBasisPoints` field is validated at authoring, preview and commit within -3000 to +3000. Mature Skill conversion preserves supplied fields and consecutive-use reduction changes potency, not hit chance or AP/MP costs. The historical Basic Attack adapter keeps its existing single-roll behavior and rejects an explicit Skill accuracy mode to prevent double rolling.

          The current slice calculates `clamp(actor Accuracy - target Evasion + Skill modifier, 0, 10000)` from committed profiles. It requires exactly one valid relevant profile and integer ratings within 0–10000. Only living hostile recipients of actual unit effect blocks are rolled, once each in stable ID order, including 0% and 100% endpoints. Repeated packets share their target's result. Geometry alone, allies, self effects and terrain do not introduce extra unit rolls. Mark/Blind's versioned state and modifiers are the next slice, not inferred from existing names or tags.

          A miss skips every unit effect for that hostile recipient in the existing ordered effect resolver, including damage, status, cleansing, displacement, DoTs, recovery and Barrier. Costs, action-use records, cooldown rules, caster effects, attack reveal and Burn backlash retain their ordinary behavior. Tile operations keep their independent existing sequence; this is not a terrain accuracy system. Misses do not consume defender Barrier, write damage history, trigger Absorb/Reflect or reattribute an existing persistent effect. Successful effects retain existing damage math, reaction ordering and K3 provenance.

          Legal opted-in kernel previews expose `targetHitChances` and `projectionsAssumeHits: true`; their ordinary projections are conditional on successful hits, not guaranteed or probability-weighted outcomes. Preview never advances RNG or reveals future rolls. Commit recomputes chances from its snapshot and emits versioned `combat_accuracy_resolved` receipts before ordinary command events. Missed target IDs are an engine-owned transient argument, never an authored or persisted hit override.

          No published Skill catalog opts into rolled accuracy in this ticket. Mark/Blind, full reactive/conditional player forecasts, AI expected-value scoring, presentation tags and controlled content migration remain publication gates. This is not a player-interface release or a completed accuracy/Mark/Blind group. No schema, dependency or deployment change is included.
          '''.replace('\n          ','\n')
          p.write_text(heading+boundary+p.read_text()[len(heading):])
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-skill-accuracy.ts packages/game-core/src/combat/actions.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/mature-skills.ts packages/game-core/src/combat/stat-driven-combat.ts docs/COMBAT.md docs/superpowers/plans/2026-09-15-skill-accuracy-kernel.md
