name: Skill accuracy workbench
on:
  push:
    branches: [review/skill-accuracy-workbench-20260915]
permissions:
  contents: write
jobs:
  accuracy-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aff99544a68173437469573907b0f36e1687e9bf
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Correct test fixture then classify behavioral RED
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 8c1f618c8220b53f4943d0fab4956b4d32d48043
          python3 - <<'PY'
          import re,subprocess,textwrap
          source=subprocess.check_output(['git','show','8c1f618c8220b53f4943d0fab4956b4d32d48043:.github/workflows/skill-accuracy-workbench.yml'],text=True)
          parts=re.split(r'(?m)^      - name: ',source)[1:]
          scripts={part.split('\n',1)[0]:textwrap.dedent(part.split('        run: |\n',1)[1]) for part in parts if '        run: |\n' in part}
          name='Write public-entry-point accuracy contract'
          old="    expect(toCombatActionDefinition({ ...mature(), accuracyModifierBasisPoints: 1_500 }, 'pve'))"
          new="    const skill: AccuracySkill = { ...mature(), accuracyModifierBasisPoints: 1_500 }\n    expect(toCombatActionDefinition(skill, 'pve'))"
          assert scripts[name].count(old)==1
          scripts[name]=scripts[name].replace(old,new)
          for stage in [name,'Prove and retain behavioral RED only']:
              print('EXECUTING_STAGE',stage,flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',scripts[stage]],check=True)
          PY
