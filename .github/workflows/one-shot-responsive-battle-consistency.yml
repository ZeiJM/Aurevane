name: One-shot responsive battle consistency

on:
  push:
    branches:
      - agent/final-facing-hotkey-reliability-v2
    paths:
      - .github/workflows/one-shot-responsive-battle-consistency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-facing-hotkey-reliability-v2
          fetch-depth: 0

      - name: Apply responsive keyboard and inspect fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          touched = set()

          def read(path):
              return (root / path).read_text()

          def write(path, text):
              (root / path).write_text(text)
              touched.add(path)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              write(path, text.replace(old, new, 1))

          # One authoritative keyboard owner at every viewport size.
          path = 'apps/web/src/components/battle/battle-self-action-quick-commit-assist.tsx'
          text = read(path)
          text = text.replace(
              "const VISIBLE_COMMAND_SLOTS: readonly SlotBinding[] = [\n",
              "const TRANSIENT_SECOND_PRESS_MS = 800\n\nconst VISIBLE_COMMAND_SLOTS: readonly SlotBinding[] = [\n",
              1,
          )
          text = text.replace(
              "  const commitSequence = useRef(0)\n",
              "  const commitSequence = useRef(0)\n  const armedCategoryRef = useRef<{ slot: CommandSlot; armedAt: number } | null>(null)\n",
              1,
          )
          text = text.replace(
              "    const cancelPendingCommit = () => {\n      commitSequence.current += 1\n    }\n",
              "    const cancelPendingCommit = () => {\n      commitSequence.current += 1\n      armedCategoryRef.current = null\n    }\n",
              1,
          )
          text = text.replace(
              "        const activeSlot = activeCommandSlot()\n        if (activeSlot && activeSlot !== slot) return\n\n        const confirm = confirmButton()\n",
              "        const activeSlot = activeCommandSlot()\n        if (activeSlot && activeSlot !== slot) {\n          // A just-closed Inspect popup or a very fast second keypress can leave the previous\n          // command marked active for a frame. Give React a short transition window instead of\n          // treating that stale DOM marker as a reason to discard the deliberate second press.\n          if (performance.now() - startedAt < 300) window.requestAnimationFrame(tryCommit)\n          return\n        }\n\n        const confirm = confirmButton()\n",
              1,
          )
          text = text.replace(
              "        event.metaKey ||\n        !event.code ||\n        !window.matchMedia('(min-width: 821px)').matches\n",
              "        event.metaKey ||\n        !event.code\n",
              1,
          )
          text = text.replace(
              "      const button = commandButton(slot)\n      if (!button) return\n\n      if ((action === 'guard' || action === 'recover') && commandIsActive(slot)) {\n        event.preventDefault()\n        event.stopImmediatePropagation()\n        commitWhenPreviewReady(slot)\n        return\n      }\n",
              "      const button = commandButton(slot)\n      if (!button || button.disabled) return\n\n      const now = performance.now()\n      const armed = armedCategoryRef.current\n      const deliberateSecondPress =\n        armed?.slot === slot && now - armed.armedAt <= TRANSIENT_SECOND_PRESS_MS\n\n      if (\n        (action === 'guard' || action === 'recover') &&\n        (commandIsActive(slot) || deliberateSecondPress)\n      ) {\n        event.preventDefault()\n        event.stopImmediatePropagation()\n        armedCategoryRef.current = null\n        commitWhenPreviewReady(slot)\n        return\n      }\n",
              1,
          )
          text = text.replace(
              "      commitSequence.current += 1\n      button.click()\n",
              "      commitSequence.current += 1\n      armedCategoryRef.current = { slot, armedAt: now }\n      button.click()\n",
              1,
          )
          write(path, text)

          path = 'apps/web/src/components/battle/battle-finish-turn-keyboard-assist.tsx'
          text = read(path)
          if "const DESKTOP_QUERY = '(min-width: 821px)'\n" not in text:
              raise SystemExit(f'{path}: desktop query constant not found')
          text = text.replace("const DESKTOP_QUERY = '(min-width: 821px)'\n", '', 1)
          text = text.replace(
              "        event.ctrlKey ||\n        event.metaKey ||\n        !window.matchMedia(DESKTOP_QUERY).matches\n",
              "        event.ctrlKey ||\n        event.metaKey\n",
              1,
          )
          write(path, text)

          for path in [
              'apps/web/src/components/battle/battle-keyboard-assist.tsx',
              'apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx',
          ]:
              text = read(path)
              old = """        // Desktop category actions and Finish Turn belong to persistent shared owners.\n        // Mobile keeps this existing handler because those owners are desktop-only.\n        if (\n          (isSharedCategoryAction(action) || action === 'endTurn') &&\n          window.matchMedia('(min-width: 821px)').matches\n        )\n          return\n"""
              new = """        // Shared category actions and Finish Turn have one persistent keyboard owner.\n        // Viewport size changes presentation only; they must never swap keyboard implementations.\n        if (isSharedCategoryAction(action) || action === 'endTurn') return\n"""
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: legacy ownership block mismatch')
              write(path, text.replace(old, new, 1))

          # Pointer capability decides whether the newer desktop presentation is used when a desktop
          # browser is restored/narrow. Width alone must not resurrect the older mobile presentation.
          css_root = root / 'apps/web/src/components/battle'
          css_replacements = {
              '@media (min-width: 821px) {': '@media (min-width: 821px), (any-hover: hover) and (any-pointer: fine) {',
              '@media (max-width: 820px) {': '@media (max-width: 820px) and (any-hover: none) and (any-pointer: coarse) {',
              '@media (min-width: 881px) {': '@media (min-width: 881px), (any-hover: hover) and (any-pointer: fine) {',
              '@media (max-width: 880px) {': '@media (max-width: 880px) and (any-hover: none) and (any-pointer: coarse) {',
          }
          css_counts = {key: 0 for key in css_replacements}
          for css_path in css_root.rglob('*.css'):
              text = css_path.read_text()
              original = text
              for old, new in css_replacements.items():
                  count = text.count(old)
                  css_counts[old] += count
                  if count:
                      text = text.replace(old, new)
              if text != original:
                  css_path.write_text(text)
                  touched.add(str(css_path))
          if css_counts['@media (min-width: 821px) {'] == 0 or css_counts['@media (max-width: 820px) {'] == 0:
              raise SystemExit(f'Expected battle desktop/mobile CSS breakpoints, found {css_counts}')
          print('CSS breakpoint replacements:', css_counts)

          lifecycle_path = 'apps/web/src/components/battle/battle-inspect-lifecycle.ts'
          lifecycle = """export const BATTLE_INSPECT_CLOSED_EVENT = 'aurevane:battle-inspect-closed'\n\nexport type BattleInspectClosedDetail = {\n  battleSessionId: string\n}\n\nexport function dispatchBattleInspectClosed(battleSessionId: string) {\n  window.dispatchEvent(\n    new CustomEvent<BattleInspectClosedDetail>(BATTLE_INSPECT_CLOSED_EVENT, {\n      detail: { battleSessionId },\n    }),\n  )\n}\n"""
          (root / lifecycle_path).write_text(lifecycle)
          touched.add(lifecycle_path)

          # Inspect popup routing is based on pointer capability, never on viewport width. Closing any
          # inspect popup announces lifecycle completion so BattleExperience can leave Inspect mode.
          path = 'apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx'
          text = read(path)
          text = text.replace("import { useEffect, useState } from 'react'", "import { useCallback, useEffect, useRef, useState } from 'react'", 1)
          text = text.replace(
              "import styles from './desktop-battle-combatant-inspect.module.css'\n",
              "import styles from './desktop-battle-combatant-inspect.module.css'\nimport { dispatchBattleInspectClosed } from './battle-inspect-lifecycle'\n",
              1,
          )
          text = text.replace("const DESKTOP_QUERY = '(min-width: 881px)'", "const DESKTOP_POINTER_QUERY = '(any-hover: hover) and (any-pointer: fine)'", 1)
          text = text.replace(
              "  const [selected, setSelected] = useState<SelectedCombatant | null>(null)\n\n  useEffect(() => {",
              "  const [selected, setSelected] = useState<SelectedCombatant | null>(null)\n  const openRef = useRef(false)\n\n  const closeInspect = useCallback(() => {\n    if (!openRef.current) return\n    openRef.current = false\n    setOpen(false)\n    dispatchBattleInspectClosed(battleSessionId)\n  }, [battleSessionId])\n\n  useEffect(() => {",
              1,
          )
          text = text.replace("      setOpen(true)\n", "      openRef.current = true\n      setOpen(true)\n", 1)
          text = text.replace("      if (!window.matchMedia(DESKTOP_QUERY).matches || !inspectModeActive()) return", "      if (!window.matchMedia(DESKTOP_POINTER_QUERY).matches || !inspectModeActive()) return", 1)
          text = text.replace("      if (event.key === 'Escape') setOpen(false)", "      if (event.key === 'Escape') closeInspect()", 1)
          text = text.replace(
              "    battleSessionId,\n    battleView,",
              "    battleSessionId,\n    battleView,\n    closeInspect,",
              1,
          )
          text = text.replace("      onPointerDown={() => setOpen(false)}", "      onPointerDown={closeInspect}", 1)
          text = text.replace("              onClick={() => setOpen(false)}", "              onClick={closeInspect}", 1)
          write(path, text)

          path = 'apps/web/src/components/battle/mobile-battle-combatant-popup.tsx'
          text = read(path)
          text = text.replace("import { useEffect, useMemo, useState } from 'react'", "import { useCallback, useEffect, useMemo, useRef, useState } from 'react'", 1)
          text = text.replace(
              "import styles from './mobile-battle-combatant-popup.module.css'\n",
              "import { dispatchBattleInspectClosed } from './battle-inspect-lifecycle'\nimport styles from './mobile-battle-combatant-popup.module.css'\n",
              1,
          )
          text = text.replace("const MOBILE_QUERY = '(max-width: 880px)'", "const DESKTOP_POINTER_QUERY = '(any-hover: hover) and (any-pointer: fine)'", 1)
          text = text.replace(
              "  const [selected, setSelected] = useState<SelectedCombatant | null>(null)\n\n  useEffect(() => {",
              "  const [selected, setSelected] = useState<SelectedCombatant | null>(null)\n  const openRef = useRef(false)\n\n  const closeInspect = useCallback(() => {\n    if (!openRef.current) return\n    openRef.current = false\n    setOpen(false)\n    dispatchBattleInspectClosed(battleSessionId)\n  }, [battleSessionId])\n\n  useEffect(() => {",
              1,
          )
          text = text.replace("      setOpen(true)\n", "      openRef.current = true\n      setOpen(true)\n", 1)
          text = text.replace("      if (!window.matchMedia(MOBILE_QUERY).matches || !inspectModeActive()) return", "      if (window.matchMedia(DESKTOP_POINTER_QUERY).matches || !inspectModeActive()) return", 1)
          text = text.replace("      if (event.key === 'Escape') setOpen(false)", "      if (event.key === 'Escape') closeInspect()", 1)
          text = text.replace("  }, [battleSessionId, playerName])", "  }, [battleSessionId, closeInspect, playerName])", 1)
          text = text.replace("onPointerDown={() => setOpen(false)} data-mobile-battle-popup", "onPointerDown={closeInspect} data-mobile-battle-popup", 1)
          write(path, text)

          path = 'apps/web/src/components/battle/pvp-battle-inspect-popup.tsx'
          text = read(path)
          text = text.replace("import { useEffect, useMemo, useState } from 'react'", "import { useCallback, useEffect, useMemo, useRef, useState } from 'react'", 1)
          text = text.replace(
              "import styles from './mobile-battle-combatant-popup.module.css'\n",
              "import { dispatchBattleInspectClosed } from './battle-inspect-lifecycle'\nimport styles from './mobile-battle-combatant-popup.module.css'\n",
              1,
          )
          text = text.replace(
              "const ACTION_ECONOMY_KEY = 'pv1f.action-economy'\n",
              "const ACTION_ECONOMY_KEY = 'pv1f.action-economy'\nconst DESKTOP_POINTER_QUERY = '(any-hover: hover) and (any-pointer: fine)'\n",
              1,
          )
          text = text.replace(
              "  const [selected, setSelected] = useState<SelectedCombatant | null>(null)\n\n  useEffect(() => {",
              "  const [selected, setSelected] = useState<SelectedCombatant | null>(null)\n  const openRef = useRef(false)\n\n  const closeInspect = useCallback(() => {\n    if (!openRef.current) return\n    openRef.current = false\n    setOpen(false)\n    dispatchBattleInspectClosed(battleSessionId)\n  }, [battleSessionId])\n\n  useEffect(() => {",
              1,
          )
          text = text.replace("      setOpen(true)\n", "      openRef.current = true\n      setOpen(true)\n", 1)
          text = text.replace(
              "    function handleBattlefieldClick(event: MouseEvent) {\n      if (!inspectModeActive()) return\n",
              "    function handleBattlefieldClick(event: MouseEvent) {\n      if (window.matchMedia(DESKTOP_POINTER_QUERY).matches || !inspectModeActive()) return\n",
              1,
          )
          text = text.replace("      if (event.key === 'Escape') setOpen(false)", "      if (event.key === 'Escape') closeInspect()", 1)
          text = text.replace("  }, [battleSessionId, battleView, metadata])", "  }, [battleSessionId, battleView, closeInspect, metadata])", 1)
          text = text.replace("      onPointerDown={() => setOpen(false)}", "      onPointerDown={closeInspect}", 1)
          write(path, text)

          # BattleExperience consumes the popup-close event, clears stale Inspect mode, and restores
          # focus to a neutral non-activating battle root.
          path = 'apps/web/src/components/battle/battle-experience.tsx'
          text = read(path)
          text = text.replace(
              "import { BattleFacingIndicator } from './battle-facing-indicator'\n",
              "import { BattleFacingIndicator } from './battle-facing-indicator'\nimport {\n  BATTLE_INSPECT_CLOSED_EVENT,\n  type BattleInspectClosedDetail,\n} from './battle-inspect-lifecycle'\n",
              1,
          )
          text = text.replace(
              "  const recruitLock = useRef(false)\n",
              "  const recruitLock = useRef(false)\n  const modeRef = useRef<Mode>('none')\n  modeRef.current = mode\n",
              1,
          )
          marker = """  const clearPlanning = useCallback((nextMode: Mode = 'none') => {\n    previewSequence.current += 1\n    setMode(nextMode)\n    setPath([])\n    setPendingIntent(null)\n    setPreview(null)\n    setSelectedUnitId(null)\n    setPreviewPending(false)\n  }, [])\n\n"""
          addition = marker + """  useEffect(() => {\n    function handleInspectClosed(event: Event) {\n      const detail = (event as CustomEvent<BattleInspectClosedDetail>).detail\n      if (detail?.battleSessionId !== initialBattle.battleSessionId || modeRef.current !== 'inspect') {\n        return\n      }\n\n      clearPlanning()\n      setNotice('Inspection closed. Choose your action.')\n      window.requestAnimationFrame(() => {\n        document\n          .querySelector<HTMLElement>('main[data-unified-battle=\"true\"]')\n          ?.focus({ preventScroll: true })\n      })\n    }\n\n    window.addEventListener(BATTLE_INSPECT_CLOSED_EVENT, handleInspectClosed)\n    return () => window.removeEventListener(BATTLE_INSPECT_CLOSED_EVENT, handleInspectClosed)\n  }, [clearPlanning, initialBattle.battleSessionId])\n\n"""
          if text.count(marker) != 1:
              raise SystemExit(f'{path}: clearPlanning marker mismatch')
          text = text.replace(marker, addition, 1)
          text = text.replace(
              "      data-local-turn={localTurn || undefined}\n      aria-busy={recruitPending || undefined}\n",
              "      data-local-turn={localTurn || undefined}\n      data-battle-keyboard-focus-root=\"true\"\n      tabIndex={-1}\n      aria-busy={recruitPending || undefined}\n",
              1,
          )
          write(path, text)

          # Source-level ownership contract.
          path = 'apps/web/src/components/battle/battle-self-action-quick-commit-assist.test.ts'
          text = read(path)
          text = text.replace("it('owns desktop category hotkeys without re-registering when account bindings refresh'", "it('owns category hotkeys at every viewport without re-registering when account bindings refresh'", 1)
          text = text.replace(
              "    expect(content).toContain('event.repeat')\n",
              "    expect(content).toContain('event.repeat')\n    expect(content).not.toContain(\"matchMedia('(min-width: 821px)')\")\n",
              1,
          )
          text = text.replace(
              "    expect(content).toContain('if (activeSlot && activeSlot !== slot) return')\n",
              "    expect(content).toContain('if (activeSlot && activeSlot !== slot) {')\n    expect(content).toContain('TRANSIENT_SECOND_PRESS_MS')\n",
              1,
          )
          text = text.replace(
              "      expect(content).toContain('if (isSharedCategoryAction(action)) return')\n",
              "      expect(content).toContain(\"if (isSharedCategoryAction(action) || action === 'endTurn') return\")\n      expect(content).not.toContain(\"window.matchMedia('(min-width: 821px)').matches\")\n",
              1,
          )
          write(path, text)

          # Rendered regression: Inspect dismissal + narrow restored desktop + repeated Space handoffs.
          path = 'apps/web/e2e/battle-self-action-quick-commit.pw.ts'
          text = read(path)
          helper_marker = """async function finishTurnKeepingFacing(page: Page, root: Locator, testRepeat = false) {\n"""
          helper = """async function openInspectAndDismiss(page: Page, root: Locator, targetName: string) {\n  const inspect = root.locator(\n    'section[aria-label=\"Command Deck\"] button[data-battle-command=\"inspect\"]',\n  )\n  await inspect.click()\n  const target = root.locator(\n    `#battlefield button[aria-label*=\"occupied by ${targetName}\"]`,\n  )\n  await target.click()\n\n  const dialog = page.getByRole('dialog', { name: `${targetName} battle details` })\n  await expect(dialog).toBeVisible({ timeout: 5_000 })\n  const backdrop = page.locator('[data-desktop-battle-inspect=\"true\"]')\n  await expect(backdrop).toBeVisible()\n  await backdrop.click({ position: { x: 5, y: 5 } })\n  await expect(dialog).toBeHidden()\n  await expect(inspect).not.toHaveAttribute('data-active', 'true')\n  await expect(root).toBeFocused()\n}\n\n"""
          if text.count(helper_marker) != 1:
              raise SystemExit(f'{path}: finish helper marker mismatch')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          guard_test_end = """  await expect(economy).toHaveAttribute('aria-valuenow', '70')\n})\n\n"""
          new_guard_test = guard_test_end + """test('keeps Guard double-press reliable after Inspect closes in a narrow desktop window', async ({\n  page,\n}, testInfo) => {\n  test.skip(testInfo.project.name === 'mobile-chromium', 'Physical keyboard regression')\n  test.slow()\n\n  await page.setViewportSize({ width: 750, height: 900 })\n  const root = await enterGuidedBattle(page)\n  const playerTile = root.locator('#battlefield button[aria-label*=\"occupied by\"]').first()\n  const targetName = ((await playerTile.getAttribute('aria-label')) ?? '').includes('Recruit')\n    ? 'QuickGuard'\n    : 'Recruit'\n\n  const inspect = root.locator(\n    'section[aria-label=\"Command Deck\"] button[data-battle-command=\"inspect\"]',\n  )\n  await inspect.click()\n  const target = root.locator('#battlefield button[aria-label*=\"occupied by Recruit\"]')\n  await target.click()\n  const dialog = page.getByRole('dialog', { name: /Recruit battle details/ })\n  await expect(dialog).toBeVisible({ timeout: 5_000 })\n  const backdrop = page.locator('[data-desktop-battle-inspect=\"true\"]')\n  await backdrop.click({ position: { x: 5, y: 5 } })\n  await expect(dialog).toBeHidden()\n  await expect(inspect).not.toHaveAttribute('data-active', 'true')\n  await expect(root).toBeFocused()\n\n  const confirm = root.getByRole('button', { name: 'Confirm Action' })\n  const economy = root.getByRole('progressbar', { name: 'Action Economy remaining' })\n  await page.keyboard.press('Digit4')\n  await expect(confirm).toBeEnabled()\n\n  const commitResponse = page.waitForResponse((response) => {\n    const request = response.request()\n    return request.method() === 'POST' && new URL(response.url()).pathname.endsWith('/intents')\n  })\n  await page.keyboard.press('Digit4')\n  expect((await commitResponse).status()).toBe(200)\n  await expect(economy).toHaveAttribute('aria-valuenow', '70')\n})\n\n"""
          if text.count(guard_test_end) != 1:
              raise SystemExit(f'{path}: guard test end marker mismatch ({text.count(guard_test_end)})')
          text = text.replace(guard_test_end, new_guard_test, 1)

          loop_old = """    for (let cycle = 0; cycle < 3; cycle += 1) {\n      await finishTurnKeepingFacing(first.page, first.root, cycle === 0)\n"""
          loop_new = """    for (let cycle = 0; cycle < 3; cycle += 1) {\n      if (cycle === 1) {\n        await Promise.all([\n          first.page.setViewportSize({ width: 750, height: 900 }),\n          second.page.setViewportSize({ width: 750, height: 900 }),\n        ])\n        await expect(first.root).toBeVisible()\n        await expect(second.root).toBeVisible()\n        await openInspectAndDismiss(first.page, first.root, second.name)\n      }\n\n      await finishTurnKeepingFacing(first.page, first.root, cycle === 0)\n"""
          if text.count(loop_old) != 1:
              raise SystemExit(f'{path}: PvP loop marker mismatch')
          text = text.replace(loop_old, loop_new, 1)
          write(path, text)

          print('Touched files:')
          for path in sorted(touched):
              print(' -', path)
          PY

      - name: Show remaining battle width gates
        shell: bash
        run: |
          echo 'Remaining JS/TS width-gated battle input paths:'
          grep -RIn "matchMedia.*min-width\|matchMedia.*max-width" apps/web/src/components/battle --include='*.ts' --include='*.tsx' || true
          echo 'Remaining exact 820/821 CSS breakpoints:'
          grep -RIn "@media (min-width: 821px) {|@media (max-width: 820px) {" apps/web/src/components/battle --include='*.css' || true

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-responsive-battle-consistency.yml
          git config user.name "aurevane-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/battle apps/web/e2e/battle-self-action-quick-commit.pw.ts .github/workflows/one-shot-responsive-battle-consistency.yml
          git commit -m "fix: keep battle controls consistent across resize and inspect"
          git push origin HEAD:agent/final-facing-hotkey-reliability-v2
