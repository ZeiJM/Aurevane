name: Bootstrap authoritative master plan

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/GAME_MASTER_PLAN.md.gz.b64.part*'
      - '.github/workflows/bootstrap-master-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct master plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat .bootstrap/GAME_MASTER_PLAN.md.gz.b64.part* | base64 --decode | gzip --decompress > docs/GAME_MASTER_PLAN.md
          test -s docs/GAME_MASTER_PLAN.md
          grep -q "AUREVANE" docs/GAME_MASTER_PLAN.md
          grep -q "THE SINGLE MOST IMPORTANT RULE" docs/GAME_MASTER_PLAN.md

      - name: Commit reconstructed document
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GAME_MASTER_PLAN.md
          if git diff --cached --quiet; then
            echo "Master plan already reconstructed."
            exit 0
          fi
          git commit -m "Restore authoritative AUREVANE master plan"
          git push
