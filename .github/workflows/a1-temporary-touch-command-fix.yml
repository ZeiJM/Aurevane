name: A1 temporary touch command fix

on:
  push:
    branches:
      - agent/a1-feedback-holistic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/a1-feedback-holistic

      - name: Preserve self-action proposal on second tap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()
          old = """  const chooseMode = useCallback(\n    (nextMode: PlanningMode) => {\n      if (planningDisabled && nextMode !== 'inspect') return\n      clearPlanning(nextMode)\n      setOverlay(null)\n"""
          new = """  const chooseMode = useCallback(\n    (nextMode: PlanningMode) => {\n      if (planningDisabled && nextMode !== 'inspect') return\n      if (\n        (nextMode === 'guard' || nextMode === 'recover') &&\n        mode === nextMode &&\n        pendingIntent\n      ) {\n        return\n      }\n      clearPlanning(nextMode)\n      setOverlay(null)\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected one chooseMode opening')
          text = text.replace(old, new)
          old_deps = """    [clearPlanning, planningDisabled, requestPreview],\n  )\n"""
          new_deps = """    [clearPlanning, mode, pendingIntent, planningDisabled, requestPreview],\n  )\n"""
          if text.count(old_deps) != 1:
              raise SystemExit('Expected one chooseMode dependency list')
          path.write_text(text.replace(old_deps, new_deps))
          PY
          pnpm --version >/dev/null 2>&1 || true
          git rm .github/workflows/a1-temporary-touch-command-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve self-action proposal for double tap"
          git push origin HEAD:agent/a1-feedback-holistic
