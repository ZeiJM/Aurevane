name: PV-1D launch cursor repair

on:
  push:
    branches:
      - agent/pv-1d-combat-readability-correction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1d-combat-readability-correction
      - name: Remove misleading wait cursor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/battle-launch.module.css')
          text = path.read_text()
          old = ".primary:disabled,\n.secondary:disabled {\n  cursor: wait;\n  opacity: 0.58;\n}"
          new = ".primary:disabled,\n.secondary:disabled {\n  cursor: default;\n  opacity: 0.58;\n}"
          if old not in text:
              raise SystemExit('Launch cursor block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-launch.module.css
          git commit -m 'fix: remove misleading practice launch wait cursor'
          git push origin HEAD:agent/pv-1d-combat-readability-correction
