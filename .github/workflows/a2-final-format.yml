name: A2 Final Formatter

on:
  push:
    branches:
      - "agent/a2-feedback-holistic"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a2-feedback-holistic
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format touched final files
        run: |
          pnpm exec prettier --write \
            apps/web/src/content/current-manual.ts \
            apps/web/src/components/battle/battle-feedback-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/character/character-profile-shell.module.css \
            apps/web/e2e/a1-layout-fit.pw.ts \
            apps/web/e2e/public-information.pw.ts \
            apps/web/e2e/wayfarers-practice.pw.ts \
            apps/web/e2e/character-creation.pw.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/content/current-manual.ts \
            apps/web/src/components/battle/battle-feedback-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/character/character-profile-shell.module.css \
            apps/web/e2e/a1-layout-fit.pw.ts \
            apps/web/e2e/public-information.pw.ts \
            apps/web/e2e/wayfarers-practice.pw.ts \
            apps/web/e2e/character-creation.pw.ts
          git commit -m "chore: format final A2 files"
          git push origin HEAD:agent/a2-feedback-holistic
