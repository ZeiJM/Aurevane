name: Agent lint repair

on:
  push:
    branches:
      - agent/a3-ui-polish-followup

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[agent-lint]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a3-ui-polish-followup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Repair PvP lint findings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          battle = Path('apps/web/src/components/battle/pvp-battle-experience.tsx')
          text = battle.read_text()
          text, count = re.subn(
              r"\n  const tileByKey = useMemo\(\n    \(\) => new Map\(tactical\.tiles\.map\(\(tile\) => \[positionKey\(tile\.position\), tile\] as const\)\),\n    \[tactical\.tiles\],\n  \)\n",
              '\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not remove unused tileByKey block')
          battle.write_text(text)

          modal = Path('apps/web/src/components/battle/pvp-lobby-modal.tsx')
          text = modal.read_text()
          text = text.replace(
              "  const startBattle = useCallback(async () => {\n    if (startLock.current || lobby.status !== 'waiting' || !lobby.readyToStart) return",
              "  const startBattle = useCallback(async (lobbyId: string) => {\n    if (startLock.current) return",
          )
          text = text.replace(
              "const response = await fetch(`/api/pvp/lobbies/${lobby.lobbyId}/start`, { method: 'POST' })",
              "const response = await fetch(`/api/pvp/lobbies/${lobbyId}/start`, { method: 'POST' })",
          )
          text = text.replace(
              "  }, [lobby.lobbyId, lobby.readyToStart, lobby.status, router])",
              "  }, [router])",
          )
          text = text.replace(
              "    if (lobby.readyToStart) void startBattle()\n",
              "",
          )
          text = text.replace(
              "  }, [lobby.battleSessionId, lobby.readyToStart, lobby.status, router, startBattle])",
              "  }, [lobby.battleSessionId, lobby.status, router])",
          )
          needle = """        if (body.lobby.status === 'cancelled') {
          setError('The lobby host closed this lobby.')
          window.clearInterval(timer)
          return
        }
        setLobby(body.lobby)
"""
          replacement = """        if (body.lobby.status === 'cancelled') {
          setError('The lobby host closed this lobby.')
          window.clearInterval(timer)
          return
        }
        if (body.lobby.status === 'active' && body.lobby.battleSessionId) {
          router.push(`/game/battle/${body.lobby.battleSessionId}`)
          window.clearInterval(timer)
          return
        }
        setLobby(body.lobby)
        if (body.lobby.readyToStart) void startBattle(body.lobby.lobbyId)
"""
          if needle not in text:
              raise SystemExit('Could not patch authoritative lobby polling block')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              "  }, [lobby.lobbyId])",
              "  }, [lobby.lobbyId, router, startBattle])",
              1,
          )
          modal.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.tsx
          pnpm --filter @aurevane/web lint
          git diff --check
      - name: Commit lint repair
        run: |
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -- \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.tsx
          git commit -m 'fix: tighten PvP lobby polling and lint [agent-lint]'
          git push origin HEAD:agent/a3-ui-polish-followup
