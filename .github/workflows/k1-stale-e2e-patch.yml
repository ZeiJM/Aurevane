name: K1 Stale E2E Patch

on:
  push:
    branches:
      - agent/combat-kernel-v2-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-kernel-v2-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconcile approved taxonomy assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          buildcraft = Path('apps/web/e2e/p3-8-representative-buildcraft.pw.ts')
          text = buildcraft.read_text()
          replacements = [
              ("await expect(forecast).toContainText('Guarded')", "await expect(forecast).toContainText('Guard')"),
              ("await expect(skillDetails).toContainText('Guarded')", "await expect(skillDetails).toContainText('Guard')"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing buildcraft assertion: {old}')
              text = text.replace(old, new, 1)
          buildcraft.write_text(text)

          roster = Path('apps/web/e2e/phase4-roster.pw.ts')
          text = roster.read_text()
          old = "await expect(sweep).toContainText('Area · radius 1')"
          new = "await expect(sweep).toContainText('Circle 1')"
          if old not in text:
              raise SystemExit('Missing Sweep area assertion')
          roster.write_text(text.replace(old, new, 1))
          PY

          pnpm exec prettier --write \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts \
            apps/web/e2e/phase4-roster.pw.ts

          git rm .github/workflows/k1-stale-e2e-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/p3-8-representative-buildcraft.pw.ts apps/web/e2e/phase4-roster.pw.ts
          git commit -m 'test: align browser assertions with combat taxonomy'
          git push origin HEAD:agent/combat-kernel-v2-hardening
