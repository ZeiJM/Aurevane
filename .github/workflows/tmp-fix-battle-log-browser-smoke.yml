name: Temporary Battle Log browser smoke alignment

on:
  push:
    branches:
      - feat/battle-log-clarity-narration-20260824

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/battle-log-clarity-narration-20260824
          fetch-depth: 0
      - name: Align battle-log smoke with toggle-driven UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/battle-experience.pw.ts')
          text = path.read_text()
          old = """  if (testInfo.project.name === 'mobile-chromium') {
    await roundButton.click()
  }
  await expect(battleLog).toBeVisible()
"""
          new = """  await roundButton.click()
  await expect(battleLog).toBeVisible()
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale viewport-specific log-open block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format test
        run: npx --yes prettier@3.9.6 --write apps/web/e2e/battle-experience.pw.ts
      - name: Remove workflow and commit patch
        run: |
          rm .github/workflows/tmp-fix-battle-log-browser-smoke.yml
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align battle log browser smoke with toggle behavior"
          git push origin HEAD:feat/battle-log-clarity-narration-20260824