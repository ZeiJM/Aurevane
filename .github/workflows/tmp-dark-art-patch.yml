name: Apply Dark Fantasy Artwork Wiring

on:
  push:
    branches:
      - art/dark-fantasy-technique-art-20260907
    paths:
      - '.github/workflows/tmp-dark-art-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/dark-fantasy-technique-art-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wire curated artwork into presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/battle-skill-presentation.ts')
          text = path.read_text()
          anchor = "} from '@aurevane/game-core/combat/pv1f-skills'\n\n"
          import_line = "import { darkFantasyCombatArtwork } from './dark-fantasy-art'\n\n"
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line, 1)
          old_skill = """export function battleSkillArtwork(actionId: string): string {\n  if (GENERATED_COMBAT_ARTWORK_IDS.has(actionId)) return generatedSkillArtwork(actionId)\n  return ACTION_ARTWORK.get(actionId) ?? BATTLE_MISSING_ARTWORK\n}\n"""
          new_skill = """export function battleSkillArtwork(actionId: string): string {\n  const curatedArtwork = darkFantasyCombatArtwork(actionId)\n  if (curatedArtwork) return curatedArtwork\n  if (GENERATED_COMBAT_ARTWORK_IDS.has(actionId)) return generatedSkillArtwork(actionId)\n  return ACTION_ARTWORK.get(actionId) ?? BATTLE_MISSING_ARTWORK\n}\n"""
          if old_skill not in text:
              raise SystemExit('battleSkillArtwork anchor not found')
          text = text.replace(old_skill, new_skill, 1)
          old_res = """export function battleResonanceArtwork(resonanceId: string): string {\n  if (GENERATED_RESONANCE_ARTWORK_IDS.has(resonanceId)) {\n    return generatedResonanceArtwork(resonanceId)\n  }\n  return RESONANCE_ARTWORK.get(resonanceId) ?? BATTLE_MISSING_ARTWORK\n}\n"""
          new_res = """export function battleResonanceArtwork(resonanceId: string): string {\n  const curatedArtwork = darkFantasyCombatArtwork(resonanceId)\n  if (curatedArtwork) return curatedArtwork\n  if (GENERATED_RESONANCE_ARTWORK_IDS.has(resonanceId)) {\n    return generatedResonanceArtwork(resonanceId)\n  }\n  return RESONANCE_ARTWORK.get(resonanceId) ?? BATTLE_MISSING_ARTWORK\n}\n"""
          if old_res not in text:
              raise SystemExit('battleResonanceArtwork anchor not found')
          text = text.replace(old_res, new_res, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/components/battle/battle-skill-presentation.ts apps/web/src/components/battle/dark-fantasy-art/*.ts
          git config user.name "Aurevane Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-skill-presentation.ts apps/web/src/components/battle/dark-fantasy-art
          git diff --cached --quiet || git commit -m "Wire dark-fantasy artwork into combat presentation"
          git push origin HEAD:art/dark-fantasy-technique-art-20260907
