name: Temporary profile validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-profile-validation.yml'
      - 'apps/web/src/components/character/character-profile-details.tsx'
      - 'apps/web/src/components/character/character-profile-details.module.css'
      - 'apps/web/src/components/character/character-profile-shell.module.css'

permissions:
  contents: read

jobs:
  validate-profile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check touched formatting
        run: pnpm exec prettier --check apps/web/src/components/character/character-profile-details.tsx apps/web/src/components/character/character-profile-details.module.css apps/web/src/components/character/character-profile-shell.module.css
      - name: Lint changed component
        run: pnpm --filter @aurevane/web exec eslint src/components/character/character-profile-details.tsx --max-warnings=0
      - name: Web typecheck
        run: pnpm --filter @aurevane/web typecheck
