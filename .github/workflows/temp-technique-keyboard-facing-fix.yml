name: Temporary tagged Technique keyboard and facing fix

on:
  push:
    branches:
      - fix/technique-keyboard-facing-ui-20260906
    paths:
      - .github/workflows/temp-technique-keyboard-facing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/technique-keyboard-facing-ui-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply fixes
        run: python .github/scripts/temp_technique_keyboard_facing_fix.py
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/pvp-battle-experience.module.css \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
      - name: Validate focused files
        run: |
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/pvp-battle-experience.module.css \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          pnpm --filter @aurevane/web typecheck
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/pvp-battle-experience.module.css \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git commit -m "Fix tagged Technique keyboard targeting and legacy facing UI"
          git push origin HEAD:fix/technique-keyboard-facing-ui-20260906
