name: Apply verified mobile layout patch

on:
  push:
    branches:
      - agent/mobile-layout-redesign-20261023

permissions:
  contents: write

jobs:
  apply-owner-layout:
    if: startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorized release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364fc918107 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify source patch and reconstruct reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          package=scripts/release/aurevane-mobile-layout-20261023.patch.xz.base64
          base64 --decode "$package" > /tmp/aurevane-mobile-layout.patch.xz
          printf '%s  %s\n' 8e7310293b87026ce17b05153985270991371abda4971baffaa28c1039553c82 /tmp/aurevane-mobile-layout.patch.xz | sha256sum --check --status
          xz --decompress --stdout /tmp/aurevane-mobile-layout.patch.xz > /tmp/aurevane-mobile-layout.patch
          printf '%s  %s\n' 6edb7b1a918bfb0019c182a4348bdd107b4e7b03483169f6de6c8a0c9732e332 /tmp/aurevane-mobile-layout.patch | sha256sum --check --status
          git apply --check /tmp/aurevane-mobile-layout.patch
          git apply /tmp/aurevane-mobile-layout.patch
          rm -f "$package" .github/workflows/aurevane-mobile-layout-apply.yml
          git add --all
          expected=ba4cd9f6bae293bcad9535c6fb1e81eb6258152e
          actual="$(git write-tree)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Refusing to publish: candidate tree differs from the locally tested source."
            exit 1
          fi
          git -c user.name='Aurevane Release' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(ui): compact mobile layouts and unify battle cockpit chronology'
          git push origin HEAD:refs/heads/agent/mobile-layout-redesign-20261023
