name: Format probe

on:
  push:
    branches:
      - agent/phase5-staff-authority-foundation-20260918

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/web/src/server/master/staff-access.ts
          echo "FORMAT_DIFF_BEGIN"
          git diff -- apps/web/src/server/master/staff-access.ts
          echo "FORMAT_DIFF_END"
