name: Temporary Techniques overlay fix

on:
  push:
    branches:
      - fix/tagged-technique-preview-hotkeys-20260906
    paths:
      - .github/workflows/temp-techniques-overlay-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tagged-technique-preview-hotkeys-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply overlay patch
        run: python .github/scripts/temp_techniques_overlay_patch.py
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            apps/web/src/components/character/character-skill-build-panel.module.css \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
      - name: Validate focused files
        run: |
          pnpm exec prettier --check \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            apps/web/src/components/character/character-skill-build-panel.module.css \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          pnpm --filter @aurevane/web typecheck
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            apps/web/src/components/character/character-skill-build-panel.module.css \
            apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git commit -m "Portal Techniques overlay above Character Profile"
          git push origin HEAD:fix/tagged-technique-preview-hotkeys-20260906
