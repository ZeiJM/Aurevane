name: Reconcile Pierce E2E tests with shared combat

on:
  push:
    branches:
      - agent/combat-k4-pierce-20260914
    paths:
      - .github/workflows/agent-k4-pierce-reconcile-shared-tests.yml

permissions:
  contents: write

concurrency:
  group: combat-k4-pierce-reconcile-shared-tests
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Pierce revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconcile only the two stale Profile E2E assumptions
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k4-pierce-20260914
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path

          mixed = Path('apps/web/e2e/mixed-build-battle-entry.pw.ts')
          text = mixed.read_text()
          old_save = """  await page.getByRole('button', { name: 'Commit Selected Techniques' }).click()\n  await expect(page.getByRole('status')).toContainText('Selected Techniques committed')"""
          new_save = """  const saved = page.waitForResponse(\n    (response) =>\n      response.url().endsWith('/api/character/build/skills') &&\n      response.request().method() === 'PUT',\n  )\n  await page.getByRole('button', { name: 'Commit Selected Techniques' }).click()\n  expect((await saved).status()).toBe(200)"""
          if text.count(old_save) != 1:
              raise SystemExit('mixed build: expected one stale technique-save assertion')
          text = text.replace(old_save, new_save, 1)
          old_nav = """  await page.getByRole('button', { name: 'Navigation' }).click()\n  await page\n    .getByRole('navigation', { name: 'Game navigation', exact: true })\n    .getByRole('link', { name: /Battle Hall/ })\n    .click()"""
          new_nav = """  await page\n    .getByRole('navigation', { name: 'Primary game navigation', exact: true })\n    .getByRole('link', { name: 'Battle Hall', exact: true })\n    .click()"""
          if text.count(old_nav) != 1:
              raise SystemExit('mixed build: expected one stale navigation selector')
          mixed.write_text(text.replace(old_nav, new_nav, 1))

          representative = Path('apps/web/e2e/p3-8-representative-buildcraft.pw.ts')
          text = representative.read_text()
          if text.count(old_nav) != 1:
              raise SystemExit('representative buildcraft: expected one stale navigation selector')
          representative.write_text(text.replace(old_nav, new_nav, 1))
          PY
          grep -Fq "name: 'Primary game navigation', exact: true" apps/web/e2e/mixed-build-battle-entry.pw.ts
          grep -Fq "name: 'Primary game navigation', exact: true" apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          grep -Fq "response.url().endsWith('/api/character/build/skills')" apps/web/e2e/mixed-build-battle-entry.pw.ts
          ! grep -Fq "getByRole('button', { name: 'Navigation' })" apps/web/e2e/mixed-build-battle-entry.pw.ts
          ! grep -Fq "getByRole('button', { name: 'Navigation' })" apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git diff --check

      - name: Commit reconciled tests and remove staging workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k4-pierce-20260914
          git rm .github/workflows/agent-k4-pierce-reconcile-shared-tests.yml
          git add apps/web/e2e/mixed-build-battle-entry.pw.ts apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: reconcile Pierce branch with shared Profile flows'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
