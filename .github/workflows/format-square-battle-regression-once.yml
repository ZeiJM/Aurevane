name: One-shot format square battle regression

on:
  push:
    branches:
      - agent/requested-ui-cleanup-aether-square-media-20260918

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/requested-ui-cleanup-aether-square-media-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/e2e/battle-cockpit-layout-stability.pw.ts
          rm .github/workflows/format-square-battle-regression-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/battle-cockpit-layout-stability.pw.ts .github/workflows/format-square-battle-regression-once.yml
          git commit -m "chore: format square battle regression"
          git push origin HEAD:agent/requested-ui-cleanup-aether-square-media-20260918
