name: Format Desktop Battle Rails

on:
  push:
    branches:
      - 'fix/desktop-six-combatant-rails-20260823'
    paths:
      - '.github/workflows/format-desktop-battle-rails.yml'
      - 'apps/web/src/components/battle/ai-desktop-combatant-rail-polish.module.css'
      - 'apps/web/src/components/battle/ai-desktop-combatant-rail-polish.tsx'
      - 'apps/web/src/components/battle/desktop-battle-combatant-inspect.module.css'
      - 'apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx'
      - 'apps/web/src/components/battle/pvp-six-combatant-rails.module.css'
      - 'apps/web/src/components/battle/pvp-six-combatant-rails.tsx'
      - 'apps/web/vercel.json'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-six-combatant-rails-20260823

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/ai-desktop-combatant-rail-polish.module.css \
            apps/web/src/components/battle/ai-desktop-combatant-rail-polish.tsx \
            apps/web/src/components/battle/desktop-battle-combatant-inspect.module.css \
            apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx \
            apps/web/src/components/battle/pvp-six-combatant-rails.module.css \
            apps/web/src/components/battle/pvp-six-combatant-rails.tsx \
            apps/web/vercel.json

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/components/battle/ai-desktop-combatant-rail-polish.module.css \
            apps/web/src/components/battle/ai-desktop-combatant-rail-polish.tsx \
            apps/web/src/components/battle/desktop-battle-combatant-inspect.module.css \
            apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx \
            apps/web/src/components/battle/pvp-six-combatant-rails.module.css \
            apps/web/src/components/battle/pvp-six-combatant-rails.tsx \
            apps/web/vercel.json
          git commit -m 'Format desktop battle rail changes'
          git push origin HEAD:fix/desktop-six-combatant-rails-20260823
