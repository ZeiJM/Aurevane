name: CSR3 Format History Authority

on:
  push:
    branches:
      - agent/combat-csr3-historical-privacy-20260917
    paths:
      - .github/workflows/csr3-format-history-authority.yml

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr3-historical-privacy-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Format history authority files
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-history-privacy-authority.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.history-privacy.test.ts
      - name: Verify focused history repository tests
        run: |
          pnpm --filter @aurevane/web exec vitest run \
            src/server/battle/supabase-battle-session-repository.history-privacy.test.ts \
            src/server/battle/supabase-battle-session-repository.privacy.test.ts
      - name: Commit exact formatter output
        run: |
          rm .github/workflows/csr3-format-history-authority.yml
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/server/battle/battle-history-privacy-authority.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.history-privacy.test.ts \
            .github/workflows/csr3-format-history-authority.yml
          git diff --cached --check
          git commit -m 'style(combat): normalize CSR-3 history authority'
          git push origin HEAD:agent/combat-csr3-historical-privacy-20260917
