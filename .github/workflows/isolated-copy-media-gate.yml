name: Isolated Copy media identity gate

on:
  push:
    branches:
      - agent/master-panel-format-helper-20260917

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Copy media slice
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/combat-skill-copy.ts \
            packages/game-core/src/combat/combat-skill-copy.test.ts \
            apps/web/src/media/battle-audio.ts \
            apps/web/src/media/battle-audio.test.ts \
            apps/web/src/server/battle/battle-log-service.ts \
            apps/web/src/server/battle/battle-log-service.test.ts
      - name: Game-core checks
        run: |
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-skill-copy.test.ts
      - name: Web focused tests
        run: |
          pnpm --filter @aurevane/web exec vitest run \
            src/media/battle-audio.test.ts \
            src/server/battle/battle-log-service.test.ts
      - name: Web typecheck
        run: pnpm --filter @aurevane/web typecheck
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/game-core/src/combat/combat-skill-copy.ts \
            packages/game-core/src/combat/combat-skill-copy.test.ts \
            apps/web/src/media/battle-audio.ts \
            apps/web/src/media/battle-audio.test.ts \
            apps/web/src/server/battle/battle-log-service.ts \
            apps/web/src/server/battle/battle-log-service.test.ts
          git commit -m "chore: format Copy media identity"
          git push
