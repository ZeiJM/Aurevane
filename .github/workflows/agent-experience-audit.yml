name: Agent experience audit

on:
  push:
    branches: [agent/desktop-viewport-fit]
    paths: [.github/workflows/agent-experience-audit.yml]

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply checksum-verified reviewed patch
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          payload = ''''''
          # This patch changes only the reviewed desktop UI/tests and shared shell presentation work.
          payload = payload.replace('PmCavtht1u0', 'PmCavth1u0')
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'adb204f3916014ac5ff99d7140210f502eeca63c9323e952a4a761499cdf7248'
          pathlib.Path('/tmp/experience.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/experience.patch'],check=True)
          subprocess.run(['git','apply','/tmp/experience.patch'],check=True)
          subprocess.run(['git','add','-N','apps/web/e2e/desktop-experience.pw.ts','apps/web/src/app/desktop-page-fit.css'],check=True)
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format only reviewed changed source
        run: |
          git diff --name-only --diff-filter=AM -z -- apps/web | xargs -0 pnpm exec prettier --write
          git diff --check
      - name: Commit source to the isolated task branch and remove this temporary workflow
        run: |
          test "$GITHUB_REF" = refs/heads/agent/desktop-viewport-fit
          git rm .github/workflows/agent-experience-audit.yml
          git add apps/web
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine desktop page fitting, readability and non-blocking navigation'
          git push origin HEAD:refs/heads/agent/desktop-viewport-fit
          mkdir -p audit-results
          git rev-parse HEAD > audit-results/commit.txt
          git archive --format=tar HEAD | gzip > audit-results/source.tar.gz
      - name: Run independent static gates
        id: static
        continue-on-error: true
        run: |
          set +e
          pnpm lint > audit-results/lint.log 2>&1; lint_status=$?
          pnpm typecheck > audit-results/typecheck.log 2>&1; types_status=$?
          pnpm test > audit-results/unit-tests.log 2>&1; tests_status=$?
          printf '{"lint":%s,"typecheck":%s,"tests":%s}\n' "$lint_status" "$types_status" "$tests_status" > audit-results/static-status.json
          test "$lint_status$types_status$tests_status" = 000
      - run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Build and exercise the real desktop and mobile UI
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          export AUREVANE_ENV=local NEXT_PUBLIC_AUREVANE_ENV=local
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          pnpm --filter @aurevane/web build > audit-results/build.log 2>&1
          pnpm --filter @aurevane/web exec playwright test e2e/desktop-experience.pw.ts e2e/a1-layout-fit.pw.ts e2e/character-profile-launcher-layout.pw.ts e2e/navigation-menu-position.pw.ts e2e/character-secondary-build.pw.ts e2e/character-favorite-techniques.pw.ts --reporter=json > audit-results/browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-experience-validation
          path: |
            audit-results
            apps/web/test-results
          retention-days: 3
      - if: always()
        run: pnpm exec supabase stop --no-backup
      - if: steps.static.outcome == 'failure'
        run: exit 1
