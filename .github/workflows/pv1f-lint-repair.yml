name: PV-1F lint repair

on:
  push:
    branches:
      - agent/pv-1f-character-hub-turn-budget

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1f-character-hub-turn-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Repair lint findings
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          s = p.read_text()
          s = s.replace("import { classifyFacingRelation } from '@aurevane/game-core/combat/board'\n", '')
          start = s.find('function facingToward(')
          if start != -1:
              end = s.find('\nfunction manhattanDistance', start)
              if end == -1:
                  raise SystemExit('Could not locate facingToward end')
              s = s[:start] + s[end+1:]
          s = s.replace("  const pathTiles = useMemo(() => new Set(path.map(positionKey)), [path])\n", '')
          s = s.replace("                  const combatant = placement\n                    ? battleState.combatants.find((candidate) => candidate.id === placement.combatantId)\n                    : null\n", '')
          old = """  useEffect(() => {\n    if (\n      !playerTurn &&\n      battleState.lifecycle === 'active' &&\n      currentTurn &&\n      !recruitPending &&\n      !recruitFailed\n    ) {\n      void runRecruitTurn()\n    }\n  }, [\n    battleState.lifecycle,\n    currentTurn,\n    playerTurn,\n    recruitFailed,\n    recruitPending,\n    runRecruitTurn,\n  ])\n"""
          new = """  useEffect(() => {\n    if (\n      playerTurn ||\n      battleState.lifecycle !== 'active' ||\n      !currentTurn ||\n      recruitPending ||\n      recruitFailed\n    ) {\n      return\n    }\n\n    const timer = window.setTimeout(() => {\n      void runRecruitTurn()\n    }, 0)\n    return () => window.clearTimeout(timer)\n  }, [\n    battleState.lifecycle,\n    currentTurn,\n    playerTurn,\n    recruitFailed,\n    recruitPending,\n    runRecruitTurn,\n  ])\n"""
          if old not in s:
              raise SystemExit('Could not locate recruit effect')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('apps/web/src/components/battle/battle-log-panel.tsx')
          s = p.read_text()
          old = """  useEffect(() => {\n    if (visible) void loadLog()\n  }, [visible, battleVersion, loadLog])\n"""
          new = """  useEffect(() => {\n    if (!visible) return\n    const timer = window.setTimeout(() => {\n      void loadLog()\n    }, 0)\n    return () => window.clearTimeout(timer)\n  }, [visible, battleVersion, loadLog])\n"""
          if old not in s:
              raise SystemExit('Could not locate log loading effect')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: pnpm format
      - run: pnpm lint
      - name: Commit lint repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-experience-v2.tsx apps/web/src/components/battle/battle-log-panel.tsx
          git commit -m "fix: clear PV-1F battle lint blockers"
          git push origin HEAD:agent/pv-1f-character-hub-turn-budget
