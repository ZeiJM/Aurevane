name: Copy composition workbench

on:
  push:
    branches:
      - review/copy-composition-ab80053

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin implementation recipe and exact RED source
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/copy-composition-implementation.py /tmp/copy-composition-implementation.py
          git fetch --depth=5 origin f99c6c8fbe8b41ff9c79c260ab743b9e6e2b16e8
          git checkout --detach f99c6c8fbe8b41ff9c79c260ab743b9e6e2b16e8
          test "$(git rev-parse HEAD)" = f99c6c8fbe8b41ff9c79c260ab743b9e6e2b16e8
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = ab80053969a98d1bffbae4ecf57f9ed1b7e53915
          test "$(git ls-remote origin refs/heads/agent/combat-k4-copy-composition-ab80053 | cut -f1)" = f99c6c8fbe8b41ff9c79c260ab743b9e6e2b16e8
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile

      - name: Implement and format composed cloning
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/copy-composition-implementation.py
          pnpm exec prettier --write \
            packages/game-core/src/combat/actions-legacy.ts \
            packages/game-core/src/combat/combat-effect-provenance.ts \
            packages/game-core/src/combat/combat-status-copy.ts
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-status-copy-composition.test.ts

      - name: Focused GREEN verification
        run: |
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run \
            src/combat/combat-status-copy-composition.test.ts \
            src/combat/combat-status-copy.test.ts \
            src/combat/combat-status-copy-publication.test.ts \
            src/combat/combat-poison-copy.test.ts \
            src/combat/combat-burn-copy.test.ts \
            src/combat/combat-bleed-copy.test.ts \
            src/combat/combat-copy-provenance.test.ts \
            src/combat/combat-effect-provenance.test.ts \
            src/combat/combat-effect-provenance-state.test.ts \
            src/combat/combat-persistent-provenance-threading.test.ts

      - name: Full repository verification
        run: pnpm check

      - name: Retain only the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          expected = {
            'docs/COMBAT.md',
            'packages/game-core/src/combat/actions-legacy.ts',
            'packages/game-core/src/combat/combat-effect-provenance.ts',
            'packages/game-core/src/combat/combat-status-copy.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-status-copy-composition.test.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = ab80053969a98d1bffbae4ecf57f9ed1b7e53915
          test "$(git ls-remote origin refs/heads/agent/combat-k4-copy-composition-ab80053 | cut -f1)" = f99c6c8fbe8b41ff9c79c260ab743b9e6e2b16e8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/COMBAT.md \
            packages/game-core/src/combat/actions-legacy.ts \
            packages/game-core/src/combat/combat-effect-provenance.ts \
            packages/game-core/src/combat/combat-status-copy.ts
          git diff --cached --check
          git commit -m 'feat(combat): compose Amplify and Curse clone blocks'
          git push origin HEAD:refs/heads/agent/combat-k4-copy-composition-ab80053
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "VERIFIED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          test -z "$(git status --porcelain)"
