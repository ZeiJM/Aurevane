name: Phase 2 closeout formatting

on:
  push:
    branches:
      - agent/phase-2-closeout-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-2-closeout-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize inherited formatting baseline
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/battle-experience.pw.ts \
            apps/web/e2e/battle-terrain-control-parity.pw.ts \
            apps/web/src/components/battle/ai-battle-pvp-parity-authority.module.css \
            apps/web/src/components/battle/ai-battle-pvp-visual-sync.tsx \
            apps/web/src/components/battle/ai-battle-quality-controls.tsx \
            apps/web/src/components/battle/ai-desktop-same-facing-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-command-cockpit-polish.tsx \
            apps/web/src/components/battle/battle-coordinate-toggle.module.css \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-lesson-coach.tsx \
            apps/web/src/components/battle/battle-pvp-scale-authority.module.css \
            apps/web/src/components/battle/battle-runtime.ts \
            apps/web/src/components/battle/battle-screen-visual-contract.module.css \
            apps/web/src/components/battle/battle-screen-visual-contract.test.ts \
            apps/web/src/components/battle/battle-self-action-quick-commit-assist.test.ts \
            apps/web/src/components/battle/battle-terrain-presentation-polish.module.css \
            apps/web/src/components/battle/battle-terrain-presentation-polish.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.module.css \
            apps/web/src/components/battle/pve-battle-completion-bridge.tsx \
            apps/web/src/components/battle/pvp-battle-board-scale-authority.module.css \
            apps/web/src/components/battle/pvp-battle-board-scale-authority.test.ts \
            apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx \
            apps/web/src/components/battle/unified-battle-experience.module.css \
            apps/web/src/server/battle/guided-training-completion-service.ts
      - name: Commit formatting only
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web
          if git diff --cached --quiet; then
            echo "Formatting baseline already clean."
            exit 0
          fi
          git commit -m "chore: normalize Phase 2 formatting baseline"
          git push origin HEAD:agent/phase-2-closeout-audit
