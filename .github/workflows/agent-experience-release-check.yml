name: Desktop experience release check
on:
  push:
    branches: [agent/desktop-viewport-fit]
    paths: [.github/workflows/agent-experience-release-check.yml]
permissions:
  contents: read
concurrency:
  group: desktop-experience-release-check
  cancel-in-progress: true
jobs:
  finish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve directory containment and unchanged sub-desktop typography
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old = subprocess.check_output(['git','show','4a46b46a878198a7cfd5a1eb854f9fba66b35d3c:apps/web/src/app/desktop-page-fit.css'],text=True)
          marker = '/* A growing directory is a bounded, keyboard-scrollable list'
          directory = old[old.index(marker):]
          # Match the scope of the shared footer row without changing Profile/Hall geometry.
          directory = directory.replace("[data-testid='authenticated-shell']:has([data-character-directory])", "[data-testid='authenticated-shell']:has(#game-main [data-character-directory])")
          f=Path('apps/web/src/app/desktop-page-fit.css'); current=f.read_text()
          if marker not in current: f.write_text(current+'\n'+directory)
          f=Path('apps/web/src/app/desktop-readability.css'); current=f.read_text()
          main=subprocess.check_output(['git','show','4e0ae15eb5a021208261f022614cff1ad09d212d:apps/web/src/app/desktop-readability.css'],text=True)
          start=main.index('@media (min-width: 761px)'); depth=0; begun=False; end=start
          for i in range(start,len(main)):
            if main[i]=='{': depth+=1; begun=True
            elif main[i]=='}':
              depth-=1
              if begun and depth==0: end=i+1; break
          legacy=main[start:end].replace('@media (min-width: 761px)', '@media (min-width: 761px) and (max-width: 980px)',1)
          if 'Preserve existing sub-desktop typography' not in current:
            current=current.replace('@media (min-width: 761px)', '@media (min-width: 981px)',1)
            f.write_text(current+'\n/* Preserve existing sub-desktop typography; the new upgrade begins at 981px. */\n'+legacy+'\n')
          PY
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format and publish isolated correction
        id: commit
        run: |
          pnpm exec prettier --write apps/web/src/app/desktop-page-fit.css apps/web/src/app/desktop-readability.css
          git config user.name 'AUREVANE engineering'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/app/desktop-page-fit.css apps/web/src/app/desktop-readability.css
          git diff --cached --check
          git commit -m 'Contain growing desktop directories and preserve existing small-screen typography'
          git push origin HEAD:agent/desktop-viewport-fit
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: finish
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finish.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and typecheck owned source
        run: |
          mkdir -p audit-results
          git rev-parse HEAD > audit-results/commit.txt
          git archive --format=tar HEAD | gzip > audit-results/source.tar.gz
          pnpm exec prettier --check apps/web/e2e/desktop-experience.pw.ts apps/web/src/app/desktop-page-fit.css apps/web/src/app/desktop-readability.css apps/web/src/components/battle/battle-launch.tsx apps/web/src/components/shell/authenticated-game-shell.tsx apps/web/src/components/shell/navigation-menu.tsx apps/web/src/components/shell/navigation-menu.module.css apps/web/src/components/shell/online-presence-link.tsx > audit-results/format.log 2>&1
          pnpm --filter @aurevane/web exec eslint e2e/desktop-experience.pw.ts src/components/battle/battle-launch.tsx src/components/shell/authenticated-game-shell.tsx src/components/shell/navigation-menu.tsx src/components/shell/online-presence-link.tsx --max-warnings=0 > audit-results/lint.log 2>&1
          pnpm typecheck > audit-results/typecheck.log 2>&1
      - run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Build and validate the combined desktop experience
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          export AUREVANE_ENV=local NEXT_PUBLIC_AUREVANE_ENV=local
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          pnpm --filter @aurevane/web build 2>&1 | tee audit-results/build.log
          PLAYWRIGHT_JSON_OUTPUT_NAME=experience-results.json pnpm --filter @aurevane/web exec playwright test e2e/desktop-page-fit.pw.ts e2e/desktop-experience.pw.ts e2e/a1-layout-fit.pw.ts e2e/character-profile-launcher-layout.pw.ts e2e/account-entry.pw.ts e2e/character-creation.pw.ts e2e/public-information.pw.ts e2e/navigation-menu-position.pw.ts --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-experience-final
          path: |
            audit-results
            apps/web/experience-results.json
            apps/web/test-results
          retention-days: 3
      - if: always()
        run: pnpm exec supabase stop --no-backup
