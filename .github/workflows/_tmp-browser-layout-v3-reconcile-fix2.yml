name: Temporary browser layout v3 reconcile fix2

on:
  push:
    branches:
      - agent/browser-layout-v3-regression-reconcile-fix2-20260915

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-layout-v3-regression-reconcile-fix2-20260915
          fetch-depth: 0

      - name: Guard exact fix base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "36824f1c1f47a9d2b02fda7e1cd090ec7a049289"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/_tmp-browser-layout-v3-reconcile-fix2.yml"

      - name: Patch remaining stale browser contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/web/e2e/character-creation.pw.ts",
              """  const profilePortrait = page\n    .getByTestId('character-profile')\n    .locator(`img[alt=\"${characterName} portrait\"]`)\n    .first()""",
              """  const profilePortrait = page.getByTestId('character-profile').locator('img').first()""",
          )

          replace_once(
              "apps/web/e2e/desktop-experience.pw.ts",
              """const rosterListSelector = \"[data-directory-roster='true']\"""",
              """const rosterPanelSelector = \"[data-directory-roster='true']\"\nconst directoryListSelector = \"[data-directory-list='true']\"""",
          )
          replace_once(
              "apps/web/e2e/desktop-experience.pw.ts",
              """  }, rosterListSelector)""",
              """  }, rosterPanelSelector)""",
          )
          replace_once(
              "apps/web/e2e/desktop-experience.pw.ts",
              """    const minimumListHeight = metrics.viewport[1]! <= 600 ? 80 : 120""",
              """    const minimumListHeight = 80""",
          )
          replace_once(
              "apps/web/e2e/desktop-experience.pw.ts",
              """      const panel = await page.locator('#battle-launch').boundingBox()\n      expect(panel!.width).toBeLessThanOrEqual(1248)""",
              """      const panel = await page.locator('#battle-launch').boundingBox()\n      const main = await page.locator('#game-main').boundingBox()\n      expect(panel).not.toBeNull()\n      expect(main).not.toBeNull()\n      expect(panel!.width).toBeLessThanOrEqual(main!.width + 1)\n      expect(panel!.width).toBeGreaterThanOrEqual(main!.width * 0.9)""",
          )
          replace_once(
              "apps/web/e2e/desktop-experience.pw.ts",
              """    const list = page.locator(rosterListSelector)""",
              """    const list = page.locator(directoryListSelector)""",
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and statically verify fix2
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/web/e2e/character-creation.pw.ts \
            apps/web/e2e/desktop-experience.pw.ts
          pnpm exec prettier --check \
            apps/web/e2e/character-creation.pw.ts \
            apps/web/e2e/desktop-experience.pw.ts
          pnpm typecheck
          git diff --check

      - name: Commit fix2 and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-browser-layout-v3-reconcile-fix2.yml
          git add \
            .github/workflows/_tmp-browser-layout-v3-reconcile-fix2.yml \
            apps/web/e2e/character-creation.pw.ts \
            apps/web/e2e/desktop-experience.pw.ts
          expected="apps/web/e2e/character-creation.pw.ts\napps/web/e2e/desktop-experience.pw.ts"
          actual="$(git diff --cached --name-only | grep -v '^.github/workflows/_tmp-browser-layout-v3-reconcile-fix2.yml$')"
          test "$actual" = "$(printf '%b' "$expected")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align remaining browser assertions with layout v3"
          git push origin HEAD:agent/browser-layout-v3-regression-reconcile-20260915