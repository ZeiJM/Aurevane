name: Poison copy workbench

on:
  push:
    branches:
      - review/poison-copy-40da86a

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin recipe and exact valid RED source
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/poison-copy-implementation.py /tmp/poison-copy-implementation.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/poison-copy-implementation.py')
          text = path.read_text()
          old = """      planCombatStatusCopies(state, actorId, target.combatantId, copyEffect, content).copies.length ===\n        0"""
          new = """      planCombatStatusCopies(state, actorId, target.combatantId, copyEffect, content).copies\n        .length === 0"""
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          git fetch --depth=4 origin 22705eb75ebad809586e570c103b73b46fe73be2
          git checkout --detach 22705eb75ebad809586e570c103b73b46fe73be2
          test "$(git rev-parse HEAD)" = 22705eb75ebad809586e570c103b73b46fe73be2
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 40da86aec7ef7354ec86078c1eae9e1eb83a952c
          test "$(git ls-remote origin refs/heads/agent/combat-k4-poison-copy-40da86a | cut -f1)" = 22705eb75ebad809586e570c103b73b46fe73be2
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Implement and format Poison copying
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/poison-copy-implementation.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/game-core/src/combat/combat-status-copy.ts')
          text = path.read_text()
          old = "effectType: 'copy-statuses',"
          assert text.count(old) == 2
          path.write_text(text.replace(old, "effectType: 'copy-statuses' as const,"))
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/combat-status-copy.ts
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-poison-copy.test.ts
      - name: Focused GREEN verification
        run: |
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-poison-copy.test.ts src/combat/combat-status-copy.test.ts src/combat/combat-status-copy-publication.test.ts src/combat/combat-copy-provenance.test.ts src/combat/combat-poison-movement.test.ts src/combat/combat-poison-voluntary-movement.test.ts src/combat/combat-poison-edges.test.ts src/combat/combat-dot-rework.test.ts src/combat/combat-effect-provenance-state.test.ts src/combat/combat-mark-blind.contract.test.ts
      - name: Full repository verification
        run: pnpm check
      - name: Retain only the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          expected = {
            'docs/COMBAT.md',
            'packages/game-core/src/combat/actions-legacy.ts',
            'packages/game-core/src/combat/combat-authoring-validation.ts',
            'packages/game-core/src/combat/combat-dots.ts',
            'packages/game-core/src/combat/combat-effect-state.ts',
            'packages/game-core/src/combat/combat-status-copy.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-poison-copy.test.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 40da86aec7ef7354ec86078c1eae9e1eb83a952c
          test "$(git ls-remote origin refs/heads/agent/combat-k4-poison-copy-40da86a | cut -f1)" = 22705eb75ebad809586e570c103b73b46fe73be2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/COMBAT.md packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-status-copy.ts
          git diff --cached --check
          git commit -m 'feat(combat): copy Poison movement state with explicit Curse policy and K3 lineage'
          git push origin HEAD:refs/heads/agent/combat-k4-poison-copy-40da86a
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "VERIFIED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          test -z "$(git status --porcelain)"
