name: P3.4 Prettier Repair

on:
  push:
    branches:
      - agent/p3-4-profile-skill-configuration
    paths:
      - .github/workflows/p3-4-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-4-profile-skill-configuration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format P3.4 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/components/character/character-skill-build-panel.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/components/character/character-skill-build-panel.tsx
          git commit -m "Format P3.4 skill configuration"
          git push origin HEAD:agent/p3-4-profile-skill-configuration
