name: A1 temporary browser integration fix

on:
  push:
    branches:
      - agent/a1-feedback-holistic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/a1-feedback-holistic

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install formatter without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fix overlay layering and stale browser expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_s: str, old: str, new: str) -> None:
              path = Path(path_s)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_s}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new))

          replace_once(
              'apps/web/src/components/shell/authenticated-game-shell.module.css',
              """.footer {\n  position: sticky;\n  bottom: 0;\n  z-index: 850;\n""",
              """.footer {\n  position: sticky;\n  bottom: 0;\n  z-index: 3000;\n""",
          )

          replace_once(
              'apps/web/src/components/shell/navigation-menu.module.css',
              """.root {\n  position: relative;\n  display: inline-flex;\n}\n""",
              """.root {\n  position: relative;\n  z-index: 3100;\n  display: inline-flex;\n}\n""",
          )
          replace_once(
              'apps/web/src/components/shell/navigation-menu.module.css',
              """.menu {\n  position: absolute;\n  z-index: 1200;\n""",
              """.menu {\n  position: absolute;\n  z-index: 3200;\n""",
          )

          replace_once(
              'apps/web/src/components/battle/battle-experience-v2.module.css',
              """.battleFooter {\n  position: relative;\n  z-index: 1000;\n""",
              """.battleFooter {\n  position: relative;\n  z-index: 3000;\n""",
          )
          replace_once(
              'apps/web/src/components/battle/battle-experience-v2.module.css',
              """.chatControl {\n  position: relative;\n}\n""",
              """.chatControl {\n  position: relative;\n  z-index: 3100;\n}\n""",
          )
          replace_once(
              'apps/web/src/components/battle/battle-experience-v2.module.css',
              """.chatPanel {\n  position: absolute;\n  z-index: 2000;\n""",
              """.chatPanel {\n  position: absolute;\n  z-index: 3200;\n""",
          )

          replace_once(
              'apps/web/e2e/character-deletion.pw.ts',
              """  await createAccountAndEnterCharacter({ page, email, password, characterName })\n  await page.getByRole('link', { name: 'Back to Character Select' }).click()\n  await expect(page).toHaveURL(/\\/game$/)\n""",
              """  await createAccountAndEnterCharacter({ page, email, password, characterName })\n  await page.getByRole('button', { name: 'Account' }).click()\n  await page.getByRole('menuitem', { name: 'Switch Character' }).click()\n  await expect(page).toHaveURL(/\\/game$/)\n""",
          )

          path = Path('apps/web/e2e/character-creation.pw.ts')
          text = path.read_text()
          old_fill = "await page.getByLabel('Personal title').fill(personalTitle)"
          new_fill = "await page.getByRole('textbox', { name: /^Personal title/ }).fill(personalTitle)"
          if text.count(old_fill) != 1:
              raise SystemExit('character creation title fill selector mismatch')
          text = text.replace(old_fill, new_fill)
          old_count = "await expect(page.getByLabel('Personal title')).toHaveCount(0)"
          new_count = "await expect(page.getByRole('textbox', { name: /^Personal title/ })).toHaveCount(0)"
          if text.count(old_count) != 1:
              raise SystemExit('character creation title disappearance selector mismatch')
          path.write_text(text.replace(old_count, new_count))
          PY

          pnpm exec prettier --write \
            apps/web/src/components/shell/authenticated-game-shell.module.css \
            apps/web/src/components/shell/navigation-menu.module.css \
            apps/web/src/components/battle/battle-experience-v2.module.css \
            apps/web/e2e/character-deletion.pw.ts \
            apps/web/e2e/character-creation.pw.ts

          git rm .github/workflows/a1-temporary-browser-integration-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix A1 overlay layering and browser flows"
          git push origin HEAD:agent/a1-feedback-holistic
