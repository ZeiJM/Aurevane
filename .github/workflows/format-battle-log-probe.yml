name: Temporary Battle Log format probe

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print Prettier output
        run: |
          pnpm exec prettier --write apps/web/src/components/battle/battle-log-movement-summary.ts
          echo '-----FORMATTED-----'
          cat apps/web/src/components/battle/battle-log-movement-summary.ts
          echo '-----END-----'
