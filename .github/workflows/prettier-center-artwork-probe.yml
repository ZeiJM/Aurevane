name: Center artwork Prettier probe

on:
  push:
    branches:
      - agent/center-skill-artwork

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write apps/web/src/components/battle/battle-skill-command.tsx apps/web/e2e/battle-cockpit-skill-slots.pw.ts
          echo '--- PRETTIER DIFF START ---'
          git diff -- apps/web/src/components/battle/battle-skill-command.tsx apps/web/e2e/battle-cockpit-skill-slots.pw.ts
          echo '--- PRETTIER DIFF END ---'