name: Combat v5 one-shot format

on:
  push:
    branches:
      - agent/combat-rebalance-v5-20260927

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format combat v5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/combat-rebalance-v5-20260927

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed code and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(
            git diff --name-only origin/main...HEAD |
              grep -E '\.(ts|tsx|js|mjs|json|css)$' || true
          )
          if (("${#files[@]}" > 0)); then
            pnpm exec prettier --write "${files[@]}"
          fi
          git rm .github/workflows/combat-v5-format-once.yml
          git config user.name "Aurevane CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format combat v5"
          git push origin HEAD:agent/combat-rebalance-v5-20260927
