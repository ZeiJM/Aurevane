name: Temporary Lowered Guard test

on:
  push:
    branches:
      - agent/cockpit-art-lowered-guard-polish

permissions:
  contents: read

jobs:
  lowered-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck game core
        run: pnpm --filter @aurevane/game-core typecheck
      - name: Test Lowered Guard
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/pvp-quality.test.ts
