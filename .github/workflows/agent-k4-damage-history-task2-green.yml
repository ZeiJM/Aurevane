name: Apply and verify K4 damage-history resolver wiring

on:
  push:
    branches:
      - agent/combat-k4-damage-history-20260914
    paths:
      - .github/workflows/agent-k4-damage-history-task2-green.yml

permissions:
  contents: write

concurrency:
  group: combat-k4-damage-history-task2-green
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply minimal provenance-aware ledger wiring
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          history = 'packages/game-core/src/combat/combat-damage-history.ts'
          replace_once(
              history,
              """export interface RecordCombatDamageHistoryInput {\n  targetCombatantId: string\n  amount: number\n  provenance: DamageProvenance\n}""",
              """export interface RecordCombatDamageHistoryInput {\n  targetCombatantId: string\n  amount: number\n  provenance: DamageProvenance\n  round?: number\n}""",
          )
          replace_once(
              history,
              """  const effectState = normalizeCombatEffectState(state.effectState)\n  const round = activeRound(state)\n  const minimumRound = Math.max(1, round - (DAMAGE_HISTORY_WINDOW_ROUNDS - 1))\n  const damageHistory = effectState.damageHistory\n    .filter((entry) => entry.round >= minimumRound && entry.round <= round)""",
              """  const effectState = normalizeCombatEffectState(state.effectState)\n  const activeBattleRound = activeRound(state)\n  const round = input.round ?? activeBattleRound\n  assertRecordableRound(round, activeBattleRound)\n  const minimumRound = Math.max(1, activeBattleRound - (DAMAGE_HISTORY_WINDOW_ROUNDS - 1))\n  const damageHistory = effectState.damageHistory\n    .filter((entry) => entry.round >= minimumRound && entry.round <= activeBattleRound)""",
          )
          replace_once(
              history,
              """function assertActualDamage(amount: number): void {\n  if (!Number.isSafeInteger(amount) || amount < 0) {\n    throw new RangeError('Combat damage-history amount must be a non-negative safe integer.')\n  }\n}""",
              """function assertRecordableRound(round: number, activeBattleRound: number): void {\n  const minimumRound = Math.max(1, activeBattleRound - (DAMAGE_HISTORY_WINDOW_ROUNDS - 1))\n  if (!Number.isSafeInteger(round) || round < minimumRound || round > activeBattleRound) {\n    throw new RangeError('Combat damage-history round must be inside the active three-round window.')\n  }\n}\n\nfunction assertActualDamage(amount: number): void {\n  if (!Number.isSafeInteger(amount) || amount < 0) {\n    throw new RangeError('Combat damage-history amount must be a non-negative safe integer.')\n  }\n}""",
          )

          actions = 'packages/game-core/src/combat/actions-legacy.ts'
          replace_once(
              actions,
              """import type { CombatEffectState } from './combat-effect-state'""",
              """import { recordCombatDamageHistory } from './combat-damage-history'\nimport type { CombatEffectState, DamageProvenance } from './combat-effect-state'""",
          )
          replace_once(
              actions,
              """  const outgoingCombatantId = state.tactical.battle.currentTurn.combatantId\n  const turn = endTurn(state.tactical.battle, outgoingCombatantId)""",
              """  const outgoingCombatantId = state.tactical.battle.currentTurn.combatantId\n  const outgoingRound = state.tactical.battle.round\n  const turn = endTurn(state.tactical.battle, outgoingCombatantId)""",
          )
          replace_once(
              actions,
              """  const periodic = resolveEndOfTurnStatuses(nextState, outgoingCombatantId, content)""",
              """  const periodic = resolveEndOfTurnStatuses(\n    nextState,\n    outgoingCombatantId,\n    content,\n    outgoingRound,\n  )""",
          )
          replace_once(
              actions,
              """  const poison = resolveCurrentPoisonEndTurn(nextState, outgoingCombatantId)""",
              """  const poison = resolveCurrentPoisonEndTurn(nextState, outgoingCombatantId, outgoingRound)""",
          )
          replace_once(
              actions,
              """  const bleed = resolveCurrentBleedEndTurn(nextState, outgoingCombatantId)""",
              """  const bleed = resolveCurrentBleedEndTurn(nextState, outgoingCombatantId, outgoingRound)""",
          )
          replace_once(
              actions,
              """  const burn = resolveCurrentBurnEndTurn(nextState, outgoingCombatantId)""",
              """  const burn = resolveCurrentBurnEndTurn(nextState, outgoingCombatantId, outgoingRound)""",
          )
          replace_once(
              actions,
              """  return {\n    state: nextState,\n    events: [\n      {\n        event: 'damage_applied',\n        actorId,\n        actionId: CURRENT_BURN_BACKLASH_ACTION_ID,\n        targetCombatantId: actorId,\n        amount: damage,\n      },""",
              """  const stateWithHistory = recordCommittedDamage(\n    nextState,\n    actorId,\n    actorId,\n    CURRENT_BURN_BACKLASH_ACTION_ID,\n    damage,\n    'self-cost',\n  )\n\n  return {\n    state: stateWithHistory,\n    events: [\n      {\n        event: 'damage_applied',\n        actorId,\n        actionId: CURRENT_BURN_BACKLASH_ACTION_ID,\n        targetCombatantId: actorId,\n        amount: damage,\n      },""",
          )
          replace_once(
              actions,
              """    const removed = removeGameplayTagsFromRecipient(\n      nextState,\n      recipientId,\n      collectDamageRemovedGameplayTags(nextState, actorId, recipientId, content),\n    )\n    return {\n      state: removed.state,\n      events: [\n        ...removed.events,\n        {\n          event: 'damage_applied',\n          actorId,\n          actionId: action.id,\n          targetCombatantId: recipientId,\n          amount: target.hp - hpAfter,\n        },""",
              """    const damage = target.hp - hpAfter\n    const removed = removeGameplayTagsFromRecipient(\n      nextState,\n      recipientId,\n      collectDamageRemovedGameplayTags(nextState, actorId, recipientId, content),\n    )\n    const stateWithHistory = recordCommittedDamage(\n      removed.state,\n      actorId,\n      recipientId,\n      action.id,\n      damage,\n      'direct-hostile',\n    )\n    return {\n      state: stateWithHistory,\n      events: [\n        ...removed.events,\n        {\n          event: 'damage_applied',\n          actorId,\n          actionId: action.id,\n          targetCombatantId: recipientId,\n          amount: damage,\n        },""",
          )
          replace_once(
              actions,
              """function resolveEndOfTurnStatuses(\n  state: CombatEncounterState,\n  combatantId: string,\n  content: CombatContentCatalog,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
              """function resolveEndOfTurnStatuses(\n  state: CombatEncounterState,\n  combatantId: string,\n  content: CombatContentCatalog,\n  damageRound: number,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
          )
          replace_once(
              actions,
              """    nextState = {\n      ...nextState,\n      tactical: {\n        ...nextState.tactical,\n        battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n      },\n    }\n    events.push({""",
              """    nextState = {\n      ...nextState,\n      tactical: {\n        ...nextState.tactical,\n        battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n      },\n    }\n    if (definition.endOfTurn.type === 'damage') {\n      nextState = recordCommittedDamage(\n        nextState,\n        status.sourceCombatantId,\n        combatantId,\n        status.statusId,\n        amount,\n        'periodic-hostile',\n        damageRound,\n      )\n    }\n    events.push({""",
          )
          replace_once(
              actions,
              """function resolveCurrentPoisonEndTurn(\n  state: CombatEncounterState,\n  combatantId: string,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
              """function resolveCurrentPoisonEndTurn(\n  state: CombatEncounterState,\n  combatantId: string,\n  damageRound: number,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
          )
          replace_once(
              actions,
              """  nextState = {\n    ...nextState,\n    tactical: {\n      ...nextState.tactical,\n      battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n    },\n  }\n  events.push({\n    event: 'damage_applied',\n    actorId: poison.sourceCombatantId,""",
              """  nextState = {\n    ...nextState,\n    tactical: {\n      ...nextState.tactical,\n      battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n    },\n  }\n  nextState = recordCommittedDamage(\n    nextState,\n    poison.sourceCombatantId,\n    combatantId,\n    poison.sourceActionId,\n    damage,\n    'periodic-hostile',\n    damageRound,\n  )\n  events.push({\n    event: 'damage_applied',\n    actorId: poison.sourceCombatantId,""",
          )
          replace_once(
              actions,
              """function resolveCurrentBleedEndTurn(\n  state: CombatEncounterState,\n  combatantId: string,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
              """function resolveCurrentBleedEndTurn(\n  state: CombatEncounterState,\n  combatantId: string,\n  damageRound: number,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
          )
          replace_once(
              actions,
              """    nextState = {\n      ...nextState,\n      tactical: {\n        ...nextState.tactical,\n        battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n      },\n    }\n    events.push({\n      event: 'damage_applied',\n      actorId: stack.sourceCombatantId,""",
              """    nextState = {\n      ...nextState,\n      tactical: {\n        ...nextState.tactical,\n        battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n      },\n    }\n    nextState = recordCommittedDamage(\n      nextState,\n      stack.sourceCombatantId,\n      combatantId,\n      stack.sourceActionId,\n      damage,\n      'periodic-hostile',\n      damageRound,\n    )\n    events.push({\n      event: 'damage_applied',\n      actorId: stack.sourceCombatantId,""",
          )
          replace_once(
              actions,
              """function resolveCurrentBurnEndTurn(\n  state: CombatEncounterState,\n  combatantId: string,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
              """function resolveCurrentBurnEndTurn(\n  state: CombatEncounterState,\n  combatantId: string,\n  damageRound: number,\n): { state: CombatEncounterState; events: CombatResolutionEvent[] } {""",
          )
          replace_once(
              actions,
              """  nextState = {\n    ...nextState,\n    tactical: {\n      ...nextState.tactical,\n      battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n    },\n  }\n  events.push({\n    event: 'damage_applied',\n    actorId: advanced.instance.sourceCombatantId,""",
              """  nextState = {\n    ...nextState,\n    tactical: {\n      ...nextState.tactical,\n      battle: withUpdatedCombatant(nextState.tactical.battle, combatantId, { hp: hpAfter }),\n    },\n  }\n  nextState = recordCommittedDamage(\n    nextState,\n    advanced.instance.sourceCombatantId,\n    combatantId,\n    advanced.instance.sourceActionId,\n    damage,\n    'periodic-hostile',\n    damageRound,\n  )\n  events.push({\n    event: 'damage_applied',\n    actorId: advanced.instance.sourceCombatantId,""",
          )
          replace_once(
              actions,
              """function scaleByBasisPoints(value: number, basisPoints: number): number {""",
              """function recordCommittedDamage(\n  state: CombatEncounterState,\n  sourceCombatantId: string,\n  targetCombatantId: string,\n  sourceActionId: string,\n  amount: number,\n  requestedKind: Extract<\n    DamageProvenance['kind'],\n    'direct-hostile' | 'periodic-hostile' | 'self-cost'\n  >,\n  round?: number,\n): CombatEncounterState {\n  let kind: DamageProvenance['kind'] = requestedKind\n  if (requestedKind !== 'self-cost') {\n    const source = getCombatant(state.tactical.battle, sourceCombatantId)\n    const target = getCombatant(state.tactical.battle, targetCombatantId)\n    if (sourceCombatantId === targetCombatantId || source.teamId === target.teamId) kind = 'system'\n  }\n\n  return recordCombatDamageHistory(state, {\n    targetCombatantId,\n    amount,\n    round,\n    provenance: {\n      kind,\n      sourceCombatantId,\n      sourceActionId,\n      commandExecutionId: null,\n    },\n  })\n}\n\nfunction scaleByBasisPoints(value: number, basisPoints: number): number {""",
          )
          PY
          pnpm exec prettier --write packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-damage-history.ts
          git diff --check

      - name: Run focused damage-history contracts
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-damage-history.test.ts src/combat/combat-damage-history-runtime.test.ts

      - name: Run game-core typecheck
        run: pnpm --filter @aurevane/game-core typecheck

      - name: Run full repository quality gate
        run: pnpm check

      - name: Commit verified resolver wiring without staging workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k4-damage-history-20260914
          git diff --check
          git rm .github/workflows/agent-k4-damage-history-task2-green.yml
          git add packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-damage-history.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire authoritative damage history provenance'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          echo "Verified Task 2 commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
