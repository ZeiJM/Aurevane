name: Temporary Technique capacity contract fixer

on:
  push:
    branches:
      - fix/battle-technique-authority-profile-20260906
    paths:
      - '.github/workflows/temp-technique-capacity-contract-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-technique-authority-profile-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Technique capacity display contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/character/character-skill-build-panel.tsx')
          text = path.read_text()
          old = "                  <strong>{selectedIds.length}</strong>\n                  <span>/ {capacity} tagged</span>"
          new = "                  <strong>{selectedIds.length}</strong>\n                  <span>{` / ${capacity}`}</span>"
          if old not in text:
              raise SystemExit('Expected Technique capacity markup not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/components/character/character-skill-build-panel.tsx
      - name: Commit capacity contract fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/character/character-skill-build-panel.tsx
          git commit -m 'Restore Technique capacity display contract'
          git push origin HEAD:fix/battle-technique-authority-profile-20260906
