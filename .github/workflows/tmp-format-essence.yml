name: Temporary Essence Formatter

on:
  push:
    branches:
      - polish/profile-center-lifebinder-attacks-20260906
    paths:
      - '.github/workflows/tmp-format-essence.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/profile-center-lifebinder-attacks-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/game-core/src/combat/essence.test.ts
      - run: |
          if git diff --quiet -- packages/game-core/src/combat/essence.test.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/game-core/src/combat/essence.test.ts
          git commit -m 'Format Lifebinder Essence test'
          git push origin HEAD:polish/profile-center-lifebinder-attacks-20260906
