name: PV-1D lint repair

on:
  push:
    branches:
      - agent/pv-1d-combat-readability-correction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1d-combat-readability-correction
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply lint repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()
          text = text.replace("type CombatProfile = BattleSessionView['snapshot']['statBridge']['combatants'][number]\n", '')
          text = text.replace("  const activeCombatant = currentTurn\n    ? (battleState.combatants.find((combatant) => combatant.id === currentTurn.combatantId) ?? null)\n    : null\n", '')
          text = text.replace("    battle,\n    battle.battleSessionId,\n    battle.battleVersion,\n    battleState.lifecycle,", "    battle,\n    battleState.lifecycle,")
          text = text.replace("    activePlacement,\n    battle,\n    battle.battleSessionId,\n    battle.battleVersion,\n    commitPending,", "    activePlacement,\n    battle,\n    commitPending,")
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/components/battle/battle-experience-v2.tsx
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo 'No lint repairs needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-experience-v2.tsx
          git commit -m 'fix: address PV-1D combat cockpit lint findings'
          git push origin HEAD:agent/pv-1d-combat-readability-correction
