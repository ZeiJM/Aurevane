name: Temporary battle regression validation

on:
  push:
    branches:
      - fix/battle-technique-authority-profile-20260906
    paths:
      - '.github/workflows/temp-battle-regression-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-technique-authority-profile-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused formatting
        run: |
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-skill-command.tsx \
            apps/web/src/server/battle/ai-battle-quality-service.ts \
            apps/web/src/server/battle/battle-final-turn-service.ts \
            apps/web/src/server/battle/battle-final-turn-service.test.ts
      - name: Focused battle typecheck
        run: |
          trap 'rm -f apps/web/tsconfig.battle-regression-ci.json' EXIT
          cat > apps/web/tsconfig.battle-regression-ci.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "next-env.d.ts",
              ".next/types/**/*.ts",
              "src/components/battle/battle-skill-command.tsx",
              "src/server/battle/ai-battle-quality-service.ts",
              "src/server/battle/battle-final-turn-service.ts",
              "src/server/battle/battle-final-turn-service.test.ts"
            ],
            "exclude": ["node_modules"]
          }
          JSON
          pnpm --filter @aurevane/web exec next typegen
          pnpm --filter @aurevane/web exec tsc --noEmit -p tsconfig.battle-regression-ci.json
      - name: Focused regression tests
        run: |
          pnpm --filter @aurevane/web exec vitest run \
            src/server/battle/battle-final-turn-service.test.ts \
            src/components/battle/battle-skill-presentation.test.ts
