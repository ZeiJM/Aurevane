name: Desktop page fit

on:
  pull_request:
    paths:
      - 'apps/web/src/app/desktop-*.css'
      - 'apps/web/src/app/layout.tsx'
      - 'apps/web/src/components/character/**'
      - 'apps/web/src/components/shell/**'
      - 'apps/web/src/components/battle/battle-launch*'
      - 'apps/web/e2e/desktop-page-fit.pw.ts'
      - '.github/workflows/desktop-page-fit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-page-fit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format changed page sources for review
        run: |
          pnpm exec prettier --write apps/web/src/app/desktop-page-fit.css apps/web/e2e/desktop-page-fit.pw.ts
          mkdir -p page-fit-formatted
          cp apps/web/src/app/desktop-page-fit.css apps/web/e2e/desktop-page-fit.pw.ts page-fit-formatted/
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test
      - run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
        if: ${{ !cancelled() }}
      - name: Build and verify page interactions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          export AUREVANE_ENV=local NEXT_PUBLIC_AUREVANE_ENV=local
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          pnpm --filter @aurevane/web build
          pnpm --filter @aurevane/web exec playwright test \
            e2e/desktop-page-fit.pw.ts e2e/a1-layout-fit.pw.ts \
            e2e/character-profile-launcher-layout.pw.ts \
            --reporter=line,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-page-fit-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
            page-fit-formatted
          retention-days: 7
      - if: always()
        run: pnpm exec supabase stop --no-backup
