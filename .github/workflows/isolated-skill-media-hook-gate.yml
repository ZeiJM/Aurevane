name: Isolated Skill media hook gate

on:
  push:
    branches:
      - agent/master-skill-media-format-helper-20260918

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format media hook slice
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-selected-skills.tsx \
            apps/web/src/components/battle/battle-skill-presentation.test.ts \
            apps/web/src/components/battle/battle-skill-presentation.ts \
            apps/web/src/media/battle-audio.ts \
            apps/web/src/media/skill-media-hooks.ts
      - name: Focused tests
        run: |
          pnpm --filter @aurevane/web exec vitest run \
            src/media/skill-media-hooks.test.ts \
            src/components/battle/battle-skill-presentation.test.ts \
            src/media/battle-audio.test.ts
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-skill-copy-pv1f.test.ts
      - name: Typecheck touched workspaces
        run: |
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/web typecheck
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-selected-skills.tsx \
            apps/web/src/components/battle/battle-skill-presentation.test.ts \
            apps/web/src/components/battle/battle-skill-presentation.ts \
            apps/web/src/media/battle-audio.ts \
            apps/web/src/media/skill-media-hooks.ts
          git commit -m "chore: format Skill media hooks"
          git push
