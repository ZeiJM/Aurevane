name: P3.2 finish fix once

on:
  push:
    branches:
      - agent/p3-2-secondary-attunement
    paths:
      - '.github/workflows/p32-finish-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected starting head
        run: test "$(git rev-parse HEAD)" = '82b24bcd82c73334f7304be7c0dbc52910183345'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix browser harness and formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/e2e/character-secondary-build.pw.ts')
          text = path.read_text()
          old = """async function recordMastery(characterName: string, disciplineId: string): Promise<void> {
            const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL
            const secretKey = process.env.SUPABASE_SECRET_KEY
            if (!supabaseUrl || !secretKey) {
              throw new Error('Local Supabase admin credentials are required for the P3.2 browser proof.')
            }

            const admin = createClient(supabaseUrl, secretKey, {
              auth: { autoRefreshToken: false, persistSession: false },
            })
            const { data: character, error: characterError } = await admin
              .from('characters')
              .select('id')
              .eq('name', characterName)
              .single()
            if (characterError || !character) throw characterError ?? new Error('Character unavailable.')

            const { error: masteryError } = await admin.rpc('record_character_discipline_mastery_v1', {
              p_character_id: character.id,
              p_discipline_id: disciplineId,
              p_source_kind: 'system',
              p_source_id: 'browser-proof.p3.2',
            })
            if (masteryError) throw masteryError
          }
          """
          new = """async function recordMastery(characterId: string, disciplineId: string): Promise<void> {
            const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL
            const secretKey = process.env.SUPABASE_SECRET_KEY
            if (!supabaseUrl || !secretKey) {
              throw new Error('Local Supabase admin credentials are required for the P3.2 browser proof.')
            }

            const admin = createClient(supabaseUrl, secretKey, {
              auth: { autoRefreshToken: false, persistSession: false },
            })
            const { error: masteryError } = await admin.rpc('record_character_discipline_mastery_v1', {
              p_character_id: characterId,
              p_discipline_id: disciplineId,
              p_source_kind: 'system',
              p_source_id: 'browser-proof.p3.2',
            })
            if (masteryError) throw masteryError
          }
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one recordMastery block.')
          text = text.replace(old, new)

          old_call = "  await recordMastery(characterName, 'aetherist')"
          new_call = """  const selectedCharacterCookie = (await page.context().cookies()).find(
            (cookie) => cookie.name === 'aurevane_selected_character',
          )
          if (!selectedCharacterCookie) {
            throw new Error('The selected character cookie is unavailable for the P3.2 browser proof.')
          }

          await recordMastery(selectedCharacterCookie.value, 'aetherist')"""
          if text.count(old_call) != 1:
              raise SystemExit('Expected exactly one recordMastery call.')
          path.write_text(text.replace(old_call, new_call))
          PY

          pnpm exec prettier --write \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/e2e/character-secondary-build.pw.ts
          pnpm --filter @aurevane/web exec eslint \
            src/components/character/character-discipline-build-panel.tsx \
            e2e/character-secondary-build.pw.ts \
            --max-warnings=0
          git diff --check

      - name: Commit durable fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/e2e/character-secondary-build.pw.ts
          git commit -m 'Harden P3.2 browser authority proof'
          git push origin HEAD:agent/p3-2-secondary-attunement
