name: P1.6 Ledger Patch

on:
  push:
    branches:
      - agent/ticket-1-6-wayfarers-practice
    paths:
      - .github/workflows/p1-6-ledger-patch.yml

permissions:
  contents: write

jobs:
  patch-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-1-6-wayfarers-practice
      - name: Update Phase 1 ledger and progression manual
        run: |
          python - <<'PY'
          from pathlib import Path

          tasks_path = Path('TASKS.md')
          text = tasks_path.read_text()
          text = text.replace(
              '**Stage:** Phase 1 — Character Foundation / P1.5 character-progression checkpoint',
              "**Stage:** Phase 1 — Character Foundation / P1.6 Wayfarer's Practice checkpoint",
              1,
          )
          text = text.replace('\n## ACTIVE\n\n### P1.5 — Level 1–100 XP Progression + Telemetry Foundation', '\n### P1.5 — Level 1–100 XP Progression + Telemetry Foundation', 1)
          old_release = '**Release rule:** do not merge P1.5 until the exact PR head passes quality/build/worker, full database/security regressions including the dedicated progression authority suite, responsive Chromium profile acceptance, and Vercel Preview.'
          new_release = '**Verification:** P1.5 passed its exact-head quality/build/worker, progression/database-security and responsive Chromium gates; PR #44 merged. Mobile release hardening followed through PR #46, and the owner production account/game/profile/sign-out smoke is green on the later verified production baseline.'
          if old_release not in text:
              raise SystemExit('Expected P1.5 release marker was not found.')
          text = text.replace(old_release, new_release, 1)

          next_marker = '\n## Next\n\nP1.6 — Wayfarer\'s Practice: Balanced Practice Foundation. Do not begin it until P1.5 is merged and its post-merge `main` release checks are green.\n'
          if next_marker not in text:
              raise SystemExit('Expected stale P1.6 Next marker was not found.')
          active = '''\n## ACTIVE\n\n### P1.6 — Wayfarer's Practice: Balanced Practice Foundation\n\nCanonical work is issue #48 / draft PR #51 / branch `agent/ticket-1-6-wayfarers-practice`.\n\nCurrent implementation scope includes:\n\n- one pure versioned deterministic Balanced Practice calculator with server-supplied timestamps, a short-reconnect threshold, full/reduced direct-XP windows, a multi-day direct bank cap, and bounded Rested Momentum accrual;\n- Phase 1 reward types restricted by construction to Character XP and Rested Momentum, with Discipline Mastery, story/quest/boss/Expedition/PvP/economy/Horizon/Rekindling/premium scope explicitly deferred;\n- private versioned Wayfarer configuration, per-character activity/accrual state, frozen Training Reports and append-only claim telemetry;\n- lazy first-return materialization with at most one pending report per character, no per-character background timers/jobs, no retroactive reward before the feature initializes, and no reward from short reconnect loops;\n- one service-role-only atomic `claim_training_report_v1` transaction reusing the P1.5 progression curve/resolver and XP-grant ledger while applying bounded Rested Momentum, marking the report claimed and advancing the claim boundary together;\n- durable replay/conflict idempotency, ownership validation, row locking and concurrent-claim safety;\n- authenticated server-only materialize/claim adapters and a thin claim route in which the browser supplies only character/report/idempotency identifiers, never authoritative timestamps or reward amounts;\n- a restrained responsive Training Report return card with Balanced Practice summary, credited duration, Character XP, Rested Momentum, cap explanation and retry-safe Claim training action;\n- authoritative post-claim refetch through the existing server-rendered `/game` flow rather than broadcasting mutable reward state;\n- spoiler-safe player guidance in `docs/player-manual/wayfarers-practice.md`;\n- dedicated local-Supabase authority coverage for private access, frozen reports, ownership denial, short reconnects, replay/conflict behavior, atomic Level/XP/Rested changes, Level-100 and Rested caps, provenance and concurrent claims;\n- desktop/laptop/mobile Playwright coverage for controlled absence → frozen report → refresh stability → keyboard claim → Level/XP refresh → no duplicate report.\n\n**Current verification:** exact-head quality/build/worker, the existing full database/security suite, the dedicated Wayfarer authority suite and responsive Chromium acceptance are green on the implementation branch. Production remains unchanged until the tested migration is merged and deliberately applied.\n\n## Next\n\nFinish PR #51 review and Vercel Preview verification, merge P1.6, apply the tested versioned Wayfarer migration to the correct production Supabase project, and complete post-merge production smoke before closing #48. Only then advance roadmap sequencing; Phase 2 — Tactical Combat Core is the next roadmap phase, but no Phase 2 implementation begins while P1.6 remains ACTIVE.\n'''
          text = text.replace(next_marker, active, 1)
          tasks_path.write_text(text)

          manual_path = Path('docs/player-manual/character-profile-and-stats.md')
          manual = manual_path.read_text()
          old_manual = "Wayfarer's Practice is a separate later Phase 1 return/catch-up system. When implemented, it may become one bounded authoritative XP source, but it does not change the rule that the browser never determines elapsed time or reward values."
          new_manual = "Wayfarer's Practice is a bounded Phase 1 return/catch-up XP source. Its Training Reports use server-controlled time and an authoritative atomic claim, so it does not change the rule that the browser never determines elapsed time, reward values, XP, or Level. See `wayfarers-practice.md` for the player-facing return loop and Rested Momentum foundation."
          if old_manual not in manual:
              raise SystemExit('Expected pre-P1.6 manual sentence was not found.')
          manual_path.write_text(manual.replace(old_manual, new_manual, 1))
          PY
      - name: Commit ledger update
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add TASKS.md docs/player-manual/character-profile-and-stats.md
          git commit -m "Update ledger and manual for active P1.6"
          git push origin HEAD:agent/ticket-1-6-wayfarers-practice
