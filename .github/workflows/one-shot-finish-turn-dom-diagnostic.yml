name: One-shot Finish Turn DOM diagnostic

on:
  push:
    branches:
      - agent/battle-input-responsive-consistency-v3
    paths:
      - .github/workflows/one-shot-finish-turn-dom-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium

      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime

      - name: Build web
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          api_url='http://127.0.0.1:54321'
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web build

      - name: Inject runner-only DOM diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/battle-self-action-quick-commit.pw.ts')
          text = path.read_text()
          needle = "  await expect(root).toHaveAttribute('data-finish-turn-hotkey-last-decision', 'handled-first')\n"
          insert = needle + "  console.log('finish-turn-dom-diagnostic', JSON.stringify(await root.evaluate((element) => {\n    const finish = element.querySelector<HTMLButtonElement>('button[data-battle-command=\\\"finish\\\"]')\n    const facing = element.querySelector<HTMLElement>('[data-unified-facing-pad=\\\"true\\\"]')\n    const notice = element.querySelector<HTMLElement>('[data-battle-notice=\\\"true\\\"]')\n    return {\n      finishActive: finish?.dataset.active ?? finish?.dataset.battleActive ?? null,\n      finishDisabled: finish?.disabled ?? null,\n      facingOpen: facing?.dataset.open ?? null,\n      facingDisplay: facing ? getComputedStyle(facing).display : null,\n      facingButtons: facing ? Array.from(facing.querySelectorAll<HTMLButtonElement>('button')).map((button) => ({ label: button.getAttribute('aria-label'), disabled: button.disabled })) : [],\n      notice: notice?.textContent ?? null,\n    }\n  })))\n"
          if needle not in text:
              raise SystemExit('diagnostic insertion point not found')
          path.write_text(text.replace(needle, insert, 1))
          PY

      - name: Run focused Finish Turn regression
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          api_url='http://127.0.0.1:54321'
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test \
            e2e/battle-self-action-quick-commit.pw.ts \
            --config=playwright.config.ts \
            --project=desktop-chromium \
            --grep="keeps desktop PvP Space-to-finish reliable"

      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup
