name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

jobs:
  pv1f-finalize:
    name: Finalize PV-1F wiring
    if: github.event_name == 'push' && github.ref_name == 'agent/pv-1f-character-hub-turn-budget' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PV-1F branch
        uses: actions/checkout@v4
        with:
          ref: agent/pv-1f-character-hub-turn-budget
          fetch-depth: 0

      - name: Apply wiring fix and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()

          old_log = '''      <BattleLogPanel
        battleSessionId={battle.battleSessionId}
        battleVersion={battle.battleVersion}
        open={overlay?.kind === 'log'}
        onClose={() => setOverlay(null)}
      />'''
          new_log = '''      <BattleLogPanel
        battleSessionId={battle.battleSessionId}
        battleVersion={battle.battleVersion}
        open={overlay?.kind === 'log'}
        onClose={() => setOverlay(null)}
        playerName={playerName}
      />'''
          if old_log not in text:
              raise SystemExit('BattleLogPanel wiring anchor not found')
          text = text.replace(old_log, new_log, 1)

          old_abort = '''      router.replace('/game/battle')
      router.refresh()'''
          if old_abort not in text:
              raise SystemExit('Abort navigation anchor not found')
          text = text.replace(old_abort, "      router.replace('/game/battle')", 1)
          path.write_text(text)
          PY

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/browser-smoke.yml > .github/workflows/browser-smoke.yml
          rm -f .github/workflows/pv1f-battle-wiring-fix.yml
          rm -f docs/.pv1f-battle-wiring-trigger

      - name: Commit clean source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: wire battle log identity and abort navigation'
          git push origin HEAD:agent/pv-1f-character-hub-turn-budget

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Verify worker boot
        run: pnpm --filter @aurevane/worker check:boot

      - name: Verify checks did not modify tracked source
        run: git diff --exit-code

  database:
    name: Database foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime

      - name: Rebuild database from migrations
        run: pnpm exec supabase db reset --local

      - name: Verify private schema permissions
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          privileges="$(docker exec "$db_container" psql -U postgres -d postgres -Atqc "select has_schema_privilege('anon','app_private','USAGE'), has_schema_privilege('authenticated','app_private','USAGE'), has_schema_privilege('service_role','app_private','USAGE');")"
          test "$privileges" = "f|f|t"

      - name: Verify player profile provisioning and privacy
        run: bash .github/scripts/verify-player-profile.sh

      - name: Verify character persistence and privacy
        run: bash .github/scripts/verify-character-persistence.sh

      - name: Verify character XP progression authority
        run: bash .github/scripts/verify-character-progression.sh

      - name: Verify transactional idempotency boundary
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"

          actor_key='user:00000000-0000-4000-8000-000000000003'
          idempotency_key='00000000-0000-4000-8000-000000000303'
          fingerprint='foundation.authority_probe:v1'

          first="$(docker exec "$db_container" psql -U postgres -d postgres -Atqc "set role service_role; select receipt_id::text || '|' || replayed::text from public.execute_foundation_authority_probe('$actor_key', '$idempotency_key', '$fingerprint');")"
          second="$(docker exec "$db_container" psql -U postgres -d postgres -Atqc "set role service_role; select receipt_id::text || '|' || replayed::text from public.execute_foundation_authority_probe('$actor_key', '$idempotency_key', '$fingerprint');")"

          first_receipt="${first%%|*}"
          second_receipt="${second%%|*}"
          first_replayed="${first##*|}"
          second_replayed="${second##*|}"

          test -n "$first_receipt"
          test "$first_receipt" = "$second_receipt"
          test "$first_replayed" = 'false'
          test "$second_replayed" = 'true'

          if docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "set role service_role; select * from public.execute_foundation_authority_probe('$actor_key', '$idempotency_key', 'foundation.authority_probe:different');"; then
            echo 'Expected conflicting idempotency fingerprint to fail.' >&2
            exit 1
          fi

          if docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "set role authenticated; select * from public.execute_foundation_authority_probe('user:browser', '00000000-0000-4000-8000-000000000304', '$fingerprint');"; then
            echo 'Expected authenticated browser role execution to be denied.' >&2
            exit 1
          fi

      - name: Verify authenticated web authority route
        shell: bash
        run: |
          set -euo pipefail

          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          test -n "${ANON_KEY:-}"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$server_key"

          api_url='http://127.0.0.1:54321'
          web_url='http://127.0.0.1:3000'
          email="f03-route-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          password='F03-route-auth-check-2026!'
          idempotency_key='00000000-0000-4000-8000-000000000305'

          signup_response="$(curl --fail-with-body --silent --show-error \
            --request POST "$api_url/auth/v1/signup" \
            --header "apikey: $ANON_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"$email\",\"password\":\"$password\"}")"
          printf '%s' "$signup_response" | jq -e '.user.id | strings | length > 0' >/dev/null

          cookie_header="$(
            F03_SUPABASE_URL="$api_url" \
            F03_SUPABASE_ANON_KEY="$ANON_KEY" \
            F03_EMAIL="$email" \
            F03_PASSWORD="$password" \
            pnpm --filter @aurevane/web exec node --input-type=module <<'NODE'
          import { createServerClient } from '@supabase/ssr'

          const cookieJar = new Map()
          const client = createServerClient(
            process.env.F03_SUPABASE_URL,
            process.env.F03_SUPABASE_ANON_KEY,
            {
              cookies: {
                getAll() {
                  return [...cookieJar].map(([name, value]) => ({ name, value }))
                },
                setAll(cookies) {
                  for (const { name, value } of cookies) {
                    cookieJar.set(name, value)
                  }
                },
              },
            },
          )

          const { error } = await client.auth.signInWithPassword({
            email: process.env.F03_EMAIL,
            password: process.env.F03_PASSWORD,
          })

          if (error) {
            process.exit(1)
          }

          process.stdout.write(
            [...cookieJar].map(([name, value]) => `${name}=${value}`).join('; '),
          )
          NODE
          )"
          test -n "$cookie_header"

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec next dev -H 127.0.0.1 -p 3000 \
            > /tmp/f03-web.log 2>&1 &
          web_pid=$!

          cleanup_web() {
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
          }
          trap cleanup_web EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent "$web_url/" >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            echo 'Local AUREVANE web server did not become ready.' >&2
            exit 1
          fi

          unauth_status="$(curl --silent --show-error \
            --output /tmp/f03-unauth.json \
            --write-out '%{http_code}' \
            --request POST "$web_url/api/foundation/authority-probe" \
            --header 'Content-Type: application/json' \
            --data "{\"idempotencyKey\":\"$idempotency_key\"}")"
          test "$unauth_status" = '401'
          jq -e '.error.code == "UNAUTHENTICATED"' /tmp/f03-unauth.json >/dev/null

          first_status="$(curl --silent --show-error \
            --output /tmp/f03-first.json \
            --write-out '%{http_code}' \
            --request POST "$web_url/api/foundation/authority-probe" \
            --header 'Content-Type: application/json' \
            --cookie "$cookie_header" \
            --data "{\"idempotencyKey\":\"$idempotency_key\"}")"
          test "$first_status" = '201'
          jq -e '.replayed == false and (.receiptId | strings | length > 0)' /tmp/f03-first.json >/dev/null
          first_receipt="$(jq -r '.receiptId' /tmp/f03-first.json)"

          replay_status="$(curl --silent --show-error \
            --output /tmp/f03-replay.json \
            --write-out '%{http_code}' \
            --request POST "$web_url/api/foundation/authority-probe" \
            --header 'Content-Type: application/json' \
            --cookie "$cookie_header" \
            --data "{\"idempotencyKey\":\"$idempotency_key\"}")"
          test "$replay_status" = '200'
          jq -e '.replayed == true' /tmp/f03-replay.json >/dev/null
          test "$(jq -r '.receiptId' /tmp/f03-replay.json)" = "$first_receipt"

          if grep -Fq "$server_key" /tmp/f03-web.log; then
            echo 'Server credential appeared in application logs.' >&2
            exit 1
          fi

      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup
