name: CI

on:
  push:
    branches:
      - "agent/a2-feedback-holistic"

permissions:
  contents: write

jobs:
  apply-single-dispatch-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout A2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/a2-feedback-holistic
          fetch-depth: 0
      - name: Collapse tile movement to one click handler
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()
          old = """                      onPointerDown={() => {
                        if (mode === 'move') handleTileClick(tile.position)
                      }}
                      onClick={(event) => {
                        if (mode !== 'move' || event.detail === 0) handleTileClick(tile.position)
                      }}
"""
          new = """                      onClick={() => handleTileClick(tile.position)}
"""
          if old not in text:
            raise SystemExit('expected dual movement dispatch block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Restore normal CI and commit clean fix
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/web/src/components/battle/battle-experience-v2.tsx
          git commit -m "fix: dispatch battle tile movement once"
          git push origin HEAD:agent/a2-feedback-holistic
