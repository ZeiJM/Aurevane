name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair_hotfix:
    if: ${{ github.head_ref == 'hotfix/post-prod-battle-pv-20260820' && !contains(github.event.pull_request.head.sha, '000000') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repair utility window helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/battle/battle-utility-windows.tsx')
          text = p.read_text()
          text = text.replace(
              "function lockWindowToCurrentRect(panel: HTMLElement) {\n  const rect = panel.getBoundingClientRect()\n  panelElement.style.left = `${rect.left}px`\n  panelElement.style.top = `${rect.top}px`\n  panelElement.style.width = `${rect.width}px`\n  panelElement.style.height = `${rect.height}px`\n  panel.style.right = 'auto'\n  panel.style.bottom = 'auto'\n  return rect\n}",
              "function lockWindowToCurrentRect(panel: HTMLElement) {\n  const rect = panel.getBoundingClientRect()\n  panel.style.left = `${rect.left}px`\n  panel.style.top = `${rect.top}px`\n  panel.style.width = `${rect.width}px`\n  panel.style.height = `${rect.height}px`\n  panel.style.right = 'auto'\n  panel.style.bottom = 'auto'\n  return rect\n}",
          )
          p.write_text(text)
          PY
      - name: Format repository
        run: pnpm format
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format and repair hotfix"
          git push origin HEAD:${{ github.head_ref }}
