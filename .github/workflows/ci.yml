name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  agent-repair:
    name: Apply branch repair
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[agent-repair]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/a3-ui-polish-followup
          fetch-depth: 0
      - name: Apply focused repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          battle = Path('apps/web/src/components/battle/pvp-battle-experience.tsx')
          text = battle.read_text()
          text, count = re.subn(
              r"\n  const tileByKey = useMemo\(\n    \(\) => new Map\(tactical\.tiles\.map\(\(tile\) => \[positionKey\(tile\.position\), tile\] as const\)\),\n    \[tactical\.tiles\],\n  \)\n",
              '\n', text, count=1,
          )
          if count != 1:
              raise SystemExit('tileByKey repair target not found')
          battle.write_text(text)

          modal = Path('apps/web/src/components/battle/pvp-lobby-modal.tsx')
          text = modal.read_text()
          text = text.replace(
              "  const startBattle = useCallback(async () => {\n    if (startLock.current || lobby.status !== 'waiting' || !lobby.readyToStart) return",
              "  const startBattle = useCallback(async (lobbyId: string) => {\n    if (startLock.current) return",
          )
          text = text.replace(
              "const response = await fetch(`/api/pvp/lobbies/${lobby.lobbyId}/start`, { method: 'POST' })",
              "const response = await fetch(`/api/pvp/lobbies/${lobbyId}/start`, { method: 'POST' })",
          )
          text = text.replace(
              "  }, [lobby.lobbyId, lobby.readyToStart, lobby.status, router])",
              "  }, [router])",
          )
          text = text.replace("    if (lobby.readyToStart) void startBattle()\n", "")
          text = text.replace(
              "  }, [lobby.battleSessionId, lobby.readyToStart, lobby.status, router, startBattle])",
              "  }, [lobby.battleSessionId, lobby.status, router])",
          )
          needle = """        if (body.lobby.status === 'cancelled') {
          setError('The lobby host closed this lobby.')
          window.clearInterval(timer)
          return
        }
        setLobby(body.lobby)
"""
          replacement = """        if (body.lobby.status === 'cancelled') {
          setError('The lobby host closed this lobby.')
          window.clearInterval(timer)
          return
        }
        if (body.lobby.status === 'active' && body.lobby.battleSessionId) {
          router.push(`/game/battle/${body.lobby.battleSessionId}`)
          window.clearInterval(timer)
          return
        }
        setLobby(body.lobby)
        if (body.lobby.readyToStart) void startBattle(body.lobby.lobbyId)
"""
          if needle not in text:
              raise SystemExit('lobby polling repair target not found')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              "  }, [lobby.lobbyId])",
              "  }, [lobby.lobbyId, router, startBattle])",
              1,
          )
          modal.write_text(text)

          for filename in ['apps/web/e2e/account-entry.pw.ts', 'apps/web/e2e/character-creation.pw.ts']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace("page.getByText('Purchase unlock · coming later', { exact: true })", "page.getByText('Additional character slot', { exact: true })")
              text = text.replace("page.getByText('Earn free · first Prestige Rebirth', { exact: true })", "page.getByText('Available later', { exact: true })")
              path.write_text(text)

          for filename in ['apps/web/e2e/a1-layout-fit.pw.ts', 'apps/web/e2e/wayfarers-practice.pw.ts']:
              path = Path(filename)
              text = path.read_text().replace("Choose a battle.", "Choose your arena.")
              path.write_text(text)

          path = Path('apps/web/e2e/wayfarers-practice.pw.ts')
          text = path.read_text()
          text = text.replace("  await expect(page.getByText('No mode selected')).toBeVisible()\n  await page.getByRole('button', { name: /AI Sparring/ }).click()\n", "  await expect(page.getByLabel('Battle mode')).toHaveValue('')\n  await page.getByLabel('Battle mode').selectOption('recruit-sparring')\n")
          path.write_text(text)

          for filename in ['apps/web/e2e/battle-experience.pw.ts', 'apps/web/e2e/battle-usability.pw.ts']:
              path = Path(filename)
              text = path.read_text()
              needle = "  await expect(page.getByRole('heading', { name: 'Choose your arena.' })).toBeVisible()\n"
              if needle in text and 'BATTLE_HALL_HEADING_DIAGNOSTIC' not in text:
                  diag = """  const battleHallHeading = page.getByRole('heading', { name: 'Choose your arena.' })
  console.log(
    'BATTLE_HALL_HEADING_DIAGNOSTIC',
    await battleHallHeading.evaluate((element) => {
      const style = window.getComputedStyle(element)
      const parent = element.parentElement ? window.getComputedStyle(element.parentElement) : null
      const rect = element.getBoundingClientRect()
      return {
        display: style.display,
        visibility: style.visibility,
        opacity: style.opacity,
        width: rect.width,
        height: rect.height,
        x: rect.x,
        y: rect.y,
        parentDisplay: parent?.display,
        parentVisibility: parent?.visibility,
        parentOpacity: parent?.opacity,
      }
    }),
  )
"""
                  text = text.replace(needle, diag + needle, 1)
              path.write_text(text)
          PY
      - name: Format repair
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm exec prettier --write \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.tsx \
            apps/web/e2e/account-entry.pw.ts \
            apps/web/e2e/character-creation.pw.ts \
            apps/web/e2e/a1-layout-fit.pw.ts \
            apps/web/e2e/wayfarers-practice.pw.ts \
            apps/web/e2e/battle-experience.pw.ts \
            apps/web/e2e/battle-usability.pw.ts
      - name: Commit repair
        run: |
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -- \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-lobby-modal.tsx \
            apps/web/e2e/account-entry.pw.ts \
            apps/web/e2e/character-creation.pw.ts \
            apps/web/e2e/a1-layout-fit.pw.ts \
            apps/web/e2e/wayfarers-practice.pw.ts \
            apps/web/e2e/battle-experience.pw.ts \
            apps/web/e2e/battle-usability.pw.ts
          git commit -m 'fix: finish PvP lint repair and browser expectations [agent-repair]'
          git push origin HEAD:agent/a3-ui-polish-followup

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Verify worker boot
        run: pnpm --filter @aurevane/worker check:boot

      - name: Verify checks did not modify tracked source
        run: git diff --exit-code

  database:
    name: Database foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime

      - name: Rebuild database from migrations
        run: pnpm exec supabase db reset --local

      - name: Verify private schema permissions
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          privileges="$(docker exec "$db_container" psql -U postgres -d postgres -Atqc "select has_schema_privilege('anon','app_private','USAGE'), has_schema_privilege('authenticated','app_private','USAGE'), has_schema_privilege('service_role','app_private','USAGE');")"
          test "$privileges" = "f|f|t"

      - name: Verify player profile provisioning and privacy
        run: bash .github/scripts/verify-player-profile.sh

      - name: Verify character persistence and privacy
        run: bash .github/scripts/verify-character-persistence.sh

      - name: Verify PV-1F character deletion lifecycle
        run: bash .github/scripts/verify-pv1f-character-deletion.sh

      - name: Verify character XP progression authority
        run: bash .github/scripts/verify-character-progression.sh

      - name: Verify transactional idempotency boundary
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"

          actor_key='user:00000000-0000-4000-8000-000000000003'
          idempotency_key='00000000-0000-4000-8000-000000000303'
          fingerprint='foundation.authority_probe:v1'

          first="$(docker exec "$db_container" psql -U postgres -d postgres -Atqc "set role service_role; select receipt_id::text || '|' || replayed::text from public.execute_foundation_authority_probe('$actor_key', '$idempotency_key', '$fingerprint');")"
          second="$(docker exec "$db_container" psql -U postgres -d postgres -Atqc "set role service_role; select receipt_id::text || '|' || replayed::text from public.execute_foundation_authority_probe('$actor_key', '$idempotency_key', '$fingerprint');")"

          first_receipt="${first%%|*}"
          second_receipt="${second%%|*}"
          first_replayed="${first##*|}"
          second_replayed="${second##*|}"

          test -n "$first_receipt"
          test "$first_receipt" = "$second_receipt"
          test "$first_replayed" = 'false'
          test "$second_replayed" = 'true'

          if docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "set role service_role; select * from public.execute_foundation_authority_probe('$actor_key', '$idempotency_key', 'foundation.authority_probe:different');"; then
            echo 'Expected conflicting idempotency fingerprint to fail.' >&2
            exit 1
          fi

          if docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "set role authenticated; select * from public.execute_foundation_authority_probe('user:browser', '00000000-0000-4000-8000-000000000304', '$fingerprint');"; then
            echo 'Expected authenticated browser role execution to be denied.' >&2
            exit 1
          fi

      - name: Verify authenticated web authority route
        shell: bash
        run: |
          set -euo pipefail

          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          test -n "${ANON_KEY:-}"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$server_key"

          api_url='http://127.0.0.1:54321'
          web_url='http://127.0.0.1:3000'
          email="f03-route-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          password='F03-route-auth-check-2026!'
          idempotency_key='00000000-0000-4000-8000-000000000305'

          signup_response="$(curl --fail-with-body --silent --show-error \
            --request POST "$api_url/auth/v1/signup" \
            --header "apikey: $ANON_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"$email\",\"password\":\"$password\"}")"
          printf '%s' "$signup_response" | jq -e '.user.id | strings | length > 0' >/dev/null

          cookie_header="$(
            F03_SUPABASE_URL="$api_url" \
            F03_SUPABASE_ANON_KEY="$ANON_KEY" \
            F03_EMAIL="$email" \
            F03_PASSWORD="$password" \
            pnpm --filter @aurevane/web exec node --input-type=module <<'NODE'
          import { createServerClient } from '@supabase/ssr'

          const cookieJar = new Map()
          const client = createServerClient(
            process.env.F03_SUPABASE_URL,
            process.env.F03_SUPABASE_ANON_KEY,
            {
              cookies: {
                getAll() {
                  return [...cookieJar].map(([name, value]) => ({ name, value }))
                },
                setAll(cookies) {
                  for (const { name, value } of cookies) {
                    cookieJar.set(name, value)
                  }
                },
              },
            },
          )

          const { error } = await client.auth.signInWithPassword({
            email: process.env.F03_EMAIL,
            password: process.env.F03_PASSWORD,
          })

          if (error) {
            process.exit(1)
          }

          process.stdout.write(
            [...cookieJar].map(([name, value]) => `${name}=${value}`).join('; '),
          )
          NODE
          )"
          test -n "$cookie_header"

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec next dev -H 127.0.0.1 -p 3000 \
            > /tmp/f03-web.log 2>&1 &
          web_pid=$!

          cleanup_web() {
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
          }
          trap cleanup_web EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent "$web_url/" >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            echo 'Local AUREVANE web server did not become ready.' >&2
            exit 1
          fi

          unauth_status="$(curl --silent --show-error \
            --output /tmp/f03-unauth.json \
            --write-out '%{http_code}' \
            --request POST "$web_url/api/foundation/authority-probe" \
            --header 'Content-Type: application/json' \
            --data "{\"idempotencyKey\":\"$idempotency_key\"}")"
          test "$unauth_status" = '401'
          jq -e '.error.code == "UNAUTHENTICATED"' /tmp/f03-unauth.json >/dev/null

          first_status="$(curl --silent --show-error \
            --output /tmp/f03-first.json \
            --write-out '%{http_code}' \
            --request POST "$web_url/api/foundation/authority-probe" \
            --header 'Content-Type: application/json' \
            --cookie "$cookie_header" \
            --data "{\"idempotencyKey\":\"$idempotency_key\"}")"
          test "$first_status" = '201'
          jq -e '.replayed == false and (.receiptId | strings | length > 0)' /tmp/f03-first.json >/dev/null
          first_receipt="$(jq -r '.receiptId' /tmp/f03-first.json)"

          replay_status="$(curl --silent --show-error \
            --output /tmp/f03-replay.json \
            --write-out '%{http_code}' \
            --request POST "$web_url/api/foundation/authority-probe" \
            --header 'Content-Type: application/json' \
            --cookie "$cookie_header" \
            --data "{\"idempotencyKey\":\"$idempotency_key\"}")"
          test "$replay_status" = '200'
          jq -e '.replayed == true' /tmp/f03-replay.json >/dev/null
          test "$(jq -r '.receiptId' /tmp/f03-replay.json)" = "$first_receipt"

          if grep -Fq "$server_key" /tmp/f03-web.log; then
            echo 'Server credential appeared in application logs.' >&2
            exit 1
          fi

      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup
