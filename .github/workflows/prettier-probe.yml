name: Prettier probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx \
            apps/web/src/components/battle/battle-log-panel.tsx
          git diff -- \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx \
            apps/web/src/components/battle/battle-log-panel.tsx
