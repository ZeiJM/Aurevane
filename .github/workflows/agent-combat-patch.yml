name: Agent combat patch

on:
  push:
    branches:
      - agent/combat-effect-taxonomy-rework
    paths:
      - .github/agent-combat-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/combat-effect-taxonomy-rework
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Task 2 runtime patch
        run: python .github/scripts/apply-agent-combat-patch.py

      - name: Format changed TypeScript
        run: pnpm exec prettier --write packages/game-core/src/combat/actions.ts packages/game-core/src/combat/combat-authoring-validation.ts

      - name: Run focused Task 2 tests
        run: pnpm --filter @aurevane/game-core test -- combat-displacement-tempo-rework.test.ts

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/game-core/src/combat/actions.ts packages/game-core/src/combat/combat-authoring-validation.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement variable displacement and tempo movement"
          git push origin HEAD:agent/combat-effect-taxonomy-rework
