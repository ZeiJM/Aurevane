name: Verify combat runtime batch

on:
  push:
    branches:
      - agent/combat-effect-taxonomy-rework
    paths:
      - .github/workflows/agent-combat-patch.yml
      - .github/agent-combat-patch-trigger

permissions:
  contents: write

concurrency:
  group: combat-runtime-batch
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/agent/combat-effect-taxonomy-rework'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact locally verified batch
        run: python .github/scripts/apply-agent-combat-patch.py

      - name: Run all repository quality gates
        run: pnpm check

      - name: Verify checks did not alter source
        run: |
          git diff --exit-code
          git diff --cached --check

      - name: Commit verified batch without touching main
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=agent/combat-effect-taxonomy-rework
          git fetch origin "$branch" main
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor origin/main HEAD
          git rm .github/combat-batch.part1 .github/combat-batch.part2 .github/combat-batch.part3 .github/scripts/apply-agent-combat-patch.py .github/agent-combat-patch-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finish displacement tempo and scheduled recovery runtime'
          git push origin "HEAD:refs/heads/$branch"
          echo "Verified implementation commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
