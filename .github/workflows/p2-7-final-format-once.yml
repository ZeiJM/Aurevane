name: P2.7 final format once

on:
  push:
    branches:
      - "agent/p2-7-combat-usability-battlefield-proof"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[p2.7-final-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p2-7-combat-usability-battlefield-proof
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact CI failures
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-log-panel.tsx \
            packages/game-core/src/combat/recruit-ai-scale.test.ts \
            packages/game-core/src/combat/tactical-hall-records.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-log-panel.tsx \
            packages/game-core/src/combat/recruit-ai-scale.test.ts \
            packages/game-core/src/combat/tactical-hall-records.ts
          git commit -m 'P2.7 format final validation files [p2.7-final-format]'
          git push origin HEAD:agent/p2-7-combat-usability-battlefield-proof
