name: One-shot account deletion lint fix

on:
  push:
    branches:
      - agent/account-deletion-grace-period

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-deletion-grace-period
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove redundant prop-sync effect
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/character/character-select-shell.tsx')
          text = path.read_text()
          block = "\n  useEffect(() => {\n    setAccountDeletionState(accountDeletion)\n  }, [accountDeletion])\n"
          if block not in text:
              raise SystemExit('Expected account deletion prop-sync effect was not found.')
          path.write_text(text.replace(block, '', 1))
          PY
          pnpm exec prettier --write apps/web/src/components/character/character-select-shell.tsx
      - name: Commit lint fix
        run: |
          git config user.name "AUREVANE Format Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/character/character-select-shell.tsx
          git commit -m "Fix account deletion state synchronization"
          git push origin HEAD:agent/account-deletion-grace-period
