name: CSR3 commit privacy patch

on:
  push:
    branches:
      - agent/csr3-history-privacy-integration-20260917
    paths:
      - tools/apply_csr3_commit_privacy.py
      - .github/workflows/csr3-commit-privacy-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/csr3-history-privacy-integration-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Apply bounded patch
        run: python tools/apply_csr3_commit_privacy.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched battle services
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/ai-battle-quality-service.ts \
            apps/web/src/server/battle/ai-battle-surrender-service.ts \
            apps/web/src/server/battle/battle-abort-service.ts \
            apps/web/src/server/battle/battle-final-turn-service.ts \
            apps/web/src/server/battle/battle-recruit-ai-service.ts \
            apps/web/src/server/battle/battle-session-service.ts \
            apps/web/src/server/battle/guided-training-completion-service.ts \
            apps/web/src/server/battle/pvp-battle-quality-service.ts
      - name: Prove production workspace type/build boundary
        run: pnpm build
      - name: Verify diff
        run: git diff --check
      - name: Commit bounded implementation
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add \
            apps/web/src/server/battle/ai-battle-quality-service.ts \
            apps/web/src/server/battle/ai-battle-surrender-service.ts \
            apps/web/src/server/battle/battle-abort-service.ts \
            apps/web/src/server/battle/battle-final-turn-service.ts \
            apps/web/src/server/battle/battle-recruit-ai-service.ts \
            apps/web/src/server/battle/battle-session-service.ts \
            apps/web/src/server/battle/guided-training-completion-service.ts \
            apps/web/src/server/battle/pvp-battle-quality-service.ts
          git commit -m "feat(combat): wire CSR-3 commit privacy metadata"
          git push origin HEAD:agent/csr3-history-privacy-integration-20260917
