name: Atlas documentation maintenance

on:
  push:
    branches:
      - 'agent/phase4-discipline-atlas-mastery'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-discipline-atlas-mastery
          fetch-depth: 0
      - name: Synchronize roadmap, Phase-4 ledger and Manual wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          roadmap = 'docs/ROADMAP.md'
          replace(roadmap, '**Synchronized:** 2026-09-11', '**Synchronized:** 2026-09-12')
          replace(
              roadmap,
              '| Phase 4 | Sixteen-Discipline implementation and media integration live; human acceptance open | PR #451 released at `7a539581`; 128 Skills, 16 Essences, 120 Resonances, named effects and Mastery Trials. All 15 CI workflows passed; exact migration verified. See `PHASE_4_TICKETS.md`. |',
              '| Phase 4 | Active — published roster, Discipline Atlas/Mastery and media integration; human acceptance open | The live sixteen-Discipline baseline is preserved while the approved 36-identity Atlas, earned Mastery, Rekindling gates and separated testing entitlement are implemented. Published roster count follows the authoritative live catalog. See `PHASE_4_TICKETS.md` and `ROADMAP_DISCIPLINE_ATLAS_MASTERY.md`. |',
          )
          replace(
              roadmap,
              '- complete and verify the Owner\'s final responsive UI/typography corrections;\n- preserve the delivered P3.1–P3.8 build authority, pure/mixed identities, cooldowns and shared committed snapshots;',
              '- complete and verify the active Phase-4 roster/Atlas/Mastery extension, including Profile and Manual presentation;\n- preserve the delivered P3.1–P3.8 build authority, pure/mixed identities, cooldowns and shared committed snapshots;\n- keep testing entitlement separate from earned Mastery so every published Discipline remains testable without pre-mastering release characters;',
          )
          replace(
              roadmap,
              '- activating Phase-4 roster expansion before the separate Owner start command;\n- Vercel deployment unless separately authorized by the Owner.',
              '- making a planned/unpublished Atlas identity selectable before its authoritative Discipline content is published;\n- treating temporary testing access as earned Mastery or as satisfaction of eventual release requirements;\n- Vercel deployment unless separately authorized by the Owner.',
          )

          tickets = 'docs/PHASE_4_TICKETS.md'
          replace(
              tickets,
              'The sixteen-Discipline playable implementation is live through PR #451, the self-target correction through #452, and ten painted identities plus 72 synthesized cue variants through #454. P4.1–P4.6 engineering, media integration and the production migration are delivered for Owner testing. Independent human visual/listening and tactical acceptance remains open. Earlier milestone evidence below is historical.',
              'The sixteen-Discipline playable baseline is live through PR #451, the self-target correction through #452, and ten painted identities plus 72 synthesized cue variants through #454. Phase 4 now also owns the approved 36-identity Discipline Atlas/Mastery extension in `ROADMAP_DISCIPLINE_ATLAS_MASTERY.md`: published content may continue expanding during testing, while planned identities remain non-selectable until their authoritative combat libraries exist. Independent human visual/listening and tactical acceptance remains open. Earlier milestone evidence below is historical.',
          )
          replace(
              tickets,
              'The acquisition boundary is inherited Foundation provisioning on active Discipline change, with durable learned facts. Secondary still requires server-owned mastery. The private PV-2 preparation path is testing only. Final world-based acquisition and mastery routes are not claimed by this content release.',
              'The acquisition boundary is server-authoritative. During the active development-testing policy, every published Primary and Secondary is available without converting that temporary entitlement into earned Mastery. With testing closed, authored mastery/Rekindling requirements resume as the real gates. Planned/unpublished Disciplines remain unavailable in either mode. Final world/story acquisition routes beyond the implemented Mastery/Atlas foundation remain later work.',
          )
          replace(
              tickets,
              "Testing-access compatibility: the existing Owner-authorized `active-player-discipline-testing:v1` triggers grant mastery for enabled Disciplines to current and new player characters. This continuation preserves those grants, including the ten newly enabled Disciplines, so players can test the complete libraries and pairs immediately. Earned progression remains implemented; isolated database fixtures remove only their own temporary support facts inside a rolled-back transaction to prove normal prerequisites and 4/2/2 learning. Existing production masteries are never deleted to manufacture that evidence.",
              "Testing-access compatibility: temporary testing entitlement is now a separate server-owned policy rather than a Mastery fact. While `testing_open` is active, every published Discipline remains selectable as Primary/Secondary and its published library is available for testing; earned XP/stage, release prerequisites and Mastery history remain independent. Isolated database fixtures close the policy inside rolled-back transactions to prove normal prerequisites and 4/2/2 learning. The final release transition must disable the testing policy and normalize temporary testing-only Skill unlocks before release gates are considered live.",
          )

          manual = 'apps/web/src/content/current-manual.ts'
          text = Path(manual).read_text()
          text = text.replace("lastUpdated: '2026-09-11',", "lastUpdated: '2026-09-12',", 2)
          old = "Primary/Secondary build configuration, representative Resonances and Essences, direct PvP and spectation are already testable. The wider roster, final acquisition and Mastery progression, exploration, co-op missions, Expeditions, ranked matchmaking, trading and the persistent world remain later work."
          new = "Primary/Secondary build configuration, the published Discipline roster, Mastery Trials, the Discipline Atlas, Resonances and Essences, direct PvP and spectation are already testable. The remaining planned Discipline libraries, final world/story acquisition routes, later Rekindling content, exploration, co-op missions, Expeditions, ranked matchmaking, trading and the persistent world remain later work."
          if old not in text:
              raise SystemExit('Start Here larger-game paragraph not found')
          text = text.replace(old, new, 1)
          old = "The starting choices are Vanguard, Farstrider, Shadehand, Ironfist, Aetherist and Lifebinder. Profile supports Primary and optional Secondary configuration. The six Foundations and ten advanced Disciplines each have eight learnable Techniques and a pure Essence. All 120 pairs across the sixteen Disciplines have Resonance coverage. Technique cards show targeting and effect tags; expand Skill details for range, effects and requirements. Mastery Trials unlock advanced Disciplines through their listed prerequisites. During the current testing period, existing system-granted Mastery access lets players try all active Disciplines immediately. Supernatural paths and world-based acquisition remain later work."
          new = "The starting choices are Vanguard, Farstrider, Shadehand, Ironfist, Aetherist and Lifebinder. Profile supports Primary and optional Secondary configuration. Published mature Disciplines have eight learnable Techniques and a pure Essence, with mixed pairs receiving authored Resonances as their content is published. Technique cards show targeting and effect tags; expand Skill details for range, effects and requirements. Mastery Trials and the Discipline Atlas track the eventual acquisition paths. During development testing, a separate server-owned testing entitlement keeps every published Discipline available without counting that access as earned Mastery or satisfying its release requirements. Planned Disciplines remain unavailable until their combat content is actually published. Supernatural paths and later world-based acquisition remain later work."
          if old not in text:
              raise SystemExit('Character Creation testing paragraph not found')
          Path(manual).write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Format changed Manual source
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/src/content/current-manual.ts
      - name: Commit synchronization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/PHASE_4_TICKETS.md apps/web/src/content/current-manual.ts
          git commit -m 'Synchronize Phase 4 Atlas roadmap and Manual'
          git push origin HEAD:agent/phase4-discipline-atlas-mastery
