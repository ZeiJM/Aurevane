name: Generate Phase 4 rebalance migration

on:
  push:
    branches:
      - agent/phase4-rebalance-migration-helper-20260918

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Discover Supabase CLI
        run: pnpm exec supabase --help >/dev/null
      - name: Generate migration
        run: pnpm exec supabase migration new phase4_discipline_rebalance_activation
      - name: Commit migration shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate Phase 4 rebalance migration"
          git push
