name: P3.5 Tuple Fixture Fix

on:
  push:
    branches:
      - 'agent/p3-5-closeout-corrections'
    paths:
      - '.github/workflows/p35-fixture-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-5-closeout-corrections
      - name: Apply exact tuple typing fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/server/character/character-build-service.test.ts')
          text = path.read_text()
          old = """              resonanceId: 'resonance.lifebinder-vanguard.mercys-edge',
              contentVersion: 1,
              disciplinePair: ['lifebinder', 'vanguard'],
"""
          new = """              resonanceId: 'resonance.lifebinder-vanguard.mercys-edge',
              contentVersion: 1,
              disciplinePair: ['lifebinder', 'vanguard'] as const,
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one exact fixture match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- apps/web/src/server/character/character-build-service.test.ts
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/server/character/character-build-service.test.ts
          git commit -m 'test: preserve Resonance discipline-pair tuple type'
          git push origin HEAD:agent/p3-5-closeout-corrections
