name: Atlas contract maintenance

# One-shot branch maintenance. The bot follow-up push is ignored by the job guard.
on:
  push:
    branches:
      - 'agent/phase4-discipline-atlas-mastery'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-discipline-atlas-mastery
          fetch-depth: 0

      - name: Apply source and authority fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected contract snippet not found in {path}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'packages/game-core/src/character/discipline-atlas.ts',
              """  const releaseEligible = evaluateRule(discipline.unlock, context)\n  const effectiveSelectable =\n    discipline.publication === 'published' && (testingAccess || releaseEligible)\n""",
              """  const releaseEligible = evaluateRule(discipline.unlock, context)\n""",
          )

          old_p36 = """testing_mastery=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select discipline_id || '|' || mastered_definition_version::text || '|' || source_kind || '|' || source_id\n  from app_private.character_discipline_masteries\n  where character_id = '$character_id'::uuid\n    and discipline_id = 'lifebinder';\")\"\ntest \"$testing_mastery\" = 'lifebinder|1|support|active-player-discipline-testing:v1'\n\nmastery_replay=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  set role service_role;\n  select discipline_id || '|' || mastered_definition_version::text || '|' || replayed::text\n  from public.record_character_discipline_mastery_v1(\n    '$character_id'::uuid,\n    'lifebinder',\n    'system',\n    'p36.database-proof'\n  );\")\"\ntest \"$mastery_replay\" = 'lifebinder|1|true'\n"""
          new_p36 = """testing_mastery_count=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select count(*)::text\n  from app_private.character_discipline_masteries\n  where character_id = '$character_id'::uuid\n    and discipline_id = 'lifebinder';\")\"\ntest \"$testing_mastery_count\" = '0'\n\ntesting_policy=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select app_private.discipline_testing_open_v1()::text;\")\"\ntest \"$testing_policy\" = 'true'\n"""
          replace('.github/scripts/verify-p36-essence.sh', old_p36, new_p36)

          old_p37 = """testing_mastery=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select discipline_id || '|' || mastered_definition_version::text || '|' || source_kind || '|' || source_id\n  from app_private.character_discipline_masteries\n  where character_id = '$character_id'::uuid\n    and discipline_id = 'lifebinder';\")\"\ntest \"$testing_mastery\" = 'lifebinder|1|support|active-player-discipline-testing:v1'\n\nmastery_replay=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  set role service_role;\n  select discipline_id || '|' || replayed::text\n  from public.record_character_discipline_mastery_v1(\n    '$character_id'::uuid,\n    'lifebinder',\n    'system',\n    'p37.database-proof'\n  );\")\"\ntest \"$mastery_replay\" = 'lifebinder|true'\n"""
          new_p37 = """testing_mastery_count=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select count(*)::text\n  from app_private.character_discipline_masteries\n  where character_id = '$character_id'::uuid\n    and discipline_id = 'lifebinder';\")\"\ntest \"$testing_mastery_count\" = '0'\n\ntesting_policy=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select app_private.discipline_testing_open_v1()::text;\")\"\ntest \"$testing_policy\" = 'true'\n"""
          replace('.github/scripts/verify-p37-saved-build-loadouts.sh', old_p37, new_p37)

          old_p38 = """testing_mastery=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select discipline_id || '|' || mastered_definition_version::text || '|' || source_kind || '|' || source_id\n  from app_private.character_discipline_masteries\n  where character_id = '$character_id'::uuid\n    and discipline_id = 'lifebinder';\")\"\ntest \"$testing_mastery\" = 'lifebinder|1|support|active-player-discipline-testing:v1'\n\nmastery_replay=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  set role service_role;\n  select discipline_id || '|' || replayed::text\n  from public.record_character_discipline_mastery_v1(\n    '$character_id'::uuid,\n    'lifebinder',\n    'support',\n    'pv2-buildcraft-test-kit:v1'\n  );\")\"\ntest \"$mastery_replay\" = 'lifebinder|true'\n"""
          new_p38 = """testing_mastery_count=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select count(*)::text\n  from app_private.character_discipline_masteries\n  where character_id = '$character_id'::uuid\n    and discipline_id = 'lifebinder';\")\"\ntest \"$testing_mastery_count\" = '0'\n\ntesting_policy=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\n  select app_private.discipline_testing_open_v1()::text;\")\"\ntest \"$testing_policy\" = 'true'\n"""
          replace('.github/scripts/verify-p38-representative-buildcraft.sh', old_p38, new_p38)

          replace(
              '.github/scripts/verify-p4-mastery.sh',
              """test -n \"$character_id\"\n# Private committed-event fixtures exercise the database reward authority. They are\n""",
              """test -n \"$character_id\"\n\ntesting_projection=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\nset role service_role;\nselect release_unlocked::text || '|' || effective_unlocked::text || '|' || testing_access::text\nfrom public.get_character_discipline_atlas_progress_v1('$user_id'::uuid,'$character_id'::uuid)\nwhere discipline_id='bastion';\")\"\ntest \"$testing_projection\" = 'false|true|true'\n\nlegacy_testing_mastery=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\nselect count(*)::text from app_private.character_discipline_masteries\nwhere character_id='$character_id'::uuid\n  and source_kind='support'\n  and source_id='active-player-discipline-testing:v1';\")\"\ntest \"$legacy_testing_mastery\" = '0'\n\nplanned_selectable=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"\nselect app_private.discipline_unlocked_v1('$character_id'::uuid,'spellwright')::text;\")\"\ntest \"$planned_selectable\" = 'false'\n\n# Private committed-event fixtures exercise the database reward authority. They are\n""",
          )

          replace(
              '.github/scripts/verify-p4-mastery.sh',
              """ -- Remove only this disposable fixture's pre-existing Owner-authorized testing grants.\n -- Production testing access is preserved; this transaction rolls back.\n delete from app_private.character_discipline_masteries where character_id=c;\n update app_private.character_discipline_progress set mastery_xp=0,demonstrated_skills='{}' where character_id=c;\n""",
              """ -- Close only this disposable fixture's testing overlay so the release prerequisite graph is\n -- exercised directly. The outer transaction rolls the policy change back.\n update app_private.discipline_unlock_policy_state\n set testing_open=false,updated_at=clock_timestamp()\n where singleton;\n delete from app_private.character_discipline_masteries where character_id=c;\n update app_private.character_discipline_progress set mastery_xp=0,demonstrated_skills='{}' where character_id=c;\n""",
          )

          replace(
              '.github/scripts/verify-p4-mastery.sh',
              """rollback;\nSQL\necho 'Phase 4 Mastery prerequisites, persisted-event rewards, retries, milestones and browser denial PASS.'\n""",
              """rollback;\nSQL\npost_trial_testing_policy=\"$(docker exec \"$db_container\" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc \"select app_private.discipline_testing_open_v1()::text;\")\"\ntest \"$post_trial_testing_policy\" = 'true'\necho 'Phase 4 Mastery prerequisites, testing separation, persisted-event rewards, retries, milestones and browser denial PASS.'\n""",
          )

          migration = Path('supabase/migrations/20260912070000_discipline_atlas_testing_separation.sql')
          text = migration.read_text()
          policy_comment = """comment on table app_private.discipline_unlock_policy_state is\n  'Server-owned Discipline acquisition policy. testing_open grants effective access to published Disciplines without creating Mastery facts or earned Mastery XP.';\n"""
          rekindling_block = """\ncreate table if not exists app_private.discipline_rekindling_prerequisites (\n  discipline_id text primary key,\n  minimum_rekindling_count integer not null check (minimum_rekindling_count between 1 and 3)\n);\n\nrevoke all on table app_private.discipline_rekindling_prerequisites from public, anon, authenticated;\ngrant select on table app_private.discipline_rekindling_prerequisites to service_role;\n\ninsert into app_private.discipline_rekindling_prerequisites (discipline_id, minimum_rekindling_count)\nvalues\n  ('blade-saint', 1),\n  ('warcaller', 1),\n  ('chronist', 1),\n  ('riftwalker', 1),\n  ('gravebinder', 1),\n  ('eidolist', 1),\n  ('oracle', 1),\n  ('sanguinist', 1),\n  ('starcaller', 2),\n  ('spellwright', 3)\non conflict (discipline_id) do update\nset minimum_rekindling_count = excluded.minimum_rekindling_count;\n\ncomment on table app_private.discipline_rekindling_prerequisites is\n  'Server-owned minimum completed-Rekindling gates for published Discipline acquisition. Planned identities may be pre-registered safely; publication remains a separate definition gate.';\n"""
          if 'discipline_rekindling_prerequisites' not in text:
              if policy_comment not in text:
                  raise SystemExit('Testing policy comment anchor missing')
              text = text.replace(policy_comment, policy_comment + rekindling_block, 1)

          old_release = """as $$\n  select not exists (\n    select 1\n    from app_private.discipline_mastery_prerequisites requirement\n    where requirement.discipline_id = p_discipline_id\n      and app_private.discipline_mastery_stage_v1(\n        p_character_id,\n        requirement.required_discipline_id\n      ) < requirement.minimum_stage\n  );\n$$;\n"""
          new_release = """as $$\n  select exists (\n    select 1 from public.characters character where character.id = p_character_id\n  )\n  and not exists (\n    select 1\n    from app_private.discipline_mastery_prerequisites requirement\n    where requirement.discipline_id = p_discipline_id\n      and app_private.discipline_mastery_stage_v1(\n        p_character_id,\n        requirement.required_discipline_id\n      ) < requirement.minimum_stage\n  )\n  and not exists (\n    select 1\n    from app_private.discipline_rekindling_prerequisites requirement\n    join public.characters character on character.id = p_character_id\n    where requirement.discipline_id = p_discipline_id\n      and greatest(character.progression_cycle - 1, 0) < requirement.minimum_rekindling_count\n  );\n$$;\n"""
          if old_release in text:
              text = text.replace(old_release, new_release, 1)

          old_effective = """as $$\n  select (\n    app_private.discipline_testing_open_v1()\n    and exists (\n      select 1\n      from app_private.discipline_definitions definition\n      where definition.discipline_id = p_discipline_id\n        and definition.enabled_for_primary\n    )\n  ) or app_private.discipline_release_unlocked_v1(p_character_id, p_discipline_id);\n$$;\n"""
          new_effective = """as $$\n  select exists (\n    select 1\n    from app_private.discipline_definitions definition\n    where definition.discipline_id = p_discipline_id\n      and definition.enabled_for_primary\n  )\n  and (\n    app_private.discipline_testing_open_v1()\n    or app_private.discipline_release_unlocked_v1(p_character_id, p_discipline_id)\n  );\n$$;\n"""
          if old_effective in text:
              text = text.replace(old_effective, new_effective, 1)
          migration.write_text(text)

          master = Path('docs/GAME_MASTER_PLAN.md')
          text = master.read_text()
          authority_anchor = """Additional authoritative detail lives in docs/GAME_MASTER_PLAN_BUILD_SYSTEM_ADDENDUM.md. If an older subordinate document still uses retired terminology, this master plan and the owner-approved build-system addendum control.\n"""
          atlas_sync = """\nThe Owner-approved `docs/GAME_MASTER_PLAN_DISCIPLINE_ATLAS_MASTERY_ADDENDUM.md` is incorporated into this synchronization for Discipline discovery, acquisition, Mastery and Rekindling gates. Where the original Discipline-list requirement lines conflict with that addendum's approved long-horizon Atlas map, the Atlas addendum controls acquisition sequencing while this Master Plan continues to control Discipline identity and overall product direction.\n"""
          if 'DISCIPLINE_ATLAS_MASTERY_ADDENDUM.md` is incorporated into this synchronization' not in text:
              if authority_anchor not in text:
                  raise SystemExit('Master Plan authority anchor missing')
              text = text.replace(authority_anchor, authority_anchor + atlas_sync, 1)
          master.write_text(text)
          PY

          git diff --check

      - name: Commit source and authority fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/game-core/src/character/discipline-atlas.ts \
            .github/scripts/verify-p36-essence.sh \
            .github/scripts/verify-p37-saved-build-loadouts.sh \
            .github/scripts/verify-p38-representative-buildcraft.sh \
            .github/scripts/verify-p4-mastery.sh \
            supabase/migrations/20260912070000_discipline_atlas_testing_separation.sql \
            docs/GAME_MASTER_PLAN.md
          git commit -m 'Harden Discipline testing and release acquisition contracts'
          git push origin HEAD:agent/phase4-discipline-atlas-mastery
