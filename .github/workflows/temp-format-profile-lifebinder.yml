name: Temporary focused formatter

on:
  pull_request:
    paths:
      - 'packages/game-core/src/combat/mature-skills.ts'
      - 'packages/game-core/src/combat/lifebinder-offense-skills.test.ts'
      - 'apps/web/src/components/battle/battle-skill-presentation.ts'
      - 'apps/web/src/components/character/character-profile-details-compact.module.css'
      - '.github/workflows/temp-format-profile-lifebinder.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply focused Prettier formatting
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/mature-skills.ts \
            packages/game-core/src/combat/lifebinder-offense-skills.test.ts \
            apps/web/src/components/battle/battle-skill-presentation.ts \
            apps/web/src/components/character/character-profile-details-compact.module.css
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              packages/game-core/src/combat/mature-skills.ts \
              packages/game-core/src/combat/lifebinder-offense-skills.test.ts \
              apps/web/src/components/battle/battle-skill-presentation.ts \
              apps/web/src/components/character/character-profile-details-compact.module.css
            git commit -m 'Apply focused Prettier formatting'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
