name: One-shot battlefield token parity patch

on:
  push:
    branches:
      - agent/battlefield-token-parity-followup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battlefield-token-parity-followup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply surgical battlefield parity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          presentation = 'apps/web/src/components/battle/battle-presentation-polish.tsx'
          replace_once(
              presentation,
              "import type { PvpBattleMetadata } from '@/server/battle/pvp-lobby-service'\n\nconst COMBATANT_COLORS = ['#67c98a', '#dc6a66', '#67aee8', '#d9ad5c', '#a984e8', '#df7eb5'] as const\nconst MOBILE_BATTLE_QUERY = '(max-width: 820px)'\nconst MOBILE_TOKEN_SHADOW = '0 0.35rem 0.9rem rgba(0, 0, 0, 0.5)'\n",
              "import type { PvpBattleMetadata } from '@/server/battle/pvp-lobby-service'\n\nimport { pvpParticipantAccent } from './battle-combatant-colors'\n",
          )
          replace_once(
              presentation,
              "function applyPvpIdentityColors(metadata: PvpBattleMetadata | undefined) {\n  if (!metadata) return\n  const mobileBattlefield = window.matchMedia(MOBILE_BATTLE_QUERY).matches\n  const ordered = [...metadata.participants].sort(\n    (a, b) =>\n      a.teamIndex - b.teamIndex ||\n      a.seatIndex - b.seatIndex ||\n      a.characterId.localeCompare(b.characterId),\n  )\n  const colors = new Map(\n    ordered.map((participant, index) => [\n      participant.characterName,\n      COMBATANT_COLORS[index % COMBATANT_COLORS.length],\n    ]),\n  )\n",
              "function applyPvpIdentityColors(metadata: PvpBattleMetadata | undefined) {\n  if (!metadata) return\n  const ordered = [...metadata.participants].sort(\n    (a, b) =>\n      a.teamIndex - b.teamIndex ||\n      a.seatIndex - b.seatIndex ||\n      a.characterId.localeCompare(b.characterId),\n  )\n  const teamCount = Math.max(1, new Set(ordered.map((participant) => participant.teamIndex)).size)\n  const colors = new Map(\n    ordered.map((participant) => [\n      participant.characterName,\n      pvpParticipantAccent(participant.teamIndex, participant.seatIndex, teamCount),\n    ]),\n  )\n",
          )
          replace_once(
              presentation,
              "    const token = tile.querySelector<HTMLElement>(':scope > span:last-child')\n    if (token) {\n      if (token.style.borderColor !== color) token.style.borderColor = color\n      const shadow = mobileBattlefield\n        ? MOBILE_TOKEN_SHADOW\n        : `0 0 0 2px ${color}55, 0 0 1rem ${color}88`\n      if (token.style.boxShadow !== shadow) token.style.boxShadow = shadow\n    }\n",
              "",
          )
          replace_once(
              presentation,
              "function polishPortraits() {\n  const mobileBattlefield = window.matchMedia(MOBILE_BATTLE_QUERY).matches\n  for (const tile of document.querySelectorAll<HTMLButtonElement>(\n",
              "function polishPortraits() {\n  for (const tile of document.querySelectorAll<HTMLButtonElement>(\n",
          )
          replace_once(
              presentation,
              "    if (mobileBattlefield && token.style.boxShadow !== MOBILE_TOKEN_SHADOW) {\n      token.style.boxShadow = MOBILE_TOKEN_SHADOW\n    }\n",
              "",
          )
          replace_once(
              presentation,
              "    const media = window.matchMedia(MOBILE_BATTLE_QUERY)\n    media.addEventListener('change', schedule)\n\n",
              "",
          )
          replace_once(
              presentation,
              "      media.removeEventListener('change', schedule)\n",
              "",
          )

          token_polish = 'apps/web/src/components/battle/battle-map-token-polish.tsx'
          replace_once(
              token_polish,
              "    if (name) {\n      const isAiPlayerToken = Boolean(playerName && combatantName === playerName)\n      name.style.display = 'none'\n\n      // AI only: remove the extra active-turn halo ring while preserving the shared identity or\n      // semantic border. PvP does not pass playerName here, so its active-token halo is unchanged.\n      if (isAiPlayerToken) token.style.boxShadow = PLAYER_TOKEN_SHADOW\n    }\n",
              "    const isAiPlayerToken = Boolean(playerName && combatantName === playerName)\n    const compactViewport = !desktopPvpScale\n    if (compactViewport || isAiPlayerToken) {\n      token.style.setProperty('box-shadow', PLAYER_TOKEN_SHADOW, 'important')\n    } else {\n      token.style.removeProperty('box-shadow')\n    }\n\n    if (name) name.style.display = 'none'\n",
          )

          spectator = 'apps/web/src/components/battle/pvp-spectator-experience.tsx'
          replace_once(
              spectator,
              "              <div className={styles.board} style={boardStyle}>\n",
              "              <div\n                className={styles.board}\n                style={boardStyle}\n                data-board-auto-fit={`${tactical.width}x${tactical.height}`}\n              >\n",
          )
          replace_once(
              spectator,
              "                        {terrain === 'rough' ? <b>R50</b> : null}\n",
              "                        {terrain === 'rough' ? (\n                          <b data-spectator-terrain-cost=\"true\">R50</b>\n                        ) : null}\n",
          )

          mobile_css = 'apps/web/src/components/battle/pvp-spectator-mobile-board-layout.module.css'
          p = Path(mobile_css)
          text = p.read_text()
          needle = "  :global(main[data-pvp-spectator='true'] #battlefield > div:nth-child(2) > div > button) {\n    height: auto !important;\n    min-height: auto !important;\n  }\n"
          addition = needle + "\n  :global(\n    main[data-pvp-spectator='true'] #battlefield [data-spectator-terrain-cost='true']\n  ) {\n    display: none !important;\n  }\n"
          if needle not in text:
              raise SystemExit(f'Expected mobile spectator selector not found in {mobile_css}')
          p.write_text(text.replace(needle, addition, 1))

          token_test = 'apps/web/src/components/battle/battle-map-token-polish.test.ts'
          p = Path(token_test)
          text = p.read_text()
          anchor = "  it('keeps participant card accents on tokens even when the hidden token name is absent', () => {\n"
          test_block = "  it('keeps shared token identity authority from being overwritten by playable-only polish', () => {\n    const shared = readLocalFile('battle-map-token-polish.tsx')\n    const playable = readLocalFile('battle-presentation-polish.tsx')\n\n    expect(shared).toContain(\"token.style.setProperty('border-color', tokenAccent, 'important')\")\n    expect(shared).toContain('const compactViewport = !desktopPvpScale')\n    expect(shared).toContain(\"token.style.setProperty('box-shadow', PLAYER_TOKEN_SHADOW, 'important')\")\n    expect(playable).toContain('pvpParticipantAccent(')\n    expect(playable).not.toContain('COMBATANT_COLORS')\n    expect(playable).not.toContain('token.style.borderColor')\n    expect(playable).not.toContain('token.style.boxShadow')\n  })\n\n"
          if anchor not in text:
              raise SystemExit(f'Expected test anchor not found in {token_test}')
          p.write_text(text.replace(anchor, test_block + anchor, 1))

          bundle_test = 'apps/web/src/components/battle/battlefield-presentation-bundle.test.ts'
          p = Path(bundle_test)
          text = p.read_text()
          closing = "  })\n})\n"
          extra = "  })\n\n  it('keeps spectator mobile board metadata aligned with playable token sizing and hides R50', () => {\n    const spectator = readLocalFile('pvp-spectator-experience.tsx')\n    const mobileLayout = readLocalFile('pvp-spectator-mobile-board-layout.module.css')\n\n    expect(spectator).toContain('data-board-auto-fit={`${tactical.width}x${tactical.height}`}')\n    expect(spectator).toContain('data-spectator-terrain-cost=\"true\"')\n    expect(mobileLayout).toContain(\"[data-spectator-terrain-cost='true']\")\n    expect(mobileLayout).toContain('display: none !important;')\n  })\n})\n"
          if not text.endswith(closing):
              raise SystemExit(f'Unexpected test ending in {bundle_test}')
          p.write_text(text[:-len(closing)] + extra)
          PY
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/battle/battle-presentation-polish.tsx
          apps/web/src/components/battle/battle-map-token-polish.tsx
          apps/web/src/components/battle/pvp-spectator-experience.tsx
          apps/web/src/components/battle/pvp-spectator-mobile-board-layout.module.css
          apps/web/src/components/battle/battle-map-token-polish.test.ts
          apps/web/src/components/battle/battlefield-presentation-bundle.test.ts
      - name: Run focused battlefield parity tests
        run: >-
          pnpm --filter @aurevane/web exec vitest run
          src/components/battle/battle-map-token-polish.test.ts
          src/components/battle/battlefield-presentation-bundle.test.ts
          src/components/battle/battle-combatant-colors.test.ts
      - name: Commit patch
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-presentation-polish.tsx \
            apps/web/src/components/battle/battle-map-token-polish.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            apps/web/src/components/battle/pvp-spectator-mobile-board-layout.module.css \
            apps/web/src/components/battle/battle-map-token-polish.test.ts \
            apps/web/src/components/battle/battlefield-presentation-bundle.test.ts
          git commit -m "Fix battlefield token identity parity"
          git push origin HEAD:agent/battlefield-token-parity-followup
