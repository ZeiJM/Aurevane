name: Temporary cockpit formatter

on:
  push:
    branches:
      - agent/cockpit-art-lowered-guard-polish

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cockpit-art-lowered-guard-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format cockpit CSS
        run: pnpm exec prettier --write apps/web/src/components/battle/battle-skill-command.module.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-skill-command.module.css
          if ! git diff --cached --quiet; then
            git commit -m "[autoformat] Format battle skill card CSS"
            git push origin HEAD:agent/cockpit-art-lowered-guard-polish
          fi
