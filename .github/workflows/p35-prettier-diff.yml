name: P3.5 Prettier Diff

on:
  push:
    branches:
      - 'agent/p3-5-closeout-corrections'
    paths:
      - 'packages/game-core/src/combat/pv1f-resonance.ts'
      - '.github/workflows/p35-prettier-diff.yml'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier packages/game-core/src/combat/pv1f-resonance.ts > /tmp/pv1f-resonance.ts
          diff -u packages/game-core/src/combat/pv1f-resonance.ts /tmp/pv1f-resonance.ts
