name: PV-1D Recruit callback repair

on:
  push:
    branches:
      - agent/pv-1d-combat-readability-correction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1d-combat-readability-correction
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repair Recruit callback memoization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()
          old = "      setSelectedUnitId(recruitId)\n      setNotice(describeRecruitTurn(before, nextBattle, body.battle.decisions))"
          new = "      setSelectedUnitId(\n        nextBattle.snapshot.statBridge.combatants.find(\n          (profile) => profile.provenance.kind === 'scenario',\n        )?.combatantId ?? null,\n      )\n      setNotice(describeRecruitTurn(before, nextBattle, body.battle.decisions))"
          if old not in text:
              raise SystemExit('Expected Recruit selection block not found')
          text = text.replace(old, new, 1)
          old_deps = "    playerTurn,\n    recruitId,\n    recruitPending,"
          new_deps = "    playerTurn,\n    recruitPending,"
          if old_deps not in text:
              raise SystemExit('Expected Recruit callback dependencies not found')
          text = text.replace(old_deps, new_deps, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/components/battle/battle-experience-v2.tsx
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-experience-v2.tsx
          git commit -m 'fix: stabilize visible Recruit turn callback'
          git push origin HEAD:agent/pv-1d-combat-readability-correction
