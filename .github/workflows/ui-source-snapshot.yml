name: UI source snapshot

on:
  push:
    branches:
      - agent/training-concept-ui
    paths:
      - .github/workflows/ui-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked formatter
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Export source and standalone formatter
        run: |
          mkdir -p /tmp/ui-source
          git rev-parse HEAD > /tmp/ui-source/commit.txt
          git archive --format=tar.gz HEAD > /tmp/ui-source/source.tar.gz
          tar -czf /tmp/ui-source/prettier.tar.gz -C "$(realpath node_modules/prettier)" .
      - uses: actions/upload-artifact@v4
        with:
          name: ui-source
          path: /tmp/ui-source
          retention-days: 3
