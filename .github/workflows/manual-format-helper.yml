name: Manual format helper

on:
  push:
    branches:
      - agent/update-site-manual-pv1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Manual files
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/public-information.pw.ts \
            apps/web/src/app/manual/page.tsx \
            apps/web/src/content/public-information.ts

      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/e2e/public-information.pw.ts \
            apps/web/src/app/manual/page.tsx \
            apps/web/src/content/public-information.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Manual updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
