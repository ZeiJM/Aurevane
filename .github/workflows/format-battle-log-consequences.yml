name: Format battle log consequences

on:
  push:
    branches:
      - agent/battle-log-action-consequences

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-log-action-consequences
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-feed.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-feed.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format battle log consequences"
          git push origin HEAD:agent/battle-log-action-consequences
