name: PV-1D combat log regression repair

on:
  push:
    branches:
      - agent/pv-1d-combat-readability-correction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1d-combat-readability-correction
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconcile player-readable log projection and expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/web/src/server/battle/battle-log-service.ts')
          text = service.read_text()
          old = "    case 'action_spent':\n      message = `${combatantLabel(event.combatantId)} spent the Action for this activation.`\n      break"
          new = "    case 'action_spent':\n      return null"
          if old not in text:
              raise SystemExit('action_spent projection block not found')
          service.write_text(text.replace(old, new, 1))

          test = Path('apps/web/src/server/battle/battle-log-service.test.ts')
          text = test.read_text()
          replacements = {
              "Recruit chose closing the distance (score 28).": "Recruit chose closing the distance.",
              "Recruit took 13 damage.": "Recruit took 13 damage and has 67 HP remaining.",
              "Wayfarer attack hit (74% hit chance).": "Wayfarer Basic Attack HIT (74% hit chance).",
              "Wayfarer moved to 4, 2 for 1 Movement.": "Wayfarer moved from 3, 2 to 4, 2 for 1 Movement.",
              "toHaveBeenCalledWith(USER_ID, SESSION_ID, 50)": "toHaveBeenCalledWith(USER_ID, SESSION_ID, 200)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected test text not found: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-log-service.ts \
            apps/web/src/server/battle/battle-log-service.test.ts
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/server/battle/battle-log-service.ts \
            apps/web/src/server/battle/battle-log-service.test.ts
          git commit -m 'test: reconcile expanded player-readable battle log'
          git push origin HEAD:agent/pv-1d-combat-readability-correction
