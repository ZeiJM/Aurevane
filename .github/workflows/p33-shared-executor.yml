name: P3.3 shared executor correction

on:
  push:
    branches:
      - agent/p3-3-mature-skill-cooldowns

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Apply shared executor correction
        run: python .github/scripts/p33-shared-executor.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format focused files
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/actions.ts \
            packages/game-core/src/combat/mature-skills.ts \
            packages/game-core/src/combat/mature-skills.test.ts \
            packages/game-core/src/combat/pv1f-action-economy.ts \
            packages/game-core/src/combat/pv1f-action-economy.test.ts
      - name: Lint focused files
        run: |
          pnpm exec eslint \
            packages/game-core/src/combat/actions.ts \
            packages/game-core/src/combat/mature-skills.ts \
            packages/game-core/src/combat/mature-skills.test.ts \
            packages/game-core/src/combat/pv1f-action-economy.ts \
            packages/game-core/src/combat/pv1f-action-economy.test.ts \
            packages/game-core/src/combat/recruit-ai.test.ts \
            packages/game-core/src/combat/skill-cooldowns.ts
      - name: Typecheck game core
        run: pnpm --filter @aurevane/game-core typecheck
      - name: Focused P3.3 tests
        run: |
          pnpm --filter @aurevane/game-core exec vitest run \
            src/combat/mature-skills.test.ts \
            src/combat/pv1f-action-economy.test.ts \
            src/combat/recruit-ai.test.ts
      - name: Production workspace build
        run: pnpm build
      - name: Commit runtime correction only
        run: |
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git restore --source=HEAD -- .github/workflows/p33-shared-executor.yml
          rm -f .github/scripts/p33-shared-executor.py
          git add -A
          git commit -m 'Integrate P3.3 Skill cooldowns with shared combat authority'
          git push origin HEAD:agent/p3-3-mature-skill-cooldowns
