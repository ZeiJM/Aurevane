name: Temporary cockpit validation

on:
  pull_request:
    branches:
      - agent/battle-cockpit-button-polish-20260828

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/format-battle-cockpit-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify cockpit formatting
        run: |
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-command-cockpit-polish.tsx \
            apps/web/src/components/battle/battle-command-cockpit-polish.module.css \
            apps/web/src/components/battle/battle-session-client-boundary.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx
      - name: Lint touched TypeScript
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/components/battle/battle-command-cockpit-polish.tsx \
            apps/web/src/components/battle/battle-session-client-boundary.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx
      - name: Typecheck web app
        run: pnpm --filter @aurevane/web typecheck
      - name: Test web app
        run: pnpm --filter @aurevane/web test
      - name: Build web app
        run: pnpm --filter @aurevane/web build
