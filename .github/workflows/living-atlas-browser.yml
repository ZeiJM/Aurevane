name: Living Atlas browser

on:
  pull_request:
    paths:
      - 'apps/web/src/components/world/**'
      - 'apps/web/src/server/world/**'
      - 'apps/web/src/world/**'
      - 'apps/web/src/app/game/**/world/**'
      - 'apps/web/src/app/api/world/**'
      - 'apps/web/e2e/atlas-world.pw.ts'
      - 'apps/web/e2e/master-event-builder.pw.ts'
      - 'apps/web/e2e/world-*.ts'
      - 'supabase/migrations/*living_atlas*'
      - 'supabase/migrations/*combat_discovery*'
      - 'supabase/migrations/*personal*'
      - 'supabase/migrations/*world*'
      - '.github/workflows/living-atlas-browser.yml'
  workflow_dispatch:
    inputs:
      staging_dry_run:
        description: 'Verify the isolated staging migration plan'
        type: boolean
        default: false
      staging_apply:
        description: 'Apply the verified migration batch to isolated staging'
        type: boolean
        default: false
      production_dry_run:
        description: 'Verify the production migration plan without applying it'
        type: boolean
        default: false
      expected_candidate:
        description: 'Exact candidate commit SHA for the migration plan or apply'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: living-atlas-browser-${{ github.ref }}-${{ inputs.staging_dry_run || inputs.staging_apply || inputs.production_dry_run || false }}
  cancel-in-progress: ${{ !inputs.staging_dry_run && !inputs.staging_apply && !inputs.production_dry_run }}

jobs:
  verify:
    if: ${{ !inputs.staging_dry_run && !inputs.staging_apply && !inputs.production_dry_run }}
    runs-on: ubuntu-latest
    # The authenticated Atlas suite covers many full-route journeys; the previous
    # 20-minute cap cancelled an otherwise progressing run at scenario 39.
    # Retain the entire test suite and allow the real run to finish.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record the tested source tree
        run: git rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Configure disposable World services
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          local_secret="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$ANON_KEY"
          test -n "$local_secret"
          printf '::add-mask::%s\n' "$ANON_KEY" "$local_secret"
          {
            printf '%s\n' AUREVANE_ENV=local NEXT_PUBLIC_AUREVANE_ENV=local
            printf '%s\n' NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$local_secret"
          } >> "$GITHUB_ENV"
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
            set role service_role;
            select public.activate_phase4_combat_interactions_v2();
            select public.activate_phase4_discipline_rebalance_v1();
          "
      - name: Build the production web bundle
        run: pnpm --filter @aurevane/web build
      - name: Verify authenticated quests and World NPC admission
        id: story
        run: |
          pnpm --filter @aurevane/web exec playwright test e2e/master-event-builder.pw.ts \
            --project=desktop-chromium --project=mobile-chromium \
            --grep 'an authored (Story Campaign|item exchange|World NPC|Alder Venn wolf hunt|Ashen Sentinel|Mentor challenge|Cinderwake (recovery|combat trial))|@sealed-realm' \
            --output=test-results-story --reporter=list,github
      - name: Save authenticated story failure context
        if: ${{ failure() && steps.story.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-story-failure
          path: apps/web/test-results-story/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify authenticated Atlas and multiplayer
        if: ${{ !cancelled() && (steps.story.outcome == 'success' || steps.story.outcome == 'failure') }}
        run: pnpm --filter @aurevane/web exec playwright test e2e/atlas-world.pw.ts --reporter=list,github
      - name: Capture safe Realtime failure diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import collections, json, pathlib, re, subprocess

          destination = pathlib.Path('apps/web/test-results/world-realtime-diagnostics.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          inventory = subprocess.run(
              ['docker', 'ps', '-a', '--filter', 'name=supabase_realtime_', '--format', '{{.ID}}'],
              capture_output=True, text=True, check=False,
          )
          categories = [
              ('database-pool', r'pool|queue|DBConnection|ConnectionPool'),
              ('database-connection', r'UnableToConnectToTenantDatabase|database.*connect|connect.*database'),
              ('authorization', r'authoriz|unauthoriz|permission|RlsPolicy|JWT|token'),
              ('timeout', r'timed?[_ -]?out|timeout'),
              ('join-limit', r'too_many_(channels|connections|joins)|tenant_events'),
              ('channel-join', r'phx_join|join.*channel|channel.*join'),
              ('connection', r'websocket|transport|socket.*(open|close)|disconnect'),
          ]
          containers = []
          for container_id in inventory.stdout.splitlines():
              logs = subprocess.run(
                  ['docker', 'logs', '--timestamps', '--since', '20m', '--tail', '2000', container_id],
                  capture_output=True, text=True, check=False,
              )
              counts = collections.Counter()
              events = []
              # Raw lines may include JWTs, keys, headers and payloads. Persist only
              # category labels and Docker timestamps; no original message text.
              for line in (logs.stdout + logs.stderr).splitlines():
                  counts['lines'] += 1
                  for category, pattern in categories:
                      if re.search(pattern, line, re.IGNORECASE):
                          counts[category] += 1
                          timestamp = re.match(r'^(\d{4}-\d{2}-\d{2}T[0-9:.]+Z)\s', line)
                          if len(events) < 1000:
                              events.append({'at': timestamp.group(1) if timestamp else 'unknown', 'category': category})
                          break
              containers.append({'captureExitCode': logs.returncode, 'counts': dict(counts), 'events': events})
          destination.write_text(json.dumps({'inventoryExitCode': inventory.returncode, 'containers': containers}, indent=2))
          PY
      - name: Save compact Atlas timing and presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-atlas-evidence
          path: |
            apps/web/test-results/**/synthetic-world-render-cost.json
            apps/web/test-results/**/world-private-scene-join-diagnostics.json
            apps/web/test-results/**/world-live-peer-delivery.json
            apps/web/test-results/**/world-multiplayer-load.json
            apps/web/test-results/**/world-multiplayer-native-trace.json
            apps/web/test-results/**/world-multiplayer-hotspot.png
            apps/web/test-results/**/world-art-review.json
            apps/web/test-results/**/world-ambient-pause.json
            apps/web/test-results/**/art-*.png
            apps/web/test-results/**/biome-boundary-*.png
            apps/web/test-results/**/coastal-road-*.png
            apps/web/test-results/**/four-biome-*.png
            apps/web/test-results/**/weather-*.png
            apps/web/test-results/**/terrain-motion-*.png
            apps/web/test-results-story/**/authored-watch-*-complete.png
            apps/web/test-results-story/**/sealed-realm-challenge.png
            apps/web/test-results-story/**/authored-world-npc-challenge.png
            apps/web/test-results-story/**/cinderwake-*.png
            apps/web/test-results-story/**/venn-hunt-*.png
            apps/web/test-results-story/**/ashen-sentinel-*.png
            apps/web/test-results/**/world-realtime-diagnostics.json
            apps/web/test-results/**/portrait-zoom-*.png
            apps/web/test-results/**/world-refined-controls.png
          retention-days: 7
      - name: Save bounded ambient pause failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: living-atlas-ambient-pause-failure
          path: apps/web/test-results/*ambient*/
          retention-days: 7
      - name: Save Atlas screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-atlas-browser
          path: |
            apps/web/test-results
            apps/web/test-results-story/**/error-context.md
          retention-days: 7
      - name: Stop disposable database
        if: always()
        run: pnpm exec supabase stop --no-backup

  staging-migration-plan:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && !inputs.production_dry_run &&
        (inputs.staging_dry_run || inputs.staging_apply) &&
        github.repository == 'ZeiJM/Aurevane' &&
        github.ref == 'refs/heads/agent/unified-release-candidate-20261107' }}
    environment: Aurevane Unified Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify the requested candidate commit
        env:
          EXPECTED_CANDIDATE: ${{ inputs.expected_candidate }}
        run: test "$GITHUB_SHA" = "$EXPECTED_CANDIDATE"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned migration CLI
        run: npm install --prefix "$RUNNER_TEMP/aurevane-staging-cli" --no-save supabase@2.114.0
      - name: Verify staging ledger and run the requested migration mode
        env:
          STAGING_DB_PASSWORD: ${{ secrets.AUREVANE_STAGING_DB_PASSWORD }}
          STAGING_APPLY: ${{ inputs.staging_apply }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.parse import quote

          apply_requested = os.environ.pop('STAGING_APPLY', '') == 'true'
          password = os.environ.pop('STAGING_DB_PASSWORD', '')
          if not password:
              raise SystemExit('The isolated staging database password is missing.')

          host = 'aws-0-us-east-2.pooler.supabase.com'
          user = 'postgres.lryykonjkvtzjyfikrme'
          uri = f"postgresql://{user}:{quote(password, safe='')}@{host}:5432/postgres?sslmode=require"

          source = sorted(Path('supabase/migrations').glob('*.sql'))
          versions = [path.name.split('_', 1)[0] for path in source]
          source_digests = {path: hashlib.sha256(path.read_bytes()).hexdigest() for path in source}
          inventory = '\n'.join(f'{path.name}\t{source_digests[path]}' for path in source)
          reviewed_inventory = '52ad63acedf2f8930b147ab1e6e734469523999408d0c3fd2eca61e1be268d31'
          if (
              len(source) != 248
              or len(set(versions)) != len(source)
              or hashlib.sha256(inventory.encode()).hexdigest() != reviewed_inventory
          ):
              raise SystemExit('Candidate migration inventory differs from the reviewed 248 files.')
          ledger_query = """
              select version, name, cardinality(statements),
                     encode(sha256(convert_to(statements[1], 'UTF8')), 'hex'),
                     encode(sha256(convert_to(statements::text, 'UTF8')), 'hex')
              from supabase_migrations.schema_migrations order by version
          """
          def read_ledger():
              result = subprocess.run(
                  ['psql', '-XqAt', '-F', '\t', '-w', '-v', 'ON_ERROR_STOP=1',
                   '-c', 'begin read only', '-c', ledger_query, '-c', 'rollback'],
                  env={**os.environ, 'PGHOST': host, 'PGPORT': '5432',
                       'PGDATABASE': 'postgres', 'PGUSER': user,
                       'PGPASSWORD': password, 'PGSSLMODE': 'require',
                       'PGCONNECT_TIMEOUT': '15'},
                  text=True, capture_output=True, timeout=30,
              )
              if result.returncode:
                  error = result.stderr.lower()
                  reason = 'connection or query error'
                  if 'password authentication failed' in error:
                      reason = 'password authentication failed'
                  elif 'could not translate host name' in error:
                      reason = 'staging hostname lookup failed'
                  elif 'timeout expired' in error:
                      reason = 'staging connection timed out'
                  raise SystemExit(f'The read-only staging ledger check failed: {reason}.')
              return [line.split('\t') for line in result.stdout.splitlines()]

          ledger = read_ledger()
          if len(ledger) != 247:
              raise SystemExit('The staging ledger no longer contains the 247 reviewed entries.')
          # Pin the verified staging snapshot, including all stored statement bodies.
          ledger_snapshot = '\n'.join('\t'.join(row) for row in ledger)
          reviewed_snapshot = '204a5cf8d085ae2487673621c7f5f24c20c7a765bae20351f30979a9597a3e64'
          if hashlib.sha256(ledger_snapshot.encode()).hexdigest() != reviewed_snapshot:
              raise SystemExit('The staging ledger fingerprint differs from the reviewed snapshot.')
          aliases = [row for row in ledger if row[1].startswith('aurevane_')]
          canonical = {row[0]: row[1] for row in ledger if not row[1].startswith('aurevane_')}
          expected_canonical = dict(path.stem.split('_', 1) for path in source[len(aliases):-1])
          if len(aliases) != 20 or canonical != expected_canonical:
              raise SystemExit('The installed migration versions and names differ from the reviewed manifest.')
          pending = [path.name for path in source[len(ledger):]]
          if pending != ['20261110085555_published_foundation_character_creation.sql']:
              raise SystemExit('The pending migration differs from the reviewed Foundation increment.')

          with tempfile.TemporaryDirectory() as tmp:
              workdir = Path(tmp)
              staged = workdir / 'supabase' / 'migrations'
              staged.mkdir(parents=True)
              shutil.copyfile('supabase/config.toml', staged.parent / 'config.toml')
              # The CLI validates config content paths before connecting.
              template = Path('supabase/templates/recovery.html')
              (workdir / template.parent).mkdir()
              shutil.copyfile(template, workdir / template)
              for path, (version, name, parts, digest, _) in zip(source, aliases):
                  if (
                      not re.fullmatch(r'\d{14}', version)
                      or version in versions
                      or name != f'aurevane_{path.stem}'
                      or parts != '1'
                      or source_digests[path] != digest
                  ):
                      raise SystemExit(f'Staging history differs from the candidate at {path.name}.')
                  # Match the hosted aliases locally for the dry run. Do not repair the remote ledger.
                  shutil.copyfile(path, staged / f'{version}_{name}.sql')
              for path in source[len(aliases):]:
                  shutil.copyfile(path, staged / path.name)

              cli = Path(os.environ['RUNNER_TEMP']) / 'aurevane-staging-cli/node_modules/.bin/supabase'
              push = [cli, 'db', 'push', '--workdir', workdir, '--db-url', uri, '--include-all']
              try:
                  plan = subprocess.run(
                      [*push, '--dry-run'],
                      text=True, capture_output=True, timeout=90,
                  )
              except subprocess.TimeoutExpired:
                  raise SystemExit('Supabase CLI staging dry run timed out.') from None
              if plan.returncode:
                  raise SystemExit('Supabase CLI staging dry run failed.')
              planned = re.findall(r'\b\d{14}_[A-Za-z0-9_-]+\.sql\b', plan.stdout + plan.stderr)
              if planned != pending:
                  raise SystemExit('Supabase CLI did not return the reviewed migration sequence.')
              if read_ledger() != ledger:
                  raise SystemExit('Staging migration history changed during the dry run.')
              print(f'Verified {len(ledger)} applied entries and {len(pending)} pending migrations.')
              print(f'First pending migration: {pending[0]}')
              print(f'Last pending migration: {pending[-1]}')

              if apply_requested:
                  print(f'Applying {len(pending)} migrations to isolated staging.', flush=True)
                  result = subprocess.run([*push, '--yes'], text=True, capture_output=True)
                  final = read_ledger()
                  original = {row[0]: row for row in ledger}
                  current = {row[0]: row for row in final}
                  expected = [tuple(path.stem.split('_', 1)) for path in source[len(ledger):]]
                  if any(current.get(version) != row for version, row in original.items()):
                      raise SystemExit('An existing staging migration entry changed during apply.')
                  applied = [tuple(row[:2]) for row in final if row[0] not in original]
                  if result.returncode:
                      state = re.search(r'\bSQLSTATE ([A-Z0-9]{5})\b', result.stdout + result.stderr)
                      detail = f' SQLSTATE {state[1]}.' if state else ''
                      raise SystemExit(f'Staging batch stopped with {len(applied)} of {len(expected)} new entries applied.{detail}')
                  if len(final) != len(source) or applied != expected:
                      raise SystemExit('Staging postflight did not match the candidate migration versions.')
                  print(f'Staging postflight verified {len(final)} applied migrations and preserved all {len(ledger)} existing entries.')
          PY

  production-migration-plan:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.production_dry_run &&
        !inputs.staging_dry_run && !inputs.staging_apply &&
        github.repository == 'ZeiJM/Aurevane' &&
        github.ref == 'refs/heads/agent/unified-release-candidate-20261107' }}
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the requested candidate commit
        env:
          EXPECTED_CANDIDATE: ${{ inputs.expected_candidate }}
        run: test "$GITHUB_SHA" = "$EXPECTED_CANDIDATE"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned migration CLI
        run: npm install --prefix "$RUNNER_TEMP/aurevane-production-cli" --no-save supabase@2.114.0
      - name: Dry-run the ordered production migration batch
        env:
          AUREVANE_PRODUCTION_DB_URL: ${{ secrets.AUREVANE_PRODUCTION_DB_URL }}
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          python3 .github/scripts/plan-aurevane-production-migrations.py "$RUNNER_TEMP/aurevane-production-cli/node_modules/.bin/supabase"
