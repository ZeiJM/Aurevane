name: Forecast Format Diff

on:
  push:
    branches:
      - agent/forecast-format-diff-20260916

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/battle/battle-preview-content.ts
      - run: git diff -- apps/web/src/components/battle/battle-preview-content.ts
