name: P3.5 Integration Patch

# Temporary one-shot formatter. Removed before the P3.5 PR.
on:
  push:
    branches:
      - 'agent/p3-5-resonance-framework'
    paths:
      - '.github/workflows/p35-integration-patch.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-5-resonance-framework
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format complete P3.5 surface
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm exec prettier --write \
            packages/game-core/src/combat/resonance.ts \
            packages/game-core/src/combat/resonance.test.ts \
            packages/game-core/package.json \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            'apps/web/src/app/game/battle/[battleSessionId]/page.tsx' \
            apps/web/src/components/battle/battle-runtime.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-resonance-indicator.tsx \
            apps/web/src/components/battle/battle-resonance-indicator.module.css
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/game-core/src/combat/resonance.ts \
            packages/game-core/src/combat/resonance.test.ts \
            packages/game-core/package.json \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts \
            apps/web/src/server/character/supabase-character-build-repository.ts \
            apps/web/src/app/game/character/page.tsx \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-skill-build-panel.tsx \
            'apps/web/src/app/game/battle/[battleSessionId]/page.tsx' \
            apps/web/src/components/battle/battle-runtime.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/components/battle/battle-resonance-indicator.tsx \
            apps/web/src/components/battle/battle-resonance-indicator.module.css
          if git diff --cached --quiet; then
            echo 'P3.5 surface already formatted.'
            exit 0
          fi
          git commit -m 'chore: format P3.5 Resonance surface'
          git push origin HEAD:agent/p3-5-resonance-framework
