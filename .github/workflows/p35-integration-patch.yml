name: P3.5 Integration Patch

on:
  push:
    branches:
      - 'agent/p3-5-resonance-framework'
    paths:
      - '.github/workflows/p35-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p3-5-resonance-framework
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply P3.5 battle indicator integration
        run: python3 .github/scripts/p35-battle-patch.py
      - name: Format battle integration files
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-runtime.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/app/game/battle/[battleSessionId]/page.tsx
      - name: Commit battle integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/components/battle/battle-runtime.ts \
            apps/web/src/components/battle/battle-client-boundary.tsx \
            apps/web/src/app/game/battle/[battleSessionId]/page.tsx
          git commit -m 'P3.5 surface committed Resonance in battle context'
          git push origin HEAD:agent/p3-5-resonance-framework
