name: CSR3 Prettier Once

on:
  push:
    branches:
      - agent/combat-csr3-historical-privacy-20260917
    paths:
      - .github/workflows/csr3-prettier-once.yml

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr3-historical-privacy-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: pnpm exec prettier --write apps/web/src/server/battle/battle-history-privacy.ts apps/web/src/server/battle/battle-history-privacy.test.ts
      - name: Commit formatted files and remove helper
        run: |
          rm .github/workflows/csr3-prettier-once.yml
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/server/battle/battle-history-privacy.ts apps/web/src/server/battle/battle-history-privacy.test.ts .github/workflows/csr3-prettier-once.yml
          git diff --cached --check
          git commit -m 'style(combat): apply exact CSR-3 Prettier output'
          git push origin HEAD:agent/combat-csr3-historical-privacy-20260917
