name: One-shot authenticated shell formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'preview/finesse-silver-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format blocking shell CSS
        run: pnpm exec prettier --write apps/web/src/components/shell/authenticated-game-shell.module.css
      - name: Commit formatting to main
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/shell/authenticated-game-shell.module.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format authenticated shell css"
          git push origin HEAD:main
