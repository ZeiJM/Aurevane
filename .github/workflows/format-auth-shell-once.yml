name: One-shot authenticated shell formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'preview/ai-surrender-20260822'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch release helper from main
        run: |
          git fetch origin main
          git show origin/main:.github/scripts/apply-pvp-combat-polish.py > /tmp/apply-pvp-combat-polish.py
      - name: Apply combat polish
        run: python /tmp/apply-pvp-combat-polish.py
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-desktop-parity.tsx \
            apps/web/src/components/battle/pvp-battle-quality-controls.tsx \
            apps/web/src/components/battle/ai-battle-pvp-visual-sync.module.css \
            apps/web/src/components/battle/pvp-battle-experience.module.css \
            apps/web/src/components/battle/pvp-desktop-parity.module.css
      - name: Commit release changes
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add apps/web/src/components/battle
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Polish PvP realtime combat shell"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
