name: One-shot authenticated shell formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/ai-action-commit-production-release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-action-commit-production-release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format latest shared visual contract
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-screen-visual-contract.module.css \
            apps/web/src/components/battle/battle-screen-visual-contract.test.ts \
            apps/web/src/components/battle/battle-screen-visual-contract.tsx \
            apps/web/src/components/battle/battle-session-client-boundary.tsx
      - name: Commit formatting to release branch
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-screen-visual-contract.module.css \
            apps/web/src/components/battle/battle-screen-visual-contract.test.ts \
            apps/web/src/components/battle/battle-screen-visual-contract.tsx \
            apps/web/src/components/battle/battle-session-client-boundary.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format shared battle visual contract"
          git push origin HEAD:agent/ai-action-commit-production-release
