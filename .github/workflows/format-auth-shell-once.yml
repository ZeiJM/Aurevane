name: One-shot PvP UI formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/pvp-ai-ui-parity-20260822'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format PvP UI patch
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.tsx \
            apps/web/src/components/battle/pvp-battle-quality-controls.tsx \
            apps/web/src/components/battle/pvp-battle-release-polish.module.css
      - name: Restore workflow and commit formatting
        run: |
          git checkout origin/main -- .github/workflows/format-auth-shell-once.yml
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/format-auth-shell-once.yml \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.tsx \
            apps/web/src/components/battle/pvp-battle-quality-controls.tsx \
            apps/web/src/components/battle/pvp-battle-release-polish.module.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format PvP UI patch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
