name: PV-1D final browser repair

on:
  push:
    branches:
      - agent/pv-1d-combat-readability-correction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1d-combat-readability-correction
      - name: Repair async battle-loop assertion and task governance
        run: |
          python - <<'PY'
          from pathlib import Path

          browser = Path('apps/web/e2e/battle-experience.pw.ts')
          text = browser.read_text()
          old = """    if (await completion.isVisible()) break

    await expect(endTurnButton).toBeEnabled()
    await endTurnButton.click()
"""
          new = """    await waitForCompletionOrEndTurn(page, completion, endTurnButton)
    if (await completion.isVisible()) break

    await endTurnButton.click()
"""
          if old not in text:
              raise SystemExit('Battle-loop end-turn assertion marker not found')
          text = text.replace(old, new, 1)

          marker = """async function waitForCompletionOrNextPlayerTurn(
"""
          helper = """async function waitForCompletionOrEndTurn(
  page: import('@playwright/test').Page,
  completion: import('@playwright/test').Locator,
  endTurnButton: import('@playwright/test').Locator,
): Promise<void> {
  await expect
    .poll(
      async () => {
        if (await completion.isVisible()) return 'completed'
        if (await endTurnButton.isEnabled()) return 'end-turn-ready'
        return 'waiting'
      },
      { timeout: 15_000 },
    )
    .not.toBe('waiting')
}

"""
          if marker not in text:
              raise SystemExit('Battle-loop helper insertion marker not found')
          browser.write_text(text.replace(marker, helper + marker, 1))

          tasks = Path('TASKS.md')
          text = tasks.read_text()
          old_rule = '2. One canonical implementation ticket is ACTIVE at a time.'
          new_rule = '2. One canonical implementation ticket is ACTIVE at a time; a validation gate may explicitly hold implementation at none.'
          if old_rule not in text:
              raise SystemExit('TASKS execution rule marker not found')
          tasks.write_text(text.replace(old_rule, new_rule, 1))
          PY
          npx --yes prettier@3.9.6 --write apps/web/e2e/battle-experience.pw.ts
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo 'No repairs needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/battle-experience.pw.ts TASKS.md
          git commit -m 'test: wait for authoritative combat commit before end turn'
          git push origin HEAD:agent/pv-1d-combat-readability-correction