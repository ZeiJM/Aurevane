name: Temporary Battle Log clarity implementation

on:
  push:
    branches:
      - feat/battle-log-clarity-narration-20260824

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/battle-log-clarity-narration-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Replay reviewed implementation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', '748e19abb33c3ce8ba90b5c4ec05f99059709e52:.github/workflows/tmp-battle-log-clarity.yml'],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/aurevane-battle-log-implement.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/aurevane-battle-log-implement.sh
      - name: Correct service assertion to event identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/server/battle/battle-log-service.test.ts')
          text = path.read_text()
          old = """    expect(result.entries[0]?.facts).toEqual([
              { label: 'Lowered Guard', tone: 'warning' },
              { label: '1 turn', tone: 'neutral' },
              { label: 'Takes 2.5× damage', tone: 'warning' },
            ])
"""
          if old not in text:
              old = """    expect(result.entries[0]?.facts).toEqual([
      { label: 'Lowered Guard', tone: 'warning' },
      { label: '1 turn', tone: 'neutral' },
      { label: 'Takes 2.5× damage', tone: 'warning' },
    ])
"""
          if old not in text:
              raise SystemExit('Expected Lowered Guard assertion was not found')
          new = """    const loweredGuard = result.entries.find(
      (entry) => entry.eventType === 'pvp_lowered_guard_applied',
    )
    const timeout = result.entries.find((entry) => entry.eventType === 'pvp_turn_timed_out')
    expect(loweredGuard?.facts).toEqual([
      { label: 'Lowered Guard', tone: 'warning' },
      { label: '1 turn', tone: 'neutral' },
      { label: 'Takes 2.5× damage', tone: 'warning' },
    ])
    expect(timeout?.facts).toEqual([{ label: '2 consecutive timeouts', tone: 'warning' }])
"""
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/game-core/package.json \
            packages/game-core/src/combat/battle-narration.ts \
            packages/game-core/src/combat/battle-narration.test.ts \
            packages/game-core/src/combat/actions.ts \
            packages/game-core/src/combat/pvp-quality.ts \
            packages/game-core/src/combat/pvp-quality.test.ts \
            apps/web/src/server/battle/battle-log-service.ts \
            apps/web/src/server/battle/battle-log-service.test.ts \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx \
            apps/web/src/components/battle/battle-log-panel.tsx \
            apps/web/src/components/battle/battle-log-presentation.ts \
            apps/web/src/components/battle/battle-log-presentation.test.ts \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-feed.module.css \
            docs/BATTLE_LOG_SYSTEM.md docs/MASTER_PANEL.md docs/GAME_MASTER_PLAN.md
      - name: Run focused tests and typechecks
        run: |
          pnpm --filter @aurevane/game-core test
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/web test
          pnpm --filter @aurevane/web typecheck
      - name: Remove temporary workflow and commit implementation
        run: |
          rm .github/workflows/tmp-battle-log-clarity.yml
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Improve battle log clarity and narration foundation"
          git push origin HEAD:feat/battle-log-clarity-narration-20260824