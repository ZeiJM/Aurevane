      - name: Implement Battle Log clarity and narration foundation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          def append_once(path: str, marker: str, block: str):
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return
              p.write_text(text.rstrip() + '\n\n' + block.strip() + '\n')

          narration = Path('packages/game-core/src/combat/battle-narration.ts')
          narration.write_text('''export interface SkillNarrationTemplate {\n  hit?: string\n  miss?: string\n  critical?: string\n}\n\nexport const SKILL_NARRATION_TOKENS = ['actor', 'target', 'ability', 'damage'] as const\nexport type SkillNarrationToken = (typeof SKILL_NARRATION_TOKENS)[number]\n\nconst TOKEN_PATTERN = /\\{([a-zA-Z][a-zA-Z0-9_.-]*)\\}/gu\nconst MAX_NARRATION_LENGTH = 180\n\nexport function skillNarrationVariantIssues(template: string): readonly string[] {\n  const value = template.trim()\n  const issues: string[] = []\n  if (!value) issues.push('Narration cannot be blank.')\n  if (value.length > MAX_NARRATION_LENGTH) {\n    issues.push(`Narration must be ${MAX_NARRATION_LENGTH} characters or fewer.`)\n  }\n\n  const allowed = new Set<string>(SKILL_NARRATION_TOKENS)\n  for (const match of value.matchAll(TOKEN_PATTERN)) {\n    const token = match[1]\n    if (token && !allowed.has(token)) issues.push(`Unknown narration token: {${token}}.`)\n  }\n  return issues\n}\n\nexport function isSkillNarrationVariantValid(template: string | undefined): boolean {\n  return template !== undefined && skillNarrationVariantIssues(template).length === 0\n}\n\nexport function validateSkillNarrationTemplate(\n  narration: SkillNarrationTemplate | undefined,\n): readonly string[] {\n  if (!narration) return []\n  return (['hit', 'miss', 'critical'] as const).flatMap((variant) => {\n    const template = narration[variant]\n    return template === undefined\n      ? []\n      : skillNarrationVariantIssues(template).map((issue) => `${variant}: ${issue}`)\n  })\n}\n''')

          Path('packages/game-core/src/combat/battle-narration.test.ts').write_text('''import { describe, expect, it } from 'vitest'\n\nimport {\n  isSkillNarrationVariantValid,\n  skillNarrationVariantIssues,\n  validateSkillNarrationTemplate,\n} from './battle-narration'\n\ndescribe('skill battle narration contract', () => {\n  it('accepts short allow-listed combat narration', () => {\n    expect(\n      validateSkillNarrationTemplate({\n        hit: "{actor} drives a sweeping cut through {target}'s guard",\n        miss: "{actor}'s sweeping cut slips past {target}",\n        critical: '{actor} tears through {target} with {ability}',\n      }),\n    ).toEqual([])\n  })\n\n  it('rejects unknown tokens so runtime presentation can safely fall back', () => {\n    expect(isSkillNarrationVariantValid('{actor} strikes {target} with {secret_roll}')).toBe(false)\n    expect(skillNarrationVariantIssues('{actor} strikes {target} with {secret_roll}')).toContain(\n      'Unknown narration token: {secret_roll}.',\n    )\n  })\n\n  it('rejects blank narration', () => {\n    expect(isSkillNarrationVariantValid('   ')).toBe(false)\n  })\n})\n''')

          replace(
              'packages/game-core/package.json',
              '    "./combat/actions": "./src/combat/actions.ts",\n',
              '    "./combat/actions": "./src/combat/actions.ts",\n    "./combat/battle-narration": "./src/combat/battle-narration.ts",\n',
          )

          replace(
              'packages/game-core/src/combat/actions.ts',
              "import { endTurn, spendAction, type BattleCombatant, type BattleState } from './battle-state'\n",
              "import type { SkillNarrationTemplate } from './battle-narration'\nimport { endTurn, spendAction, type BattleCombatant, type BattleState } from './battle-state'\n",
          )
          replace(
              'packages/game-core/src/combat/actions.ts',
              "  requirements: readonly CombatUseRequirement[]\n  effects: readonly CombatEffectDefinition[]\n}",
              "  requirements: readonly CombatUseRequirement[]\n  narration?: SkillNarrationTemplate\n  effects: readonly CombatEffectDefinition[]\n}",
          )
          replace(
              'packages/game-core/src/combat/actions.ts',
              "      remainingOwnerTurnStarts: number\n    }\n",
              "      remainingOwnerTurnStarts: number\n      refreshed: boolean\n    }\n",
          )
          replace(
              'packages/game-core/src/combat/actions.ts',
              "  const nextState = applyStatusState(\n    state,\n    actorId,\n    recipientId,\n    effect.statusId,\n    effect.stacks,\n    content,\n  )\n  const status = getStatus(nextState, recipientId, effect.statusId)\n",
              "  const existingStatus = getStatus(state, recipientId, effect.statusId)\n  const nextState = applyStatusState(\n    state,\n    actorId,\n    recipientId,\n    effect.statusId,\n    effect.stacks,\n    content,\n  )\n  const status = getStatus(nextState, recipientId, effect.statusId)\n",
          )
          replace(
              'packages/game-core/src/combat/actions.ts',
              "        stacks: status.stacks,\n        remainingOwnerTurnStarts: status.remainingOwnerTurnStarts,\n      },\n",
              "        stacks: status.stacks,\n        remainingOwnerTurnStarts: status.remainingOwnerTurnStarts,\n        refreshed: existingStatus !== null,\n      },\n",
          )

          replace(
              'packages/game-core/src/combat/pvp-quality.ts',
              "      combatantId: actor.id,\n      damageTakenMultiplierBasisPoints: 25_000,\n",
              "      combatantId: actor.id,\n      remainingOwnerTurnStarts: options.loweredGuardDurationOwnerTurnStarts,\n      damageTakenMultiplierBasisPoints: 25_000,\n",
          )
          replace(
              'packages/game-core/src/combat/pvp-quality.test.ts',
              "    expectLoweredGuardDamage(firstMiss.state, firstMiss.events, 'pvp_lowered_guard_applied')\n    expect(loweredGuard(firstMiss.state, 'player')?.remainingOwnerTurnStarts).toBe(1)\n",
              "    expectLoweredGuardDamage(firstMiss.state, firstMiss.events, 'pvp_lowered_guard_applied')\n    expect(firstMiss.events).toEqual(\n      expect.arrayContaining([\n        expect.objectContaining({\n          event: 'pvp_lowered_guard_applied',\n          combatantId: 'player',\n          remainingOwnerTurnStarts: 1,\n        }),\n      ]),\n    )\n    expect(loweredGuard(firstMiss.state, 'player')?.remainingOwnerTurnStarts).toBe(1)\n",
          )

          service = 'apps/web/src/server/battle/battle-log-service.ts'
          replace(service, "...fact(hpAfter === null ? null : `${hpAfter} HP`),", "...fact(hpAfter === null ? null : `${hpAfter} HP remaining`),", 2)
          replace(service, "...fact(cost === null ? null : `${cost} Move`)", "...fact(cost === null ? null : `${cost} Move spent`)")
          replace(
              service,
              "      const remaining = numberValue(event.remainingOwnerTurnStarts)\n      const beneficial = statusId === 'guarded' || statusId?.startsWith('buff.') === true\n      return createEntry(record, eventType, {\n        message: `${combatantLabel(event.targetCombatantId)} gained ${label}${remaining === null ? '' : ` for ${remaining} owner-turn start${remaining === 1 ? '' : 's'}`}.`,\n        messageTemplate: '{target} gained {status}.',\n        templateValues: { status: label },\n",
              "      const remaining = numberValue(event.remainingOwnerTurnStarts)\n      const refreshed = event.refreshed === true\n      const beneficial = statusId === 'guarded' || statusId?.startsWith('buff.') === true\n      return createEntry(record, eventType, {\n        message: refreshed\n          ? `${combatantLabel(event.targetCombatantId)} refreshed ${label}${remaining === null ? '' : ` for ${remaining} owner-turn start${remaining === 1 ? '' : 's'}`}.`\n          : `${combatantLabel(event.targetCombatantId)} gained ${label}${remaining === null ? '' : ` for ${remaining} owner-turn start${remaining === 1 ? '' : 's'}`}.`,\n        messageTemplate: refreshed ? \"{target}'s {status} refreshed.\" : '{target} gained {status}.',\n        templateValues: { status: label, statusChange: refreshed ? 'REFRESHED' : 'APPLIED' },\n",
          )
          replace(service, "        facts: fact('Expired'),\n", "        facts: [],\n")
          replace(service, "...fact(chance === null ? null : `${Math.round(chance / 100)}% hit`),", "...fact(chance === null ? null : `${Math.round(chance / 100)}% hit chance`),")
          replace(
              service,
              "    case 'pvp_turn_timed_out': {\n      const actorCombatantId = stringValue(event.combatantId)\n      const misses = numberValue(event.consecutiveMisses)\n      return createEntry(record, eventType, {\n        message: `${combatantLabel(event.combatantId)} timed out${misses === null ? '' : ` (${misses} tracked miss${misses === 1 ? '' : 'es'})`}.`,\n        messageTemplate: '{actor} timed out.',\n        actorCombatantId,\n        kind: 'turn',\n        headline: 'Turn Timeout',\n        tone: 'warning',\n        facts: fact(\n          misses === null ? 'Timed out' : `${misses} miss${misses === 1 ? '' : 'es'}`,\n          'warning',\n        ),\n      })\n    }\n    case 'pvp_lowered_guard_applied': {\n      const targetCombatantId = stringValue(event.combatantId)\n      return createEntry(record, eventType, {\n        message: `${combatantLabel(event.combatantId)} gained Lowered Guard after the turn timer expired.`,\n        messageTemplate: '{target} gained Lowered Guard.',\n        targetCombatantId,\n        kind: 'status',\n        headline: 'Lowered Guard',\n        tone: 'warning',\n        facts: fact('Lowered Guard', 'warning'),\n      })\n    }\n",
              "    case 'pvp_turn_timed_out':\n    case 'ai_turn_timed_out': {\n      const actorCombatantId = stringValue(event.combatantId)\n      const timeouts = numberValue(event.consecutiveMisses)\n      return createEntry(record, eventType, {\n        message: `${combatantLabel(event.combatantId)} timed out${timeouts === null ? '' : ` (${timeouts} consecutive timeout${timeouts === 1 ? '' : 's'})`}.`,\n        messageTemplate: '{actor} timed out.',\n        actorCombatantId,\n        kind: 'turn',\n        headline: 'Turn Timeout',\n        tone: 'warning',\n        facts:\n          timeouts !== null && timeouts > 1\n            ? fact(`${timeouts} consecutive timeouts`, 'warning')\n            : [],\n      })\n    }\n    case 'pvp_lowered_guard_applied':\n    case 'ai_lowered_guard_applied': {\n      const targetCombatantId = stringValue(event.combatantId)\n      const remaining = numberValue(event.remainingOwnerTurnStarts)\n      const multiplier = numberValue(event.damageTakenMultiplierBasisPoints)\n      const multiplierValue = multiplier === null ? null : multiplier / 10_000\n      const multiplierLabel =\n        multiplierValue === null\n          ? null\n          : `Takes ${multiplierValue.toFixed(2).replace(/\\.0+$/u, '').replace(/(\\.\\d*[1-9])0+$/u, '$1')}× damage`\n      return createEntry(record, eventType, {\n        message: `${combatantLabel(event.combatantId)} gained Lowered Guard after the turn timer expired.`,\n        messageTemplate: '{target} gained Lowered Guard.',\n        targetCombatantId,\n        kind: 'status',\n        headline: 'Lowered Guard',\n        tone: 'warning',\n        facts: [\n          ...fact('Lowered Guard', 'warning'),\n          ...fact(remaining === null ? null : `${remaining} turn${remaining === 1 ? '' : 's'}`),\n          ...fact(multiplierLabel, 'warning'),\n        ],\n      })\n    }\n",
          )

          boundary = 'apps/web/src/components/battle/pvp-battle-client-boundary.tsx'
          replace(boundary, "'use client'\n\n", "'use client'\n\nimport { useMemo } from 'react'\n\n")
          replace(
              boundary,
              "}) {\n  return (\n",
              "}) {\n  const combatantNames = useMemo(\n    () =>\n      Object.fromEntries(\n        metadata.participants.map((participant) => [\n          participant.combatantId,\n          participant.characterName,\n        ]),\n      ),\n    [metadata.participants],\n  )\n\n  return (\n",
          )
          replace(
              boundary,
              "      <DesktopBattleLogDock\n        battleSessionId={initialBattle.battleSessionId}\n        playerName={playerName}\n      />\n",
              "      <DesktopBattleLogDock\n        battleSessionId={initialBattle.battleSessionId}\n        playerName={playerName}\n        combatantNames={combatantNames}\n      />\n",
          )

          dock = 'apps/web/src/components/battle/desktop-battle-log-dock.tsx'
          replace(dock, "  playerName,\n}: {\n  battleSessionId: string\n  playerName?: string\n}) {", "  playerName,\n  combatantNames,\n}: {\n  battleSessionId: string\n  playerName?: string\n  combatantNames?: Readonly<Record<string, string>>\n}) {")
          replace(dock, "        playerName={playerName}\n        dockOnDesktop", "        playerName={playerName}\n        combatantNames={combatantNames}\n        dockOnDesktop")

          panel = 'apps/web/src/components/battle/battle-log-panel.tsx'
          replace(panel, "  playerName?: string\n  dockOnDesktop?: boolean", "  playerName?: string\n  combatantNames?: Readonly<Record<string, string>>\n  dockOnDesktop?: boolean")
          replace(panel, "  playerName,\n  dockOnDesktop = false,", "  playerName,\n  combatantNames,\n  dockOnDesktop = false,")
          replace(panel, "            playerName={effectivePlayerName}\n          />", "            playerName={effectivePlayerName}\n            combatantNames={combatantNames}\n          />", 1)
          replace(panel, "          playerName={effectivePlayerName}\n        />", "          playerName={effectivePlayerName}\n          combatantNames={combatantNames}\n        />", 1)
          replace(panel, "        playerName={effectivePlayerName}\n      />", "        playerName={effectivePlayerName}\n        combatantNames={combatantNames}\n      />", 1)
          replace(panel, "  playerName,\n}: {\n  entries:", "  playerName,\n  combatantNames,\n}: {\n  entries:")
          replace(panel, "  playerName?: string\n}) {", "  playerName?: string\n  combatantNames?: Readonly<Record<string, string>>\n}) {")
          replace(panel, "          playerName={playerName}\n          emptyMessage=", "          playerName={playerName}\n          combatantNames={combatantNames}\n          emptyMessage=")

          presentation = Path('apps/web/src/components/battle/battle-log-presentation.ts')
          text = presentation.read_text()
          text = text.replace(
              "import type {\n  BattleLogEntry,",
              "import {\n  isSkillNarrationVariantValid,\n  type SkillNarrationTemplate,\n} from '@aurevane/game-core/combat/battle-narration'\n\nimport type {\n  BattleLogEntry,",
              1,
          )
          text = text.replace(
              "  combatantNames?: Readonly<Record<string, string>>\n}",
              "  combatantNames?: Readonly<Record<string, string>>\n  skillNarrations?: Readonly<Record<string, SkillNarrationTemplate>>\n}",
              1,
          )
          text = text.replace(
              "interface ActionGroup {\n  battleVersion: number",
              "interface ActionGroup {\n  key: string\n  battleVersion: number",
              1,
          )
          text = text.replace(
              "  if (combatantId.startsWith('character:')) return options.playerName ?? 'Wayfarer'\n",
              "  if (combatantId.startsWith('character:')) {\n    if (options.combatantNames) return 'Opponent'\n    return options.playerName ?? 'Wayfarer'\n  }\n",
              1,
          )

          start = text.index("function groupActions(entries: BattleLogView['entries']): ActionGroup[] {")
          end = text.index("\nfunction findEntry(", start)
          new_group = '''function groupActions(entries: BattleLogView['entries']): ActionGroup[] {\n  const ordered = [...entries].sort((left, right) => {\n    if (left.battleVersion !== right.battleVersion) return right.battleVersion - left.battleVersion\n    return right.eventIndex - left.eventIndex\n  })\n  const rawGroups: Array<{ battleVersion: number; entries: BattleLogEntry[] }> = []\n\n  for (const entry of ordered) {\n    const current = rawGroups.at(-1)\n    if (current?.battleVersion === entry.battleVersion) current.entries.push(entry)\n    else rawGroups.push({ battleVersion: entry.battleVersion, entries: [entry] })\n  }\n\n  return rawGroups.flatMap((group) => {\n    const visible = group.entries.filter((entry) => !BOOKKEEPING_EVENTS.has(entry.eventType))\n    if (visible.length === 0) return []\n\n    const expirations = visible.filter((entry) => entry.eventType === 'status_expired')\n    const mainEntries = visible.filter((entry) => entry.eventType !== 'status_expired')\n    const groups: ActionGroup[] = []\n\n    const addGroup = (groupEntries: BattleLogEntry[], key: string) => {\n      const contextEntry = groupEntries[0]\n      if (!contextEntry) return\n      groups.push({\n        key,\n        battleVersion: group.battleVersion,\n        entries: groupEntries,\n        round:\n          contextEntry.round ?? groupEntries.find((entry) => entry.round !== null)?.round ?? null,\n        turnNumber:\n          contextEntry.turnNumber ??\n          groupEntries.find((entry) => entry.turnNumber !== null)?.turnNumber ??\n          null,\n        occurredAt: contextEntry.occurredAt,\n      })\n    }\n\n    if (mainEntries.length > 0) addGroup(mainEntries, `battle:${group.battleVersion}`)\n    for (const expiration of expirations) {\n      addGroup([expiration], `battle:${group.battleVersion}:expired:${expiration.eventIndex}`)\n    }\n\n    return groups\n  })\n}\n'''
          text = text[:start] + new_group + text[end:]

          old_secondary = '''function statusApplicationSecondary(\n  group: ActionGroup,\n  options: PresentationOptions,\n  consumed: Set<string>,\n): readonly BattleLogSegment[] | null {\n  const candidates = group.entries.filter(\n    (entry) =>\n      entry.eventType === 'status_applied' || entry.eventType === 'pvp_lowered_guard_applied',\n  )\n  const seen = new Set<string>()\n  const entry = candidates.find((candidate) => {\n    const name = statusName(candidate).toLowerCase()\n    if (seen.has(name)) return false\n    seen.add(name)\n    return true\n  })\n  if (!entry) return null\n\n  const name = statusName(entry)\n  const target = combatantName(entry.targetCombatantId, options)\n  const duration = reasonableDurationLabel(entry)\n  const negative = statusIsNegative(name, entry)\n  consumed.add(name.toLowerCase())\n  if (duration) consumed.add(duration.toLowerCase())\n\n  return [\n    segment('↳ '),\n    ...(target ? [segment(target, 'target')] : []),\n    segment(negative ? ' suffers ' : ' gains '),\n    segment(name, 'outcome', negative ? 'warning' : 'benefit'),\n    ...(duration ? [segment(` · ${duration}`)] : []),\n  ]\n}\n'''
          new_secondary = '''function statusApplicationSecondary(\n  group: ActionGroup,\n  options: PresentationOptions,\n  consumed: Set<string>,\n  expectedTargetCombatantId?: string | null,\n): readonly BattleLogSegment[] | null {\n  const candidates = group.entries.filter(\n    (entry) =>\n      (entry.eventType === 'status_applied' ||\n        entry.eventType === 'pvp_lowered_guard_applied' ||\n        entry.eventType === 'ai_lowered_guard_applied') &&\n      (!expectedTargetCombatantId || entry.targetCombatantId === expectedTargetCombatantId),\n  )\n  const seen = new Set<string>()\n  const entry = candidates.find((candidate) => {\n    const name = statusName(candidate).toLowerCase()\n    if (seen.has(name)) return false\n    seen.add(name)\n    return true\n  })\n  if (!entry) return null\n\n  const name = statusName(entry)\n  const target = combatantName(entry.targetCombatantId, options)\n  const duration = reasonableDurationLabel(entry)\n  const refreshed = entry.templateValues.statusChange === 'REFRESHED'\n  const negative = statusIsNegative(name, entry)\n  consumed.add(name.toLowerCase())\n  if (duration) consumed.add(duration.toLowerCase())\n  const durationDisplay =\n    entry.eventType === 'pvp_lowered_guard_applied' && duration === '1 turn'\n      ? 'until next turn'\n      : duration\n\n  if (refreshed) {\n    return [\n      segment('↳ '),\n      ...(target ? [segment(`${target}'s `, 'target')] : []),\n      segment(name, 'outcome', negative ? 'warning' : 'benefit'),\n      segment(' refreshes'),\n      ...(durationDisplay ? [segment(` · ${durationDisplay}`)] : []),\n    ]\n  }\n\n  return [\n    segment('↳ '),\n    ...(target ? [segment(target, 'target')] : []),\n    segment(negative ? ' suffers ' : ' gains '),\n    segment(name, 'outcome', negative ? 'warning' : 'benefit'),\n    ...(durationDisplay ? [segment(` · ${durationDisplay}`)] : []),\n  ]\n}\n'''
          if old_secondary not in text:
              raise SystemExit('battle-log-presentation.ts: statusApplicationSecondary block not found')
          text = text.replace(old_secondary, new_secondary, 1)

          attack_start = text.index('function attackSegments(')
          attack_end = text.index('\nfunction movementDestination', attack_start)
          new_attack = '''type AttackNarrationOutcome = 'hit' | 'miss' | 'critical'\n\nfunction narratedAttackSegments(\n  template: string,\n  values: { actor: string; target: string; ability: string; damage: string },\n  tone: BattleLogTone,\n): readonly BattleLogSegment[] | null {\n  if (!isSkillNarrationVariantValid(template)) return null\n\n  const tokenPattern = /\\{(actor|target|ability|damage)\\}/gu\n  const segments: BattleLogSegment[] = []\n  let cursor = 0\n  for (const match of template.matchAll(tokenPattern)) {\n    const index = match.index ?? 0\n    if (index > cursor) segments.push(segment(template.slice(cursor, index)))\n    const token = match[1] as keyof typeof values\n    const value = values[token]\n    if (!value) return null\n    if (token === 'actor') segments.push(segment(value, 'actor'))\n    else if (token === 'target') segments.push(segment(value, 'target'))\n    else if (token === 'ability') segments.push(segment(value, 'action'))\n    else segments.push(segment(value, 'outcome', tone))\n    cursor = index + match[0].length\n  }\n  if (cursor < template.length) segments.push(segment(template.slice(cursor)))\n  return segments.length > 0 ? segments : null\n}\n\nfunction attackSegments(\n  actor: string | null,\n  target: string | null,\n  actionId: string | null,\n  actionLabel: string | null,\n  outcome: string,\n  tone: BattleLogTone,\n  narrationOutcome: AttackNarrationOutcome,\n  options: PresentationOptions,\n): readonly BattleLogSegment[] {\n  const safeActor = actor ?? 'Combatant'\n  const safeTarget = target ?? 'the target'\n  const basic = !actionLabel || actionLabel === 'Basic Attack'\n  const authored = actionId ? options.skillNarrations?.[actionId]?.[narrationOutcome] : undefined\n\n  if (authored) {\n    const narrated = narratedAttackSegments(\n      authored,\n      {\n        actor: safeActor,\n        target: safeTarget,\n        ability: actionLabel ?? 'Attack',\n        damage: outcome,\n      },\n      tone,\n    )\n    if (narrated) {\n      return authored.includes('{damage}')\n        ? narrated\n        : [...narrated, segment(' — '), segment(outcome, 'outcome', tone)]\n    }\n  }\n\n  if (basic) {\n    return [\n      segment(safeActor, 'actor'),\n      segment(' strikes '),\n      segment(safeTarget, 'target'),\n      segment(' — '),\n      segment(outcome, 'outcome', tone),\n    ]\n  }\n\n  return [\n    segment(safeActor, 'actor'),\n    segment(' uses '),\n    segment(actionLabel, 'action'),\n    segment(' on '),\n    segment(safeTarget, 'target'),\n    segment(' — '),\n    segment(outcome, 'outcome', tone),\n  ]\n}\n'''
          text = text[:attack_start] + new_attack + text[attack_end:]

          text = text.replace(
              "    secondary = statusApplicationSecondary(group, options, consumed)\n    kind = 'turn'",
              "    secondary = statusApplicationSecondary(\n      group,\n      options,\n      consumed,\n      timeout.actorCombatantId,\n    )\n    kind = 'turn'",
              1,
          )
          text = text.replace(
              "    primary = attackSegments(actor, target, actionLabel, 'Miss', 'warning')\n",
              "    primary = attackSegments(\n      actor,\n      target,\n      resolved.actionId,\n      actionLabel,\n      'Miss',\n      'warning',\n      'miss',\n      options,\n    )\n",
              1,
          )
          text = text.replace(
              "    secondary = statusApplicationSecondary(group, options, consumed)\n  } else if (damage) {",
              "    secondary = statusApplicationSecondary(\n      group,\n      options,\n      consumed,\n      resolved.targetCombatantId,\n    )\n  } else if (damage) {",
              1,
