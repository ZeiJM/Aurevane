name: One-shot Final Facing visibility fix

on:
  push:
    branches:
      - agent/battle-input-responsive-consistency-v3
    paths:
      - .github/workflows/one-shot-final-facing-css-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/battle-input-responsive-consistency-v3
          fetch-depth: 0

      - name: Patch Final Facing visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/unified-battle-experience.module.css')
          text = path.read_text()
          marker = "/* Final Facing must remain visible whenever BattleExperience opens the facing pad. */"
          if marker not in text:
              text += "\n\n" + marker + "\n:global(\n  main[data-unified-battle='true']\n    [data-unified-command-deck='true']\n    > [data-unified-facing-pad='true'][data-open='true']\n) {\n  display: grid !important;\n}\n"
          path.write_text(text)
          PY

      - name: Format owned stylesheet
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm exec prettier --write apps/web/src/components/battle/unified-battle-experience.module.css

      - name: Commit fix and remove temporary diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-finish-turn-dom-diagnostic.yml
          rm -f .github/workflows/one-shot-final-facing-css-fix.yml
          git config user.name 'aurevane-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web/src/components/battle/unified-battle-experience.module.css .github/workflows
          git commit -m 'fix: keep Final Facing visible when opened'
          git push origin HEAD:agent/battle-input-responsive-consistency-v3
