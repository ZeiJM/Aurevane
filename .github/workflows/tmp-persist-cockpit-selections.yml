name: Persist Battle Cockpit Selections

on:
  push:
    branches:
      - content/foundation-trio-skills-20260907
    paths:
      - '.github/workflows/tmp-persist-cockpit-selections.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/foundation-trio-skills-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Persist all cockpit selector choices by battle session
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/battle-experience.tsx')
          text = path.read_text(encoding='utf-8')

          category_constant = """const BATTLE_SKILL_CATEGORIES = {
  heal: {
    defaultSkillId: RECOVER_ID,
    skillIds: HEAL_SELECTOR_OPTIONS.map((option) => option.id),
  },
} as const

"""
          if category_constant not in text:
              raise SystemExit('Legacy battle skill category constant not found')
          text = text.replace(category_constant, '', 1)

          start_marker = """  const { selectedSkillId, selectSkill } = useBattleSkillSelections(
    initialBattle.battleSessionId,
    BATTLE_SKILL_CATEGORIES,
  )
"""
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Legacy cockpit selection hook block not found')
          end = text.find('  const attackOptions = [\n', start)
          if end < 0:
              raise SystemExit('Attack options marker not found')

          replacement = """  const attackTechniques =
    runtime.techniques?.filter((technique) => technique.category === 'attack') ?? []
  const defenseTechniques =
    runtime.techniques?.filter((technique) => technique.category === 'defense') ?? []
  const healTechniques =
    runtime.techniques?.filter((technique) => technique.category === 'heal') ?? []
  const battleSkillCategories = {
    attack: {
      defaultSkillId: BASIC_ATTACK_ID,
      skillIds: [
        BASIC_ATTACK_ID,
        ...attackTechniques.map((technique) => technique.id),
        ...(runtime.essence ? [runtime.essence.id] : []),
      ],
    },
    defense: {
      defaultSkillId: GUARD_ID,
      skillIds: [GUARD_ID, ...defenseTechniques.map((technique) => technique.id)],
    },
    recovery: {
      defaultSkillId: RECOVER_ID,
      skillIds: [
        ...HEAL_SELECTOR_OPTIONS.map((option) => option.id),
        ...healTechniques.map((technique) => technique.id),
      ],
    },
  } as const
  const { selectedSkillId, selectSkill } = useBattleSkillSelections(
    initialBattle.battleSessionId,
    battleSkillCategories,
  )
  const selectedAttackActionId = selectedSkillId('attack')
  const selectedDefenseActionId = selectedSkillId('defense')

"""
          text = text[:start] + replacement + text[end:]

          old_effective = '  const effectiveHealActionId = selectedTechniqueHealId ?? selectedHealActionId\n'
          if old_effective not in text:
              raise SystemExit('Legacy effective recovery selection not found')
          text = text.replace(
              old_effective,
              "  const effectiveHealActionId = selectedSkillId('recovery')\n",
              1,
          )

          if 'setSelectedAttackActionId(actionId)' not in text:
              raise SystemExit('Attack selector setter not found')
          text = text.replace(
              'setSelectedAttackActionId(actionId)',
              "selectSkill('attack', actionId)",
              1,
          )

          if 'setSelectedDefenseActionId(actionId)' not in text:
              raise SystemExit('Defense selector setter not found')
          text = text.replace(
              'setSelectedDefenseActionId(actionId)',
              "selectSkill('defense', actionId)",
              1,
          )

          recovery_block = """                  if (skillId === RECOVER_ID || skillId === MP_RECOVER_ID) {
                    setSelectedTechniqueHealId(null)
                    selectSkill('heal', skillId)
                  } else {
                    setSelectedTechniqueHealId(skillId)
                  }
"""
          if recovery_block not in text:
              raise SystemExit('Recovery selector legacy branch not found')
          text = text.replace(
              recovery_block,
              "                  selectSkill('recovery', skillId)\n",
              1,
          )

          path.write_text(text, encoding='utf-8')

          test_path = Path('apps/web/src/components/battle/battle-skill-selection.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_definitions = """const definitions = {
  attack: {
    defaultSkillId: 'basic-attack',
    skillIds: ['basic-attack', 'heavy-attack'],
  },
  heal: {
    defaultSkillId: 'hp-recovery',
    skillIds: ['hp-recovery', 'mp-recovery'],
  },
} as const
"""
          new_definitions = """const definitions = {
  attack: {
    defaultSkillId: 'basic-attack',
    skillIds: ['basic-attack', 'heavy-attack'],
  },
  defense: {
    defaultSkillId: 'guard',
    skillIds: ['guard', 'barrier'],
  },
  recovery: {
    defaultSkillId: 'hp-recovery',
    skillIds: ['hp-recovery', 'mp-recovery', 'mending-light'],
  },
} as const
"""
          if old_definitions not in test:
              raise SystemExit('Skill selection test definitions not found')
          test = test.replace(old_definitions, new_definitions, 1)
          test = test.replace(
              """    writeBattleSkillSelections(storage, battleSessionId, {
      attack: 'heavy-attack',
      heal: 'mp-recovery',
    })

    expect(readBattleSkillSelections(storage, battleSessionId)).toEqual({
      attack: 'heavy-attack',
      heal: 'mp-recovery',
    })
""",
              """    writeBattleSkillSelections(storage, battleSessionId, {
      attack: 'heavy-attack',
      defense: 'barrier',
      recovery: 'mending-light',
    })

    expect(readBattleSkillSelections(storage, battleSessionId)).toEqual({
      attack: 'heavy-attack',
      defense: 'barrier',
      recovery: 'mending-light',
    })
""",
              1,
          )
          test = test.replace(
              "writeBattleSkillSelections(storage, 'battle-one', { heal: 'mp-recovery' })",
              "writeBattleSkillSelections(storage, 'battle-one', { recovery: 'mp-recovery' })",
              1,
          )
          test = test.replace(
              """    ).toEqual({
      attack: 'basic-attack',
      heal: 'hp-recovery',
    })
""",
              """    ).toEqual({
      attack: 'basic-attack',
      defense: 'guard',
      recovery: 'hp-recovery',
    })
""",
              1,
          )
          test = test.replace(
              "resolveBattleSkillSelections({ attack: 'removed-skill', heal: 'mp-recovery' }, definitions)",
              "resolveBattleSkillSelections(\n        { attack: 'removed-skill', defense: 'barrier', recovery: 'mp-recovery' },\n        definitions,\n      )",
              1,
          )
          test = test.replace(
              """    ).toEqual({
      attack: 'basic-attack',
      heal: 'mp-recovery',
    })
""",
              """    ).toEqual({
      attack: 'basic-attack',
      defense: 'barrier',
      recovery: 'mp-recovery',
    })
""",
              1,
          )
          test_path.write_text(test, encoding='utf-8')
          PY

          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/battle/battle-skill-selection.test.ts
          pnpm exec vitest run \
            apps/web/src/components/battle/battle-skill-selection.test.ts \
            apps/web/src/components/battle/battle-session-ui-state.test.ts
          pnpm --filter @aurevane/web typecheck

          git config user.name "Aurevane Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/battle/battle-skill-selection.test.ts
          git commit -m "Persist cockpit skill selections for the battle"
          git push origin HEAD:content/foundation-trio-skills-20260907
