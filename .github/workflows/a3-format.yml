name: A3 format helper

on:
  push:
    branches:
      - agent/a3-holistic-player-feedback

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[a3-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a3-holistic-player-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format A3 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-completion-panel.module.css \
            apps/web/src/components/battle/battle-completion-panel.tsx \
            apps/web/src/components/battle/battle-feedback-assist.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-launch.tsx \
            apps/web/src/components/battle/battle-lesson-coach.module.css \
            apps/web/src/components/battle/battle-lesson-coach.tsx \
            apps/web/src/components/battle/mobile-battle-combatant-popup.tsx \
            apps/web/src/components/social/online-users-directory.module.css \
            apps/web/src/components/social/online-users-directory.tsx \
            apps/web/src/server/battle/guided-training-completion-service.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/battle apps/web/src/components/social apps/web/src/server/battle/guided-training-completion-service.ts
          git commit -m "chore: format A3 changes [a3-format]"
          git push origin HEAD:agent/a3-holistic-player-feedback
