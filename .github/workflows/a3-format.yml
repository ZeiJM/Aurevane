name: A3 roster format helper

on:
  push:
    branches:
      - agent/a3-holistic-player-feedback

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[a3-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a3-holistic-player-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format final roster files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-select-shell.module.css \
            apps/web/src/components/character/character-select-shell.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/character/character-select-shell.module.css apps/web/src/components/character/character-select-shell.tsx
          git commit -m "chore: format final A3 roster files [a3-format]"
          git push origin HEAD:agent/a3-holistic-player-feedback
