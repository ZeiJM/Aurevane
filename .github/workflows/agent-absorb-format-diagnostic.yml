name: Absorb HP isolated verification

on:
  push:
    branches:
      - agent/absorb-hp-format-diagnostic-20260915

permissions:
  contents: read

jobs:
  focused-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7cbe2ee1d08f5fd4671598c50c6e87e4241d350f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact checkout and focused Absorb contracts
        run: |
          test "$(git rev-parse HEAD)" = 7cbe2ee1d08f5fd4671598c50c6e87e4241d350f
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-absorb-hp.test.ts src/combat/combat-absorb-hp-command.test.ts src/combat/combat-damage-history-runtime.test.ts src/combat/combat-barrier.test.ts src/combat/combat-resolution-provenance.test.ts src/combat/combat-burn-backlash.test.ts src/combat/combat-dot-rework.test.ts
      - name: Verify game-core types
        run: pnpm --filter @aurevane/game-core typecheck
      - name: Verify repository formatting and lint
        run: |
          pnpm format:check
          pnpm lint
      - name: Verify exact scope and source hygiene
        run: |
          git diff --check 6ba57e8fab8bac3f68efd0dd04a3a43786c5dd53...HEAD
          git diff --exit-code 6ba57e8fab8bac3f68efd0dd04a3a43786c5dd53...HEAD -- packages/game-core/src/combat/actions-legacy.ts apps .github
          git diff --name-only 6ba57e8fab8bac3f68efd0dd04a3a43786c5dd53...HEAD
          git diff --exit-code
