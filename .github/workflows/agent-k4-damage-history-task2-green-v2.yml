name: Apply and verify K4 damage-history resolver wiring v2

on:
  push:
    branches:
      - agent/combat-k4-damage-history-20260914
    paths:
      - .github/workflows/agent-k4-damage-history-task2-green-v2.yml

permissions:
  contents: write

concurrency:
  group: combat-k4-damage-history-task2-green-v2
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply minimal provenance-aware ledger wiring
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          history = 'packages/game-core/src/combat/combat-damage-history.ts'
          replace_once(
              history,
              """export interface RecordCombatDamageHistoryInput {\n  targetCombatantId: string\n  amount: number\n  provenance: DamageProvenance\n}""",
              """export interface RecordCombatDamageHistoryInput {\n  targetCombatantId: string\n  amount: number\n  provenance: DamageProvenance\n  round?: number\n}""",
          )
          replace_once(
              history,
              """  const effectState = normalizeCombatEffectState(state.effectState)\n  const round = activeRound(state)\n  const minimumRound = Math.max(1, round - (DAMAGE_HISTORY_WINDOW_ROUNDS - 1))\n  const damageHistory = effectState.damageHistory\n    .filter((entry) => entry.round >= minimumRound && entry.round <= round)""",
              """  const effectState = normalizeCombatEffectState(state.effectState)\n  const activeBattleRound = activeRound(state)\n  const round = input.round ?? activeBattleRound\n  assertRecordableRound(round, activeBattleRound)\n  const minimumRound = Math.max(1, activeBattleRound - (DAMAGE_HISTORY_WINDOW_ROUNDS - 1))\n  const damageHistory = effectState.damageHistory\n    .filter((entry) => entry.round >= minimumRound && entry.round <= activeBattleRound)""",
          )
          replace_once(
              history,
              """function assertActualDamage(amount: number): void {\n  if (!Number.isSafeInteger(amount) || amount < 0) {\n    throw new RangeError('Combat damage-history amount must be a non-negative safe integer.')\n  }\n}""",
              """function assertRecordableRound(round: number, activeBattleRound: number): void {\n  const minimumRound = Math.max(1, activeBattleRound - (DAMAGE_HISTORY_WINDOW_ROUNDS - 1))\n  if (!Number.isSafeInteger(round) || round < minimumRound || round > activeBattleRound) {\n    throw new RangeError('Combat damage-history round must be inside the active three-round window.')\n  }\n}\n\nfunction assertActualDamage(amount: number): void {\n  if (!Number.isSafeInteger(amount) || amount < 0) {\n    throw new RangeError('Combat damage-history amount must be a non-negative safe integer.')\n  }\n}""",
          )

          actions = 'packages/game-core/src/combat/actions-legacy.ts'
          replace_once(
              actions,
              "import type { CombatEffectState } from './combat-effect-state'",
              "import { recordCombatDamageHistory } from './combat-damage-history'\nimport type { CombatEffectState, DamageProvenance } from './combat-effect-state'",
          )
          replace_once(
              actions,
              """  const outgoingId = state.tactical.battle.currentTurn!.combatantId\n  const outgoing = getCombatant(state.tactical.battle, outgoingId)""",
              """  const outgoingId = state.tactical.battle.currentTurn!.combatantId\n  const outgoingRound = state.tactical.battle.round\n  const outgoing = getCombatant(state.tactical.battle, outgoingId)""",
          )
          replace_once(
              actions,
              "  const periodic = resolveEndOfTurnStatuses(nextState, outgoingId, content)",
              "  const periodic = resolveEndOfTurnStatuses(nextState, outgoingId, content, outgoingRound)",
          )
          replace_once(
              actions,
              "  const currentDots = resolveCurrentEndOfTurnDots(nextState, outgoingId, content)",
              """  const currentDots = resolveCurrentEndOfTurnDots(\n    nextState,\n    outgoingId,\n    content,\n    outgoingRound,\n  )""",
          )
          replace_once(
              actions,
              """  if (hpAfter === 0) {\n    const defeated = defeatCurrentCombatant(state.tactical.battle, actorId)\n    return {\n      state: withBattle(state, defeated.state),\n      events: [damageEvent, ...defeated.events],\n    }\n  }\n  return {\n    state: withUpdatedCombatant(state, actorId, { ...actor, hp: hpAfter }),\n    events: [damageEvent],\n  }""",
              """  if (hpAfter === 0) {\n    const defeated = defeatCurrentCombatant(state.tactical.battle, actorId)\n    const defeatedState = withBattle(state, defeated.state)\n    return {\n      state: recordCommittedDamage(\n        defeatedState,\n        actorId,\n        actorId,\n        'status.burn.backlash.current.v1',\n        actor.hp - hpAfter,\n        'self-cost',\n      ),\n      events: [damageEvent, ...defeated.events],\n    }\n  }\n  const updated = withUpdatedCombatant(state, actorId, { ...actor, hp: hpAfter })\n  return {\n    state: recordCommittedDamage(\n      updated,\n      actorId,\n      actorId,\n      'status.burn.backlash.current.v1',\n      actor.hp - hpAfter,\n      'self-cost',\n    ),\n    events: [damageEvent],\n  }""",
          )
          replace_once(
              actions,
              """    return {\n      state: removed.state,\n      events: [\n        {\n          event: 'damage_applied',\n          actionId,\n          sourceCombatantId: actorId,\n          targetCombatantId: recipientId,\n          amount: target.hp - hpAfter,\n          hpBefore: target.hp,\n          hpAfter,\n        },\n        ...removed.events,\n      ],\n    }""",
              """    const damage = target.hp - hpAfter\n    const stateWithHistory = recordCommittedDamage(\n      removed.state,\n      actorId,\n      recipientId,\n      actionId,\n      damage,\n      'direct-hostile',\n    )\n    return {\n      state: stateWithHistory,\n      events: [\n        {\n          event: 'damage_applied',\n          actionId,\n          sourceCombatantId: actorId,\n          targetCombatantId: recipientId,\n          amount: damage,\n          hpBefore: target.hp,\n          hpAfter,\n        },\n        ...removed.events,\n      ],\n    }""",
          )
          replace_once(
              actions,
              """function resolveEndOfTurnStatuses(\n  state: CombatEncounterState,\n  combatantId: string,\n  content: CombatContentCatalog,\n): CombatResolutionTransition {""",
              """function resolveEndOfTurnStatuses(\n  state: CombatEncounterState,\n  combatantId: string,\n  content: CombatContentCatalog,\n  damageRound: number,\n): CombatResolutionTransition {""",
          )
          replace_once(
              actions,
              """      nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n      events.push({\n        event: definition.endOfTurn.type === 'damage' ? 'damage_applied' : 'healing_applied',""",
              """      nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n      if (definition.endOfTurn.type === 'damage') {\n        nextState = recordCommittedDamage(\n          nextState,\n          status.sourceCombatantId,\n          combatantId,\n          `status.${status.statusId}`,\n          target.hp - hpAfter,\n          'periodic-hostile',\n          damageRound,\n        )\n      }\n      events.push({\n        event: definition.endOfTurn.type === 'damage' ? 'damage_applied' : 'healing_applied',""",
          )
          replace_once(
              actions,
              """function resolveCurrentEndOfTurnDots(\n  state: CombatEncounterState,\n  combatantId: string,\n  content: CombatContentCatalog,\n): CombatResolutionTransition {""",
              """function resolveCurrentEndOfTurnDots(\n  state: CombatEncounterState,\n  combatantId: string,\n  content: CombatContentCatalog,\n  damageRound: number,\n): CombatResolutionTransition {""",
          )
          replace_once(
              actions,
              """    const hpAfter = Math.max(0, target.hp - CURRENT_POISON_DAMAGE)\n    nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n    events.push({""",
              """    const hpAfter = Math.max(0, target.hp - CURRENT_POISON_DAMAGE)\n    nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n    nextState = recordCommittedDamage(\n      nextState,\n      poison.sourceCombatantId,\n      combatantId,\n      poison.sourceActionId,\n      target.hp - hpAfter,\n      'periodic-hostile',\n      damageRound,\n    )\n    events.push({""",
          )
          replace_once(
              actions,
              """    const hpAfter = Math.max(0, target.hp - stack.damagePerTick)\n    nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n    events.push({""",
              """    const hpAfter = Math.max(0, target.hp - stack.damagePerTick)\n    nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n    nextState = recordCommittedDamage(\n      nextState,\n      stack.sourceCombatantId,\n      combatantId,\n      stack.sourceActionId,\n      target.hp - hpAfter,\n      'periodic-hostile',\n      damageRound,\n    )\n    events.push({""",
          )
          replace_once(
              actions,
              """    const hpAfter = Math.max(0, target.hp - burnTurn.damage)\n    nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n    events.push({""",
              """    const hpAfter = Math.max(0, target.hp - burnTurn.damage)\n    nextState = withUpdatedCombatant(nextState, combatantId, { ...target, hp: hpAfter })\n    nextState = recordCommittedDamage(\n      nextState,\n      burnTurn.instance.sourceCombatantId,\n      combatantId,\n      burnTurn.instance.sourceActionId,\n      target.hp - hpAfter,\n      'periodic-hostile',\n      damageRound,\n    )\n    events.push({""",
          )
          replace_once(
              actions,
              "function scaleByBasisPoints(value: number, basisPoints: number): number {",
              """function recordCommittedDamage(\n  state: CombatEncounterState,\n  sourceCombatantId: string,\n  targetCombatantId: string,\n  sourceActionId: string,\n  amount: number,\n  requestedKind: Extract<\n    DamageProvenance['kind'],\n    'direct-hostile' | 'periodic-hostile' | 'self-cost'\n  >,\n  round?: number,\n): CombatEncounterState {\n  let kind: DamageProvenance['kind'] = requestedKind\n  if (requestedKind !== 'self-cost') {\n    const source = getCombatant(state.tactical.battle, sourceCombatantId)\n    const target = getCombatant(state.tactical.battle, targetCombatantId)\n    if (sourceCombatantId === targetCombatantId || source.teamId === target.teamId) kind = 'system'\n  }\n\n  return recordCombatDamageHistory(state, {\n    targetCombatantId,\n    amount,\n    round,\n    provenance: {\n      kind,\n      sourceCombatantId,\n      sourceActionId,\n      commandExecutionId: null,\n    },\n  })\n}\n\nfunction scaleByBasisPoints(value: number, basisPoints: number): number {""",
          )
          PY
          pnpm exec prettier --write packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-damage-history.ts
          git diff --check

      - name: Run focused damage-history contracts
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-damage-history.test.ts src/combat/combat-damage-history-runtime.test.ts

      - name: Run game-core typecheck
        run: pnpm --filter @aurevane/game-core typecheck

      - name: Run full repository quality gate
        run: pnpm check

      - name: Commit verified resolver wiring without staging workflows
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k4-damage-history-20260914
          git diff --check
          git rm .github/workflows/agent-k4-damage-history-task2-green.yml .github/workflows/agent-k4-damage-history-task2-green-v2.yml
          git add packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-damage-history.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire authoritative damage history provenance'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          echo "Verified Task 2 commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
