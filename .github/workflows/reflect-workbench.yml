name: Reflect isolated verification
on:
  push:
    branches: [agent/reflect-workbench-20260915]
permissions:
  contents: read
jobs:
  review-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df825910e89d64f46c22d7d6c2d1b7c69d41b8f5
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify additional outcomes on the unchanged candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = df825910e89d64f46c22d7d6c2d1b7c69d41b8f5
          test "$(git rev-parse HEAD^{tree})" = c1b439bc550e06335eb64e1c055706f8c341325c
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('packages/game-core/src/combat/combat-reflect.test.ts')
          original = p.read_bytes()
          additions = '''
          import { applyCommittedReflect } from './combat-reflect'
          import { applyCommittedAbsorbRecovery } from './combat-absorb-recovery'
          import { collectCommittedHostileCommandDamage } from './combat-committed-damage'
          import { createStatDrivenCombatEncounterState, executeStatDrivenAttack, validateStatDrivenCombatEncounterState } from './stat-driven-combat'

          const outcomeVectors = [1, 250, 2_500, 6_000, 10_000].flatMap((rate) =>
            [0, 1, 3, 7, 20, 99, 200].flatMap((damage) =>
              [1, 3, 5, 100].flatMap((actorHp) =>
                [1, 20, 100].map((targetHp) => ({ rate, damage, actorHp, targetHp })))))
          it.each(outcomeVectors)('review outcome matrix %j', ({ rate, damage, actorHp, targetHp }) => {
            const definition = reflectStatus(rate)
            const initial = encounter({ actorHp, targetHp, duel: true, targetStatuses: [definition] })
            const snapshot = JSON.stringify(initial)
            const result = cast(initial, hit(damage), [definition])
            const actual = Math.min(targetHp, damage)
            const returned = Math.min(actorHp, Math.floor(actual * rate / 10_000))
            const expectedActor = actorHp - returned
            const expectedTarget = targetHp - actual
            expect(unit(result, 'actor').hp).toBe(expectedActor)
            expect(unit(result, 'target').hp).toBe(expectedTarget)
            expect(reflected(result)).toHaveLength(returned > 0 ? 1 : 0)
            expect(reflected(result).reduce((sum, event) => sum + (event.event === 'damage_applied' ? event.amount : 0), 0)).toBe(returned)
            expect(result.state.effectState?.damageHistory ?? []).toEqual(actual > 0 ? [{ combatantId: 'target', round: 1, amount: actual }] : [])
            const terminal = expectedActor === 0 || expectedTarget === 0
            expect(completion(result)).toEqual(terminal ? [{ event: 'battle_completed', winningTeamId: expectedActor === 0 ? (expectedTarget === 0 ? null : 'enemies') : 'players' }] : [])
            expect(result.state.tactical.battle.lifecycle).toBe(terminal ? 'completed' : 'active')
            expect(validateCombatEncounterState(result.state)).toEqual([])
            expect(JSON.stringify(initial)).toBe(snapshot)
            expect(result.state.tactical.battle.rng).toEqual(initial.tactical.battle.rng)
          })
          it.each([0, 10_000])('review stat-driven attack hit/miss accuracy %s', (accuracy) => {
            const base = encounter({ actorHp: 3, duel: true })
            const initial = createStatDrivenCombatEncounterState(base, base.tactical.battle.combatants.map((combatant) => ({
              combatantId: combatant.id, provenance: { kind: 'scenario', sourceId: `review:${combatant.id}`, sourceRulesVersion: 1 },
              accuracy, evasion: 0, armor: 0, ward: 0, jump: 0,
            })))
            const before = JSON.stringify(initial)
            const action: CombatActionDefinition = { ...hit(), sourceType: 'basic-attack', cost: { spendsAction: true, mp: 0 } }
            const result = executeStatDrivenAttack(initial, action, { kind: 'unit', combatantId: 'target' }, { statuses: [REFLECT] })
            expect(result.state.tactical.battle.combatants.find((row) => row.id === 'actor')?.hp).toBe(accuracy === 0 ? 3 : 0)
            expect(result.state.tactical.battle.combatants.find((row) => row.id === 'target')?.hp).toBe(accuracy === 0 ? 100 : 80)
            expect(result.events.filter((event) => event.event === 'damage_applied' && event.actionId === 'status.reflect.current.v1')).toHaveLength(accuracy === 0 ? 0 : 1)
            expect(result.events.filter((event) => event.event === 'battle_completed')).toEqual(accuracy === 0 ? [] : [{ event: 'battle_completed', winningTeamId: 'enemies' }])
            expect(validateStatDrivenCombatEncounterState(result.state)).toEqual([])
            expect(JSON.stringify(initial)).toBe(before)
          })
          it('review helper does not accept unrelated source/action/system-shaped events', () => {
            const initial = encounter({ actorStatuses: [REFLECT, ABSORB] })
            const content = { statuses: [REFLECT, ABSORB] }
            const action = hit()
            const committed = legacy.executeCombatAction(initial, action, { kind: 'unit', combatantId: 'target' }, content)
            const event = committed.events.find((candidate) => candidate.event === 'damage_applied')
            if (!event || event.event !== 'damage_applied') throw new Error('Missing committed damage')
            const command = { sourceCombatantId: 'actor', actionId: action.id }
            const exclusions = [
              { ...event, actionId: 'status.reflect.current.v1' },
              { ...event, actionId: 'status.system.damage' },
              { ...event, actionId: 'status.burn.backlash.current.v1' },
              { ...event, sourceCombatantId: 'witness' },
              { ...event, targetCombatantId: 'actor' },
              { ...event, targetCombatantId: 'missing' },
              { ...event, amount: 0 },
            ]
            expect([...collectCommittedHostileCommandDamage(committed.state, exclusions, command)]).toEqual([])
            const guard = createCombatTriggerGuard({ triggerChainId: 'review:filter' })
            const filtered = applyCommittedReflect(committed.state, exclusions, content, command, guard)
            expect(filtered.state).toBe(committed.state)
            expect(filtered.events).toEqual([])
            expect(filtered.triggerGuard).toBe(guard)
            const reflected = applyCommittedReflect(committed.state, committed.events, content, command, guard)
            expect(unit(reflected, 'actor')).toMatchObject({ hp: 95, mp: 10 })
            const repeat = applyCommittedReflect(reflected.state, reflected.events, content, command)
            expect(repeat.state).toBe(reflected.state)
            expect(repeat.events).toEqual([])
            expect(applyCommittedAbsorbRecovery(reflected.state, reflected.events, content, command).state).toBe(reflected.state)
            expect(applyCommittedReflect(committed.state, committed.events, content, { ...command, sourceCombatantId: 'missing' }, guard).state).toBe(committed.state)
          })
          it('review shared collector rejects non-integer or overflowing trusted receipts', () => {
            const state = encounter()
            const action = hit()
            const committed = legacy.executeCombatAction(state, action, { kind: 'unit', combatantId: 'target' }, { statuses: [REFLECT] })
            const event = committed.events.find((candidate) => candidate.event === 'damage_applied')
            if (!event || event.event !== 'damage_applied') throw new Error('Missing committed damage')
            const command = { sourceCombatantId: 'actor', actionId: action.id }
            for (const amount of [0.5, NaN, Infinity]) {
              expect(() => collectCommittedHostileCommandDamage(committed.state, [{ ...event, amount }], command)).toThrow(/safe integer/)
            }
            expect(() => collectCommittedHostileCommandDamage(committed.state, [{ ...event, amount: Number.MAX_SAFE_INTEGER }, { ...event, amount: 1 }], command)).toThrow(/safe integer/)
          })
          it('review reflection preserves new status provenance when the attacker dies', () => {
            const mark: CombatStatusDefinition = { id: 'review.mark', version: 1, maximumStacks: 1, durationOwnerTurnStarts: 2, damageTakenMultiplierBasisPoints: 10_000 }
            const action = hit()
            action.effects = [...action.effects, { type: 'apply-status', recipient: 'primary-unit', statusId: mark.id, stacks: 1 }]
            const original = context()
            const result = cast(encounter({ actorHp: 3, allyWitness: true }), action, [REFLECT, mark], original)
            const applied = result.state.statusState.find((row) => row.combatantId === 'target')?.statuses.find((status) => status.statusId === mark.id)
            expect(applied?.provenance).toMatchObject({ action: original.provenance, effectOrdinal: 1, createdRound: 1, createdTurn: 1, targetCombatantId: 'target' })
            expect(result.resolution?.triggerGuard.remainingReactionBudget).toBe(31)
            expect(validateCombatEncounterState(result.state)).toEqual([])
          })
          it('review ordinary healing does not shrink the original reflection basis', () => {
            const action = hit()
            action.effects = [...action.effects, { type: 'healing', recipient: 'primary-unit', amount: 20 }]
            const result = cast(encounter(), action)
            expect(unit(result, 'target').hp).toBe(100)
            expect(unit(result, 'actor').hp).toBe(95)
            expect(result.state.effectState?.damageHistory).toEqual([{ combatantId: 'target', round: 1, amount: 20 }])
          })
          '''
          try:
              p.write_bytes(original + additions.encode())
              subprocess.run(['pnpm','--filter','@aurevane/game-core','typecheck'], check=True)
              subprocess.run(['pnpm','--filter','@aurevane/game-core','exec','vitest','run',
                'src/combat/combat-reflect.test.ts','src/combat/combat-absorb-mp.test.ts',
                'src/combat/combat-absorb-hp.test.ts','src/combat/combat-absorb-hp-command.test.ts',
                'src/combat/combat-barrier.test.ts','src/combat/combat-damage-history-runtime.test.ts',
                'src/combat/combat-resolution-provenance.test.ts','src/combat/combat-burn-backlash.test.ts',
                'src/combat/combat-dot-rework.test.ts'], check=True)
          finally:
              p.write_bytes(original)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Review source and publication boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --check c2c41be224d22f532d551506037ac86835452691...HEAD
          git diff --exit-code c2c41be224d22f532d551506037ac86835452691...HEAD -- apps .github pnpm-lock.yaml packages/game-core/src/combat/status-content.ts packages/game-core/src/combat/stat-driven-combat.ts packages/game-core/src/combat/battle-state.ts packages/game-core/src/combat/combat-effect-provenance.ts
          test "$(git rev-parse HEAD)" = df825910e89d64f46c22d7d6c2d1b7c69d41b8f5
          test "$(git rev-parse HEAD^{tree})" = c1b439bc550e06335eb64e1c055706f8c341325c
          git diff --exit-code
