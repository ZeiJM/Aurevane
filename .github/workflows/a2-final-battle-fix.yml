name: A2 Final Battle Fix

on:
  push:
    branches:
      - "agent/a2-feedback-holistic"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a2-feedback-holistic
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Move directional input into authoritative battle state
        shell: python
        run: |
          from pathlib import Path
          import re

          assist = Path('apps/web/src/components/battle/battle-keyboard-assist.tsx')
          text = assist.read_text()
          text, count = re.subn(
              r"\nfunction clickAdjacentMove\(direction: \{ dx: number; dy: number \}\): boolean \{.*?\n\}\n\nfunction syncVisibleCommandLabels",
              "\nfunction syncVisibleCommandLabels",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not remove DOM movement shim')
          old = """      const movementDirection = directionForCode(event.code)
              if (movementDirection && moveModeIsActive()) {
                event.preventDefault()
                event.stopImmediatePropagation()
                clickAdjacentMove(movementDirection)
                return
              }
          """
          new = """      const movementDirection = directionForCode(event.code)
              if (movementDirection && moveModeIsActive()) {
                // BattleExperienceV2 owns movement state and handles these keys with its
                // authoritative reachable-path map. Do not reinterpret them as keybind actions.
                return
              }
          """
          if old not in text:
              raise SystemExit('Could not find movement capture block')
          assist.write_text(text.replace(old, new, 1))

          battle = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = battle.read_text()
          if "style={{ width: `${playerEconomy} AP` }}" not in text:
              raise SystemExit('Could not find Action Economy width source')
          text = text.replace(
              "style={{ width: `${playerEconomy} AP` }}",
              "style={{ width: `${playerEconomy}%` }}",
              1,
          )
          old_effect = """  useEffect(() => {
              function handleKeyDown(event: KeyboardEvent) {
                if (isTextEntryTarget(event.target)) return
                if (event.key === 'Escape') {
                  event.preventDefault()
                  setOverlay(null)
                  clearPlanning()
                  setNotice('Selection cleared. Choose any action when you are ready.')
                } else if (event.key === '0') {
                  event.preventDefault()
                  chooseMode('inspect')
                } else if (event.key === 'Enter' && pendingIntent && preview?.preview.legal) {
                  event.preventDefault()
                  void commitIntent()
                }
              }
              window.addEventListener('keydown', handleKeyDown)
              return () => window.removeEventListener('keydown', handleKeyDown)
            }, [chooseMode, clearPlanning, commitIntent, pendingIntent, preview])
          """
          new_effect = """  useEffect(() => {
              function handleKeyDown(event: KeyboardEvent) {
                if (isTextEntryTarget(event.target)) return

                const movementDirection =
                  event.code === 'ArrowUp' || event.code === 'KeyW'
                    ? { x: 0, y: -1 }
                    : event.code === 'ArrowDown' || event.code === 'KeyS'
                      ? { x: 0, y: 1 }
                      : event.code === 'ArrowLeft' || event.code === 'KeyA'
                        ? { x: -1, y: 0 }
                        : event.code === 'ArrowRight' || event.code === 'KeyD'
                          ? { x: 1, y: 0 }
                          : null

                if (mode === 'move' && movementDirection && playerPlacement) {
                  event.preventDefault()
                  const target = {
                    x: playerPlacement.position.x + movementDirection.x,
                    y: playerPlacement.position.y + movementDirection.y,
                  }
                  const nextPath = reachablePaths.get(positionKey(target))
                  if (!nextPath || nextPath.length < 2) {
                    setNotice('That adjacent tile is not reachable with the Action Economy you have left.')
                    return
                  }
                  handleTileClick(target)
                  return
                }

                if (event.key === 'Escape') {
                  event.preventDefault()
                  setOverlay(null)
                  clearPlanning()
                  setNotice('Selection cleared. Choose any action when you are ready.')
                } else if (event.key === '0') {
                  event.preventDefault()
                  chooseMode('inspect')
                } else if (event.key === 'Enter' && pendingIntent && preview?.preview.legal) {
                  event.preventDefault()
                  void commitIntent()
                }
              }
              window.addEventListener('keydown', handleKeyDown)
              return () => window.removeEventListener('keydown', handleKeyDown)
            }, [
              chooseMode,
              clearPlanning,
              commitIntent,
              handleTileClick,
              mode,
              pendingIntent,
              playerPlacement,
              preview,
              reachablePaths,
            ])
          """
          if old_effect not in text:
              raise SystemExit('Could not find battle keyboard effect')
          battle.write_text(text.replace(old_effect, new_effect, 1))
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-experience-v2.tsx \
            apps/web/src/app/pv1e-shell-fixes.css \
            apps/web/src/components/settings/combat-controls-settings.module.css \
            apps/web/e2e/public-information.pw.ts
      - name: Commit final battle fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-experience-v2.tsx \
            apps/web/src/app/pv1e-shell-fixes.css \
            apps/web/src/components/settings/combat-controls-settings.module.css \
            apps/web/e2e/public-information.pw.ts
          git commit -m "fix: finalize A2 battle interaction behavior"
          git push origin HEAD:agent/a2-feedback-holistic
