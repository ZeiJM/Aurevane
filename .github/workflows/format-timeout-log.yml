name: Format timeout battle log

on:
  push:
    branches:
      - agent/thematic-turn-timeout-log

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/thematic-turn-timeout-log
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched battle-log files
        run: |
          pnpm exec prettier --write apps/web/src/components/battle/battle-log-presentation.ts apps/web/src/components/battle/battle-log-presentation.test.ts
          rm .github/workflows/format-timeout-log.yml
      - name: Commit formatted files and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-log-presentation.ts apps/web/src/components/battle/battle-log-presentation.test.ts .github/workflows/format-timeout-log.yml
          git commit -m "Format thematic timeout battle log"
          git push origin HEAD:agent/thematic-turn-timeout-log
