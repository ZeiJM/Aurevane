name: Temporary Final Format

on:
  push:
    branches:
      - hotfix/post-prod-battle-pv-20260820

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[final-format-bot]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/post-prod-battle-pv-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format remaining file
        run: pnpm exec prettier --write apps/web/src/components/battle/pvp-battle-combatant-panels.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/battle/pvp-battle-combatant-panels.tsx
          git commit -m "style: format PvP combatant panels [final-format-bot]"
          git push origin HEAD:hotfix/post-prod-battle-pv-20260820
