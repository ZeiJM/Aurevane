name: Controls CSS format diagnostic

on:
  push:
    branches:
      - agent/controls-keybinds-fidelity
    paths:
      - apps/web/src/components/settings/combat-controls-settings.module.css
      - .github/workflows/controls-css-format-diagnostic.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Print exact CSS Prettier diff
        run: |
          pnpm exec prettier --write apps/web/src/components/settings/combat-controls-settings.module.css
          git diff -- apps/web/src/components/settings/combat-controls-settings.module.css
