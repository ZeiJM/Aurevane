name: A2 Keyboard Formatter

on:
  push:
    branches:
      - "agent/a2-feedback-holistic"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a2-feedback-holistic
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/battle/battle-keyboard-assist.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-keyboard-assist.tsx
          git commit -m "chore: format final battle keyboard assist"
          git push origin HEAD:agent/a2-feedback-holistic
