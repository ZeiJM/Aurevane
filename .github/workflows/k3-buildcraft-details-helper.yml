name: K3 Buildcraft Details Assertion Helper

on:
  push:
    branches:
      - agent/combat-k3-buildcraft-details-helper-20260915

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out exact K3 candidate
        shell: bash
        run: |
          git fetch origin agent/combat-k3-effect-provenance-reconcile-20260915
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "c4b8e5ef8c13187bf7ba076befa7e3d97095743e"
      - name: Patch stale Barrier details assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/p3-8-representative-buildcraft.pw.ts')
          text = path.read_text()
          old = "  await expect(skillDetails).toContainText('Guarded')"
          new = "  await expect(skillDetails).toContainText('Apply 1 Guard stack')"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale details assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify surgical test-only diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "apps/web/e2e/p3-8-representative-buildcraft.pw.ts"
          git diff -- apps/web/e2e/p3-8-representative-buildcraft.pw.ts
      - name: Commit and push result branch
        shell: bash
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git commit -m "test: align Barrier details presentation assertion"
          git push origin HEAD:agent/combat-k3-buildcraft-details-result-20260915
