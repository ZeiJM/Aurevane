name: Modular ability readers browser

on:
  pull_request:
    paths:
      - 'apps/web/src/components/character/**'
      - 'apps/web/src/components/battle/**'
      - 'apps/web/e2e/fixtures/skill-parameter-palette-harness.jsx'
      - 'apps/web/scripts/skill-parameter-palette-browser-regression.mjs'
      - 'apps/web/e2e/fixtures/primed-requirement-modules-harness.jsx'
      - 'apps/web/scripts/primed-requirement-modules-browser-regression.mjs'
      - 'apps/web/e2e/fixtures/simple-requirements-harness.jsx'
      - 'apps/web/scripts/browser-simple-requirements*.mjs'
      - 'apps/web/src/components/master/combat-content/ability-*.tsx'
      - 'apps/web/src/components/master/combat-content/simple-*.tsx'
      - 'apps/web/src/components/master/combat-content/skill-effect*.tsx'
      - 'packages/game-core/src/combat/**'
      - '.github/workflows/ability-readers-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modular-ability-readers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify modular catalogue and release bindings
        run: |
          python3 scripts/prepare-resonance-modularity.test.py
          python3 scripts/prepare-resonance-modularity-release.test.py
          python3 scripts/prepare-resonance-modularity.py --check
          python3 scripts/prepare-simple-requirements.test.py
          python3 scripts/prepare-simple-requirements-release.test.py
          python3 scripts/prepare-simple-requirements.py --check
          pnpm --filter @aurevane/game-core exec vitest run --root ../.. scripts/2026-10-19-simple-requirements.test.ts
      - name: Install Chromium
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          pnpm --filter @aurevane/web exec playwright install --with-deps chromium
      - name: Verify modular current and pinned public readers
        env:
          AV_MODULAR_READERS_ONLY: '1'
          AV_SKILL_PARAMETER_PALETTE_EVIDENCE_DIR: /tmp/modular-ability-readers-review
        run: pnpm --filter @aurevane/web exec node scripts/skill-parameter-palette-browser-regression.mjs
      - name: Save native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-ability-readers-review
          path: /tmp/modular-ability-readers-review
          retention-days: 7
      - name: Verify Basic authoring and retired rollback with actual local services
        env:
          AV_BASIC_SERVICE_ACCEPTANCE: '1'
          AV_SKILL_PARAMETER_PALETTE_EVIDENCE_DIR: /tmp/basic-service-restore-review
        run: pnpm --filter @aurevane/web exec node scripts/skill-parameter-palette-browser-regression.mjs
      - name: Save Basic authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-service-restore-review
          path: /tmp/basic-service-restore-review
          retention-days: 7
      - name: Verify Primed and modular requirements on desktop and mobile
        env:
          AV_PRIMED_MODULES_EVIDENCE_DIR: /tmp/primed-modules-browser-evidence
        run: pnpm --filter @aurevane/web exec node scripts/primed-requirement-modules-browser-regression.mjs
      - name: Save Primed and modular requirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primed-modules-browser-evidence
          path: /tmp/primed-modules-browser-evidence
          retention-days: 7
      - name: Verify simple Requirements and Conditional Cleanse on desktop and mobile
        env:
          AV_SIMPLE_REQUIREMENTS_EVIDENCE_DIR: /tmp/simple-requirements-browser-evidence
        run: pnpm --filter @aurevane/web exec node scripts/browser-simple-requirements-regression.mjs
      - name: Save simple Requirements browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-requirements-browser-evidence
          path: /tmp/simple-requirements-browser-evidence
          retention-days: 7
