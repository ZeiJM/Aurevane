name: Burn copy workbench

on:
  push:
    branches:
      - review/burn-copy-fde662e

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin implementation recipe and exact valid RED source
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/burn-copy-implementation.py /tmp/burn-copy-implementation.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/burn-copy-implementation.py')
          text = path.read_text()
          old = '\n'.join([
              "replace(",
              "    dots,",
              "    \"\"\"export interface CurrentBurnEffect {",
              "  type: 'burn'",
              "  recipient: CombatEffectRecipient",
              "}\"\"\",",
              "    \"\"\"export interface CurrentBurnEffect {",
              "  type: 'burn'",
              "  recipient: CombatEffectRecipient",
              "  curseCopyable?: boolean",
              "}",
              "",
              "export function validateCurrentBurnEffect(effect: { curseCopyable?: unknown }): void {",
              "  if (effect.curseCopyable !== undefined && typeof effect.curseCopyable !== 'boolean') {",
              "    throw new TypeError('Burn curseCopyable must be boolean when supplied.')",
              "  }",
              "}\"\"\",",
              ")",
          ])
          new = '\n'.join([
              "replace(",
              "    dots,",
              "    \"export function currentBurnInstance(\",",
              "    \"\"\"export function validateCurrentBurnEffect(effect: { curseCopyable?: unknown }): void {",
              "  if (effect.curseCopyable !== undefined && typeof effect.curseCopyable !== 'boolean') {",
              "    throw new TypeError('Burn curseCopyable must be boolean when supplied.')",
              "  }",
              "}",
              "",
              "export function currentBurnInstance(\"\"\",",
              ")",
          ])
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          wrong_instance = '  const nextInstance: CombatBurnInstance = {'
          assert text.count(wrong_instance) == 2, text.count(wrong_instance)
          text = text.replace(wrong_instance, '  const instance: CombatBurnInstance = {')
          wrong_old_message = 'Burn state must contain one valid current-profile stage from 0 to 2 per target, sorted by target ID.'
          actual_old_message = 'Burn state must contain one valid current-profile instance per target, sorted by target ID, with canonical stage 0 through 2.'
          wrong_new_message = 'Burn state must contain one valid current-profile stage from 0 to 2 per target, sorted by target ID, with optional boolean copy policy.'
          actual_new_message = 'Burn state must contain one valid current-profile instance per target, sorted by target ID, with canonical stage 0 through 2 and optional boolean copy policy.'
          assert text.count(wrong_old_message) == 1, text.count(wrong_old_message)
          assert text.count(wrong_new_message) == 1, text.count(wrong_new_message)
          text = text.replace(wrong_old_message, actual_old_message).replace(wrong_new_message, actual_new_message)
          path.write_text(text)
          PY
          git fetch --depth=4 origin 15cb61ab7f4b308c6c0b93f1dc818522a3869d38
          git checkout --detach 15cb61ab7f4b308c6c0b93f1dc818522a3869d38
          test "$(git rev-parse HEAD)" = 15cb61ab7f4b308c6c0b93f1dc818522a3869d38
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = fde662e38f864dc8797d0dfdd82ba05f3411ad05
          test "$(git ls-remote origin refs/heads/agent/combat-k4-burn-copy-fde662e | cut -f1)" = 15cb61ab7f4b308c6c0b93f1dc818522a3869d38
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Implement and format Burn copying
        run: |
          python3 /tmp/burn-copy-implementation.py
          pnpm exec prettier --write packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/combat-status-copy.ts
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-burn-copy.test.ts
      - name: Focused GREEN verification
        run: |
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-burn-copy.test.ts src/combat/combat-burn-rework.test.ts src/combat/combat-burn-backlash.test.ts src/combat/combat-status-copy.test.ts src/combat/combat-status-copy-publication.test.ts src/combat/combat-poison-copy.test.ts src/combat/combat-copy-provenance.test.ts src/combat/combat-effect-provenance-state.test.ts src/combat/combat-dot-rework.test.ts src/combat/combat-mark-blind.contract.test.ts
      - name: Full repository verification
        run: pnpm check
      - name: Retain only the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          expected = {
            'docs/COMBAT.md',
            'packages/game-core/src/combat/actions-legacy.ts',
            'packages/game-core/src/combat/combat-authoring-validation.ts',
            'packages/game-core/src/combat/combat-dots.ts',
            'packages/game-core/src/combat/combat-effect-state.ts',
            'packages/game-core/src/combat/combat-status-copy.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-burn-copy.test.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = fde662e38f864dc8797d0dfdd82ba05f3411ad05
          test "$(git ls-remote origin refs/heads/agent/combat-k4-burn-copy-fde662e | cut -f1)" = 15cb61ab7f4b308c6c0b93f1dc818522a3869d38
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/COMBAT.md packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-status-copy.ts
          git diff --cached --check
          git commit -m 'feat(combat): copy Burn stage with pinned reapplication and K3 lineage'
          git push origin HEAD:refs/heads/agent/combat-k4-burn-copy-fde662e
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "VERIFIED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          test -z "$(git status --porcelain)"
