name: Temporary tagged Technique fixer v3

on:
  push:
    branches:
      - fix/tagged-technique-preview-hotkeys-20260906
    paths:
      - .github/workflows/temp-tagged-technique-fix-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tagged-technique-preview-hotkeys-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply scoped PvE and cockpit patch
        run: |
          set +e
          python .github/scripts/temp_tagged_technique_patch.py
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "function activeCommandSlug" apps/web/src/components/battle/battle-command-cockpit-polish.tsx
          grep -q "LEGACY_COMMAND_SLOTS" apps/web/src/components/battle/battle-keyboard-assist.tsx
      - name: Apply scoped PvP patch
        run: python .github/scripts/temp_tagged_technique_pvp_patch.py
      - name: Format touched files
        run: npx --yes prettier@3.9.6 --write apps/web/src/components/battle/battle-command-cockpit-polish.tsx apps/web/src/components/battle/battle-keyboard-assist.tsx apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-command-cockpit-polish.tsx apps/web/src/components/battle/battle-keyboard-assist.tsx apps/web/src/components/battle/pvp-battle-keyboard-assist.tsx
          git commit -m 'Fix tagged Technique previews and stable hotkeys'
          git push origin HEAD:fix/tagged-technique-preview-hotkeys-20260906
