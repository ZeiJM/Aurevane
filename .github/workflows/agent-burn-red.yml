name: Verify Burn RED

on:
  push:
    branches:
      - agent/combat-overhaul-task4-burn
    paths:
      - .github/workflows/agent-burn-red.yml

permissions:
  contents: read

jobs:
  burn-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact isolated revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize Burn test formatting in runner
        run: pnpm exec prettier --write packages/game-core/src/combat/combat-burn-rework.test.ts
      - name: Run focused Burn contract
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-burn-rework.test.ts
