name: Apply and verify K4 Pierce GREEN

on:
  push:
    branches:
      - agent/combat-k4-pierce-20260914
    paths:
      - .github/workflows/agent-k4-pierce-green.yml

permissions:
  contents: write

concurrency:
  group: combat-k4-pierce-green
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply minimal Pierce implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          actions = 'packages/game-core/src/combat/actions-legacy.ts'
          replace_once(
              actions,
              "      defenseKind?: 'armor' | 'ward'\n      element?: CombatElement",
              "      defenseKind?: 'armor' | 'ward'\n      piercing?: boolean\n      element?: CombatElement",
          )
          replace_once(
              actions,
              "  if (effect.defenseKind && amount > 0) {",
              "  if (effect.defenseKind && amount > 0 && effect.piercing !== true) {",
          )
          replace_once(
              actions,
              """  for (const status of getStatusRow(state, recipientId).statuses) {\n    const definition = getStatusDefinition(content, status.statusId, status.statusVersion)\n    for (let stack = 0; stack < status.stacks; stack += 1) {\n      amount = scaleByBasisPoints(amount, definition.damageTakenMultiplierBasisPoints)\n    }\n  }\n\n  amount = scaleByBasisPoints(\n    amount,\n    conditionalDamageMultiplier(state, actorId, recipientId, content, elementalMultiplier),\n  )""",
              """  for (const status of getStatusRow(state, recipientId).statuses) {\n    const definition = getStatusDefinition(content, status.statusId, status.statusVersion)\n    if (effect.piercing === true && definition.damageTakenMultiplierBasisPoints < 10_000) continue\n    for (let stack = 0; stack < status.stacks; stack += 1) {\n      amount = scaleByBasisPoints(amount, definition.damageTakenMultiplierBasisPoints)\n    }\n  }\n\n  amount = scaleByBasisPoints(\n    amount,\n    conditionalDamageMultiplier(state, actorId, recipientId, content, elementalMultiplier, {\n      ignoreIncomingMitigation: effect.piercing === true,\n    }),\n  )""",
          )

          modifiers = 'packages/game-core/src/combat/damage-modifiers.ts'
          replace_once(
              modifiers,
              """export function conditionalDamageMultiplier(\n  state: CombatEncounterState,\n  attackerId: string,\n  recipientId: string,\n  content: CombatContentCatalog,\n  elementalMultiplier = 10_000,\n): number {""",
              """export function conditionalDamageMultiplier(\n  state: CombatEncounterState,\n  attackerId: string,\n  recipientId: string,\n  content: CombatContentCatalog,\n  elementalMultiplier = 10_000,\n  options: { ignoreIncomingMitigation?: boolean } = {},\n): number {""",
          )
          replace_once(
              modifiers,
              """      for (const modifier of definition?.damageModifiers ?? []) {\n        if (modifier.direction !== direction) continue\n        if (\n          !matchesCondition(""",
              """      for (const modifier of definition?.damageModifiers ?? []) {\n        if (modifier.direction !== direction) continue\n        if (\n          direction === 'incoming' &&\n          options.ignoreIncomingMitigation === true &&\n          modifier.multiplierBasisPoints < 10_000\n        )\n          continue\n        if (\n          !matchesCondition(""",
          )

          tags = 'packages/game-core/src/combat/gameplay-tags.ts'
          replace_once(
              tags,
              """export function validateGameplayEffectMetadata(effect: CombatEffectDefinition): void {\n  if (\n    effect.type === 'damage' &&\n    effect.element !== undefined &&""",
              """export function validateGameplayEffectMetadata(effect: CombatEffectDefinition): void {\n  if (\n    effect.type === 'damage' &&\n    effect.piercing !== undefined &&\n    typeof effect.piercing !== 'boolean'\n  )\n    throw new TypeError('Pierce must be a boolean.')\n  if (\n    effect.type === 'damage' &&\n    effect.element !== undefined &&""",
          )
          PY
          git diff --check

      - name: Run focused Pierce contract
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-pierce.test.ts

      - name: Run game-core typecheck
        run: pnpm --filter @aurevane/game-core typecheck

      - name: Run all repository quality gates
        run: pnpm check

      - name: Commit verified Pierce source without staging workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k4-pierce-20260914
          git diff --check
          git rm .github/workflows/agent-k4-pierce-green.yml
          git add packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/damage-modifiers.ts packages/game-core/src/combat/gameplay-tags.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement K4 Pierce damage'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          echo "Verified Pierce commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
