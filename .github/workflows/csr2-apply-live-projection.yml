name: CSR2 Apply Live Projection

on:
  push:
    branches:
      - agent/combat-csr2-live-viewer-projection-20260917
    paths:
      - .github/workflows/csr2-apply-live-projection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr2-live-viewer-projection-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply CSR-2 projection patch
        run: python .github/scripts/csr2-apply-live-projection.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-live-viewer-projection.ts \
            apps/web/src/server/battle/battle-live-viewer-projection.test.ts \
            apps/web/src/server/battle/battle-session-service.ts \
            apps/web/src/server/battle/pvp-lobby-service.ts
      - name: Verify targeted CSR-2 tests
        run: pnpm --filter @aurevane/web exec vitest run src/server/battle/battle-live-viewer-projection.test.ts src/server/battle/battle-viewer-entitlement.test.ts
      - name: Commit implementation
        run: |
          rm .github/workflows/csr2-apply-live-projection.yml
          rm .github/scripts/csr2-apply-live-projection.py
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(combat): redact live Covert status projections'
          git push origin HEAD:agent/combat-csr2-live-viewer-projection-20260917
