name: Apply and verify K4 Absorb HP GREEN

on:
  push:
    branches:
      - agent/combat-k4-absorb-hp-20260915
    paths:
      - .github/workflows/agent-k4-absorb-hp-green.yml

permissions:
  contents: write

concurrency:
  group: combat-k4-absorb-hp-green
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply minimal Absorb HP implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          effect_state = 'packages/game-core/src/combat/combat-effect-state.ts'
          replace_once(
              effect_state,
              """    reactionClass?: ReactionClass\n    effectCategories?: readonly CombatEffectCategory[]\n""",
              """    reactionClass?: ReactionClass\n    effectCategories?: readonly CombatEffectCategory[]\n    absorbHpBasisPoints?: number\n""",
          )

          validation = 'packages/game-core/src/combat/combat-authoring-validation.ts'
          replace_once(
              validation,
              """  if (status.gameplayTags !== undefined) {\n""",
              """  if (status.absorbHpBasisPoints !== undefined) {\n    if (\n      !Number.isSafeInteger(status.absorbHpBasisPoints) ||\n      status.absorbHpBasisPoints < 1 ||\n      status.absorbHpBasisPoints > 10_000\n    ) {\n      throw new RangeError('Absorb HP must be between 1 and 10000 basis points.')\n    }\n    if (status.polarity !== 'positive' || status.reactionClass !== 'reactive') {\n      throw new TypeError('Absorb HP statuses must be positive and reactive.')\n    }\n  }\n\n  if (status.gameplayTags !== undefined) {\n""",
          )

          actions = 'packages/game-core/src/combat/actions-legacy.ts'
          replace_once(
              actions,
              """    return {\n      state: removed.state,\n      events: [\n        {\n          event: 'damage_applied',\n          actionId,\n          sourceCombatantId: actorId,\n          targetCombatantId: recipientId,\n          amount: target.hp - hpAfter,\n          hpBefore: target.hp,\n          hpAfter,\n        },\n        ...removed.events,\n      ],\n    }\n  }\n""",
              """    const actualDamage = target.hp - hpAfter\n    const absorbed = applyCurrentAbsorbHpRecovery(\n      removed.state,\n      actorId,\n      recipientId,\n      actualDamage,\n      content,\n    )\n    return {\n      state: absorbed.state,\n      events: [\n        {\n          event: 'damage_applied',\n          actionId,\n          sourceCombatantId: actorId,\n          targetCombatantId: recipientId,\n          amount: actualDamage,\n          hpBefore: target.hp,\n          hpAfter,\n        },\n        ...removed.events,\n        ...absorbed.events,\n      ],\n    }\n  }\n""",
          )
          replace_once(
              actions,
              """function rewindToTurnOrigin(state: CombatEncounterState, actorId: string): CombatEncounterState {\n""",
              """function applyCurrentAbsorbHpRecovery(\n  state: CombatEncounterState,\n  sourceCombatantId: string,\n  targetCombatantId: string,\n  actualDamage: number,\n  content: CombatContentCatalog,\n): CombatResolutionTransition {\n  if (actualDamage <= 0) return { state, events: [] }\n\n  const source = getCombatant(state.tactical.battle, sourceCombatantId)\n  const target = getCombatant(state.tactical.battle, targetCombatantId)\n  if (target.hp <= 0 || source.teamId === target.teamId) return { state, events: [] }\n\n  let totalBasisPoints = 0\n  for (const status of getStatusRow(state, targetCombatantId).statuses) {\n    const definition = getStatusDefinition(content, status.statusId, status.statusVersion)\n    const basisPoints = definition.absorbHpBasisPoints ?? 0\n    if (basisPoints <= 0) continue\n\n    const remainingBasisPoints = 10_000 - totalBasisPoints\n    if (status.stacks >= Math.ceil(remainingBasisPoints / basisPoints)) {\n      totalBasisPoints = 10_000\n      break\n    }\n    totalBasisPoints += basisPoints * status.stacks\n  }\n\n  if (totalBasisPoints <= 0) return { state, events: [] }\n\n  const recovery = Math.max(1, Math.floor((actualDamage * totalBasisPoints) / 10_000))\n  const hpBefore = target.hp\n  const hpAfter = Math.min(target.maxHp, hpBefore + recovery)\n  const amount = hpAfter - hpBefore\n  if (amount <= 0) return { state, events: [] }\n\n  const nextState = withUpdatedCombatant(state, targetCombatantId, { ...target, hp: hpAfter })\n  return {\n    state: nextState,\n    events: [\n      {\n        event: 'healing_applied',\n        actionId: 'status.absorb-hp.current.v1',\n        sourceCombatantId: targetCombatantId,\n        targetCombatantId,\n        amount,\n        hpBefore,\n        hpAfter,\n      },\n    ],\n  }\n}\n\nfunction rewindToTurnOrigin(state: CombatEncounterState, actorId: string): CombatEncounterState {\n""",
          )
          PY
          git diff --check

      - name: Run focused Absorb HP contract
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-absorb-hp.test.ts

      - name: Run game-core typecheck
        run: pnpm --filter @aurevane/game-core typecheck

      - name: Run all repository quality gates
        run: pnpm check

      - name: Commit verified Absorb HP source without staging workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k4-absorb-hp-20260915
          git diff --check
          git rm .github/workflows/agent-k4-absorb-hp-green.yml
          git add packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/actions-legacy.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement K4 Absorb HP recovery'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          echo "Verified Absorb HP commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
