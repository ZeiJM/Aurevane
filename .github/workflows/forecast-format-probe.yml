name: Forecast Format Probe

on:
  push:
    branches:
      - agent/forecast-format-probe-20260916

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier apps/web/src/components/battle/battle-preview-content.test.ts
