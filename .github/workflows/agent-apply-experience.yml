name: Desktop experience verification
on:
  push:
    branches: [agent/desktop-viewport-fit]
    paths: [.github/workflows/agent-apply-experience.yml]
permissions:
  contents: read
concurrency:
  group: desktop-experience-verification
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply checksum-verified presentation patch
        env:
          PATCH_GZIP_BASE64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 -d | gzip -d > /tmp/experience.patch
          echo 'fddb759ce2648ff060be9f217362f5d3fcf2677f37940fe037586328f8d28a66  /tmp/experience.patch' | sha256sum -c -
          git apply --check /tmp/experience.patch
          git apply --index /tmp/experience.patch
          git diff --cached --check
          git config user.name 'AUREVANE engineering'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git commit -m 'Reflow desktop Profile and Battle Hall, polish reading surfaces and add navigation feedback'
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Normalize pre-existing formatter drift in a separate mechanical commit
        run: |
          pnpm format
          if ! git diff --quiet; then
            git add -u apps packages package.json turbo.json pnpm-workspace.yaml .prettierrc.json eslint.config.mjs
            git diff --cached --check
            git commit -m 'Normalize existing formatter drift to unblock complete quality gates'
          fi
      - name: Publish only to the isolated work branch
        id: source
        run: |
          git push origin HEAD:agent/desktop-viewport-fit
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > validated-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experience-source
          path: validated-source.txt
          retention-days: 3
  quality:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @aurevane/worker check:boot
      - run: git diff --exit-code
  browser:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Build and verify rendered interactions
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          export AUREVANE_ENV=local NEXT_PUBLIC_AUREVANE_ENV=local
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          pnpm --filter @aurevane/web build
          PLAYWRIGHT_JSON_OUTPUT_NAME=experience-results.json pnpm --filter @aurevane/web exec playwright test e2e/desktop-experience.pw.ts e2e/a1-layout-fit.pw.ts e2e/account-entry.pw.ts e2e/character-creation.pw.ts e2e/public-information.pw.ts e2e/navigation-menu-position.pw.ts e2e/pvp-spectator-footer-shape.pw.ts --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-verification
          path: |
            apps/web/experience-results.json
            apps/web/test-results
          retention-days: 3
      - if: always()
        run: pnpm exec supabase stop --no-backup
