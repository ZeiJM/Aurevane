name: Agent formatter tool
on:
  push:
    branches: [agent/desktop-viewport-fit]
    paths: [.github/workflows/agent-format-tool.yml]
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm pack prettier@3.9.6
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-formatter
          path: prettier-3.9.6.tgz
          retention-days: 1
