name: One-shot battle release formatting

on:
  push:
    branches:
      - agent/ai-action-commit-production-release

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format battle release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-action-commit-production-release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format files named by CI
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/ai-cockpit-pvp-button-format.module.css \
            apps/web/src/components/battle/ai-desktop-same-facing-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-command-cockpit-polish.tsx \
            apps/web/src/components/battle/battle-coordinate-toggle.module.css \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.tsx \
            apps/web/src/components/battle/battle-session-client-boundary.tsx \
            apps/web/src/components/battle/battle-stabilization-polish.tsx \
            apps/web/src/components/battle/battle-terrain-presentation-polish.module.css \
            apps/web/src/components/battle/battle-terrain-presentation-polish.tsx \
            apps/web/src/components/battle/pvp-battle-board-scale-authority.module.css \
            apps/web/src/components/battle/pvp-battle-board-scale-authority.test.ts \
            apps/web/src/components/battle/pvp-mobile-command-parity.module.css \
            apps/web/src/server/battle/guided-training-completion-service.ts
      - name: Commit formatted sources
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/ai-cockpit-pvp-button-format.module.css \
            apps/web/src/components/battle/ai-desktop-same-facing-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-command-cockpit-polish.tsx \
            apps/web/src/components/battle/battle-coordinate-toggle.module.css \
            apps/web/src/components/battle/battle-facing-quick-commit-assist.tsx \
            apps/web/src/components/battle/battle-session-client-boundary.tsx \
            apps/web/src/components/battle/battle-stabilization-polish.tsx \
            apps/web/src/components/battle/battle-terrain-presentation-polish.module.css \
            apps/web/src/components/battle/battle-terrain-presentation-polish.tsx \
            apps/web/src/components/battle/pvp-battle-board-scale-authority.module.css \
            apps/web/src/components/battle/pvp-battle-board-scale-authority.test.ts \
            apps/web/src/components/battle/pvp-mobile-command-parity.module.css \
            apps/web/src/server/battle/guided-training-completion-service.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format battle release"
          git push origin HEAD:agent/ai-action-commit-production-release
