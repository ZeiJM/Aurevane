name: A1 temporary touch patch

on:
  push:
    branches:
      - agent/a1-feedback-holistic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/a1-feedback-holistic

      - name: Apply exact gesture patch and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()
          old = """  function handleTouchCommit(position: GridPosition) {\n    const key = positionKey(position)\n    const now = Date.now()\n    if (lastTouch.current?.key === key && now - lastTouch.current.at <= 360) {\n      lastTouch.current = null\n      requestQuickCommit()\n      return\n    }\n    lastTouch.current = { key, at: now }\n  }\n"""
          new = """  function handleTouchCommit(position: GridPosition, at: number) {\n    const key = positionKey(position)\n    if (lastTouch.current?.key === key && at - lastTouch.current.at <= 360) {\n      lastTouch.current = null\n      requestQuickCommit()\n      return\n    }\n    lastTouch.current = { key, at }\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one touch helper to patch')
          text = text.replace(old, new)
          old_call = "if (event.pointerType === 'touch') handleTouchCommit(tile.position)"
          new_call = "if (event.pointerType === 'touch') handleTouchCommit(tile.position, event.timeStamp)"
          if text.count(old_call) != 1:
              raise SystemExit('Expected exactly one touch handler call to patch')
          path.write_text(text.replace(old_call, new_call))
          PY
          git rm .github/workflows/a1-temporary-touch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use pointer timestamps for touch quick commit"
          git push origin HEAD:agent/a1-feedback-holistic
