name: P1.6 Browser Format Probe

on:
  push:
    branches:
      - agent/ticket-1-6-wayfarers-practice
    paths:
      - .github/workflows/p1-6-browser-format-probe.yml

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/web/e2e/character-creation.pw.ts
          echo '--- P1.6 BROWSER PRETTIER DIFF START ---'
          git diff -- apps/web/e2e/character-creation.pw.ts
          echo '--- P1.6 BROWSER PRETTIER DIFF END ---'
