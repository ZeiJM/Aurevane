name: Temporary Technique Hotkey Formatter

on:
  push:
    branches:
      - fix/technique-keyboard-facing-ui-20260906

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/technique-keyboard-facing-ui-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/e2e/p3-8-representative-buildcraft.pw.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git commit -m "Format Forceful Strike keyboard regression"
          git push origin HEAD:fix/technique-keyboard-facing-ui-20260906
