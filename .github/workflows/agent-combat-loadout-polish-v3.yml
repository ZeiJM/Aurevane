name: Agent Combat Loadout Polish V3

on:
  push:
    branches:
      - agent/profile-discipline-mobile-polish-v3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-discipline-mobile-polish-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Apply loadout patch
        run: |
          python - <<'PY'
          from pathlib import Path

          shell_path = Path('apps/web/src/components/character/character-profile-shell.tsx')
          shell = shell_path.read_text()

          import_anchor = "import { AuthenticatedShellFrame } from '@/components/shell/authenticated-game-shell'\n"
          media_import = "import { battleResonanceArtwork, battleSkillArtwork } from '@/components/battle/battle-skill-presentation'\n"
          if media_import not in shell:
              if shell.count(import_anchor) != 1:
                  raise SystemExit('profile shell import seam changed')
              shell = shell.replace(import_anchor, media_import + import_anchor, 1)

          shell = shell.replace(
              "  const equippedCount = disciplineBuild.disciplineSkills.equippedSkills.length\n",
              '',
              1,
          )
          build_label = """  const buildLabel = disciplineBuild.currentSecondary\n    ? `${disciplineBuild.current.definition.name} + ${disciplineBuild.currentSecondary.name}`\n    : disciplineBuild.current.definition.name\n"""
          if build_label not in shell:
              raise SystemExit('profile shell build label seam changed')
          shell = shell.replace(build_label, '', 1)

          discipline_header_old = """              <div className={styles.buildSectionHeader}>\n                <span id=\"build-disciplines-heading\">Disciplines</span>\n                <strong>{buildLabel}</strong>\n              </div>"""
          discipline_header_new = """              <div className={styles.buildSectionHeader}>\n                <strong id=\"build-disciplines-heading\">Disciplines</strong>\n              </div>"""
          if shell.count(discipline_header_old) != 1:
              raise SystemExit('discipline loadout heading seam changed')
          shell = shell.replace(discipline_header_old, discipline_header_new, 1)

          technique_header_old = """              <div className={styles.buildSectionHeader}>\n                <span id=\"build-techniques-heading\">Techniques</span>\n                <strong>\n                  {equippedCount} / {disciplineBuild.disciplineSkills.capacity} tagged\n                </strong>\n              </div>"""
          technique_header_new = """              <div className={styles.buildSectionHeader}>\n                <strong id=\"build-techniques-heading\">Techniques</strong>\n              </div>"""
          if shell.count(technique_header_old) != 1:
              raise SystemExit('technique loadout heading seam changed')
          shell = shell.replace(technique_header_old, technique_header_new, 1)

          identity_old = """            <section className={styles.buildIdentity} aria-label=\"Combat loadout identity\">\n              <span>{resonance ? 'Resonance' : 'Essence'}</span>\n              <strong>{resonance?.name ?? essence?.name ?? 'None available'}</strong>\n              <small>\n                {resonance?.description ??\n                  essence?.description ??\n                  (disciplineBuild.currentSecondary\n                    ? 'No authored Resonance is available for this pair yet.'\n                    : 'No authored Essence is available for this Discipline yet.')}\n              </small>\n            </section>"""
          identity_new = """            <section className={styles.buildIdentity} aria-label=\"Combat loadout identity\">\n              {resonance || essence ? (\n                <span className={styles.buildIdentityArt} aria-hidden=\"true\">\n                  <img\n                    src={\n                      resonance\n                        ? battleResonanceArtwork(resonance.id)\n                        : battleSkillArtwork(essence!.skill.id)\n                    }\n                    alt=\"\"\n                  />\n                </span>\n              ) : null}\n              <div className={styles.buildIdentityCopy}>\n                <span>{resonance ? 'Resonance' : 'Essence'}</span>\n                <strong>{resonance?.name ?? essence?.name ?? 'None available'}</strong>\n                <small>\n                  {resonance?.description ??\n                    essence?.description ??\n                    (disciplineBuild.currentSecondary\n                      ? 'No authored Resonance is available for this pair yet.'\n                      : 'No authored Essence is available for this Discipline yet.')}\n                </small>\n              </div>\n            </section>"""
          if shell.count(identity_old) != 1:
              raise SystemExit('combat loadout identity seam changed')
          shell = shell.replace(identity_old, identity_new, 1)
          shell_path.write_text(shell)

          css_path = Path('apps/web/src/components/character/character-profile-shell.module.css')
          css = css_path.read_text()
          old = """.buildSectionHeader span,\n.buildIdentity span {\n  color: color-mix(in srgb, var(--av-text-dim) 88%, var(--av-brass-300));\n  font: 700 0.5rem/1 var(--av-font-mono);\n  letter-spacing: 0.09em;\n  text-transform: uppercase;\n}\n\n.buildSectionHeader strong,\n.buildIdentity strong {\n  color: var(--av-text);\n  font: 600 1.08rem/1.15 var(--av-font-display);\n  letter-spacing: -0.01em;\n}"""
          new = """.buildIdentityCopy > span {\n  color: color-mix(in srgb, var(--av-text-dim) 88%, var(--av-brass-300));\n  font: 700 0.5rem/1 var(--av-font-mono);\n  letter-spacing: 0.09em;\n  text-transform: uppercase;\n}\n\n.buildSectionHeader strong,\n.buildIdentity strong {\n  color: var(--av-text);\n  font: 600 1.08rem/1.15 var(--av-font-display);\n  letter-spacing: -0.01em;\n}"""
          if css.count(old) != 1:
              raise SystemExit('loadout typography seam changed')
          css = css.replace(old, new, 1)

          old_identity = """.buildIdentity {\n  padding-bottom: 0.22rem;\n  gap: 0.36rem;\n}\n\n.buildIdentity strong {\n  color: var(--av-brass-200);\n  font-size: 1.18rem;\n}"""
          new_identity = """.buildIdentity {\n  grid-template-columns: 4.4rem minmax(0, 1fr);\n  align-items: center;\n  padding-bottom: 0.22rem;\n  gap: 0.72rem;\n}\n\n.buildIdentityCopy {\n  display: grid;\n  min-width: 0;\n  gap: 0.36rem;\n}\n\n.buildIdentityArt {\n  display: block;\n  width: 4.4rem;\n  aspect-ratio: 1;\n  overflow: hidden;\n  border: 1px solid rgba(207, 169, 93, 0.3);\n  border-radius: 0.62rem;\n  background: rgba(4, 7, 11, 0.86);\n  box-shadow:\n    inset 0 0 0 1px rgba(255, 255, 255, 0.025),\n    0 0.45rem 1.2rem rgba(0, 0, 0, 0.2);\n}\n\n.buildIdentityArt img {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.buildIdentity strong {\n  color: var(--av-brass-200);\n  font-size: 1.18rem;\n}"""
          if css.count(old_identity) != 1:
              raise SystemExit('loadout identity layout seam changed')
          css = css.replace(old_identity, new_identity, 1)

          mobile_anchor = """  .sideCard {\n    padding: 0.78rem;\n  }\n}"""
          mobile_new = """  .sideCard {\n    padding: 0.78rem;\n  }\n\n  .buildIdentity {\n    grid-template-columns: 3.8rem minmax(0, 1fr);\n    gap: 0.62rem;\n  }\n\n  .buildIdentityArt {\n    width: 3.8rem;\n  }\n}"""
          if css.count(mobile_anchor) != 1:
              raise SystemExit('mobile loadout seam changed')
          css = css.replace(mobile_anchor, mobile_new, 1)
          css_path.write_text(css)

          test_path = Path('apps/web/e2e/character-profile-launcher-layout.pw.ts')
          test_text = test_path.read_text()
          insert_anchor = """  await expect(disciplineLauncher).toBeVisible()\n  await expect(techniquesLauncher).toBeVisible()\n"""
          insert = """  await expect(disciplineLauncher).toBeVisible()\n  await expect(techniquesLauncher).toBeVisible()\n  await expect(page.locator('#build-disciplines-heading')).toHaveText('Disciplines')\n  await expect(page.locator('#build-techniques-heading')).toHaveText('Techniques')\n  await expect(page.getByText(/\\d+ \\/ \\d+ tagged/)).toHaveCount(0)\n"""
          if test_text.count(insert_anchor) != 1:
              raise SystemExit('launcher regression seam changed')
          test_path.write_text(test_text.replace(insert_anchor, insert, 1))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-profile-shell.module.css \
            apps/web/e2e/character-profile-launcher-layout.pw.ts
      - name: Commit focused patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-profile-shell.module.css \
            apps/web/e2e/character-profile-launcher-layout.pw.ts
          git diff --cached --check
          git commit -m "Polish combat loadout presentation"
          git push origin HEAD:agent/profile-discipline-mobile-polish-v3
