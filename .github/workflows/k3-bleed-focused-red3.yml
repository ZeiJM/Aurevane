name: K3 Bleed Focused RED 3

on:
  push:
    branches:
      - agent/combat-k3-bleed-focused-red3-20260915

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify test formatting
        run: pnpm exec prettier --check packages/game-core/src/combat/combat-persistent-provenance-bleed-replacement.test.ts
      - name: Run focused Bleed provenance contract
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-persistent-provenance-bleed-replacement.test.ts
