name: PvP lobby refresh hotfix once

on:
  push:
    branches:
      - "agent/fix-pvp-lobby-refresh-build"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pvp-lobby-hotfix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-pvp-lobby-refresh-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Patch nullable lobby id and format touched files
        run: |
          python - <<'PY'
          from pathlib import Path

          launch = Path('apps/web/src/components/battle/battle-launch.tsx')
          text = launch.read_text()
          old = """    async function restoreLobby() {\n      try {\n        const response = await fetch(`/api/pvp/lobbies/${encodeURIComponent(lobbyId)}`, {"""
          new = """    async function restoreLobby(restoredLobbyId: string) {\n      try {\n        const response = await fetch(\n          `/api/pvp/lobbies/${encodeURIComponent(restoredLobbyId)}`,\n          {"""
          if text.count(old) != 1:
              raise SystemExit('Expected restoreLobby target was not found exactly once.')
          text = text.replace(old, new)
          old_tail = """          cache: 'no-store',\n        })"""
          new_tail = """            cache: 'no-store',\n          },\n        )"""
          if text.count(old_tail) < 1:
              raise SystemExit('Expected restoreLobby fetch options target was not found.')
          # Only replace the first matching fetch-options close after the new restored-lobby fetch.
          before, after = text.split(new, 1)
          after = after.replace(old_tail, new_tail, 1)
          text = before + new + after
          if text.count('    void restoreLobby()') != 1:
              raise SystemExit('Expected restoreLobby invocation was not found exactly once.')
          text = text.replace('    void restoreLobby()', '    void restoreLobby(lobbyId)')
          launch.write_text(text)

          test = Path('apps/web/src/components/battle/pvp-lobby-refresh-contract.test.ts')
          test_text = test.read_text().replace(
              'encodeURIComponent(lobbyId)', 'encodeURIComponent(restoredLobbyId)'
          )
          test.write_text(test_text)
          PY
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-launch.tsx \
            apps/web/src/components/battle/pvp-lobby-refresh-contract.test.ts
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-launch.tsx \
            apps/web/src/components/battle/pvp-lobby-refresh-contract.test.ts
      - name: Commit patch
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-launch.tsx apps/web/src/components/battle/pvp-lobby-refresh-contract.test.ts
          git diff --cached --check
          git commit -m "Fix PvP lobby refresh build [pvp-lobby-hotfix]"
          git push origin HEAD:agent/fix-pvp-lobby-refresh-build
