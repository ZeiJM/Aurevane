name: Verify combat main reconciliation

on:
  push:
    branches:
      - agent/combat-main-reconcile-k1-20260914
    paths:
      - .github/workflows/agent-combat-main-reconcile.yml

permissions:
  contents: write

concurrency:
  group: combat-main-reconcile-k1-20260914
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FEATURE_BASE: fc78464d81324d7089444df852f0b2d35823ef0a
      MAIN_HEAD: 233b88b5701417c8a188516c487a747c63d61756
      RESULT_BRANCH: agent/combat-main-reconcile-k1-result-20260914
      SKILL_DETAIL: apps/web/src/components/character/skill-detail-presentation.ts
    steps:
      - name: Checkout exact combat feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BASE }}
          fetch-depth: 0

      - name: Configure merge identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch exact main revision
        run: |
          git fetch origin "$MAIN_HEAD"
          git fetch origin "$RESULT_BRANCH"
          test "$(git rev-parse origin/$RESULT_BRANCH)" = "$FEATURE_BASE"

      - name: Merge main and verify conflict set
        run: |
          set +e
          git merge --no-ff --no-commit "$MAIN_HEAD"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            test -z "$(git diff --name-only --diff-filter=U)"
            exit 0
          fi
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Merge conflicts:\n%s\n' "${conflicts[@]}"
          test "${#conflicts[@]}" -eq 1
          test "${conflicts[0]}" = "$SKILL_DETAIL"

      - name: Resolve skill detail presenter conflict
        run: |
          if git diff --name-only --diff-filter=U | grep -qx "$SKILL_DETAIL"; then
            git checkout --ours -- "$SKILL_DETAIL"
            python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          path = os.environ['SKILL_DETAIL']
          main_head = os.environ['MAIN_HEAD']
          current = Path(path).read_text()
          main = subprocess.check_output(['git', 'show', f'{main_head}:{path}'], text=True)
          marker = 'export function skillDisplayName(skill: MatureSkillDefinition): string {'
          if marker not in main:
              raise SystemExit('main skillDisplayName helper missing')
          helper = main[main.index(marker):].strip()
          if marker not in current:
              Path(path).write_text(current.rstrip() + '\n\n' + helper + '\n')
          PY
            git add "$SKILL_DETAIL"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q "combatActionPresentationTags" "$SKILL_DETAIL"
          grep -q "export function skillDisplayName" "$SKILL_DETAIL"
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gates
        run: pnpm check

      - name: Verify merge tree hygiene
        run: |
          git diff --exit-code
          git diff --cached --check

      - name: Commit clean verified merge and publish result branch
        run: |
          git commit -m 'merge: reconcile combat overhaul with main'
          test "$(git rev-parse HEAD^1)" = "$FEATURE_BASE"
          test "$(git rev-parse HEAD^2)" = "$MAIN_HEAD"
          git fetch origin "$RESULT_BRANCH"
          test "$(git rev-parse origin/$RESULT_BRANCH)" = "$FEATURE_BASE"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          echo "Verified merge commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
