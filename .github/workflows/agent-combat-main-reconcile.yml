name: Reconcile combat K1 with latest main

on:
  push:
    branches:
      - agent/combat-main-reconcile-k1-20260914
    paths:
      - .github/workflows/agent-combat-main-reconcile.yml

permissions:
  contents: write

concurrency:
  group: combat-main-reconcile-k1
  cancel-in-progress: false

jobs:
  reconcile-verify-and-commit:
    if: github.ref == 'refs/heads/agent/combat-main-reconcile-k1-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact reconciliation revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Merge latest main and resolve only approved overlaps
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-main-reconcile-k1-20260914
          git fetch origin "$branch" main
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          main_sha="$(git rev-parse origin/main)"
          echo "Reconciling main at $main_sha"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              case "$path" in
                apps/web/src/components/character/skill-detail-presentation.ts)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                apps/web/e2e/phase4-roster.pw.ts)
                  git checkout --theirs -- "$path"
                  sed -i 's/Area · radius 1/Circle 1/' "$path"
                  grep -Fq "toContainText('Circle 1')" "$path"
                  git add "$path"
                  ;;
                apps/web/e2e/shared-battle-presentation-parity.pw.ts)
                  git checkout --theirs -- "$path"
                  sed -i 's@/Guarded/i@/Guard/i@' "$path"
                  grep -Fq 'toContainText(/Guard/i)' "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          elif [ "$merge_status" -ne 0 ]; then
            echo 'Merge failed without reported content conflicts.' >&2
            exit "$merge_status"
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          grep -Fq "toContainText('Circle 1')" apps/web/e2e/phase4-roster.pw.ts
          grep -Fq 'toContainText(/Guard/i)' apps/web/e2e/shared-battle-presentation-parity.pw.ts
          grep -Fq 'export function skillDisplayName' apps/web/src/components/character/skill-detail-presentation.ts
          echo "MAIN_SHA=$main_sha" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full repository quality gate
        run: pnpm check

      - name: Verify merge state is clean and commit reconciliation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-main-reconcile-k1-20260914
          git diff --check
          git diff --cached --check
          git rm .github/workflows/agent-combat-main-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'merge: reconcile Combat Kernel K1 with latest main'
          test "$(git rev-parse HEAD^2)" = "$MAIN_SHA"
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
          echo "Reconciled candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Merged main: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
