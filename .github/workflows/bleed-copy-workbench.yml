name: Bleed copy workbench

on:
  push:
    branches:
      - review/bleed-copy-296e385

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin implementation recipe and exact RED source
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/bleed-copy-implementation.py /tmp/bleed-copy-implementation.py
          git fetch --depth=5 origin b9ecf3cafd32e28e11764d0b8e924d30d41758e9
          git checkout --detach b9ecf3cafd32e28e11764d0b8e924d30d41758e9
          test "$(git rev-parse HEAD)" = b9ecf3cafd32e28e11764d0b8e924d30d41758e9
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 296e385ea878d2ca4d26de652084a9e41f8791d4
          test "$(git ls-remote origin refs/heads/agent/combat-k4-bleed-copy-296e385 | cut -f1)" = b9ecf3cafd32e28e11764d0b8e924d30d41758e9
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Implement and format Bleed copying
        run: |
          python3 /tmp/bleed-copy-implementation.py
          pnpm exec prettier --write docs/COMBAT.md packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-status-copy.ts
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-bleed-copy.test.ts
      - name: Focused GREEN verification
        run: |
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-bleed-copy.test.ts src/combat/combat-bleed-rework.test.ts src/combat/combat-persistent-provenance-bleed-replacement.test.ts src/combat/combat-dot-rework.test.ts src/combat/combat-status-copy.test.ts src/combat/combat-status-copy-publication.test.ts src/combat/combat-poison-copy.test.ts src/combat/combat-burn-copy.test.ts src/combat/combat-copy-provenance.test.ts src/combat/combat-effect-provenance-state.test.ts src/combat/combat-persistent-provenance-threading.test.ts
      - name: Full repository verification
        run: pnpm check
      - name: Retain only the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          expected = {
            'docs/COMBAT.md',
            'packages/game-core/src/combat/actions-legacy.ts',
            'packages/game-core/src/combat/combat-dots.ts',
            'packages/game-core/src/combat/combat-effect-state.ts',
            'packages/game-core/src/combat/combat-status-copy.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-bleed-copy.test.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 296e385ea878d2ca4d26de652084a9e41f8791d4
          test "$(git ls-remote origin refs/heads/agent/combat-k4-bleed-copy-296e385 | cut -f1)" = b9ecf3cafd32e28e11764d0b8e924d30d41758e9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/COMBAT.md packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-status-copy.ts
          git diff --cached --check
          git commit -m 'feat(combat): copy Bleed stacks with canonical cap and K3 lineage'
          git push origin HEAD:refs/heads/agent/combat-k4-bleed-copy-296e385
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "VERIFIED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          git diff --exit-code
          test -z "$(git status --porcelain)"
