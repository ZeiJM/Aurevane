name: Status copy workbench
on:
  push:
    branches: [review/status-copy-workbench-20260916]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d79f2bc0c6294af485f4bf5b19f5aeb58760ca14
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format only test fixtures and retain test-only source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d79f2bc0c6294af485f4bf5b19f5aeb58760ca14
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          files=(packages/game-core/src/combat/combat-status-copy.test.ts packages/game-core/src/combat/combat-status-copy-publication.test.ts)
          pnpm exec prettier --write "${files[@]}"
          pnpm exec eslint "${files[@]}"
          pnpm --filter @aurevane/game-core typecheck
          pnpm format:check
          git config user.name 'Aurevane verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          if ! git diff --cached --quiet; then git commit -m 'test: format staged copy publication guards'; fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 0eecf1f5f776b8b3b9151f503ff7396b8715ec07
          test "$(git ls-remote origin refs/heads/agent/combat-k4-status-copy-20260916 | cut -f1)" = d79f2bc0c6294af485f4bf5b19f5aeb58760ca14
          test "$(git diff --name-only 0eecf1f5f776b8b3b9151f503ff7396b8715ec07 HEAD | wc -l)" = 2
          git push origin HEAD:refs/heads/agent/combat-k4-status-copy-20260916
          echo "RED_SOURCE=$(git rev-parse HEAD)"
      - name: Observe full RED and isolate missing feature failures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @aurevane/game-core exec vitest run --reporter=json --outputFile=/tmp/copy-red.json > /tmp/copy-red.log 2>&1
          result=$?
          set -e
          cat /tmp/copy-red.log
          test "$result" -ne 0
          python3 <<'PY'
          import json
          r = json.load(open('/tmp/copy-red.json'))
          assert r['numFailedTests'] > 41
          assert r['numPassedTests'] >= 1559
          for suite in r['testResults']:
              failed = [t for t in suite['assertionResults'] if t['status'] == 'failed']
              if failed:
                  assert suite['name'].endswith(('/combat-status-copy.test.ts','/combat-status-copy-publication.test.ts'))
                  for t in failed:
                      print('RED:', t['fullName'], '\n', '\n'.join(t.get('failureMessages', []))[:250])
          print('RED_TOTALS', {k: r[k] for k in ['numTotalTests','numPassedTests','numFailedTests']})
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo "VALID_RED_SOURCE=$(git rev-parse HEAD)"
