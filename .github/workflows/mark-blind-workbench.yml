name: Mark Blind workbench
on:
  push:
    branches: [review/mark-blind-workbench-20260915]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11a5cb6d6177b530ecd98bbe1249a0af0cc936aa
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Locked setup
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply scoped implementation to exact RED
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 11a5cb6d6177b530ecd98bbe1249a0af0cc936aa
          node -e 'if(require("./apps/web/vercel.json").git.deploymentEnabled["**"] !== false) process.exit(1)'
          git fetch --depth=1 --no-tags origin aaacc4f942047ef49a95b87f6b9b68ab34e6b3f1
          git show aaacc4f942047ef49a95b87f6b9b68ab34e6b3f1:.github/mark-blind-green.py > /tmp/mark-blind-green.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('/tmp/mark-blind-green.py')
          s = p.read_text()
          corrections = [
              ("replace('actions-legacy.ts', 'const existing = getStatus(state, recipientId, effect.statusId)', 'const existing = getStatus(state, recipientId, effect.statusId, actorId)')",
               "replace('actions-legacy.ts', 'const oldStatus = getStatus(before, recipientId, effect.statusId)', 'const oldStatus = getStatus(before, recipientId, effect.statusId, actorId)')\nreplace('actions-legacy.ts', 'const newStatus = getStatus(nextState, recipientId, effect.statusId)', 'const newStatus = getStatus(nextState, recipientId, effect.statusId, actorId)')"),
              ("replace('actions-legacy.ts', 'const status = getStatus(nextState, recipientId, effect.statusId)!', 'const status = getStatus(nextState, recipientId, effect.statusId, actorId)!')",
               "replace('actions-legacy.ts', 'const existingStatus = getStatus(state, recipientId, effect.statusId)', 'const existingStatus = getStatus(state, recipientId, effect.statusId, actorId)')\nreplace('actions-legacy.ts', 'const status = getStatus(nextState, recipientId, effect.statusId)', 'const status = getStatus(nextState, recipientId, effect.statusId, actorId)')"),
          ]
          for old, new in corrections:
              assert s.count(old) == 1
              s = s.replace(old, new)
          p.write_text(s)
          PY
          python3 /tmp/mark-blind-green.py
          git diff --name-only
          git grep -n -E 'forecastCombatSkillAccuracy|rollCombatSkillAccuracy' -- packages apps
          pnpm exec prettier --write packages/game-core/src/combat/combat-accuracy-status.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/actions.ts packages/game-core/src/combat/combat-effect-provenance.ts packages/game-core/src/combat/combat-skill-accuracy.ts packages/game-core/src/combat/stat-driven-combat.ts
      - name: Focused tests and type safety
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-mark-blind.contract.test.ts src/combat/combat-skill-accuracy.test.ts src/combat/combat-vengeance.test.ts src/combat/combat-reflect.test.ts src/combat/combat-absorb-mp.test.ts src/combat/combat-absorb-hp.test.ts src/combat/combat-absorb-hp-command.test.ts src/combat/combat-barrier.test.ts src/combat/combat-damage-history-runtime.test.ts src/combat/combat-resolution-provenance.test.ts src/combat/combat-displacement-tempo-rework.test.ts src/combat/actions.test.ts src/combat/stat-driven-combat.test.ts src/combat/gameplay-tags.test.ts src/combat/combat-authoring-validation.test.ts src/combat/combat-effect-provenance-state.test.ts
          pnpm --filter @aurevane/game-core typecheck
      - name: Full repository quality gate
        run: pnpm check
      - name: Preserve exact tested source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- packages/game-core/src/combat/combat-mark-blind.contract.test.ts
          git diff --exit-code 01ff5307478bb06f6fd35aa6442070afb237379d -- apps .github packages/game-core/src/combat/status-content.ts packages/game-core/src/combat/phase4-roster.ts pnpm-lock.yaml package.json
          git diff --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = 01ff5307478bb06f6fd35aa6442070afb237379d
          test -z "$(git ls-remote origin refs/heads/review/mark-blind-green-source-20260915)"
          git add docs/COMBAT.md packages/game-core/src/combat/combat-accuracy-status.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/actions.ts packages/game-core/src/combat/combat-effect-provenance.ts packages/game-core/src/combat/combat-skill-accuracy.ts packages/game-core/src/combat/stat-driven-combat.ts
          test "$(git diff --cached --name-only | wc -l)" = 9
          git diff --exit-code
          git config user.name 'AUREVANE coding agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(combat): add source-specific Mark and non-stacking Blind accuracy'
          git push origin HEAD:refs/heads/review/mark-blind-green-source-20260915
          echo "GREEN_COMMIT=$(git rev-parse HEAD)"
          echo "GREEN_TREE=$(git rev-parse HEAD^{tree})"
          git diff --stat 01ff5307478bb06f6fd35aa6442070afb237379d...HEAD
          test -z "$(git status --porcelain)"
