name: Agent Profile Discipline Mobile Polish V3

on:
  push:
    branches:
      - agent/profile-discipline-mobile-polish-v3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-discipline-mobile-polish-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/web/src/components/character/character-profile-shell-compact.module.css',
              '    transform: translateY(0.28rem);',
              '    transform: translateY(0.48rem);',
          )

          replace_once(
              'apps/web/src/components/character/character-discipline-build-panel.module.css',
              '''  min-width: 2rem;\n  height: 1.8rem;\n  align-items: center;\n  justify-content: center;''',
              '''  min-width: max-content;\n  height: 1.8rem;\n  align-items: center;\n  justify-content: center;\n  gap: 0.34rem;''',
          )
          replace_once(
              'apps/web/src/components/character/character-discipline-build-panel.module.css',
              '''.triggerSigilSecondary {\n  margin-left: -0.46rem;\n  color: color-mix(in srgb, var(--av-brass-200) 78%, #93a9cf);\n  transform: translateY(0.12rem) scale(0.88);\n}''',
              '''.triggerSigilSecondary {\n  margin-left: 0;\n  color: var(--av-brass-300);\n  transform: none;\n}''',
          )
          replace_once(
              'apps/web/src/components/character/character-discipline-build-panel.module.css',
              '''  .backdrop {\n    align-items: end;\n    padding: 0.3rem;\n  }\n\n  .dialog {\n    width: 100%;\n    max-height: 95dvh;\n    padding: 0.65rem;\n  }''',
              '''  .backdrop {\n    place-items: center;\n    padding: max(0.55rem, env(safe-area-inset-top)) 0.3rem\n      max(0.55rem, env(safe-area-inset-bottom));\n  }\n\n  .dialog {\n    width: 100%;\n    max-height: 90dvh;\n    padding: 0.65rem;\n  }''',
          )

          panel_path = Path('apps/web/src/components/character/character-discipline-build-panel.tsx')
          panel = panel_path.read_text()
          replace_old = '<div className={styles.preview} data-testid="primary-build-preview">'
          replace_new = '''<div\n                    className={styles.preview}\n                    data-testid="primary-build-preview"\n                    data-primary-change={preview.changes.primary ? 'true' : 'false'}\n                  >'''
          if panel.count(replace_old) != 1:
              raise SystemExit('discipline panel: preview root seam changed')
          panel = panel.replace(replace_old, replace_new, 1)

          stats_start = panel.index('                    <div className={styles.statComparisonGrid}>')
          footer_start = panel.index('                    <div className={styles.previewFooter}>', stats_start)
          stats_block = panel[stats_start:footer_start]
          panel = (
              panel[:stats_start]
              + '                    {preview.changes.primary ? (\n'
              + stats_block
              + '                    ) : null}\n\n'
              + panel[footer_start:]
          )

          legend_old = '''                      <div className={styles.legend} aria-label="Stat preview legend">\n                        <span data-direction="increase">Increase</span>\n                        <span data-direction="decrease">Decrease</span>\n                        <span data-direction="neutral">Unchanged</span>\n                      </div>'''
          legend_new = '''                      {preview.changes.primary ? (\n                        <div className={styles.legend} aria-label="Stat preview legend">\n                          <span data-direction="increase">Increase</span>\n                          <span data-direction="decrease">Decrease</span>\n                          <span data-direction="neutral">Unchanged</span>\n                        </div>\n                      ) : null}'''
          if panel.count(legend_old) != 1:
              raise SystemExit('discipline panel: legend seam changed')
          panel_path.write_text(panel.replace(legend_old, legend_new, 1))

          test_path = Path('apps/web/e2e/character-secondary-build.pw.ts')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              "  await expect(preview).toContainText('Core stats')\n  await expect(preview).toContainText('Adventure stats')",
              "  await expect(preview).not.toContainText('Core stats')\n  await expect(preview).not.toContainText('Adventure stats')",
              1,
          )
          sigil_seam = "  await expect(disciplineBuildLabel).toHaveText('Vanguard + Aetherist')\n  await expect(maxHp).toHaveText(maxHpBeforeSecondary)"
          sigil_insert = """  await expect(disciplineBuildLabel).toHaveText('Vanguard + Aetherist')\n  const triggerSigils = launcher.locator('svg')\n  await expect(triggerSigils).toHaveCount(2)\n  const primarySigilBox = await triggerSigils.nth(0).boundingBox()\n  const secondarySigilBox = await triggerSigils.nth(1).boundingBox()\n  if (!primarySigilBox || !secondarySigilBox) {\n    throw new Error('The committed Discipline sigils are unavailable for layout verification.')\n  }\n  expect(secondarySigilBox.x - (primarySigilBox.x + primarySigilBox.width)).toBeGreaterThanOrEqual(3)\n  expect(Math.abs(primarySigilBox.height - secondarySigilBox.height)).toBeLessThanOrEqual(1)\n  await expect(maxHp).toHaveText(maxHpBeforeSecondary)"""
          if test_text.count(sigil_seam) != 1:
              raise SystemExit('secondary test: trigger sigil seam changed')
          test_text = test_text.replace(sigil_seam, sigil_insert, 1)
          primary_seam = "  await expect(preview).toContainText('Lifebinder + Aetherist')\n  await expect(preview).not.toContainText('Build v2')"
          primary_insert = """  await expect(preview).toContainText('Lifebinder + Aetherist')\n  await expect(preview).toContainText('Core stats')\n  await expect(preview).toContainText('Adventure stats')\n  await expect(preview).not.toContainText('Build v2')"""
          if test_text.count(primary_seam) != 1:
              raise SystemExit('secondary test: primary preview seam changed')
          test_text = test_text.replace(primary_seam, primary_insert, 1)

          test_text += '''\n\ntest('mobile Profile balances the portrait and centers Discipline Management', async ({\n  page,\n}, testInfo) => {\n  test.skip(\n    testInfo.project.name !== 'mobile-chromium',\n    'This proof targets the mobile Profile and modal layout.',\n  )\n\n  const characterName = uniqueCharacterName()\n  await provisionAccountAndEnterCharacter({\n    page,\n    email: `profile-mobile-polish-${Date.now()}@example.com`,\n    password: 'Profile-mobile-polish-2026!',\n    characterName,\n  })\n\n  const profile = page.getByTestId('character-profile')\n  const portrait = profile.getByRole('img', { name: `${characterName} portrait` }).locator('..')\n  const portraitTranslateY = await portrait.evaluate((element) => {\n    const transform = getComputedStyle(element).transform\n    return transform === 'none' ? 0 : new DOMMatrix(transform).m42\n  })\n  expect(portraitTranslateY).toBeGreaterThanOrEqual(7)\n\n  const launcher = page\n    .getByTestId('primary-build-panel')\n    .getByRole('button', { name: /Manage Primary Discipline/ })\n  await launcher.click()\n  const dialog = page.getByRole('dialog', { name: 'Discipline Management' })\n  await expect(dialog).toBeVisible()\n\n  const dialogBox = await dialog.boundingBox()\n  const viewport = page.viewportSize()\n  if (!dialogBox || !viewport) {\n    throw new Error('The mobile Discipline dialog geometry is unavailable.')\n  }\n  const dialogCenterY = dialogBox.y + dialogBox.height / 2\n  expect(Math.abs(dialogCenterY - viewport.height / 2)).toBeLessThanOrEqual(12)\n  expect(dialogBox.y).toBeGreaterThan(8)\n})\n'''
          test_path.write_text(test_text)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-profile-shell-compact.module.css \
            apps/web/src/components/character/character-discipline-build-panel.module.css \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/e2e/character-secondary-build.pw.ts
      - name: Commit focused patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/components/character/character-profile-shell-compact.module.css \
            apps/web/src/components/character/character-discipline-build-panel.module.css \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/e2e/character-secondary-build.pw.ts
          git diff --cached --check
          git commit -m "Polish mobile profile and discipline interactions"
          git push origin HEAD:agent/profile-discipline-mobile-polish-v3
