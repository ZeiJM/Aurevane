name: Agent Profile Discipline Mobile Polish V3

on:
  push:
    branches:
      - agent/profile-discipline-mobile-polish-v3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-discipline-mobile-polish-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Apply matched launcher patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          compact = 'apps/web/src/components/character/character-profile-shell-compact.module.css'
          replace_once(
              compact,
              """.buildCard [data-testid='skill-build-panel'] > button small {\n  display: none !important;\n}\n""",
              """.buildCard [data-testid='skill-build-panel'] > button small {\n  display: none !important;\n}\n\n.buildCard [data-testid='skill-build-panel'] > button {\n  justify-content: center;\n  text-align: center;\n}\n\n.buildCard [data-testid='skill-build-panel'] > button strong::after {\n  font: 750 0.56rem/1 var(--av-font-mono);\n  letter-spacing: 0.06em;\n}\n""",
          )
          replace_once(
              compact,
              """\n  .buildCard [data-testid='skill-build-panel'] > button {\n    justify-content: center;\n    text-align: center;\n  }\n""",
              "\n",
          )

          test_path = Path('apps/web/e2e/character-secondary-build.pw.ts')
          text = test_path.read_text()
          if "import { expect, test } from '@playwright/test'" not in text:
              raise SystemExit('secondary browser test import seam changed')
          text = text.replace(
              "import { expect, test } from '@playwright/test'",
              "import { expect, test, type Page } from '@playwright/test'",
              1,
          )

          helper_anchor = """async function recordMastery(characterId: string, disciplineId: string): Promise<void> {\n"""
          helper_start = text.index(helper_anchor)
          first_test = text.index("\ntest('Profile equips", helper_start)
          helper = """

async function expectMatchedBuildLaunchers(page: Page): Promise<void> {
  const disciplineLauncher = page
    .getByTestId('primary-build-panel')
    .getByRole('button', { name: /Manage Primary Discipline/ })
  const techniquesLauncher = page
    .getByTestId('skill-build-panel')
    .getByRole('button', { name: /Manage Techniques/ })
  const disciplineLabel = disciplineLauncher.getByText('Discipline Management', { exact: true })
  const techniquesLabel = techniquesLauncher.locator('strong')

  await expect(disciplineLauncher).toBeVisible()
  await expect(techniquesLauncher).toBeVisible()

  const [techniquesButtonBox, techniquesLabelBox] = await Promise.all([
    techniquesLauncher.boundingBox(),
    techniquesLabel.boundingBox(),
  ])
  if (!techniquesButtonBox || !techniquesLabelBox) {
    throw new Error('The Techniques launcher geometry is unavailable.')
  }
  const buttonCenterX = techniquesButtonBox.x + techniquesButtonBox.width / 2
  const labelCenterX = techniquesLabelBox.x + techniquesLabelBox.width / 2
  expect(Math.abs(buttonCenterX - labelCenterX)).toBeLessThanOrEqual(2)

  const [techniquesFontSize, disciplineFontSize] = await Promise.all([
    techniquesLabel.evaluate((element) => getComputedStyle(element, '::after').fontSize),
    disciplineLabel.evaluate((element) => getComputedStyle(element).fontSize),
  ])
  expect(techniquesFontSize).toBe(disciplineFontSize)
}
"""
          text = text[:first_test] + helper + text[first_test:]

          desktop_anchor = "  await expect(disciplineBuildLabel).toHaveText('Vanguard')\n"
          if text.count(desktop_anchor) != 1:
              raise SystemExit('secondary browser test desktop launcher seam changed')
          text = text.replace(
              desktop_anchor,
              desktop_anchor + '  await expectMatchedBuildLaunchers(page)\n',
              1,
          )

          mobile_anchor = """  const profile = page.getByTestId('character-profile')\n"""
          if text.count(mobile_anchor) != 1:
              raise SystemExit('secondary browser test mobile launcher seam changed')
          text = text.replace(
              mobile_anchor,
              "  await expectMatchedBuildLaunchers(page)\n\n" + mobile_anchor,
              1,
          )
          test_path.write_text(text)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-profile-shell-compact.module.css \
            apps/web/e2e/character-secondary-build.pw.ts
      - name: Commit matched launcher patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/components/character/character-profile-shell-compact.module.css \
            apps/web/e2e/character-secondary-build.pw.ts
          git diff --cached --check
          git commit -m "Match Profile build launcher typography"
          git push origin HEAD:agent/profile-discipline-mobile-polish-v3
