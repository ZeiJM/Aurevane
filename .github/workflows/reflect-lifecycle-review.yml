name: Reflect lifecycle review
on:
  push:
    branches: [agent/reflect-lifecycle-workbench-20260915]
permissions:
  contents: read
jobs:
  final-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ded3a8b11060760486a8972cf4209ac2a8f2dd17
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Differential normal turns and full Reflect boundary review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ded3a8b11060760486a8972cf4209ac2a8f2dd17
          test "$(git rev-parse HEAD^{tree})" = 54813341e63028217d0181a6151c64d6269d49b4
          git fetch --no-tags origin 73a7fff80e39527f839cbd7b0e960bb1c9c8650f
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          root=Path('packages/game-core/src/combat')
          tests=root/'combat-reflect.test.ts'
          legacy=root/'actions-legacy.ts'
          saved_tests=tests.read_bytes()
          saved_legacy=legacy.read_bytes()
          before=subprocess.check_output(['git','show','df825910e89d64f46c22d7d6c2d1b7c69d41b8f5:packages/game-core/src/combat/actions-legacy.ts'],text=True)
          start=before.index('export function endCombatTurn(')
          end=before.index('\nexport function resolveTargetShapeTiles(',start)
          baseline=before[start:end].replace('export function endCombatTurn(', 'export function reviewBaselineEndCombatTurn(',1)
          workflow=subprocess.check_output(['git','show','73a7fff80e39527f839cbd7b0e960bb1c9c8650f:.github/workflows/reflect-workbench.yml'],text=True)
          marker="          additions = '''\n"
          assert workflow.count(marker)==1
          old_review=textwrap.dedent(workflow.split(marker)[1].split("          '''\n")[0])
          additions='''
          import { reviewBaselineEndCombatTurn } from './actions-legacy'

          const turnVectors = [false, true].flatMap((wraps) =>
            [-20, 20].flatMap((tempoAmount) =>
              ['none', 'damage', 'healing'].flatMap((periodicKind) =>
                [1, 2].map((duration) => ({ wraps, tempoAmount, periodicKind, duration })))))
          it.each(turnVectors)('review unchanged ordinary turn %j', ({ wraps, tempoAmount, periodicKind, duration }) => {
            let initial = wraps ? roundEndReflectEncounter() : encounter({ actorHp: 3, allyWitness: true })
            const tempo: CombatStatusDefinition = {
              id: 'review.tempo', version: 1, maximumStacks: 1, durationOwnerTurnStarts: 2,
              damageTakenMultiplierBasisPoints: 10_000, nextRoundInitiative: tempoAmount,
            }
            const periodic: CombatStatusDefinition = {
              id: 'review.periodic', version: 1, maximumStacks: 1, durationOwnerTurnStarts: 2,
              damageTakenMultiplierBasisPoints: 10_000,
              ...(periodicKind === 'damage' ? { endOfTurn: { type: 'damage' as const, amount: 1 } }
                : periodicKind === 'healing' ? { endOfTurn: { type: 'healing' as const, amount: 4 } } : {}),
            }
            const content = { statuses: [REFLECT, tempo, periodic] }
            initial.statusState = initial.statusState.map((row) => ({
              ...row,
              statuses: row.combatantId === 'target' ? row.statuses.map((status) => ({ ...status, remainingOwnerTurnStarts: duration }))
                : [{ statusId: row.combatantId === 'witness' ? tempo.id : periodic.id, statusVersion: 1,
                    stacks: 1, remainingOwnerTurnStarts: duration, sourceCombatantId: row.combatantId }],
            }))
            initial = setTerrainOverlay(initial, { x: 0, y: 0 }, 'frozen', 'actor', 'review.terrain').state
            initial = { ...initial, tactical: selectCurrentFinalFacing(initial.tactical, 'east').state }
            const snapshot = JSON.stringify(initial)
            const baseline = reviewBaselineEndCombatTurn(initial, content)
            const current = legacy.endCombatTurn(initial, content)
            expect(current).toEqual(baseline)
            expect(validateCombatEncounterState(current.state)).toEqual([])
            expect(JSON.stringify(initial)).toBe(snapshot)
          })
          it('review no outgoing periodic tick is replayed after Reflect defeats the actor', () => {
            const periodic: CombatStatusDefinition = {
              id: 'review.dead-periodic', version: 1, maximumStacks: 1, durationOwnerTurnStarts: 2,
              damageTakenMultiplierBasisPoints: 10_000, endOfTurn: { type: 'healing', amount: 50 },
            }
            const result = cast(encounter({ actorHp: 3, allyWitness: true, actorStatuses: [periodic] }), hit(), [REFLECT, periodic])
            expect(unit(result, 'actor').hp).toBe(0)
            expect(result.events.filter((event) => event.event === 'healing_applied')).toEqual([])
            expect(result.events.filter((event) => event.event === 'damage_applied')).toHaveLength(2)
            expect(result.state.tactical.battle.currentTurn?.combatantId).toBe('target')
          })
          it('review terminal Reflect does not start a successor status clock or round', () => {
            const initial = encounter({ actorHp: 3, duel: true })
            const result = cast(initial)
            expect(result.state.tactical.battle.currentTurn).toBeNull()
            expect(result.events.filter((event) => ['turn_started', 'round_started', 'status_expired'].includes(event.event))).toEqual([])
            expect(result.state.statusState).toEqual(initial.statusState)
          })
          it('review non-wrapping Reflect defeat leaves queued tempo and terrain for their real boundary', () => {
            const tempo: CombatStatusDefinition = {
              id: 'review.queued-tempo', version: 1, maximumStacks: 1, durationOwnerTurnStarts: 2,
              damageTakenMultiplierBasisPoints: 10_000, nextRoundInitiative: 20,
            }
            let initial = encounter({ actorHp: 3, allyWitness: true })
            initial.statusState = initial.statusState.map((row) => row.combatantId !== 'witness' ? row : {
              ...row, statuses: [{ statusId: tempo.id, statusVersion: 1, stacks: 1, remainingOwnerTurnStarts: 2, sourceCombatantId: 'witness' }],
            })
            initial = setTerrainOverlay(initial, { x: 0, y: 0 }, 'frozen', 'actor', 'review.queued-terrain').state
            const result = cast(initial, hit(), [REFLECT, tempo])
            expect(result.state.tactical.battle.round).toBe(1)
            expect(result.state.tactical.battle.currentTurn?.combatantId).toBe('target')
            expect(result.state.statusState.find((row) => row.combatantId === 'witness')).toEqual(initial.statusState.find((row) => row.combatantId === 'witness'))
            expect(terrainOverlayAt(result.state, { x: 0, y: 0 })?.remainingRoundBoundaries).toBe(2)
            expect(result.events.filter((event) => event.event === 'status_expired')).toEqual([])
          })
          '''
          try:
              legacy.write_bytes(saved_legacy+b'\n'+baseline.encode())
              tests.write_bytes(saved_tests+b'\n'+old_review.encode()+additions.encode())
              subprocess.run(['pnpm','--filter','@aurevane/game-core','typecheck'],check=True)
              subprocess.run(['pnpm','--filter','@aurevane/game-core','exec','vitest','run',
                'src/combat/combat-reflect.test.ts','src/combat/combat-absorb-mp.test.ts',
                'src/combat/combat-absorb-hp.test.ts','src/combat/combat-absorb-hp-command.test.ts',
                'src/combat/combat-barrier.test.ts','src/combat/combat-damage-history-runtime.test.ts',
                'src/combat/combat-resolution-provenance.test.ts','src/combat/combat-burn-backlash.test.ts',
                'src/combat/combat-dot-rework.test.ts'],check=True)
          finally:
              legacy.write_bytes(saved_legacy)
              tests.write_bytes(saved_tests)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Verify restricted source and publication scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check c2c41be224d22f532d551506037ac86835452691...HEAD
          git diff --exit-code c2c41be224d22f532d551506037ac86835452691...HEAD -- apps .github pnpm-lock.yaml packages/game-core/src/combat/status-content.ts packages/game-core/src/combat/battle-state.ts packages/game-core/src/combat/stat-driven-combat.ts packages/game-core/src/combat/combat-effect-provenance.ts
          test "$(git rev-parse HEAD)" = ded3a8b11060760486a8972cf4209ac2a8f2dd17
          test "$(git rev-parse HEAD^{tree})" = 54813341e63028217d0181a6151c64d6269d49b4
          git diff --exit-code
