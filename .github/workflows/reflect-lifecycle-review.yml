name: Reflect lifecycle review
on:
  push:
    branches: [agent/reflect-lifecycle-workbench-20260915]
permissions:
  contents: read
jobs:
  lifecycle-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df825910e89d64f46c22d7d6c2d1b7c69d41b8f5
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify unchanged baseline and inspect lifecycle helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = df825910e89d64f46c22d7d6c2d1b7c69d41b8f5
          pnpm --filter @aurevane/game-core exec vitest run > /tmp/baseline.log 2>&1
          tail -8 /tmp/baseline.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('packages/game-core/src/combat/actions-legacy.ts').read_text()
          for name in ['applyCurrentBurnBacklash', 'expireOwnerTurnStartStatuses', 'removeStatuses', 'withBattle']:
              match = re.search(r'^(?:export )?function '+name+r'\(', text, re.M)
              if match:
                  tail = text[match.start():]
                  end = re.search(r'\n(?:export )?function ', tail[1:])
                  print('LIFECYCLE_SOURCE', name, '\n', tail[:end.start()+1] if end else tail[:6000])
          for path in Path('packages/game-core/src/combat').glob('*.ts'):
              if path.name.endswith('.test.ts'): continue
              for i,line in enumerate(path.read_text().splitlines()):
                  if any(token in line for token in ['expireOwnerTurnStartStatuses(', 'defeatCurrentCombatant(', 'turnOrigin:']):
                      print('LIFECYCLE_CALLER', path.name, i+1, line.strip())
          PY
      - name: Prove lifecycle assertions before production changes
        shell: bash
        run: |
          set -euo pipefail
          file=packages/game-core/src/combat/combat-reflect.test.ts
          cp "$file" /tmp/reflect-original.ts
          trap 'cp /tmp/reflect-original.ts "$file"' EXIT
          cat >> "$file" <<'TEST'

          import { setTerrainOverlay, terrainOverlayAt } from './terrain-overlays'

          function roundEndReflectEncounter(): CombatEncounterState {
            const initial = encounter({ actorHp: 3, allyWitness: true })
            const turn = initial.tactical.battle.currentTurn
            if (!turn) throw new Error('Missing fixture turn')
            return {
              ...initial,
              tactical: createTacticalBattleState({
                ...initial.tactical,
                battle: {
                  ...initial.tactical.battle,
                  combatants: initial.tactical.battle.combatants.map((combatant) => ({
                    ...combatant,
                    initiative: combatant.id === 'actor' ? 10 : combatant.id === 'target' ? 30 : 20,
                  })),
                  initiativeOrder: ['target', 'witness', 'actor'],
                  turnNumber: 3,
                  currentTurn: { ...turn, initiativeIndex: 2 },
                },
              }),
            }
          }

          describe('Reflect successor lifecycle regression', () => {
            it('decrements the surviving successor status exactly once after attacker defeat', () => {
              const initial = encounter({ actorHp: 3, allyWitness: true })
              const result = cast(initial)
              expect(result.state.tactical.battle.currentTurn?.combatantId).toBe('target')
              expect(result.state.statusState.find((row) => row.combatantId === 'target')?.statuses[0]?.remainingOwnerTurnStarts).toBe(1)
              expect(validateCombatEncounterState(result.state)).toEqual([])
            })
            it('expires the successor final status tick only after its earned reflection', () => {
              const initial = encounter({ actorHp: 3, allyWitness: true })
              initial.statusState = initial.statusState.map((row) => ({
                ...row,
                statuses: row.statuses.map((status) => ({ ...status, remainingOwnerTurnStarts: 1 })),
              }))
              const result = cast(initial)
              expect(reflected(result)).toEqual([expect.objectContaining({ amount: 3 })])
              expect(result.state.statusState.find((row) => row.combatantId === 'target')?.statuses).toEqual([])
              expect(result.events.filter((event) => event.event === 'status_expired')).toEqual([
                { event: 'status_expired', combatantId: 'target', statusId: REFLECT.id },
              ])
            })
            it('preserves durations when reflection does not advance the turn', () => {
              const result = cast(encounter({ allyWitness: true }))
              expect(result.state.tactical.battle.currentTurn?.combatantId).toBe('actor')
              expect(result.state.statusState.find((row) => row.combatantId === 'target')?.statuses[0]?.remainingOwnerTurnStarts).toBe(2)
              expect(result.events.filter((event) => event.event === 'status_expired')).toEqual([])
            })
            it('applies and consumes scheduled tempo when reflected defeat wraps the round', () => {
              const initial = roundEndReflectEncounter()
              const tempo: CombatStatusDefinition = {
                id: 'test.reflect-successor-tempo', version: 1, maximumStacks: 1,
                durationOwnerTurnStarts: 2, damageTakenMultiplierBasisPoints: 10_000,
                nextRoundInitiative: 20,
              }
              initial.statusState = initial.statusState.map((row) => row.combatantId !== 'witness' ? row : {
                ...row,
                statuses: [{ statusId: tempo.id, statusVersion: 1, stacks: 1, remainingOwnerTurnStarts: 2, sourceCombatantId: 'witness' }],
              })
              expect(validateCombatEncounterState(initial)).toEqual([])
              const result = cast(initial, hit(), [REFLECT, tempo])
              expect(result.state.tactical.battle.round).toBe(2)
              expect(result.state.tactical.battle.currentTurn?.combatantId).toBe('witness')
              expect(result.state.tactical.battle.roundInitiativeModifiers).toEqual([{ combatantId: 'witness', amount: 20 }])
              expect(result.state.statusState.find((row) => row.combatantId === 'witness')?.statuses).toEqual([])
              expect(result.events).toContainEqual({ event: 'status_expired', combatantId: 'witness', statusId: tempo.id })
              expect(validateCombatEncounterState(result.state)).toEqual([])
            })
            it('advances temporary terrain lifetime on a reflected round boundary', () => {
              const initial = setTerrainOverlay(roundEndReflectEncounter(), { x: 0, y: 0 }, 'frozen', 'actor', 'test.reflect-terrain').state
              const result = cast(initial)
              expect(result.state.tactical.battle.round).toBe(2)
              expect(terrainOverlayAt(result.state, { x: 0, y: 0 })?.remainingRoundBoundaries).toBe(1)
              expect(validateCombatEncounterState(result.state)).toEqual([])
            })
          })
          TEST
          pnpm exec prettier --write "$file"
          pnpm --filter @aurevane/game-core typecheck
          pnpm exec eslint "$file"
          set +e
          pnpm --filter @aurevane/game-core exec vitest run --reporter=json --outputFile=/tmp/reflect-lifecycle-red.json > /tmp/reflect-lifecycle-red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json,re
          report=json.load(open('/tmp/reflect-lifecycle-red.json'))
          failed=[]
          for suite in report['testResults']:
              for test in suite['assertionResults']:
                  if test['status']!='failed': continue
                  msg='\n'.join(test.get('failureMessages', []))
                  assert 'Reflect successor lifecycle regression' in test['fullName'], (test['fullName'], msg)
                  assert 'AssertionError:' in msg, msg
                  print('LIFECYCLE_RED', test['fullName'], re.sub(r'\x1b\[[0-9;]*m','',msg).split('\n')[0])
                  failed.append(test)
          assert len(failed)==4, len(failed)
          print('VALID_LIFECYCLE_RED', len(failed), 'failed;', report['numPassedTests'], 'passed;', report['numTotalTests'], 'total')
          PY
          cp /tmp/reflect-original.ts "$file"
          trap - EXIT
          git diff --exit-code
          test -z "$(git status --porcelain)"
