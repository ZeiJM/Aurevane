name: Reflect lifecycle review
on:
  push:
    branches: [agent/reflect-lifecycle-workbench-20260915]
permissions:
  contents: write
jobs:
  lifecycle-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df825910e89d64f46c22d7d6c2d1b7c69d41b8f5
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Preserve and re-prove the exact lifecycle RED tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = df825910e89d64f46c22d7d6c2d1b7c69d41b8f5
          git fetch --no-tags origin ea1d100ad522fb594e99178f5dd7755c4fff6245
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          workflow=subprocess.check_output(['git','show','ea1d100ad522fb594e99178f5dd7755c4fff6245:.github/workflows/reflect-lifecycle-review.yml'],text=True)
          marker='          cat >> "$file" <<\'TEST\'\n'
          assert workflow.count(marker)==1
          tests=textwrap.dedent(workflow.split(marker)[1].split('          TEST\n')[0])
          p=Path('packages/game-core/src/combat/combat-reflect.test.ts')
          p.write_text(p.read_text()+tests)
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-reflect.test.ts
          pnpm --filter @aurevane/game-core typecheck
          pnpm exec eslint packages/game-core/src/combat/combat-reflect.test.ts
          set +e
          pnpm --filter @aurevane/game-core exec vitest run --reporter=json --outputFile=/tmp/lifecycle-red.json >/tmp/lifecycle-red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json,re
          r=json.load(open('/tmp/lifecycle-red.json'))
          failed=[]
          for s in r['testResults']:
              for t in s['assertionResults']:
                  if t['status']!='failed': continue
                  msg='\n'.join(t.get('failureMessages',[]))
                  assert 'Reflect successor lifecycle regression' in t['fullName'] and 'AssertionError:' in msg, (t['fullName'],msg)
                  failed.append(t)
                  print('EXPECTED RED',t['fullName'],re.sub(r'\x1b\[[0-9;]*m','',msg).split('\n')[0])
          assert len(failed)==4 and r['numPassedTests']==1374 and r['numTotalTests']==1378, r
          print('VALID_LIFECYCLE_RED 4 failures; 1374 passing')
          PY
          test "$(git diff --name-only)" = packages/game-core/src/combat/combat-reflect.test.ts
          git diff --check
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -- packages/game-core/src/combat/combat-reflect.test.ts
          git commit -m 'test(combat): guard Reflect successor status and round upkeep'
          git rev-parse HEAD > /tmp/lifecycle-red-sha
      - name: Reuse encounter turn and round upkeep for Reflect defeat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('packages/game-core/src/combat')
          for name,sha in {'actions-legacy.ts':'deed3d55195757ec761e3c25cc1242079f132573','combat-reflect.ts':'33aacea327b0'}.items():
              actual=subprocess.check_output(['git','rev-parse',f'HEAD:{root/name}'],text=True).strip()
              if name=='actions-legacy.ts': assert actual==sha,(name,actual)
          p=root/'actions-legacy.ts'
          text=p.read_text()
          assert 'function defeatCombatActionActor(' not in text
          assert 'function collectNextRoundInitiativeModifiers(' not in text
          assert 'function applyCombatRoundBoundary(' not in text
          a=text.index('  const roundModifiers = state.statusState.flatMap(')
          b=text.index('  const outgoingId',a)
          modifier_body=text[a:b].replace('  const roundModifiers = ','  return ',1)
          text=text[:a]+'  const roundModifiers = collectNextRoundInitiativeModifiers(state, content)\n'+text[b:]
          a=text.index('  if (ended.state.round !== state.tactical.battle.round) {')
          b=text.index('  // Resolve the outgoing unit',a)
          block=text[a:b].splitlines()
          assert block[-1]=='  }',block[-1]
          inner='\n'.join(line[2:] for line in block[1:-1])+'\n'
          text=text[:a]+'''  const boundary = applyCombatRoundBoundary(nextState, state.tactical.battle.round, content)
            nextState = boundary.state
            events.push(...boundary.events)
          '''+text[b:]
          helpers='''/** Encounter upkeep for a reaction knockout; the defeated actor receives no extra periodic tick. */
          export function defeatCombatActionActor(
            state: CombatEncounterState,
            actorId: string,
            content: CombatContentCatalog,
          ): CombatResolutionTransition {
            const defeated = defeatCurrentCombatant(
              state.tactical.battle,
              actorId,
              collectNextRoundInitiativeModifiers(state, content),
            )
            const boundary = applyCombatRoundBoundary(
              withBattle(state, defeated.state), state.tactical.battle.round, content,
            )
            const successorId = boundary.state.tactical.battle.currentTurn?.combatantId
            const successor = successorId
              ? expireOwnerTurnStartStatuses(boundary.state, successorId, content)
              : { state: boundary.state, events: [] }
            return {
              state: successor.state,
              events: [...defeated.events, ...boundary.events, ...successor.events],
            }
          }

          function collectNextRoundInitiativeModifiers(
            state: CombatEncounterState,
            content: CombatContentCatalog,
          ): NonNullable<BattleState['roundInitiativeModifiers']> {
          '''+modifier_body+''' }

          function applyCombatRoundBoundary(
            state: CombatEncounterState,
            previousRound: number,
            content: CombatContentCatalog,
          ): CombatResolutionTransition {
            if (state.tactical.battle.round === previousRound) return { state, events: [] }
            let nextState = state
            const events: CombatResolutionEvent[] = []
          '''+inner+'''  return { state: nextState, events }
          }

          '''
          point=text.index('export function endCombatTurn(')
          text=text[:point]+helpers+text[point:]
          p.write_text(text)
          p=root/'combat-reflect.ts'
          text=p.read_text()
          old="import { removeGameplayTags } from './actions-legacy'\nimport { defeatCurrentCombatant } from './battle-state'"
          assert text.count(old)==1
          text=text.replace(old,"import { defeatCombatActionActor, removeGameplayTags } from './actions-legacy'")
          a=text.index('    // Reuse the established defeat/turn transition;')
          b=text.index('    const revealed = ',a)
          text=text[:a]+'''    // Run encounter upkeep as well as selecting the next living combatant.
              const defeated = hpAfter === 0 ? defeatCombatActionActor(nextState, attacker.id, content) : null
              nextState = defeated?.state ?? clearDefeatedRecovery({
                ...nextState,
                tactical: createTacticalBattleState({
                  ...nextState.tactical,
                  battle: {
                    ...nextState.tactical.battle,
                    combatants: nextState.tactical.battle.combatants.map((unit) =>
                      unit.id === attacker.id ? { ...unit, hp: hpAfter } : unit,
                    ),
                  },
                }),
              })
          '''+text[b:]
          p.write_text(text)
          doc=Path('docs/COMBAT.md')
          text=doc.read_text()
          marker='This is a kernel primitive, not a published roster or balance change.'
          assert text.count(marker)==1
          text=text.replace(marker,"When Reflect defeats the current actor but the battle continues, the successor receives normal owner-turn-start status expiration. A crossed round applies and consumes scheduled tempo and advances temporary terrain exactly once, using the same upkeep as normal turn endings. The defeated actor's ordinary periodic damage/recovery is not replayed.\n\n"+marker)
          doc.write_text(text)
          PY
          pnpm exec prettier --write packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-reflect.ts docs/COMBAT.md
          git diff --check
      - name: Focused and full repository GREEN
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-reflect.test.ts src/combat/combat-absorb-mp.test.ts src/combat/combat-absorb-hp.test.ts src/combat/combat-absorb-hp-command.test.ts src/combat/combat-barrier.test.ts src/combat/combat-damage-history-runtime.test.ts src/combat/combat-resolution-provenance.test.ts src/combat/combat-burn-backlash.test.ts src/combat/combat-dot-rework.test.ts
          pnpm --filter @aurevane/game-core typecheck
          if ! pnpm check > /tmp/lifecycle-quality.log 2>&1; then tail -200 /tmp/lifecycle-quality.log; exit 1; fi
          python3 - <<'PY'
          import re
          text=re.sub(r'\x1b\[[0-9;]*m','',open('/tmp/lifecycle-quality.log').read())
          for line in text.splitlines():
              if any(k in line for k in ['Test Files','Tests ','successful,','Compiled successfully','All matched files','ℹ pass','ℹ fail']): print(line)
          print('FULL_PNPM_CHECK_PASSED')
          PY
      - name: Scope review and source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-reflect.test.ts apps .github pnpm-lock.yaml
          python3 - <<'PY'
          import subprocess
          expected={'packages/game-core/src/combat/actions-legacy.ts','packages/game-core/src/combat/combat-reflect.ts','docs/COMBAT.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,changed
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          PY
          git diff --stat
          git diff -- packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-reflect.ts
          git add -- packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-reflect.ts docs/COMBAT.md
          git commit -m 'fix(combat): preserve encounter upkeep after Reflect knockout' -m 'Four assertion-only regressions confirmed on df825910. Reuse normal successor expiration, scheduled tempo and terrain round-boundary handling without replaying dead-actor periodic effects. Original Reflect/Absorb contracts and full pnpm check pass. No publication or deployment.'
          git diff --check df825910e89d64f46c22d7d6c2d1b7c69d41b8f5...HEAD
          git diff --exit-code
          test -z "$(git status --porcelain)"
          test -z "$(git ls-remote origin refs/heads/agent/reflect-lifecycle-green-20260915)"
          git push origin HEAD:refs/heads/agent/reflect-lifecycle-green-20260915
          printf 'RED_SHA=%s\nGREEN_SHA=%s\nGREEN_TREE=%s\n' "$(cat /tmp/lifecycle-red-sha)" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
