name: Agent Profile Loadout Finalize V2

on:
  push:
    branches:
      - agent/profile-discipline-mobile-polish-v3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-discipline-mobile-polish-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Apply final focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          shell_path = Path('apps/web/src/components/character/character-profile-shell.tsx')
          shell = shell_path.read_text()
          old = '<strong id="build-disciplines-heading">Disciplines</strong>'
          if shell.count(old) != 1:
              raise SystemExit(f'profile shell heading seam changed: {shell.count(old)} matches')
          shell_path.write_text(shell.replace(old, '<strong id="build-disciplines-heading">Discipline</strong>', 1))

          old_locator = """  const disciplineBuildLabel = page\n    .locator('#build-disciplines-heading')\n    .locator('..')\n    .locator('strong')\n"""

          primary_path = Path('apps/web/e2e/character-primary-build.pw.ts')
          primary = primary_path.read_text()
          if primary.count(old_locator) != 1:
              raise SystemExit('primary test build-label seam changed')
          primary = primary.replace(old_locator, "  const primaryDisciplineChip = page.getByTestId('primary-discipline-chip')\n", 1)
          primary = primary.replace("await expect(disciplineBuildLabel).toHaveText('Vanguard')", "await expect(primaryDisciplineChip).toHaveText('Vanguard')", 1)
          primary = primary.replace("await expect(disciplineBuildLabel).toHaveText('Aetherist')", "await expect(primaryDisciplineChip).toHaveText('Aetherist')", 1)
          primary_path.write_text(primary)

          secondary_path = Path('apps/web/e2e/character-secondary-build.pw.ts')
          secondary = secondary_path.read_text()
          if secondary.count(old_locator) != 1:
              raise SystemExit('secondary test build-label seam changed')
          secondary = secondary.replace(
              old_locator,
              """  const primaryDisciplineChip = page.getByTestId('primary-discipline-chip')\n  const secondaryDisciplineChip = page.getByTestId('secondary-discipline-chip')\n""",
              1,
          )
          secondary = secondary.replace("await expect(disciplineBuildLabel).toHaveText('Vanguard')", "await expect(primaryDisciplineChip).toHaveText('Vanguard')", 1)
          secondary = secondary.replace(
              "await expect(disciplineBuildLabel).toHaveText('Vanguard + Aetherist')",
              """await expect(primaryDisciplineChip).toHaveText('Vanguard')\n  await expect(secondaryDisciplineChip).toHaveText('Aetherist')""",
              1,
          )
          secondary = secondary.replace(
              "await expect(disciplineBuildLabel).toHaveText('Lifebinder + Aetherist')",
              """await expect(primaryDisciplineChip).toHaveText('Lifebinder')\n  await expect(secondaryDisciplineChip).toHaveText('Aetherist')""",
              1,
          )
          secondary_path.write_text(secondary)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/e2e/character-secondary-build.pw.ts
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/e2e/character-secondary-build.pw.ts
          git diff --cached --check
          git commit -m "Finalize Combat Loadout labels and coverage"
          git push origin HEAD:agent/profile-discipline-mobile-polish-v3
