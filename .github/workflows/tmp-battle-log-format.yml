name: Temporary battle log formatting diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/pvp-battle-chat.tsx \
            apps/web/src/server/battle/battle-log-service.ts
          git diff -- \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/pvp-battle-chat.tsx \
            apps/web/src/server/battle/battle-log-service.ts
