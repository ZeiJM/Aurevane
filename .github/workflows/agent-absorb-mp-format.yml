name: Format Absorb MP RED contract

on:
  push:
    branches:
      - agent/combat-k4-absorb-mp-20260915
    paths:
      - .github/workflows/agent-absorb-mp-format.yml

permissions:
  contents: write

jobs:
  format-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Format only the RED contract
        run: |
          pnpm exec prettier --write packages/game-core/src/combat/combat-absorb-mp.test.ts
          git diff --check
      - name: Commit formatted contract and remove formatter
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k4-absorb-mp-20260915
          git rm .github/workflows/agent-absorb-mp-format.yml
          git add packages/game-core/src/combat/combat-absorb-mp.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format Absorb MP RED contract'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
