name: One-shot Final Facing state diagnostic

on:
  push:
    branches:
      - agent/battle-input-responsive-consistency-v3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-input-responsive-consistency-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Add deterministic facing-state assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/battle-self-action-quick-commit.pw.ts')
          text = path.read_text()
          old = """  await page.keyboard.press('Space')
  await expect(root).toHaveAttribute('data-finish-turn-hotkey-last-decision', 'handled-first')
  await expect(root.getByRole('button', { name: 'Face north' })).toBeEnabled()
  await expect(root.getByRole('button', { name: 'Face east' })).toBeEnabled()
  await expect(root.getByRole('button', { name: 'Face south' })).toBeEnabled()
  await expect(root.getByRole('button', { name: 'Face west' })).toBeEnabled()
"""
          new = """  await page.keyboard.press('Space')
  await expect(root).toHaveAttribute('data-finish-turn-hotkey-last-decision', 'handled-first')

  const facingState = await expect
    .poll(
      () =>
        root.evaluate((element) => {
          const pad = element.querySelector<HTMLElement>('[data-unified-facing-pad=\"true\"]')
          if (!pad) return { exists: false }
          const buttons = Array.from(
            pad.querySelectorAll<HTMLButtonElement>('button[aria-label^=\"Face \" ]'),
          )
          const style = getComputedStyle(pad)
          const hiddenAncestor = pad.closest<HTMLElement>('[aria-hidden=\"true\"]')
          return {
            exists: true,
            open: pad.getAttribute('data-open'),
            display: style.display,
            visibility: style.visibility,
            opacity: style.opacity,
            buttonCount: buttons.length,
            disabled: buttons.map((button) => button.disabled),
            hiddenAncestor: hiddenAncestor?.tagName ?? null,
            parentDisplay: pad.parentElement ? getComputedStyle(pad.parentElement).display : null,
          }
        }),
      { timeout: 5_000, message: 'Final Facing must open and become visible after first Space' },
    )
    .toMatchObject({
      exists: true,
      open: 'true',
      display: 'grid',
      visibility: 'visible',
      buttonCount: 4,
      disabled: [false, false, false, false],
      hiddenAncestor: null,
    })

  void facingState
  await expect(root.getByRole('button', { name: 'Face north' })).toBeEnabled()
  await expect(root.getByRole('button', { name: 'Face east' })).toBeEnabled()
  await expect(root.getByRole('button', { name: 'Face south' })).toBeEnabled()
  await expect(root.getByRole('button', { name: 'Face west' })).toBeEnabled()
"""
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm prettier --write apps/web/e2e/battle-self-action-quick-commit.pw.ts
      - name: Commit diagnostic and remove helper
        run: |
          git config user.name aurevane-release-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/one-shot-facing-state-diagnostic.yml
          git add apps/web/e2e/battle-self-action-quick-commit.pw.ts
          git commit -m "test: expose Final Facing render state"
          git push origin HEAD:agent/battle-input-responsive-consistency-v3
