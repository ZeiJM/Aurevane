name: World timing repeat validation

on:
  pull_request:
    paths:
      - 'apps/web/e2e/world-presence-case.ts'
      - 'apps/web/e2e/world-presence-diagnostics.ts'
      - 'apps/web/e2e/world-presence-diagnostics.test.ts'
      - 'apps/web/e2e/world-timing-metrics.ts'
      - 'apps/web/e2e/world-timing-metrics.test.ts'
      - '.github/workflows/world-timing-repeat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-timing-repeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Repeat both World timing tests twenty times
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          export AUREVANE_ENV=local NEXT_PUBLIC_AUREVANE_ENV=local
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$SUPABASE_SECRET_KEY"
          pnpm --filter @aurevane/web build
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
            set role service_role;
            select public.activate_phase4_combat_interactions_v2();
            select public.activate_phase4_discipline_rebalance_v1();
          "
          pnpm --filter @aurevane/web exec playwright test e2e/atlas-world.pw.ts \
            --project=desktop-chromium --workers=1 --repeat-each=20 --retries=0 \
            --grep 'known neighbouring players follow the visible viewport|holding WASD walks repeatedly' \
            --reporter=list,github
      - name: Save compact repeat boundary and motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-timing-repeat-evidence
          path: |
            apps/web/test-results/**/world-private-scene-join-diagnostics.json
            apps/web/test-results/**/world-live-peer-delivery.json
            apps/web/test-results/**/world-live-peer-interpolation.json
            apps/web/test-results/**/world-both-moving-peer-*.json
            apps/web/test-results/**/world-presence-boundaries.json
            apps/web/test-results/**/world-presence-cleanup.json
            apps/web/test-results/**/attachments/held-walk-approval-timings-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable database
        if: always()
        run: pnpm exec supabase stop --no-backup
