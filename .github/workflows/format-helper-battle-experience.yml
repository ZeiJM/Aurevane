name: Format helper battle experience

on:
  push:
    branches:
      - agent/format-helper-battle-experience

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format and commit battle experience
        run: |
          pnpm exec prettier --write apps/web/e2e/battle-experience.pw.ts
          if git diff --quiet -- apps/web/e2e/battle-experience.pw.ts; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'Aurevane CI'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web/e2e/battle-experience.pw.ts
          git commit -m 'Format battle experience regression'
          git push
