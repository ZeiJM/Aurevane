name: P3.3 docs reconciliation

on:
  push:
    branches:
      - agent/p3-3-mature-skill-cooldowns

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded P3.3 status reconciliation
        run: python .github/scripts/p33-reconcile-docs.py
      - name: Commit durable docs only
        run: |
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git restore --source=HEAD -- .github/workflows/p33-reconcile-docs.yml
          rm -f .github/scripts/p33-reconcile-docs.py
          git add TASKS.md AGENTS.md docs/ROADMAP.md
          git commit -m 'Reconcile active Phase 3 status to P3.3'
          git push origin HEAD:agent/p3-3-mature-skill-cooldowns
