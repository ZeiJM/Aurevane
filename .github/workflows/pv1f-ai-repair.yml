name: PV-1F temporary AI gate repair

on:
  push:
    branches:
      - agent/pv-1f-character-hub-turn-budget

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1f-character-hub-turn-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Repair Recruit PV-1F economy compatibility and tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          ai_path = Path('packages/game-core/src/combat/recruit-ai.ts')
          ai = ai_path.read_text()
          if 'preparePv1fTurnEconomy' not in ai:
              ai = ai.replace(
                  '  evaluatePv1fMovement,\n  readPv1fActionEconomy,\n',
                  '  evaluatePv1fMovement,\n  preparePv1fTurnEconomy,\n  readPv1fActionEconomy,\n',
                  1,
              )
          ai, count = re.subn(
              r"\): RecruitAiKnowledge \{\n  const battle = state\.tactical\.battle",
              "): RecruitAiKnowledge {\n  const prepared = preparePv1fTurnEconomy(state)\n  const battle = prepared.tactical.battle",
              ai,
              count=1,
          )
          if count != 1 and 'const prepared = preparePv1fTurnEconomy(state)' not in ai:
              raise SystemExit('Recruit knowledge preparation marker not found')
          ai = ai.replace(
              'actionEconomyRemaining: readPv1fActionEconomy(state, turn.combatantId)?.current ?? 0,',
              'actionEconomyRemaining: readPv1fActionEconomy(prepared, turn.combatantId)?.current ?? 0,',
              1,
          )
          ai = ai.replace('placements: state.tactical.placements.map', 'placements: prepared.tactical.placements.map', 1)
          ai = ai.replace('tiles: state.tactical.tiles.map', 'tiles: prepared.tactical.tiles.map', 1)
          ai_path.write_text(ai)

          test_path = Path('packages/game-core/src/combat/recruit-ai.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "import { createTacticalBattleState, selectCurrentFinalFacing } from './board'",
              "import { createTacticalBattleState } from './board'",
              1,
          )
          if "from './pv1f-action-economy'" not in test:
              test = test.replace(
                  "import { createTacticalBattleState } from './board'\n",
                  "import { createTacticalBattleState } from './board'\nimport { spendPv1fActionEconomy } from './pv1f-action-economy'\n",
                  1,
              )
          test = test.replace('  reattachStatDrivenCombatBridge,\n', '', 1)
          test, _ = re.subn(
              r"\nfunction withFinalFacing\([\s\S]*?\n\}\n\n(?=describe\('P2\.6 Recruit AI')",
              '\n',
              test,
              count=1,
          )

          new_face = '''  it('falls back to final facing when no Action Economy remains', () => {
            const state = encounter({
              width: 2,
              recruitPosition: { x: 1, y: 0 },
              playerPosition: { x: 0, y: 0 },
            })
            const economySpent = spendPv1fActionEconomy(state, 100)

            const decision = chooseRecruitAiDecision({ state: economySpent, tieBreakSeed: 9 })
            expect(decision).toMatchObject({
              reason: 'face-threat',
              intent: { kind: 'face', facing: 'west' },
            })
          })'''
          test, count = re.subn(
              r"  it\('falls back to facing the nearest threat before ending a turn',[\s\S]*?\n  \}\)\n\n(?=  it\('ends the turn)",
              new_face + '\n\n',
              test,
              count=1,
          )
          if count != 1 and 'falls back to final facing when no Action Economy remains' not in test:
              raise SystemExit('legacy face test not found')

          new_remaining = '''  it('continues acting when legacy Action State says spent but PV-1F economy remains', () => {
            const state = encounter({
              width: 2,
              recruitPosition: { x: 1, y: 0 },
              playerPosition: { x: 0, y: 0 },
            })
            const legacySpent = {
              ...state,
              tactical: {
                ...state.tactical,
                battle: {
                  ...state.tactical.battle,
                  currentTurn: {
                    ...state.tactical.battle.currentTurn!,
                    actionState: 'spent' as const,
                    movementRemaining: 0,
                    movementSpent: state.tactical.battle.currentTurn!.movementMaximum,
                  },
                },
              },
            }

            const decision = chooseRecruitAiDecision({ state: legacySpent, tieBreakSeed: 9 })
            expect(decision).toMatchObject({
              reason: 'legal-damage',
              intent: { kind: 'action', actionId: 'basic.attack.unarmed.basic' },
            })
          })'''
          test, count = re.subn(
              r"  it\('ends the turn once the safe final facing is already selected',[\s\S]*?\n  \}\)\n\n(?=  it\('rejects unbounded)",
              new_remaining + '\n\n',
              test,
              count=1,
          )
          if count != 1 and 'continues acting when legacy Action State says spent' not in test:
              raise SystemExit('legacy end-turn test not found')
          test_path.write_text(test)
          PY
      - name: Canonical format and focused tests
        run: |
          pnpm exec prettier --write packages/game-core/src/combat/recruit-ai.ts packages/game-core/src/combat/recruit-ai.test.ts
          pnpm --filter @aurevane/game-core test -- recruit-ai.test.ts
      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No AI repair changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/game-core/src/combat/recruit-ai.ts packages/game-core/src/combat/recruit-ai.test.ts
          git commit -m 'fix: align Recruit AI with PV-1F numeric economy'
          git push origin HEAD:agent/pv-1f-character-hub-turn-budget
