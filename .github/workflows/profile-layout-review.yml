name: UI layout review

on:
  push:
    branches:
      - agent/controls-keybinds-fidelity
    paths:
      - .github/workflows/profile-layout-review.yml
      - apps/web/e2e/controls-layout-regression.pw.ts
  pull_request:
    paths:
      - .github/workflows/profile-layout-review.yml
      - apps/web/e2e/controls-layout-regression.pw.ts

permissions:
  contents: read

concurrency:
  group: ui-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Print exact Controls Prettier diff
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/e2e/controls-layout-regression.pw.ts
          git diff -- apps/web/e2e/controls-layout-regression.pw.ts
