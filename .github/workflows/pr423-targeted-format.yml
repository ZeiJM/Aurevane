name: PR423 Targeted Format

on:
  push:
    branches:
      - 'agent/profile-discipline-battle-scaling'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/profile-discipline-battle-scaling

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format PR-related files
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-essence-authority.test.ts \
            apps/web/src/server/battle/battle-session-primary-build.test.ts \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/src/components/character/character-discipline-build-panel.module.css

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/server/battle/battle-essence-authority.test.ts \
            apps/web/src/server/battle/battle-session-primary-build.test.ts \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/src/components/character/character-discipline-build-panel.module.css
          if ! git diff --cached --quiet; then
            git commit -m "Normalize PR 423 targeted formatting"
            git push origin HEAD:agent/profile-discipline-battle-scaling
          fi
