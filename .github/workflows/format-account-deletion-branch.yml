name: One-shot account deletion formatting

on:
  push:
    branches:
      - agent/account-deletion-grace-period

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/account-deletion-grace-period
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format account deletion files
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/character-deletion.pw.ts \
            apps/web/src/components/character/character-select-shell.tsx \
            apps/web/src/app/api/account/deletion/route.ts \
            apps/web/src/app/game/page.tsx \
            apps/web/src/server/account/account-deletion-service.ts
      - name: Commit formatting
        run: |
          git config user.name "AUREVANE Format Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/e2e/character-deletion.pw.ts \
            apps/web/src/components/character/character-select-shell.tsx \
            apps/web/src/app/api/account/deletion/route.ts \
            apps/web/src/app/game/page.tsx \
            apps/web/src/server/account/account-deletion-service.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format account deletion flow"
          git push origin HEAD:agent/account-deletion-grace-period
