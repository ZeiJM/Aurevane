name: One-shot Finish Turn lifecycle formatting

on:
  push:
    branches:
      - agent/battle-input-responsive-consistency-v3
    paths:
      - .github/workflows/one-shot-format-finish-turn-lifecycle.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/battle-input-responsive-consistency-v3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format lifecycle and remove helper
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/src/components/battle/battle-interaction-lifecycle.tsx
          rm -f .github/workflows/one-shot-format-finish-turn-lifecycle.yml
          git config user.name 'aurevane-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-interaction-lifecycle.tsx .github/workflows/one-shot-format-finish-turn-lifecycle.yml
          git commit -m 'style: format Finish Turn lifecycle'
          git push origin HEAD:agent/battle-input-responsive-consistency-v3
