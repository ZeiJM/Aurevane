name: Format Creation reconciliation

on:
  push:
    branches:
      - agent/creation-subject-reconciliation
    paths:
      - .github/workflows/format-creation-reconciliation.yml
      - apps/web/e2e/creation-subject-reconciliation.pw.ts

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/e2e/creation-subject-reconciliation.pw.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-creation-reconciliation
          path: apps/web/e2e/creation-subject-reconciliation.pw.ts
          retention-days: 1
