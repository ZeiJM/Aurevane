name: PV-1E PR bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract and apply consolidated PV-1E source transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pv1e-apply.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/pv1e_apply.py').write_text(script)
          PY
          python /tmp/pv1e_apply.py
          rm -f .github/workflows/pv1e-apply.yml .github/workflows/pv1e-pr-bootstrap.yml

      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format changed source
        shell: bash
        run: pnpm format

      - name: Verify quality gates
        shell: bash
        run: pnpm check

      - name: Commit verified correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "PV-1E: compact persistent shell and battle cockpit"
          git push origin HEAD:${{ github.head_ref }}
