name: P1.1 format once

on:
  push:
    branches:
      - agent/ticket-1-1-account-profile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ticket-1-1-account-profile

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format P1.1 source
        run: >-
          pnpm exec prettier --write
          apps/web/e2e/account-entry.pw.ts
          apps/web/src/components/account/account-access-panel.tsx
          apps/web/src/components/account/account-entry-shell.tsx

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/e2e/account-entry.pw.ts \
            apps/web/src/components/account/account-access-panel.tsx \
            apps/web/src/components/account/account-entry-shell.tsx
          git commit -m 'Format P1.1 account source'
          git push origin HEAD:agent/ticket-1-1-account-profile
