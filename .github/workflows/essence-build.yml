name: Essence Build

on:
  push:
    branches:
      - 'agent/p3-6-*'
    paths:
      - 'apps/web/src/server/character/character-build-service.ts'
      - '.github/workflows/essence-build.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exact formatting diff
        run: |
          pnpm exec prettier --write apps/web/src/server/character/character-build-service.ts
          git diff -- apps/web/src/server/character/character-build-service.ts
          exit 1
