name: Copy status workbench
on:
  push:
    branches: [review/amplify-curse-status-workbench-20260916]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53e1c8840077efbab5f66789857ac4afc3e3590b
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Locked test-only source and static checks
        run: |
          test "$(git rev-parse HEAD)" = 53e1c8840077efbab5f66789857ac4afc3e3590b
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @aurevane/game-core typecheck
          pnpm exec eslint packages/game-core/src/combat/combat-status-copy*.test.ts
          pnpm format:check
          git diff --exit-code 0eecf1f5f776b8b3b9151f503ff7396b8715ec07 HEAD -- ':!packages/game-core/src/combat/combat-status-copy.test.ts' ':!packages/game-core/src/combat/combat-status-copy-publication.test.ts'
      - name: Classify behavioral RED across the complete core suite
        shell: bash
        run: |
          set +e
          pnpm --filter @aurevane/game-core exec vitest run --reporter=json --outputFile=/tmp/red.json > /tmp/red-output.txt 2>&1
          code=$?
          set -e
          cat /tmp/red-output.txt
          test "$code" = 1
          python3 <<'PY'
          import json
          result=json.load(open('/tmp/red.json'))
          print('TOTAL',result['numTotalTests'],'PASSED',result['numPassedTests'],'FAILED',result['numFailedTests'])
          assert result['numFailedTests'] > 0
          for suite in result['testResults']:
              failures=[a for a in suite['assertionResults'] if a['status']=='failed']
              if not failures:
                  continue
              assert suite['name'].endswith(('combat-status-copy.test.ts','combat-status-copy-publication.test.ts')), suite['name']
              print('RED_SUITE',suite['name'])
              for a in failures:
                  print(a['fullName'])
                  print('\n'.join(a['failureMessages'])[:1500])
          assert result['numPassedTests'] >= 1559
          PY
          git diff --exit-code
