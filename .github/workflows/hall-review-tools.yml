name: Hall review tools

on:
  push:
    branches: [agent/battle-hall-concept-ui]
    paths: [.github/workflows/hall-review-tools.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare locked review runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          mkdir -p /tmp/hall-tools
          git rev-parse HEAD > /tmp/hall-tools/commit.txt
          git archive --format=tar.gz HEAD > /tmp/hall-tools/source.tar.gz
          tar -czf /tmp/hall-tools/dependencies.tar.gz node_modules apps/web/node_modules apps/worker/node_modules packages/*/node_modules
          cp "$(command -v node)" /tmp/hall-tools/node
      - uses: actions/upload-artifact@v4
        with:
          name: hall-review-tools
          path: /tmp/hall-tools
          retention-days: 1
