name: Master Panel runtime format helper

on:
  push:
    branches:
      - agent/master-panel-runtime-format-helper-20260917

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format runtime consumption changes
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/api/battles/route.ts \
            apps/web/src/app/api/battles/[battleSessionId]/intents/route.ts \
            apps/web/src/app/api/battles/[battleSessionId]/preview/route.ts \
            apps/web/src/server/battle/battle-build-authority.ts \
            apps/web/src/server/battle/battle-preview-service.ts \
            apps/web/src/server/battle/battle-session-service.ts \
            apps/web/src/server/battle/combat-content-publication-consumption.test.ts
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/api/battles/route.ts \
            apps/web/src/app/api/battles/[battleSessionId]/intents/route.ts \
            apps/web/src/app/api/battles/[battleSessionId]/preview/route.ts \
            apps/web/src/server/battle/battle-build-authority.ts \
            apps/web/src/server/battle/battle-preview-service.ts \
            apps/web/src/server/battle/battle-session-service.ts \
            apps/web/src/server/battle/combat-content-publication-consumption.test.ts
          git commit -m "chore: format published combat runtime"
          git push
