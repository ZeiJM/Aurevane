name: Publish verified final battle layout changes

on:
  push:
    branches:
      - agent/mobile-layout-redesign-20261023

permissions:
  contents: write

jobs:
  publish-battle-layout:
    if: startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify archive and publish exact tested source tree
        shell: bash
        run: |
          set -euo pipefail
          package=scripts/release/aurevane-layout-battle-final-20261023.patch.xz.base64
          base64 --decode "$package" > /tmp/aurevane-layout-battle.patch.xz
          printf '%s  %s\n' 17d083255cf6907a60a950f1fdd26414c16d7e2a179f3b50ce00e088f0445800 /tmp/aurevane-layout-battle.patch.xz | sha256sum --check --status
          xz --decompress --stdout /tmp/aurevane-layout-battle.patch.xz > /tmp/aurevane-layout-battle.patch
          printf '%s  %s\n' 54ba45be2990bc6780aeb366315bf5dc3496a9b15aa5b5ef1fe001b753936600 /tmp/aurevane-layout-battle.patch | sha256sum --check --status
          git apply --check /tmp/aurevane-layout-battle.patch
          git apply /tmp/aurevane-layout-battle.patch
          rm -f "$package" .github/workflows/aurevane-layout-battle-publish.yml
          git add --all
          expected=b66cd2c50bf9a4a3a016e3555c3ce978b3794f5b
          actual="$(git write-tree)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Refusing publish: tree differs from tested source."
            echo "Expected $expected; found $actual"
            exit 1
          fi
          git -c user.name='Aurevane Release' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(mobile): stabilize shared facing, spectator timeline and compact battle footprint'
          git push origin HEAD:refs/heads/agent/mobile-layout-redesign-20261023
