name: One-time complete skill art repair v2

on:
  push:
    paths:
      - '.github/workflows/one-time-art-repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply repaired artwork generator
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-time-art-repair.yml').read_text()
          opener = "          python <<'PY'\n"
          closer = "          PY\n"
          start = source.index(opener) + len(opener)
          end = source.index(closer, start)
          body = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          Path('/tmp/aurevane-art-repair.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/aurevane-art-repair.py
      - name: Format repaired artwork module
        run: pnpm exec prettier --write apps/web/src/media/generated-dark-fantasy-art.ts
      - name: Verify complete artwork coverage and battle wiring
        run: pnpm --filter @aurevane/web exec vitest run src/media/generated-dark-fantasy-art.test.ts src/components/battle/battle-skill-presentation.test.ts
      - name: Commit repair and remove one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-art-repair.yml .github/workflows/one-time-art-repair-v2.yml
          git add apps/web/src/media/generated-dark-fantasy-art.ts
          git commit -m "fix: give every combat skill distinct dark fantasy art"
          git push origin HEAD:main
