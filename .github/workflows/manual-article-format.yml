name: Manual article formatter

on:
  push:
    branches:
      - agent/manual-article-fidelity
    paths:
      - .github/workflows/manual-article-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format Manual article files
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/manual-article-layout-regression.pw.ts \
            apps/web/src/components/public-information/discipline-atlas-guide.tsx \
            apps/web/src/components/public-information/manual-article.module.css
      - uses: actions/upload-artifact@v4
        with:
          name: manual-article-formatted
          path: |
            apps/web/e2e/manual-article-layout-regression.pw.ts
            apps/web/src/components/public-information/discipline-atlas-guide.tsx
            apps/web/src/components/public-information/manual-article.module.css
          retention-days: 1
