name: Format PvP release branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/ai-surrender-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/web/src/components/battle/pvp-battle-chat-bridge.tsx
          apps/web/src/components/battle/pvp-battle-release-polish.module.css
          apps/web/src/components/battle/pvp-desktop-parity.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/components/battle/pvp-battle-chat-bridge.tsx \
                  apps/web/src/components/battle/pvp-battle-release-polish.module.css \
                  apps/web/src/components/battle/pvp-desktop-parity.tsx
          git commit -m 'chore: format PvP release files'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
