name: Bootstrap foundation formatting

on:
  push:
    branches:
      - agent/ticket-0-1-app-foundation
    paths:
      - '.github/workflows/bootstrap-foundation.yml'

permissions:
  contents: write

jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format controlled source files
        run: pnpm format

      - name: Commit formatting and lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-workspace.yaml turbo.json .prettierrc.json apps/web pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Format foundation and lock dependencies"
          git push
