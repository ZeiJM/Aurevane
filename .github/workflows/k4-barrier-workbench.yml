name: K4 Barrier Workbench

on:
  push:
    branches:
      - agent/combat-k4-barrier-workbench-20260915

permissions:
  contents: read

jobs:
  focused-red-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Barrier ticket branch
        uses: actions/checkout@v4
        with:
          ref: agent/combat-k4-barrier-20260915

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test formatting
        run: pnpm exec prettier --check packages/game-core/src/combat/combat-barrier.test.ts

      - name: Run focused Barrier RED contract
        run: pnpm --filter @aurevane/game-core test -- combat-barrier.test.ts
