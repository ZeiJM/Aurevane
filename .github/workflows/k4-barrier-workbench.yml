name: K4 Barrier Workbench

on:
  push:
    branches:
      - agent/combat-k4-barrier-workbench-20260915

permissions:
  contents: write

jobs:
  implement-green:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workbench
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patch script and check out exact RED head
        run: |
          cp .github/scripts/k4_barrier_green.py /tmp/k4_barrier_green.py
          git fetch origin agent/combat-k4-barrier-20260915
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "9777fc4acb79dbdc61cc13f349a490ad590fb3ed"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded direct Barrier implementation
        run: python /tmp/k4_barrier_green.py

      - name: Format production delta
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/actions-legacy.ts \
            packages/game-core/src/combat/combat-authoring-validation.ts \
            packages/game-core/src/combat/combat-barrier.ts \
            packages/game-core/src/combat/combat-effect-state.ts \
            packages/game-core/src/combat/gameplay-tags.ts

      - name: Verify surgical changed-file set
        run: |
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort > /tmp/actual.txt
          printf '%s\n' \
            packages/game-core/src/combat/actions-legacy.ts \
            packages/game-core/src/combat/combat-authoring-validation.ts \
            packages/game-core/src/combat/combat-barrier.ts \
            packages/game-core/src/combat/combat-effect-state.ts \
            packages/game-core/src/combat/gameplay-tags.ts \
            > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Run focused Barrier GREEN contract
        run: pnpm --filter @aurevane/game-core test -- combat-barrier.test.ts

      - name: Run game-core typecheck
        run: pnpm --filter @aurevane/game-core typecheck

      - name: Run complete verification
        run: pnpm check

      - name: Commit and push verified GREEN implementation
        run: |
          git config user.name "AUREVANE K4 Workbench"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/game-core/src/combat/actions-legacy.ts \
            packages/game-core/src/combat/combat-authoring-validation.ts \
            packages/game-core/src/combat/combat-barrier.ts \
            packages/game-core/src/combat/combat-effect-state.ts \
            packages/game-core/src/combat/gameplay-tags.ts
          git commit -m "feat: implement K4 direct Barrier primitive"
          git push origin HEAD:agent/combat-k4-barrier-20260915
