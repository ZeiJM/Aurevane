name: One-shot Finish Turn bridge formatting

on:
  push:
    branches:
      - agent/battle-input-responsive-consistency-v3
    paths:
      - .github/workflows/one-shot-format-finish-turn-bridge.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/battle-input-responsive-consistency-v3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format owned bridge files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/battle/battle-interaction-lifecycle.tsx \
            apps/web/src/components/battle/battle-finish-turn-keyboard-assist.tsx \
            apps/web/src/components/battle/battle-self-action-quick-commit-assist.tsx

      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-format-finish-turn-bridge.yml
          git config user.name aurevane-release-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "style: format Finish Turn bridge"
          git push origin HEAD:agent/battle-input-responsive-consistency-v3
