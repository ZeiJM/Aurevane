name: Browser smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  a2-movement-patch:
    name: Apply A2 movement patch
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 123 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout A2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/a2-feedback-holistic
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unify click and keyboard movement input
        shell: python
        run: |
          from pathlib import Path

          battle = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = battle.read_text()

          old_effect = """  useEffect(() => {
              function handleKeyDown(event: KeyboardEvent) {
                if (isTextEntryTarget(event.target)) return
                if (event.key === 'Escape') {
                  event.preventDefault()
                  setOverlay(null)
                  clearPlanning()
                  setNotice('Selection cleared. Choose any action when you are ready.')
                } else if (event.key === '0') {
                  event.preventDefault()
                  chooseMode('inspect')
                } else if (event.key === 'Enter' && pendingIntent && preview?.preview.legal) {
                  event.preventDefault()
                  void commitIntent()
                }
              }
              window.addEventListener('keydown', handleKeyDown)
              return () => window.removeEventListener('keydown', handleKeyDown)
            }, [chooseMode, clearPlanning, commitIntent, pendingIntent, preview])
          """
          new_effect = old_effect + """

            useEffect(() => {
              function handleMoveTarget(event: Event) {
                if (!(event instanceof CustomEvent)) return
                const detail = event.detail as { x?: unknown; y?: unknown }
                if (!Number.isSafeInteger(detail.x) || !Number.isSafeInteger(detail.y)) return
                handleTileClick({ x: Number(detail.x), y: Number(detail.y) })
              }
              window.addEventListener('aurevane:battle-move-target', handleMoveTarget)
              return () => window.removeEventListener('aurevane:battle-move-target', handleMoveTarget)
            }, [handleTileClick])
          """
          if old_effect not in text:
              raise SystemExit('Battle keyboard effect anchor not found')
          text = text.replace(old_effect, new_effect, 1)

          old_tile = """                      onClick={() => handleTileClick(tile.position)}
                        onDoubleClick={requestQuickCommit}
                        onPointerUp={(event) => {
                          if (event.pointerType === 'touch')
                            handleTouchQuickCommit(
                              `tile:${positionKey(tile.position)}`,
                              event.timeStamp,
                            )
                        }}
          """
          new_tile = """                      onPointerDown={(event) => {
                          if (mode === 'move') handleTileClick(tile.position)
                        }}
                        onClick={(event) => {
                          if (mode !== 'move' || event.detail === 0) handleTileClick(tile.position)
                        }}
                        onDoubleClick={requestQuickCommit}
                        onPointerUp={(event) => {
                          if (event.pointerType === 'touch')
                            handleTouchQuickCommit(
                              `tile:${positionKey(tile.position)}`,
                              event.timeStamp,
                            )
                        }}
          """
          if old_tile not in text:
              raise SystemExit('Battle tile event anchor not found')
          text = text.replace(old_tile, new_tile, 1)
          text = text.replace("style={{ width: `${playerEconomy} AP` }}", "style={{ width: `${playerEconomy}%` }}", 1)
          battle.write_text(text)

          assist = Path('apps/web/src/components/battle/battle-keyboard-assist.tsx')
          text = assist.read_text()
          old_click = """  target.focus({ preventScroll: true })
            target.click()
            return true
          """
          new_click = """  target.focus({ preventScroll: true })
            window.dispatchEvent(
              new CustomEvent('aurevane:battle-move-target', {
                detail: { x: targetX - 1, y: targetY - 1 },
              }),
            )
            return true
          """
          if old_click not in text:
              raise SystemExit('Keyboard movement click anchor not found')
          assist.write_text(text.replace(old_click, new_click, 1))
      - name: Format movement files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-experience-v2.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx
      - name: Commit movement fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-experience-v2.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx
          git commit -m "fix: unify battle movement input path"
          git push origin HEAD:agent/a2-feedback-holistic

  browser:
    name: Responsive browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium

      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime

      - name: Verify desktop and mobile shell
        shell: bash
        run: |
          set -euo pipefail

          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          test -n "${ANON_KEY:-}"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$server_key"

          api_url='http://127.0.0.1:54321'

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web build

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web test:browser

      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup
