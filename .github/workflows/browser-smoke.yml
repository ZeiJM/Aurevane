name: Browser smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification-plan:
    name: Select Browser smoke coverage
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      execute: ${{ steps.plan.outputs.execute }}
      battle: ${{ steps.plan.outputs.battle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: ./.github/actions/verification-plan
        id: plan
        with:
          workflow: browser-smoke.yml

  browser:
    needs: verification-plan
    if: ${{ needs.verification-plan.outputs.execute == 'true' }}
    name: Execute Responsive browser smoke
    runs-on: ubuntu-latest
    # Full fallback keeps every scenario; isolated presentation uses core plus affected cases.
    timeout-minutes: 120
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
      AV_VERIFICATION_PLAN: ${{ needs.verification-plan.outputs.plan }}
      AV_VERIFY_BATTLE: ${{ needs.verification-plan.outputs.battle }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install selected browsers
        run: |
          # The runner's Azure apt mirror stalled before browser installation.
          # Use the official HTTPS mirror that responded in the same job logs.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          browsers=(chromium)
          if [ "$AV_VERIFY_BATTLE" = 'true' ]; then browsers+=(msedge); fi
          pnpm --filter @aurevane/web exec playwright install --with-deps "${browsers[@]}"

      - name: Verify complete Master operational components
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_MASTER_OPERATIONS_EVIDENCE_DIR: /tmp/master-operations-review
          AV_TECHNIQUE_ELIGIBILITY_EVIDENCE_DIR: /tmp/technique-eligibility-review
          AV_EVENT_WORKSPACE_EVIDENCE_DIR: /tmp/event-workspace-review
          AV_NEXUS_DESKTOP_EVIDENCE_DIR: /tmp/nexus-desktop-review
        run: |
          node apps/web/scripts/master-operations-browser-regression.mjs
          node apps/web/scripts/technique-eligibility-browser-regression.mjs
          node apps/web/scripts/event-workspace-browser-regression.mjs
          node apps/web/scripts/nexus-desktop-integration-regression.mjs

      - name: Verify shared ally inspection and multi-target previews
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_ALLY_INSPECTION_EVIDENCE_DIR: /tmp/battle-ally-inspection-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-ally-inspection-browser-regression.mjs

      - name: Verify current and historical targeting geometry across modes
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_TARGETING_EVIDENCE_DIR: /tmp/battle-targeting-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-targeting-browser-regression.mjs

      - name: Verify captured plural targeting and Manual behavior choices
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_TARGETING_EVIDENCE_DIR: /tmp/battle-canonical-targeting-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-canonical-targeting-browser-regression.mjs

      - name: Verify captured Move destination and combined follow-up
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_CANONICAL_MOVE: '1'
          AV_TARGETING_EVIDENCE_DIR: /tmp/battle-canonical-move-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-canonical-targeting-browser-regression.mjs

      - name: Verify standardized skill parameter colors and readers
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_SKILL_PARAMETER_PALETTE_EVIDENCE_DIR: /tmp/skill-parameter-palette-review
        run: pnpm --filter @aurevane/web exec node scripts/skill-parameter-palette-browser-regression.mjs

      - name: Verify Basic authoring and retired rollback through actual mutation responses
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_BASIC_ORIGINAL_RPC_ACCEPTANCE: '1'
          AV_SKILL_PARAMETER_PALETTE_EVIDENCE_DIR: /tmp/basic-original-rpc-review
        run: pnpm --filter @aurevane/web exec node scripts/skill-parameter-palette-browser-regression.mjs

      - name: Verify percentage Skill Essence and rail readers across modes
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_PERCENTAGE_DOT_EVIDENCE_DIR: /tmp/battle-percentage-dot-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-percentage-dot-browser-regression.mjs

      - name: Verify elemental statuses and Ground readers across modes
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_ELEMENTAL_EVIDENCE_DIR: /tmp/battle-elemental-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-elemental-browser-regression.mjs

      - name: Verify Suppress percentage authoring and readers across modes
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_SUPPRESS_EVIDENCE_DIR: /tmp/battle-suppress-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-suppress-browser-regression.mjs

      - name: Verify elevated rail effects and viewer privacy
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_ELEVATED_RAIL_EVIDENCE_DIR: /tmp/battle-elevated-rail-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-elevated-rail-browser-regression.mjs

      - name: Verify completion windows fit the viewport
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_COMPLETION_FIT_EVIDENCE_DIR: /tmp/battle-completion-fit-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-completion-fit-browser-regression.mjs

      - name: Verify immediate battle command feedback and Tab prevention
        if: ${{ needs.verification-plan.outputs.battle == 'true' }}
        env:
          AV_COMMAND_FEEDBACK_EVIDENCE_DIR: /tmp/battle-command-feedback-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-command-feedback-browser-regression.mjs

      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime

      - name: Verify desktop and mobile shell
        shell: bash
        run: |
          set -euo pipefail

          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          test -n "${ANON_KEY:-}"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$server_key"

          api_url='http://127.0.0.1:54321'

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web build

          # Local disposable database only: browser scenarios must receive the same
          # current versions as the compatible app bundle. Preserve release ordering.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
            set role service_role;
            select public.activate_phase4_combat_interactions_v2();
            select public.activate_phase4_discipline_rebalance_v1();
          "

          export AUREVANE_ENV=local NEXT_PUBLIC_AUREVANE_ENV=local
          export NEXT_PUBLIC_SUPABASE_URL="$api_url"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="$server_key"
          node .github/scripts/run-browser-verification.mjs

      - name: Save Technique and Chronicle failure diagnostics
        if: ${{ failure() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: technique-chronicle-failure-diagnostics
          path: |
            apps/web/test-results/techniques-state-stability*/**/*.md
            apps/web/test-results/techniques-state-stability*/**/*.json
            apps/web/test-results/techniques-state-stability*/**/test-failed*.png
            apps/web/test-results/battle-log-inline-reader*/**/*.md
            apps/web/test-results/battle-log-inline-reader*/**/*.json
            apps/web/test-results/battle-log-inline-reader*/**/test-failed*.png
          retention-days: 7

      - name: Save battle rail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-rail-review
          path: /tmp/battle-rail-review
          retention-days: 7

      - name: Save ally inspection and preview evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-ally-inspection-review
          path: /tmp/battle-ally-inspection-review
          retention-days: 7

      - name: Save targeting geometry evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-targeting-review
          path: /tmp/battle-targeting-review
          retention-days: 7

      - name: Save captured targeting evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-canonical-targeting-review
          path: /tmp/battle-canonical-targeting-review
          retention-days: 7

      - name: Save captured Move evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-canonical-move-review
          path: /tmp/battle-canonical-move-review
          retention-days: 7

      - name: Save percentage reader evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-percentage-dot-review
          path: /tmp/battle-percentage-dot-review
          retention-days: 7

      - name: Save elemental status and Ground reader evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-elemental-review
          path: /tmp/battle-elemental-review
          retention-days: 7

      - name: Save Suppress percentage authoring and reader evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-suppress-review
          path: /tmp/battle-suppress-review
          retention-days: 7

      - name: Save compact combat release screenshots
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: combat-release-reader-screens
          path: |
            /tmp/battle-percentage-dot-review/results.json
            /tmp/battle-percentage-dot-review/spectator-*.png
            /tmp/battle-percentage-dot-review/pve-1366-burn-active-rail.png
            /tmp/battle-percentage-dot-review/pve-390-poison-pending-rail.png
            /tmp/battle-percentage-dot-review/pvp-390-essence-burn-active-report.png
            /tmp/combat-master-release-review/*.png
            /tmp/players-task9-review/*.png
            apps/web/test-results/master-players-recovery*/error-context.md
            apps/web/test-results/master-players-recovery*/test-failed-*.png
            apps/web/test-results/master-players-recovery*/trace.zip
            apps/web/test-results/**/master-percentage-*.png
            apps/web/test-results/**/master-elevation-*.png
            apps/web/test-results/**/master-ground-*.png
            apps/web/test-results/**/battle-ground-*.png
            apps/web/test-results/**/staff-*.png
            apps/web/test-results/staff-selected-character-access*/error-context.md
            apps/web/test-results/staff-selected-character-access*/test-failed-*.png
            apps/web/test-results/master-combat-content*/error-context.md
            apps/web/test-results/master-combat-content*/test-failed-*.png
            apps/web/test-results/battle-wasd-backtracking*/error-context.md
            apps/web/test-results/battle-wasd-backtracking*/test-failed-*.png
            apps/web/test-results/refined-battle-execution*/error-context.md
          retention-days: 7

      - name: Save skill parameter palette evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: skill-parameter-palette-review
          path: /tmp/skill-parameter-palette-review
          retention-days: 7

      - name: Save Basic authoring and retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-original-rpc-review
          path: /tmp/basic-original-rpc-review
          retention-days: 7

      - name: Save elevated rail effect evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-elevated-rail-review
          path: /tmp/battle-elevated-rail-review
          retention-days: 7

      - name: Save completion window fit evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-completion-fit-review
          path: /tmp/battle-completion-fit-review
          retention-days: 7

      - name: Save command feedback and Tab evidence
        if: ${{ always() && needs.verification-plan.outputs.battle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: battle-command-feedback-review
          path: /tmp/battle-command-feedback-review
          retention-days: 7

      - name: Save focused World failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-world-failure-diagnostics
          path: |
            apps/web/test-results/atlas-world.pw.ts-*/trace.zip
            apps/web/test-results/atlas-world.pw.ts-*/error-context.md
            apps/web/test-results/atlas-world.pw.ts-*/test-failed-*.png
            apps/web/test-results/atlas-world.pw.ts-*/attachments/world-*.json
          retention-days: 7

      - name: Save complete Master operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-integration-operational-evidence
          path: |
            /tmp/master-full-integration-review
            apps/web/test-results/master-complete-layout*/
            apps/web/test-results/master-world-environment-*/
            /tmp/master-operations-review
            /tmp/technique-eligibility-review
            /tmp/event-workspace-review
            /tmp/nexus-desktop-review
          retention-days: 7

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            apps/web/test-results
            apps/web/test-results-edge
          retention-days: 7

      - name: Save compact browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            apps/web/test-results/**/*.zip
            apps/web/test-results/**/*.json
            apps/web/test-results/**/*.md
            apps/web/test-results/battle-ui-polish-regressio*/**
            apps/web/test-results-edge
          retention-days: 7

      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup

  browser-result:
    name: Responsive browser smoke
    if: ${{ always() }}
    needs: [verification-plan, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require selected verification or verified reuse
        env:
          AV_PROOF_OUTPUT: /tmp/verification-proof.json
          AV_WORKFLOW_FILE: browser-smoke.yml
          AV_PLAN_RESULT: ${{ needs.verification-plan.result }}
          AV_VERIFICATION_PLAN: ${{ needs.verification-plan.outputs.plan }}
          AV_EXECUTION_RESULTS: '["${{ needs.browser.result }}"]'
        run: node .github/scripts/verification-plan.mjs gate
      - name: Save exact tested-source receipt
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-proof-browser-smoke.yml-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/verification-proof.json
          if-no-files-found: error
          retention-days: 2
