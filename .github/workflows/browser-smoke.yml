name: Browser smoke

on:
  pull_request:
    paths-ignore:
      - 'apps/web/vercel.json'
      - 'docs/**'
      - 'README.md'
      - 'TASKS.md'
      - 'AGENTS.md'
      - 'apps/web/DEPLOYMENT.md'
      - 'content/art-requests/**'
      - 'content/audio-requests/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/web/vercel.json'
      - 'docs/**'
      - 'README.md'
      - 'TASKS.md'
      - 'AGENTS.md'
      - 'apps/web/DEPLOYMENT.md'
      - 'content/art-requests/**'
      - 'content/audio-requests/**'

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Responsive browser smoke
    runs-on: ubuntu-latest
    # The complete serial suite includes elapsed-time Atlas journeys and Edge checks.
    # Keep every scenario enabled and allow enough time to finish after stack setup.
    timeout-minutes: 75
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and Microsoft Edge
        run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium msedge

      - name: Verify shared ally inspection and multi-target previews
        env:
          AV_ALLY_INSPECTION_EVIDENCE_DIR: /tmp/battle-ally-inspection-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-ally-inspection-browser-regression.mjs

      - name: Verify standardized skill parameter colors and readers
        env:
          AV_SKILL_PARAMETER_PALETTE_EVIDENCE_DIR: /tmp/skill-parameter-palette-review
        run: pnpm --filter @aurevane/web exec node scripts/skill-parameter-palette-browser-regression.mjs

      - name: Verify elevated rail effects and viewer privacy
        env:
          AV_ELEVATED_RAIL_EVIDENCE_DIR: /tmp/battle-elevated-rail-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-elevated-rail-browser-regression.mjs

      - name: Verify completion windows fit the viewport
        env:
          AV_COMPLETION_FIT_EVIDENCE_DIR: /tmp/battle-completion-fit-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-completion-fit-browser-regression.mjs

      - name: Verify immediate battle command feedback and Tab prevention
        env:
          AV_COMMAND_FEEDBACK_EVIDENCE_DIR: /tmp/battle-command-feedback-review
        run: pnpm --filter @aurevane/web exec node scripts/battle-command-feedback-browser-regression.mjs

      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime

      - name: Verify desktop and mobile shell
        shell: bash
        run: |
          set -euo pipefail

          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          test -n "${ANON_KEY:-}"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$server_key"

          api_url='http://127.0.0.1:54321'

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web build

          # Local disposable database only: browser scenarios must receive the same
          # current versions as the compatible app bundle. Preserve release ordering.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
            set role service_role;
            select public.activate_phase4_combat_interactions_v2();
            select public.activate_phase4_discipline_rebalance_v1();
          "

          # Prove real recovery email and expired-link handling before longer gameplay scenarios.
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test e2e/password-reset.pw.ts

          # Prove complete training and terrain-weighted movement before the longer suites.
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test e2e/battle-experience.pw.ts

          # Catch shared battle composition regressions before the longer all-page run.
          # A successful candidate still runs the entire suite and the Edge keyboard checks below.
          focused_status=0
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test \
            e2e/ai-header-control-shape.pw.ts e2e/ai-grid-legend-regression.pw.ts e2e/ai-sparring-teams.pw.ts \
            e2e/battle-cockpit-skill-slots.pw.ts e2e/combat-summon-flow.pw.ts e2e/pvp-six-combatant-rails.pw.ts e2e/pvp-map-sizes.pw.ts \
            e2e/pvp-spectator-title-layout.pw.ts \
            e2e/shared-battle-presentation-parity.pw.ts e2e/pvp-battle-log-footer-parity.pw.ts \
            e2e/phase4-ground-targeting.pw.ts \
            e2e/pvp-mobile-unified-battle.pw.ts e2e/discipline-sigil-art.pw.ts \
            e2e/character-secondary-build.pw.ts \
            e2e/battle-move-preview-polish.pw.ts e2e/battle-self-action-quick-commit.pw.ts e2e/battle-self-skill-hotkey.pw.ts \
            e2e/battle-terrain-control-parity.pw.ts e2e/refined-battle-execution.pw.ts e2e/battle-info-popover.pw.ts \
            e2e/battle-recovery-hotkey.pw.ts e2e/battle-support-action.pw.ts e2e/techniques-support-action.pw.ts e2e/technique-preview-layout.pw.ts \
            e2e/shell-viewport-fit.pw.ts \
            --project=desktop-chromium --project=mobile-chromium || focused_status=$?

          # Preserve the shared rail/map screenshots before the complete suite clears its output.
          mkdir -p /tmp/battle-rail-review
          find apps/web/test-results -maxdepth 1 -type d \( -name 'ai-grid-legend-regressio*' -o -name 'pvp-map-sizes*' -o -name 'pvp-spectator-title-layout*' \) \
            -exec cp -R '{}' /tmp/battle-rail-review/ \;
          if [ "$focused_status" -ne 0 ]; then exit "$focused_status"; fi

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web test:browser

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test \
            e2e/battle-self-action-quick-commit.pw.ts \
            e2e/battle-recovery-hotkey.pw.ts e2e/battle-support-action.pw.ts e2e/techniques-support-action.pw.ts \
            --config=playwright.edge.config.ts --output=test-results-edge

      - name: Save focused battle rail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-rail-review
          path: /tmp/battle-rail-review
          retention-days: 7

      - name: Save ally inspection and preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-ally-inspection-review
          path: /tmp/battle-ally-inspection-review
          retention-days: 7

      - name: Save skill parameter palette evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-parameter-palette-review
          path: /tmp/skill-parameter-palette-review
          retention-days: 7

      - name: Save elevated rail effect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-elevated-rail-review
          path: /tmp/battle-elevated-rail-review
          retention-days: 7

      - name: Save completion window fit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-completion-fit-review
          path: /tmp/battle-completion-fit-review
          retention-days: 7

      - name: Save command feedback and Tab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-command-feedback-review
          path: /tmp/battle-command-feedback-review
          retention-days: 7

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            apps/web/test-results
            apps/web/test-results-edge
          retention-days: 7

      - name: Save compact browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            apps/web/test-results/**/*.zip
            apps/web/test-results/**/*.json
            apps/web/test-results/**/*.md
            apps/web/test-results/battle-ui-polish-regressio*/**
            apps/web/test-results-edge
          retention-days: 7

      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup
