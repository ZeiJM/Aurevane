name: Browser smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    name: Responsive browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and Microsoft Edge
        run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium msedge

      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime

      - name: Verify desktop and mobile shell
        shell: bash
        run: |
          set -euo pipefail

          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          test -n "${ANON_KEY:-}"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$server_key"

          api_url='http://127.0.0.1:54321'

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web build

          # Local disposable database only: new browser scenarios require the app's v2 catalog.
          # Keep activation after building the compatible app, as in Representative Buildcraft.
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "set role service_role; select public.activate_phase4_combat_interactions_v2();"

          # Catch shared battle composition regressions before the longer all-page run.
          # A successful candidate still runs the entire suite and the Edge keyboard checks below.
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test \
            e2e/ai-header-control-shape.pw.ts e2e/ai-grid-legend-regression.pw.ts \
            e2e/battle-cockpit-skill-slots.pw.ts e2e/pvp-six-combatant-rails.pw.ts \
            e2e/shared-battle-presentation-parity.pw.ts e2e/pvp-battle-log-footer-parity.pw.ts \
            e2e/phase4-ground-targeting.pw.ts \
            --project=desktop-chromium --project=mobile-chromium

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web test:browser

          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test \
            e2e/battle-self-action-quick-commit.pw.ts \
            e2e/battle-recovery-hotkey.pw.ts \
            --config=playwright.edge.config.ts

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: apps/web/test-results
          retention-days: 7

      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup
