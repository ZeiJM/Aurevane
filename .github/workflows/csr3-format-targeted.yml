name: CSR3 Targeted Fix

on:
  push:
    branches:
      - agent/combat-csr3-historical-privacy-20260917
    paths:
      - .github/workflows/csr3-format-targeted.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr3-historical-privacy-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix CSR-3 projection leaks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/server/battle/battle-history-privacy.ts')
          text = path.read_text(encoding='utf-8')
          old_import = """import {
            COVERT_STATUS_ID,
            REVEALED_STATUS_ID,
          } from '@aurevane/game-core/combat/covert-sensory-revealed'
          import { PV1F_COMBAT_CONTENT } from '@aurevane/game-core/combat/pv1f-action-economy'
          """
          new_import = """import {
            PV1F_COMBAT_CONTENT,
            PV1F_COVERT_STATUS,
            PV1F_REVEALED_STATUS,
          } from '@aurevane/game-core/combat/pv1f-action-economy'
          """
          if old_import not in text:
              raise SystemExit('CSR status import seam changed')
          text = text.replace(old_import, new_import, 1)
          text = text.replace('COVERT_STATUS_ID', 'PV1F_COVERT_STATUS.id')
          text = text.replace('REVEALED_STATUS_ID', 'PV1F_REVEALED_STATUS.id')
          old_visible = """    visible.push({ sortIndex: record.eventIndex, record })
"""
          new_visible = """    const event = objectValue(record.event)
    const visibleRecord =
      !commandAllowed && event
        ? {
            ...record,
            event: Object.fromEntries(Object.entries(event).filter(([key]) => key !== 'actionId')),
          }
        : record
    visible.push({ sortIndex: record.eventIndex, record: visibleRecord })
"""
          if old_visible not in text:
              raise SystemExit('history visibility insertion seam changed')
          text = text.replace(old_visible, new_visible, 1)
          path.write_text(text, encoding='utf-8')
          PY
          pnpm exec prettier --write apps/web/src/server/battle/battle-history-privacy.ts apps/web/src/server/battle/battle-history-privacy.test.ts
      - name: Targeted CSR-3 test
        run: pnpm --filter @aurevane/web exec vitest run src/server/battle/battle-history-privacy.test.ts
      - name: Commit tested fix
        run: |
          rm .github/workflows/csr3-format-targeted.yml
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/server/battle/battle-history-privacy.ts apps/web/src/server/battle/battle-history-privacy.test.ts .github/workflows/csr3-format-targeted.yml
          git diff --cached --check
          git commit -m 'fix(combat): scrub hidden CSR-3 action identity'
          git push origin HEAD:agent/combat-csr3-historical-privacy-20260917
