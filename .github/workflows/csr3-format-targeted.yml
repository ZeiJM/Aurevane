name: CSR3 Format Targeted

on:
  push:
    branches:
      - agent/combat-csr3-historical-privacy-20260917
    paths:
      - .github/workflows/csr3-format-targeted.yml

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr3-historical-privacy-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix CSR-3 package export seam
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/server/battle/battle-history-privacy.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import {\n  COVERT_STATUS_ID,\n  REVEALED_STATUS_ID,\n} from '@aurevane/game-core/combat/covert-sensory-revealed'\n",
              "",
          )
          text = text.replace(
              "  PV1F_COMBAT_CONTENT,\n} from '@aurevane/game-core/combat/pv1f-action-economy'",
              "  PV1F_COMBAT_CONTENT,\n  PV1F_COVERT_STATUS,\n  PV1F_REVEALED_STATUS,\n} from '@aurevane/game-core/combat/pv1f-action-economy'",
          )
          text = text.replace('COVERT_STATUS_ID', 'PV1F_COVERT_STATUS.id')
          text = text.replace('REVEALED_STATUS_ID', 'PV1F_REVEALED_STATUS.id')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format CSR-3 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-history-privacy.ts \
            apps/web/src/server/battle/battle-history-privacy.test.ts
      - name: Targeted CSR-3 test
        run: pnpm --filter @aurevane/web exec vitest run src/server/battle/battle-history-privacy.test.ts
      - name: Commit exact formatter output
        run: |
          rm .github/workflows/csr3-format-targeted.yml
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/server/battle/battle-history-privacy.ts \
            apps/web/src/server/battle/battle-history-privacy.test.ts \
            .github/workflows/csr3-format-targeted.yml
          git diff --cached --check
          git commit -m 'style(combat): format CSR-3 history privacy authority'
          git push origin HEAD:agent/combat-csr3-historical-privacy-20260917
