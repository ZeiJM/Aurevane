name: Temporary attack range keyboard patch

on:
  push:
    branches:
      - fix/technique-keyboard-facing-ui-20260906
    paths:
      - .github/workflows/temp-attack-range-keyboard-patch.yml
      - .github/scripts/temp_attack_range_keyboard_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/technique-keyboard-facing-ui-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: python .github/scripts/temp_attack_range_keyboard_patch.py
      - name: Format and validate
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx
          pnpm --filter @aurevane/web typecheck
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/battle/battle-directional-attack-assist.tsx
          git commit -m "Use Technique targeting range for keyboard attacks"
          git push origin HEAD:fix/technique-keyboard-facing-ui-20260906
