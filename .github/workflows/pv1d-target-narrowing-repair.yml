name: PV-1D target narrowing repair

on:
  push:
    branches:
      - agent/pv-1d-combat-readability-correction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1d-combat-readability-correction
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stabilize confirmed unit target IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = path.read_text()
          old = "      ) {\n        const targetPlacement = tactical.placements.find(\n          (placement) => placement.combatantId === committedIntent.target.combatantId,\n        )"
          new = "      ) {\n        const targetCombatantId = committedIntent.target.combatantId\n        const targetPlacement = tactical.placements.find(\n          (placement) => placement.combatantId === targetCombatantId,\n        )"
          if old not in text:
              raise SystemExit('First attack target block not found')
          text = text.replace(old, new, 1)
          old2 = "      ) {\n        const targetBefore = before.snapshot.tactical.battle.combatants.find(\n          (combatant) => combatant.id === committedIntent.target.combatantId,\n        )\n        const targetAfter = body.battle.snapshot.tactical.battle.combatants.find(\n          (combatant) => combatant.id === committedIntent.target.combatantId,\n        )"
          new2 = "      ) {\n        const targetCombatantId = committedIntent.target.combatantId\n        const targetBefore = before.snapshot.tactical.battle.combatants.find(\n          (combatant) => combatant.id === targetCombatantId,\n        )\n        const targetAfter = body.battle.snapshot.tactical.battle.combatants.find(\n          (combatant) => combatant.id === targetCombatantId,\n        )"
          if old2 not in text:
              raise SystemExit('Second attack target block not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/components/battle/battle-experience-v2.tsx
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-experience-v2.tsx
          git commit -m 'fix: stabilize committed attack target narrowing'
          git push origin HEAD:agent/pv-1d-combat-readability-correction
