name: Vengeance workbench
on:
  push:
    branches: [review/vengeance-workbench-20260915]
permissions:
  contents: write
jobs:
  vengeance-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8ca06ce4f886b58304a94d8e4d0536186b7cc1f
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Write Vengeance behavioral contract only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a8ca06ce4f886b58304a94d8e4d0536186b7cc1f
          file=packages/game-core/src/combat/combat-vengeance.test.ts
          test ! -e "$file"
          cat > "$file" <<'TEST'
          import { describe, expect, it } from 'vitest'
          import {
            createCombatEncounterState, evaluateCombatAction, executeCombatAction,
            endCombatTurn, validateCombatEncounterState,
            type CombatActionDefinition, type CombatEffectDefinition, type CombatEncounterState,
            type CombatResolutionTransition, type CombatStatusDefinition,
          } from './actions'
          import { createPendingBattle, startBattle } from './battle-state'
          import { createTacticalBattleState, selectCurrentFinalFacing } from './board'
          import { validateCombatActionDefinition } from './combat-authoring-validation'
          import { normalizeCombatEffectState, type CombatDamageHistoryEntry } from './combat-effect-state'
          import { createCombatActionProvenance, createCombatTriggerGuard } from './combat-kernel-types'
          import { createStatDrivenCombatEncounterState } from './stat-driven-combat'
          import {
            createPv1fTemporaryResources, evaluatePv1fMatureSkill, executePv1fMatureSkill,
          } from './pv1f-action-economy'
          import { P33_REPRESENTATIVE_DISCIPLINE_SKILLS, type MatureSkillDefinition } from './mature-skills'

          // Structural test-first shape: behavior is exercised through existing public entry points.
          interface VengeanceProfile {
            conversionBasisPoints: number
            minimumDamage?: number
            maximumDamage: number
          }
          type VengeanceEffect = Extract<CombatEffectDefinition, { type: 'damage' }> & {
            vengeance: VengeanceProfile
          }
          const SELECT = { kind: 'unit' as const, combatantId: 'target' }
          const ACTOR_HISTORY = [
            { combatantId: 'actor', round: 4, amount: 20 },
            { combatantId: 'actor', round: 3, amount: 12 },
            { combatantId: 'actor', round: 2, amount: 8 },
          ]
          function encounter(history: CombatDamageHistoryEntry[] = ACTOR_HISTORY, round = 4) {
            const ids = ['actor', 'target', 'witness']
            const started = startBattle(createPendingBattle({
              battleId: 'battle:vengeance-contract', rulesVersion: 2, contentVersion: 2, rngSeed: 53,
              combatants: ids.map((id, index) => ({
                id, teamId: id === 'actor' ? 'players' : 'enemies', initiative: 30 - index,
                baseMovementBudget: 3, hp: 100, maxHp: 100, mp: 50, maxMp: 50,
                temporaryResources: createPv1fTemporaryResources(16),
              })),
            })).state
            const base = createCombatEncounterState(createTacticalBattleState({
              battle: { ...started, round, turnNumber: 3 * round - 2 }, width: 3, height: 1,
              terrains: [{ id: 'open', traversalCost: 1 }],
              tiles: ids.map((_, x) => ({ position: { x, y: 0 }, elevation: 0, terrainId: 'open' })),
              movementProfiles: [{ id: 'ground', maxElevationStep: 0, terrainCostOverrides: [] }],
              placements: ids.map((combatantId, x) => ({
                combatantId, position: { x, y: 0 }, facing: 'east', movementProfileId: 'ground',
              })),
            }))
            return { ...base, effectState: {
              ...normalizeCombatEffectState(base.effectState), damageHistory: history.map((row) => ({ ...row })),
            } }
          }
          function vengeance(profile: Partial<VengeanceProfile> = {}): VengeanceEffect {
            return { type: 'damage', recipient: 'primary-unit', amount: 0,
              vengeance: { conversionBasisPoints: 5_000, maximumDamage: 80, ...profile } }
          }
          function action(effect: CombatEffectDefinition = vengeance()): CombatActionDefinition {
            return {
              id: 'test.vengeance', version: 1, sourceType: 'test', tags: [],
              target: { kind: 'unit', teamPolicy: 'enemy', shape: { kind: 'single' },
                minimumRange: 1, maximumRange: 2, requiresLineOfSight: false,
                maximumElevationDifference: 0, friendlyFire: 'enemies-only' },
              cost: { spendsAction: false, mp: 0 }, requirements: [], effects: [effect],
            }
          }
          function cast(state: CombatEncounterState = encounter(), command = action(), statuses: CombatStatusDefinition[] = []) {
            return executeCombatAction(state, command, SELECT, { statuses })
          }
          function dealt(result: CombatResolutionTransition, target = 'target'): number {
            return result.events.reduce((sum, event) => sum + (
              event.event === 'damage_applied' && event.actionId === 'test.vengeance' && event.targetCombatantId === target
                ? event.amount : 0), 0)
          }
          function advance(state: CombatEncounterState, statuses: CombatStatusDefinition[] = []) {
            return endCombatTurn({ ...state, tactical: selectCurrentFinalFacing(state.tactical, 'east').state }, { statuses }).state
          }
          function status(id: string, extras: Partial<CombatStatusDefinition>): CombatStatusDefinition {
            return { id, version: 1, maximumStacks: 1, durationOwnerTurnStarts: 3,
              damageTakenMultiplierBasisPoints: 10_000, ...extras }
          }
          function withStatus(state: CombatEncounterState, owner: string, definition: CombatStatusDefinition) {
            return { ...state, statusState: state.statusState.map((row) => row.combatantId !== owner ? row : {
              ...row, statuses: [...row.statuses, { statusId: definition.id, statusVersion: definition.version,
                stacks: 1, remainingOwnerTurnStarts: 3, sourceCombatantId: owner }],
            }) }
          }

          describe('Vengeance committed history potency', () => {
            it('converts the acting unit current and previous two rounds, not its missing HP', () => {
              expect(dealt(cast())).toBe(20)
            })
            it('ignores old unpruned entries and another combatant history', () => {
              const history = [...ACTOR_HISTORY,
                { combatantId: 'actor', round: 1, amount: 999 },
                { combatantId: 'target', round: 4, amount: 500 }]
              expect(dealt(cast(encounter(history)))).toBe(20)
            })
            it('recomputes the window when time advances without a new damage entry', () => {
              expect(dealt(cast(encounter(ACTOR_HISTORY, 5)))).toBe(16)
              expect(dealt(cast(encounter(ACTOR_HISTORY, 6)))).toBe(10)
              expect(dealt(cast(encounter(ACTOR_HISTORY, 7)))).toBe(0)
            })
            it.each([1, 2])('uses the available rounds at early battle round %s', (round) => {
              const history = Array.from({ length: round }, (_, index) => ({ combatantId: 'actor', round: index + 1, amount: 6 }))
              expect(dealt(cast(encounter(history, round)))).toBe(3 * round)
            })
            it('does not count entries from future rounds', () => {
              expect(dealt(cast(encounter([...ACTOR_HISTORY, { combatantId: 'actor', round: 5, amount: 100 }])))).toBe(20)
            })
            it('floors once after summing the qualifying window', () => {
              const history = [2, 3, 4].map((round) => ({ combatantId: 'actor', round, amount: 1 }))
              expect(dealt(cast(encounter(history)))).toBe(1)
            })
            it('does not borrow Absorb minimum-one rounding when conversion is below one', () => {
              expect(dealt(cast(encounter([{ combatantId: 'actor', round: 4, amount: 1 }])))).toBe(0)
            })
            it('applies an explicit authored minimum with no qualifying history', () => {
              expect(dealt(cast(encounter([]), action(vengeance({ minimumDamage: 7 }))))).toBe(7)
            })
            it('caps converted potency at its finite authored maximum', () => {
              expect(dealt(cast(encounter(), action(vengeance({ maximumDamage: 13 }))))).toBe(13)
            })
            it('supports conversions over 100 percent while keeping the authored cap', () => {
              expect(dealt(cast(encounter(), action(vengeance({ conversionBasisPoints: 15_000 }))))).toBe(60)
            })
            it('caps exact large integer arithmetic before converting back to a number', () => {
              const history = [2, 3, 4].map((round) => ({ combatantId: 'actor', round, amount: Number.MAX_SAFE_INTEGER }))
              expect(dealt(cast(encounter(history), action(vengeance({ conversionBasisPoints: Number.MAX_SAFE_INTEGER, maximumDamage: 17 }))))).toBe(17)
            })
            it('preserves historical states without effect state and zero history', () => {
              const initial: CombatEncounterState = encounter([])
              delete initial.effectState
              expect(dealt(cast(initial))).toBe(0)
              expect(validateCombatEncounterState(cast(initial).state)).toEqual([])
            })
            it('does not spend or erase the user damage history after casting', () => {
              const first = cast()
              expect(first.state.effectState?.damageHistory.filter((row) => row.combatantId === 'actor')).toEqual(ACTOR_HISTORY)
              expect(dealt(cast(first.state))).toBe(20)
            })
            it('keeps preview and commit equal without mutating inputs or consuming RNG', () => {
              const initial = encounter()
              const command = action()
              const before = JSON.stringify({ initial, command })
              const preview = evaluateCombatAction(initial, command, SELECT, { statuses: [] })
              const result = cast(initial, command)
              expect(preview.projectedEvents.find((event) => event.event === 'damage_applied')).toMatchObject({ amount: 20 })
              expect(dealt(result)).toBe(20)
              expect(JSON.stringify({ initial, command })).toBe(before)
              expect(result.state.tactical.battle.rng).toEqual(initial.tactical.battle.rng)
            })
            it('includes a bounded three-round basis in a legal kernel preview', () => {
              const preview = evaluateCombatAction(encounter(), action(), SELECT, { statuses: [] })
              expect(preview).toMatchObject({ vengeanceBasis: [{
                effectOrdinal: 0, sourceCombatantId: 'actor', windowStartRound: 2, windowEndRound: 4,
                damageByRound: [{ round: 2, amount: 8 }, { round: 3, amount: 12 }, { round: 4, amount: 20 }], rawDamage: 20,
              }] })
            })
            it('does not expose a calculated basis for illegal targets', () => {
              const result = evaluateCombatAction(encounter(), action(), { kind: 'unit', combatantId: 'actor' }, { statuses: [] })
              expect(result.legal).toBe(false)
              expect(result).not.toHaveProperty('vengeanceBasis')
            })
            it('recomputes from the current snapshot rather than trusting an older preview', () => {
              const old = encounter()
              evaluateCombatAction(old, action(), SELECT, { statuses: [] })
              const changed = encounter([{ combatantId: 'actor', round: 4, amount: 60 }])
              expect(dealt(cast(changed))).toBe(30)
            })
            it('uses one starting history basis for every damage block in the command', () => {
              const command = action()
              command.effects = [vengeance(), vengeance({ conversionBasisPoints: 2_500 })]
              expect(dealt(cast(encounter(), command))).toBe(30)
            })
            it('applies the same potency independently to area recipients', () => {
              const effect = vengeance()
              effect.recipient = 'affected-units'
              const command = action(effect)
              command.target = { ...command.target, shape: { kind: 'circle', radius: 1 } }
              const result = cast(encounter(), command)
              expect(dealt(result)).toBe(20)
              expect(dealt(result, 'witness')).toBe(20)
            })
            it('keeps mitigation and Barrier after Vengeance potency', () => {
              const guarded = status('test.vengeance-guard', { damageTakenMultiplierBasisPoints: 5_000 })
              const initial = withStatus(encounter(), 'target', guarded)
              initial.effectState = { ...normalizeCombatEffectState(initial.effectState), barriers: [{ targetCombatantId: 'target', sourceCombatantId: 'target', sourceActionId: 'test.barrier', amount: 3 }] }
              const result = cast(initial, action(), [guarded])
              expect(dealt(result)).toBe(7)
              expect(result.state.effectState?.damageHistory).toContainEqual({ combatantId: 'target', round: 4, amount: 7 })
            })
            it('lets Pierce bypass mitigation but never Barrier', () => {
              const guarded = status('test.vengeance-guard', { damageTakenMultiplierBasisPoints: 5_000 })
              const initial = withStatus(encounter(), 'target', guarded)
              initial.effectState = { ...normalizeCombatEffectState(initial.effectState), barriers: [{ targetCombatantId: 'target', sourceCombatantId: 'target', sourceActionId: 'test.barrier', amount: 3 }] }
              expect(dealt(cast(initial, action({ ...vengeance(), piercing: true }), [guarded]))).toBe(17)
            })
            it('allows normal Absorb and Reflect from Vengeance direct damage without history feedback', () => {
              const reactive = status('test.vengeance-reactive', { polarity: 'positive', reactionClass: 'reactive', reflectBasisPoints: 2_500, absorbHpBasisPoints: 2_500 })
              const result = cast(withStatus(encounter(), 'target', reactive), action(), [reactive])
              expect(dealt(result)).toBe(20)
              expect(result.state.tactical.battle.combatants.find((unit) => unit.id === 'target')?.hp).toBe(85)
              expect(result.state.tactical.battle.combatants.find((unit) => unit.id === 'actor')?.hp).toBe(95)
              expect(result.state.effectState?.damageHistory.filter((row) => row.combatantId === 'actor')).toEqual(ACTOR_HISTORY)
            })
            it('uses authoritative hostile periodic history and ignores later healing', () => {
              const periodic = status('test.vengeance-dot', { endOfTurn: { type: 'damage', amount: 8 } })
              let initial = withStatus(encounter([]), 'actor', periodic)
              initial.statusState = initial.statusState.map((row) => ({ ...row, statuses: row.statuses.map((instance) => ({ ...instance, sourceCombatantId: 'target' })) }))
              initial = advance(initial, [periodic])
              initial = advance(initial, [periodic])
              initial = advance(initial, [periodic])
              const command = action()
              command.effects = [{ type: 'healing', recipient: 'actor', amount: 100 }, vengeance()]
              expect(dealt(cast(initial, command, [periodic]))).toBe(4)
            })
            it('retains K3 context and provenance on Vengeance execution', () => {
              const provenance = createCombatActionProvenance({ rulesetVersion: 2, sourceKind: 'discipline-skill', actionDefinitionId: 'test.vengeance', actionVersion: 1, sourceCombatantId: 'actor', controllerCombatantId: 'actor', triggerChainId: 'chain:vengeance' })
              const triggerGuard = createCombatTriggerGuard({ triggerChainId: 'chain:vengeance' })
              const result = executeCombatAction(encounter(), action(), SELECT, { statuses: [] }, { provenance, triggerGuard })
              expect(dealt(result)).toBe(20)
              expect(result.resolution).toMatchObject({ provenance, triggerGuard })
            })
            it('preserves ordinary authored damage without Vengeance metadata', () => {
              expect(dealt(cast(encounter(), action({ type: 'damage', recipient: 'primary-unit', amount: 9 })))).toBe(9)
            })
          })

          describe('Vengeance authoring boundary', () => {
            it.each([undefined, null, 0, -1, 0.5, NaN, Infinity, Number.MAX_SAFE_INTEGER + 1])('rejects invalid or missing cap %s', (maximumDamage) => {
              const effect = vengeance({ maximumDamage: maximumDamage as number })
              expect(() => validateCombatActionDefinition(action(effect))).toThrow(/Vengeance/)
            })
            it.each([0, -1, 0.5, NaN, Infinity, Number.MAX_SAFE_INTEGER + 1])('rejects invalid conversion %s', (conversionBasisPoints) => {
              expect(() => validateCombatActionDefinition(action(vengeance({ conversionBasisPoints })))).toThrow(/Vengeance/)
            })
            it.each([-1, 0.5, NaN, Infinity, 81])('rejects invalid or over-cap minimum %s', (minimumDamage) => {
              expect(() => validateCombatActionDefinition(action(vengeance({ minimumDamage })))).toThrow(/Vengeance/)
            })
            it.each([null, 4, [], {}, { conversionBasisPoints: 5_000, maximumDamage: 50, script: 'not permitted' }])('rejects malformed profile %j', (profile) => {
              const effect = { ...vengeance(), vengeance: profile } as unknown as VengeanceEffect
              expect(() => validateCombatActionDefinition(action(effect))).toThrow(/Vengeance/)
            })
            it('rejects ambiguous extra base damage instead of silently adding or dropping it', () => {
              expect(() => validateCombatActionDefinition(action({ ...vengeance(), amount: 3 }))).toThrow(/Vengeance/)
            })
            it('rejects simultaneous offensive-stat and Vengeance scaling', () => {
              expect(() => validateCombatActionDefinition(action({ ...vengeance(), scaling: { source: 'physical-power', coefficientBasisPoints: 5_000 } }))).toThrow(/Vengeance/)
            })
            it('rejects Vengeance metadata on a non-damage operation', () => {
              const effect = { type: 'healing', recipient: 'actor', amount: 3, vengeance: vengeance().vengeance } as unknown as CombatEffectDefinition
              expect(() => validateCombatActionDefinition(action(effect))).toThrow(/Vengeance/)
            })
            it('fails closed for the historical basic-attack-only mitigation adapter', () => {
              expect(() => validateCombatActionDefinition({ ...action(), sourceType: 'basic-attack' })).toThrow(/Vengeance/)
            })
            it('validates before materializing and cannot hide a missing cap at execution', () => {
              expect(() => cast(encounter(), action(vengeance({ maximumDamage: undefined })))).toThrow(/Vengeance/)
            })
            it('rejects invalid relevant history amounts rather than producing unsafe potency', () => {
              expect(() => cast(encounter([{ combatantId: 'actor', round: 4, amount: NaN }]))).toThrow(/Vengeance/)
            })
            it('rejects duplicate actor-round rows instead of counting them twice', () => {
              expect(() => cast(encounter([...ACTOR_HISTORY, ACTOR_HISTORY[0]!]))).toThrow(/Vengeance/)
            })
          })

          describe('Vengeance mature Skill integration', () => {
            function fixture(profile: Partial<VengeanceProfile> = {}, history = ACTOR_HISTORY) {
              const initial = encounter(history)
              const state = createStatDrivenCombatEncounterState(initial, initial.tactical.battle.combatants.map((unit) => ({
                combatantId: unit.id, provenance: { kind: 'scenario', sourceId: `scenario:${unit.id}`, sourceRulesVersion: 2 },
                accuracy: 10_000, evasion: 0, armor: 0, ward: 0, jump: 0, physicalPower: 30, mysticPower: 30,
              })))
              const skill: MatureSkillDefinition = { ...P33_REPRESENTATIVE_DISCIPLINE_SKILLS[0]!, id: 'test.vengeance', enabled: true,
                apCost: 10, mpCost: 1, target: action().target, requirements: [], effects: [vengeance(profile)], overrides: {} }
              return { state, skill }
            }
            it('halves capped Vengeance potency on a consecutive repeat at unchanged AP/MP cost', () => {
              const { state, skill } = fixture({ maximumDamage: 13 })
              const first = executePv1fMatureSkill(state, skill, SELECT)
              const preview = evaluatePv1fMatureSkill(first.state, skill, SELECT)
              const second = executePv1fMatureSkill(first.state, skill, SELECT)
              expect(preview.repeatPenaltyApplied).toBe(true)
              expect(first.events).toContainEqual(expect.objectContaining({ event: 'damage_applied', amount: 13 }))
              expect(second.events).toContainEqual(expect.objectContaining({ event: 'damage_applied', amount: 6 }))
              expect(preview.evaluation.projectedEvents).toContainEqual(expect.objectContaining({ event: 'damage_applied', amount: 6 }))
              expect(first.events).toContainEqual(expect.objectContaining({ event: 'action_economy_spent', amount: 10 }))
              expect(second.events).toContainEqual(expect.objectContaining({ event: 'action_economy_spent', amount: 10 }))
              expect(second.state.tactical.battle.combatants.find((unit) => unit.id === 'actor')?.mp).toBe(48)
            })
            it('halves the authored minimum only after capped potency is calculated', () => {
              const { state, skill } = fixture({ minimumDamage: 9 }, [])
              const first = executePv1fMatureSkill(state, skill, SELECT)
              const second = executePv1fMatureSkill(first.state, skill, SELECT)
              expect(first.events).toContainEqual(expect.objectContaining({ event: 'damage_applied', amount: 9 }))
              expect(second.events).toContainEqual(expect.objectContaining({ event: 'damage_applied', amount: 4 }))
            })
            it('preserves the repeat minimum-one rule for positive one-point potency', () => {
              const { state, skill } = fixture({ maximumDamage: 1 })
              const first = executePv1fMatureSkill(state, skill, SELECT)
              const second = executePv1fMatureSkill(first.state, skill, SELECT)
              expect(second.events).toContainEqual(expect.objectContaining({ event: 'damage_applied', amount: 1 }))
            })
          })
          TEST
          pnpm exec prettier --write "$file"
          pnpm --filter @aurevane/game-core typecheck
          pnpm exec eslint "$file"
          pnpm format:check
      - name: Classify behavioral RED and retain source-only tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @aurevane/game-core exec vitest run --reporter=json --outputFile=/tmp/vengeance-red.json > /tmp/vengeance-red.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then cat /tmp/vengeance-red.log; exit 1; fi
          python3 - <<'PY'
          import json,re
          report=json.load(open('/tmp/vengeance-red.json'))
          failed=[]
          for suite in report['testResults']:
              for test in suite['assertionResults']:
                  if test['status']!='failed': continue
                  message='\n'.join(test.get('failureMessages',[]))
                  print('RED',test['fullName'],re.sub(r'\x1b\[[0-9;]*m','',message).split('\n')[0])
                  assert 'combat-vengeance.test.ts' in suite['name'], (suite['name'], message)
                  assert 'AssertionError:' in message, message
                  failed.append(test)
          assert len(failed)>=30, len(failed)
          assert report['numPassedTests']>=1378,report['numPassedTests']
          print('VALID_VENGEANCE_RED',len(failed),'failures;',report['numPassedTests'],'passed;',report['numTotalTests'],'total')
          PY
          git diff --check
          test -z "$(git diff --name-only)"
          test "$(git ls-files --others --exclude-standard)" = packages/game-core/src/combat/combat-vengeance.test.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = a8ca06ce4f886b58304a94d8e4d0536186b7cc1f
          test -z "$(git ls-remote origin refs/heads/review/vengeance-red-source-20260915)"
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -- packages/game-core/src/combat/combat-vengeance.test.ts
          git commit -m 'test(combat): define capped Vengeance from three-round damage history'
          git push origin HEAD:refs/heads/review/vengeance-red-source-20260915
          printf 'RED_SHA=%s\nRED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
