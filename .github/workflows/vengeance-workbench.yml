name: Vengeance workbench
on:
  push:
    branches: [review/vengeance-workbench-20260915]
permissions:
  contents: write
jobs:
  vengeance-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8ca06ce4f886b58304a94d8e4d0536186b7cc1f
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Restore exact test contract and correct readonly fixture annotation only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a8ca06ce4f886b58304a94d8e4d0536186b7cc1f
          git fetch --no-tags origin f30cbdb7e0b766700baa4cce2c90681528f99b77
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          source=subprocess.check_output(['git','show','f30cbdb7e0b766700baa4cce2c90681528f99b77:.github/workflows/vengeance-workbench.yml'],text=True)
          marker='          cat > "$file" <<\'TEST\'\n'
          assert source.count(marker)==1
          tests=textwrap.dedent(source.split(marker)[1].split('          TEST\n')[0])
          old='function withStatus(state: CombatEncounterState, owner: string, definition: CombatStatusDefinition) {'
          assert tests.count(old)==1
          tests=tests.replace(old,old.replace(') {','): CombatEncounterState {'))
          p=Path('packages/game-core/src/combat/combat-vengeance.test.ts')
          assert not p.exists()
          p.write_text(tests)
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-vengeance.test.ts
          pnpm --filter @aurevane/game-core typecheck
          pnpm exec eslint packages/game-core/src/combat/combat-vengeance.test.ts
          pnpm format:check
      - name: Classify behavioral RED and retain source-only tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @aurevane/game-core exec vitest run --reporter=json --outputFile=/tmp/vengeance-red.json > /tmp/vengeance-red.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then cat /tmp/vengeance-red.log; exit 1; fi
          python3 - <<'PY'
          import json,re
          report=json.load(open('/tmp/vengeance-red.json'))
          failed=[]
          for suite in report['testResults']:
              for test in suite['assertionResults']:
                  if test['status']!='failed': continue
                  message='\n'.join(test.get('failureMessages',[]))
                  print('RED',test['fullName'],re.sub(r'\x1b\[[0-9;]*m','',message).split('\n')[0])
                  assert 'combat-vengeance.test.ts' in suite['name'], (suite['name'], message)
                  assert 'AssertionError:' in message, message
                  failed.append(test)
          assert len(failed)>=30, len(failed)
          assert report['numPassedTests']>=1378,report['numPassedTests']
          print('VALID_VENGEANCE_RED',len(failed),'failures;',report['numPassedTests'],'passed;',report['numTotalTests'],'total')
          PY
          git diff --check
          test -z "$(git diff --name-only)"
          test "$(git ls-files --others --exclude-standard)" = packages/game-core/src/combat/combat-vengeance.test.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = a8ca06ce4f886b58304a94d8e4d0536186b7cc1f
          test -z "$(git ls-remote origin refs/heads/review/vengeance-red-source-20260915)"
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -- packages/game-core/src/combat/combat-vengeance.test.ts
          git commit -m 'test(combat): define capped Vengeance from three-round damage history'
          git push origin HEAD:refs/heads/review/vengeance-red-source-20260915
          printf 'RED_SHA=%s\nRED_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
