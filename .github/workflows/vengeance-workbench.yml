name: Vengeance workbench
on:
  push:
    branches: [review/vengeance-workbench-20260915]
permissions:
  contents: write
jobs:
  vengeance-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a29b940c62366b1c59ae0abf67bb5a6319e29c03
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Preserve RED with a literal array malformed-profile fixture
        shell: bash
        run: |
          set -euo pipefail
