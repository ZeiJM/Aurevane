name: Vengeance workbench
on:
  push:
    branches: [review/vengeance-workbench-20260915]
permissions:
  contents: write
jobs:
  vengeance-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a29b940c62366b1c59ae0abf67bb5a6319e29c03
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Reproduce RED, apply exact patch and run all GREEN gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin cc66e1de9652a581a18c033785d0b532fd138857
          python3 - <<'PY'
          import re, subprocess, textwrap
          source=subprocess.check_output(['git','show','cc66e1de9652a581a18c033785d0b532fd138857:.github/workflows/vengeance-workbench.yml'],text=True)
          parts=re.split(r'(?m)^      - name: ',source)[1:]
          scripts={part.split('\n',1)[0]:textwrap.dedent(part.split('        run: |\n',1)[1]) for part in parts if '        run: |\n' in part}
          implementation=scripts['Implement bounded Vengeance without changing direct damage resolution']
          fixes={
              "old='''  return legacy.evaluateCombatAction(\n  state,\n  materializeStatScaledDamage(state, action),\n  selection,\n  content,\n)'''":
              "old='''  return legacy.evaluateCombatAction(\n    state,\n    materializeStatScaledDamage(state, action),\n    selection,\n    content,\n  )'''",
              "old='''  return {\n  prepared,\n  action,\n  cost: resolved.apCost,\n  evaluation: evaluateCombatAction(prepared, action, target, PV1F_COMBAT_CONTENT),\n  repeatPenaltyApplied,\n}'''":
              "old='''  return {\n    prepared,\n    action,\n    cost: resolved.apCost,\n    evaluation: evaluateCombatAction(prepared, action, target, PV1F_COMBAT_CONTENT),\n    repeatPenaltyApplied,\n  }'''",
          }
          for old,new in fixes.items():
              assert implementation.count(old)==1,old
              implementation=implementation.replace(old,new)
          scripts['Implement bounded Vengeance without changing direct damage resolution']=implementation
          for name in ['Preserve RED with a literal array malformed-profile fixture','Implement bounded Vengeance without changing direct damage resolution','Verify focused and full repository GREEN','Review restricted scope and preserve a source-only candidate']:
              print('EXECUTING_STAGE',name,flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',scripts[name]],check=True)
          PY
