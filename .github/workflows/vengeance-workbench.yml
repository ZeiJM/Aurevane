          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/game-core/src/combat/combat-vengeance.test.ts')
          text=p.read_text()
          old="  ])('rejects malformed profile %j', (profile) => {"
          assert text.count(old)==1
          # Vitest treats an array row as positional arguments. Wrap the input so [] stays [].
          text=text.replace(old,"  ].map((profile) => ({ profile })))('rejects malformed profile %j', ({ profile }) => {")
          p.write_text(text)
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-vengeance.test.ts
