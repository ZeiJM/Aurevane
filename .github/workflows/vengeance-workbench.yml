name: Vengeance workbench
on:
  push:
    branches: [review/vengeance-workbench-20260915]
permissions:
  contents: read
jobs:
  vengeance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b02e3fb63cc85856e2a53caf8ae061bb229653b8
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Rerun unchanged candidate review with correctly narrowed temporary event assertions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 32acb3a2cb1f2c7ffdd260544471bd7fe6af93b2
          python3 - <<'PY'
          import re,subprocess,textwrap
          source=subprocess.check_output(['git','show','32acb3a2cb1f2c7ffdd260544471bd7fe6af93b2:.github/workflows/vengeance-workbench.yml'],text=True)
          parts=re.split(r'(?m)^      - name: ',source)[1:]
          scripts={part.split('\n',1)[0]:textwrap.dedent(part.split('        run: |\n',1)[1]) for part in parts if '        run: |\n' in part}
          name='Check actual candidate with temporary compatibility and boundary probes'
          script=scripts[name]
          old="event.event === 'damage_applied' && event.amount > 0"
          new="typeof event === 'object' && event !== null && 'event' in event && event.event === 'damage_applied' && 'amount' in event && typeof event.amount === 'number' && event.amount > 0"
          assert script.count(old)==1
          scripts[name]=script.replace(old,new)
          for stage in [name,'Verify scope and unchanged legacy math, catalogs and deployment boundaries']:
              print('REVIEW_STAGE',stage,flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',scripts[stage]],check=True)
          PY
