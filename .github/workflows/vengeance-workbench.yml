          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json,re
          r=json.load(open('/tmp/vengeance-red.json'))
          failed=[]
          for suite in r['testResults']:
              for test in suite['assertionResults']:
                  if test['status']!='failed': continue
                  msg='\n'.join(test.get('failureMessages',[]))
                  assert 'combat-vengeance.test.ts' in suite['name'] and 'AssertionError:' in msg, (test['fullName'],msg)
                  print('EXPECTED_RED',test['fullName'],re.sub(r'\x1b\[[0-9;]*m','',msg).split('\n')[0])
                  failed.append(test)
          assert len(failed)==56 and r['numPassedTests']==1382 and r['numTotalTests']==1438, r
          print('VALID_VENGEANCE_RED 56 assertion failures; 1382 passing; 1438 total')
          PY
          test "$(git diff --name-only)" = packages/game-core/src/combat/combat-vengeance.test.ts
          git diff --check
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add -- packages/game-core/src/combat/combat-vengeance.test.ts
          git commit -m 'test(combat): exercise literal malformed Vengeance array metadata'
          git rev-parse HEAD >/tmp/vengeance-red-sha
      - name: Implement bounded Vengeance without changing direct damage resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('packages/game-core/src/combat')
          for name,expected in {
            'actions.ts':'b8b580ee0e72965865a5d9bf450fd8dbfd836af6',
            'combat-authoring-validation.ts':'066b2b709078823a6ba3e0cc60bd97d5a0c5e04c',
            'pv1f-action-economy.ts':'23e92bbfe495d4de564b920b42ff1a6feaeb3c27',
          }.items():
              actual=subprocess.check_output(['git','rev-parse',f'HEAD:{root/name}'],text=True).strip()
              assert actual==expected,(name,actual)
          p=root/'combat-vengeance.ts'
          assert not p.exists()
          p.write_text('''import type { CombatActionDefinition, CombatEncounterState } from './actions'

          export interface CombatVengeanceDefinition {
            conversionBasisPoints: number
            minimumDamage?: number
            maximumDamage: number
          }

          export interface CombatVengeanceBasis {
            effectOrdinal: number
            sourceCombatantId: string
            windowStartRound: number
            windowEndRound: number
            damageByRound: readonly { round: number; amount: number }[]
            rawDamage: number
          }

          /** Validate before lowering the profile to ordinary damage, so invalid authoring cannot disappear. */
          export function validateVengeanceActionDefinition(action: CombatActionDefinition): void {
            for (const effect of action.effects) {
              if (!('vengeance' in effect) || effect.vengeance === undefined) continue
              if (effect.type !== 'damage' || action.sourceType === 'basic-attack') {
                throw new TypeError('Vengeance requires a damage effect outside the historical Basic Attack adapter.')
              }
              if (effect.amount !== 0 || effect.scaling !== undefined) {
                throw new TypeError('Vengeance requires zero base damage and no offensive-stat scaling.')
              }
              const profile = effect.vengeance
              if (!profile || typeof profile !== 'object' || Array.isArray(profile)) {
                throw new TypeError('Vengeance requires a typed conversion profile.')
              }
              if (Object.keys(profile).some((key) => !['conversionBasisPoints', 'minimumDamage', 'maximumDamage'].includes(key))) {
                throw new TypeError('Vengeance profile contains an unsupported field.')
              }
              assertSafeInteger(profile.conversionBasisPoints, 1, 'conversion percentage')
              assertSafeInteger(profile.maximumDamage, 1, 'maximum damage')
              if (profile.minimumDamage !== undefined) {
                assertSafeInteger(profile.minimumDamage, 0, 'minimum damage')
                if (profile.minimumDamage > profile.maximumDamage) {
                  throw new RangeError('Vengeance minimum damage cannot exceed its maximum.')
                }
              }
            }
          }

          /** Read one command-start snapshot. Vengeance never consumes history or reactive output. */
          export function materializeVengeanceDamage(
            state: CombatEncounterState,
            action: CombatActionDefinition,
          ): { action: CombatActionDefinition; basis: readonly CombatVengeanceBasis[] } {
            validateVengeanceActionDefinition(action)
            if (!action.effects.some((effect) => effect.type === 'damage' && effect.vengeance !== undefined)) {
              return { action, basis: [] }
            }
            const actorId = state.tactical.battle.lifecycle === 'active'
              ? state.tactical.battle.currentTurn?.combatantId : undefined
            // Preserve the established inactive-turn legality report rather than inventing a potency source.
            if (!actorId) return { action, basis: [] }
            const round = state.tactical.battle.round
            assertSafeInteger(round, 1, 'current round')
            const firstRound = Math.max(1, round - 2)
            const history = state.effectState?.damageHistory ?? []
            if (!Array.isArray(history)) throw new TypeError('Vengeance history must be an array.')
            const byRound = new Map<number, number>()
            for (const entry of history) {
              if (!entry || typeof entry !== 'object') throw new TypeError('Vengeance history contains an invalid row.')
              if (entry.combatantId !== actorId) continue
              assertSafeInteger(entry.round, 1, 'history round')
              if (entry.round < firstRound || entry.round > round) continue
              assertSafeInteger(entry.amount, 0, 'history amount')
              if (byRound.has(entry.round)) throw new TypeError('Vengeance history must have one row per actor and round.')
              byRound.set(entry.round, entry.amount)
            }
            const damageByRound = Array.from({ length: round - firstRound + 1 }, (_, index) => {
              const entryRound = firstRound + index
              return { round: entryRound, amount: byRound.get(entryRound) ?? 0 }
            })
            // Each row is safe, but the three-row total need not fit a JavaScript number.
            const total = damageByRound.reduce((sum, entry) => sum + BigInt(entry.amount), 0n)
            const basis: CombatVengeanceBasis[] = []
            const effects = action.effects.map((effect, effectOrdinal) => {
              if (effect.type !== 'damage' || effect.vengeance === undefined) return effect
              const { vengeance, ...ordinaryDamage } = effect
              const converted = total * BigInt(vengeance.conversionBasisPoints) / 10_000n
              const minimum = BigInt(vengeance.minimumDamage ?? 0)
              const maximum = BigInt(vengeance.maximumDamage)
              const bounded = converted < minimum ? minimum : converted > maximum ? maximum : converted
              const rawDamage = Number(bounded)
              basis.push({ effectOrdinal, sourceCombatantId: actorId, windowStartRound: firstRound,
                windowEndRound: round, damageByRound, rawDamage })
              return { ...ordinaryDamage, amount: rawDamage }
            })
            return { action: { ...action, effects }, basis }
          }

          function assertSafeInteger(value: unknown, minimum: number, label: string): asserts value is number {
            if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < minimum) {
              throw new RangeError(`Vengeance ${label} must be a safe integer of at least ${minimum}.`)
            }
          }
          ''')
          p=root/'actions.ts'
          text=p.read_text()
          text="import { materializeVengeanceDamage, type CombatVengeanceDefinition, type CombatVengeanceBasis } from './combat-vengeance'\n"+text
          old='  | (LegacyDamageEffect & { scaling?: CombatDamageScaling })'
          assert text.count(old)==1
          text=text.replace(old,'  | (LegacyDamageEffect & { scaling?: CombatDamageScaling; vengeance?: CombatVengeanceDefinition })')
          marker='export interface CombatResolutionContext {'
          assert text.count(marker)==1
          text=text.replace(marker,"export interface CombatActionEvaluation extends legacy.CombatActionEvaluation {\n  vengeanceBasis?: readonly CombatVengeanceBasis[]\n}\n\n"+marker)
          old='''  return legacy.evaluateCombatAction(
            state,
            materializeStatScaledDamage(state, action),
            selection,
            content,
          )'''
          assert text.count(old)==1
          text=text.replace(old,'''  const materialized = materializeVengeanceDamage(state, action)
            const evaluation = legacy.evaluateCombatAction(
              state,
              materializeStatScaledDamage(state, materialized.action),
              selection,
              content,
            )
            return evaluation.legal && materialized.basis.length > 0
              ? { ...evaluation, vengeanceBasis: materialized.basis }
              : evaluation''')
          assert text.count('): legacy.CombatActionEvaluation {')==1
          text=text.replace('): legacy.CombatActionEvaluation {','): CombatActionEvaluation {')
          old='  const materializedAction = materializeStatScaledDamage(state, action)'
          assert text.count(old)==1
          text=text.replace(old,'  const materializedAction = materializeStatScaledDamage(state, materializeVengeanceDamage(state, action).action)')
          p.write_text(text)
          p=root/'combat-authoring-validation.ts'
          text=p.read_text()
          text="import { validateVengeanceActionDefinition } from './combat-vengeance'\n"+text
          old='  validateGameplayActionMetadata(action)'
          assert text.count(old)==1
          text=text.replace(old,'  validateVengeanceActionDefinition(action)\n'+old)
          p.write_text(text)
          p=root/'pv1f-action-economy.ts'
          text=p.read_text()
          text="import { materializeVengeanceDamage } from './combat-vengeance'\n"+text
          old='  const defendedEffects: readonly CombatEffectDefinition[] = baseAction.effects.map((effect) =>'
          assert text.count(old)==1
          text=text.replace(old,"  const vengeance = materializeVengeanceDamage(prepared, baseAction)\n  const defendedEffects: readonly CombatEffectDefinition[] = vengeance.action.effects.map((effect) =>")
          old='''  return {
            prepared,
            action,
            cost: resolved.apCost,
            evaluation: evaluateCombatAction(prepared, action, target, PV1F_COMBAT_CONTENT),
            repeatPenaltyApplied,
          }'''
          assert text.count(old)==1
          text=text.replace(old,'''  const evaluation = evaluateCombatAction(prepared, action, target, PV1F_COMBAT_CONTENT)
            return {
              prepared,
              action,
              cost: resolved.apCost,
              evaluation: evaluation.legal && vengeance.basis.length > 0
                ? { ...evaluation, vengeanceBasis: vengeance.basis.map((basis) => ({
                    ...basis, rawDamage: repeatPenaltyApplied ? halfPositiveMagnitude(basis.rawDamage) : basis.rawDamage,
                  })) }
                : evaluation,
              repeatPenaltyApplied,
            }''')
          p.write_text(text)
          p=Path('docs/COMBAT.md')
          text=p.read_text()
          marker='# AUREVANE Combat Design Bible\n'
          assert text.startswith(marker)
          addition='''
          ## P4.K4 Vengeance kernel boundary — 2026-09-15

          Vengeance is an optional typed `vengeance` profile on an ordinary damage block, not a reactive status or a second damage resolver. Author `conversionBasisPoints` as a positive safe integer, optional nonnegative `minimumDamage`, and required positive finite safe-integer `maximumDamage`. The minimum cannot exceed the maximum. Conversion may exceed 100%, but the explicit maximum always bounds the derived raw potency. The block uses `amount: 0` and cannot also author offensive-stat scaling; ordinary extra damage belongs in a separate block. Unknown profile fields, invalid values and Vengeance on non-damage operations are rejected. The historical Basic Attack adapter does not accept this metadata.

          The user’s authoritative current-round plus previous-two-round Damage History is read once from the command-start snapshot. Old unpruned rows, future rows and other combatants do not contribute. Each actor/round row is unique and contains a nonnegative safe integer; invalid relevant values or duplicates fail closed. The engine sums and converts using exact integer arithmetic, floors once, applies the authored minimum and maximum, and only then converts back to a safe numeric raw-damage value. There is no implicit Absorb minimum-one rule. Missing historical effect state means zero qualifying history. Casting and healing do not consume or erase the history.

          The ordinary pipeline then applies targeting, Armor/Ward, tactical and damage modifiers, Barrier, actual-HP/overkill clamping, Damage History and bounded reactions. `maximumDamage` caps the history-derived raw potency, not the subsequent ordinary modifier stage. Pierce retains its existing mitigation-only meaning. Vengeance is direct command damage and may trigger eligible defender Absorb/Reflect; reflected output does not feed the user’s history. Existing hostile direct/periodic history recording and self/backlash/system exclusions are unchanged.

          Kernel evaluation and commit share the same materializer. A legal Vengeance evaluation includes `vengeanceBasis` with the source, effect ordinal, window bounds, at most three per-round amounts and derived raw potency; illegal evaluations do not expose that basis. Evaluation does not advance RNG or mutate the snapshot. Commit recomputes from its current snapshot; existing expected-battle-version protection remains authoritative. Mature Skills materialize before the existing consecutive-use reduction, so the capped potency is halved at unchanged AP/MP cost, retaining the established minimum-one repeat rule only for already-positive potency.

          This ticket supplies kernel calculation, validation and forecast data, not published Vengeance Skills or a player-interface release. Generalized Skill accuracy, complete reactive forecasts, AI policy, compact-tag/presentation wiring and content publication remain their separate migration/acceptance gates. Published catalogs, historical direct-damage behavior, schemas and deployment configuration are unchanged. No deployment is authorized by this checkpoint.

          '''
          import textwrap
          p.write_text(marker+textwrap.dedent(addition)+text[len(marker):])
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-vengeance.ts packages/game-core/src/combat/actions.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/pv1f-action-economy.ts docs/COMBAT.md
          git diff --check
      - name: Verify focused and full repository GREEN
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-vengeance.test.ts src/combat/combat-reflect.test.ts src/combat/combat-absorb-mp.test.ts src/combat/combat-absorb-hp.test.ts src/combat/combat-absorb-hp-command.test.ts src/combat/combat-barrier.test.ts src/combat/combat-damage-history-runtime.test.ts src/combat/combat-resolution-provenance.test.ts src/combat/pv1f-action-economy.test.ts src/combat/actions-stat-scaled-damage.test.ts src/combat/combat-burn-backlash.test.ts
          if ! pnpm check >/tmp/vengeance-quality.log 2>&1; then tail -180 /tmp/vengeance-quality.log; exit 1; fi
          python3 - <<'PY'
          import re
          text=re.sub(r'\x1b\[[0-9;]*m','',open('/tmp/vengeance-quality.log').read())
          for line in text.splitlines():
              if any(k in line for k in ['Test Files','Tests ','successful,','Compiled successfully','All matched files','ℹ pass','ℹ fail']): print(line)
          print('FULL_PNPM_CHECK_PASSED')
          PY
      - name: Review restricted scope and preserve a source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- packages/game-core/src/combat/combat-vengeance.test.ts apps .github pnpm-lock.yaml packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/status-content.ts packages/game-core/src/combat/stat-driven-combat.ts
          python3 - <<'PY'
          import subprocess
          expected={'docs/COMBAT.md','packages/game-core/src/combat/actions.ts','packages/game-core/src/combat/combat-authoring-validation.ts','packages/game-core/src/combat/pv1f-action-economy.ts'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,changed
          assert subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()=='packages/game-core/src/combat/combat-vengeance.ts'
          PY
          git diff --stat
          git diff -- packages/game-core/src/combat/actions.ts packages/game-core/src/combat/pv1f-action-economy.ts
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3d8a4d25cb897d0f9ce4871c6972e5d7107d68b0
          test "$(git ls-remote origin refs/heads/agent/combat-effect-taxonomy-rework | cut -f1)" = a8ca06ce4f886b58304a94d8e4d0536186b7cc1f
          test -z "$(git ls-remote origin refs/heads/review/vengeance-green-source-20260915)"
          git add -- docs/COMBAT.md packages/game-core/src/combat/actions.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/pv1f-action-economy.ts packages/game-core/src/combat/combat-vengeance.ts
          git commit -m 'feat(combat): derive capped Vengeance from authoritative recent damage' -m 'Test-first 56 expected assertion failures, then full GREEN. Shared snapshot materialization for preview/commit, exact bounded arithmetic, typed authoring validation and existing mature repeat reduction. No legacy damage math, catalog, schema, UI or deployment changes.'
          git diff --exit-code
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/review/vengeance-green-source-20260915
          printf 'RED_SHA=%s\nGREEN_SHA=%s\nGREEN_TREE=%s\n' "$(cat /tmp/vengeance-red-sha)" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
