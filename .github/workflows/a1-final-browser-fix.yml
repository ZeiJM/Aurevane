name: A1 final browser integration fix

on:
  push:
    branches:
      - agent/a1-feedback-holistic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/a1-feedback-holistic

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install formatter without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fix final browser integration seams and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          battle = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = battle.read_text()
          old = """              <div className={styles.chatHeading}>\n                <strong>Battle Chat</strong>\n                <span>Solo channel</span>\n              </div>\n"""
          new = """              <div className={styles.chatHeading}>\n                <strong>Battle Chat</strong>\n                <span>Solo channel</span>\n                <button\n                  type=\"button\"\n                  className={styles.chatClose}\n                  aria-label=\"Close battle chat\"\n                  onClick={() => setOverlay(null)}\n                >\n                  ×\n                </button>\n              </div>\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected one battle chat heading block')
          battle.write_text(text.replace(old, new))

          css = Path('apps/web/src/components/battle/battle-experience-v2.module.css')
          style = css.read_text()
          marker = """.chatHeading span {\n  color: var(--av-text-dim);\n  font: 650 0.42rem/1 var(--av-font-mono);\n  text-transform: uppercase;\n}\n\n"""
          addition = marker + """.chatClose {\n  display: grid;\n  width: 1.55rem;\n  height: 1.55rem;\n  flex: 0 0 auto;\n  place-items: center;\n  margin-left: 0.15rem;\n  border: 1px solid var(--av-border-strong);\n  border-radius: var(--av-radius-sm);\n  color: var(--av-text-muted);\n  background: rgba(255, 255, 255, 0.025);\n  cursor: pointer;\n  font-size: 0.9rem;\n  line-height: 1;\n}\n\n.chatClose:hover,\n.chatClose:focus-visible {\n  border-color: rgba(207, 169, 93, 0.65);\n  color: var(--av-brass-200);\n}\n\n"""
          if style.count(marker) != 1:
              raise SystemExit('Expected one chat heading style marker')
          css.write_text(style.replace(marker, addition))

          battle_test = Path('apps/web/e2e/battle-experience.pw.ts')
          test_text = battle_test.read_text()
          old_test = "await page.getByRole('button', { name: /Chat Self/ }).click()\n\n  await page.getByRole('button', { name: `Show ${characterName} combat details` }).click()"
          new_test = "await page.getByRole('button', { name: 'Close battle chat' }).click()\n\n  await page.getByRole('button', { name: `Show ${characterName} combat details` }).click()"
          if test_text.count(old_test) != 1:
              raise SystemExit('Expected one battle chat closing assertion')
          battle_test.write_text(test_text.replace(old_test, new_test))

          practice_test = Path('apps/web/e2e/wayfarers-practice.pw.ts')
          practice_text = practice_test.read_text()
          old_practice = "await expect(planner).toContainText('Offline Training')"
          new_practice = "await expect(planner).toContainText('Practice Plan')"
          if practice_text.count(old_practice) != 1:
              raise SystemExit('Expected one stale Offline Training assertion')
          practice_test.write_text(practice_text.replace(old_practice, new_practice))
          PY

          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-experience-v2.tsx \
            apps/web/src/components/battle/battle-experience-v2.module.css \
            apps/web/e2e/battle-experience.pw.ts \
            apps/web/e2e/wayfarers-practice.pw.ts

          git rm .github/workflows/a1-final-browser-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix final A1 browser integration seams"
          git push origin HEAD:agent/a1-feedback-holistic
