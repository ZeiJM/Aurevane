name: P1.6 format Practice e2e

on:
  push:
    branches:
      - agent/p1-6-wayfarers-practice-backfill

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-6-wayfarers-practice-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/web/e2e/wayfarers-practice.pw.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/wayfarers-practice.pw.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "P1.6 format Practice browser journey"
          git push origin HEAD:agent/p1-6-wayfarers-practice-backfill
