name: Temporary agent Battle Log full-history integration

on:
  push:
    branches:
      - agent/battle-log-full-history

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-log-full-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply surgical Battle Log history integration
        run: python scripts/temp-battle-log-full-history.py
      - name: Format changed TypeScript
        run: >-
          pnpm exec prettier --write
          packages/db/src/battle-session.ts
          apps/web/src/server/battle/supabase-battle-session-repository.ts
          apps/web/src/server/battle/battle-log-service.ts
          apps/web/src/server/battle/battle-log-service.test.ts
          apps/web/src/server/battle/pvp-battle-communication-service.ts
          apps/web/src/server/battle/pvp-battle-communication-service.test.ts
          apps/web/src/components/battle/battle-log-presentation.ts
          apps/web/src/components/battle/battle-log-presentation.test.ts
          apps/web/src/components/battle/battle-log-feed.tsx
      - name: Run focused Battle Log regression tests
        run: >-
          pnpm --filter @aurevane/web exec vitest run
          src/server/battle/battle-log-service.test.ts
          src/server/battle/pvp-battle-communication-service.test.ts
          src/components/battle/battle-log-presentation.test.ts
      - name: Commit integrated task and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/temp-agent-battle-log-full-history.yml
          rm scripts/temp-battle-log-full-history.py
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve complete Battle Log history"
          git push origin HEAD:agent/battle-log-full-history
