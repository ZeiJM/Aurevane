name: Temporary tagged Technique regression v4

on:
  push:
    branches:
      - fix/tagged-technique-preview-hotkeys-20260906
    paths:
      - .github/workflows/temp-tagged-technique-regression-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tagged-technique-preview-hotkeys-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply regression patch
        run: python .github/scripts/temp_tagged_technique_regression_patch.py
      - name: Format touched files
        run: npx --yes prettier@3.9.6 --write apps/web/src/components/battle/battle-command-cockpit-polish.tsx apps/web/e2e/p3-8-representative-buildcraft.pw.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/battle-command-cockpit-polish.tsx apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git commit -m 'Add tagged Technique cockpit regression proof'
          git push origin HEAD:fix/tagged-technique-preview-hotkeys-20260906
