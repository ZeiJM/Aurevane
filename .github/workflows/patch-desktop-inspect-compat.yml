name: Patch Desktop Inspect Compatibility

on:
  push:
    branches:
      - 'fix/desktop-six-combatant-rails-20260823'
    paths:
      - '.github/workflows/patch-desktop-inspect-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-six-combatant-rails-20260823

      - name: Preserve legacy AI portrait fallback outside Inspect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx')
          text = path.read_text()
          old = """      if ((railCombatant || railName) && !inspectModeActive()) {\n        event.preventDefault()\n        event.stopImmediatePropagation()\n        return\n      }\n      if (!inspectModeActive()) return\n"""
          new = """      if ((railCombatant || railName) && !inspectModeActive()) return\n      if (!inspectModeActive()) return\n"""
          if old not in text:
              raise SystemExit('Expected desktop Inspect compatibility block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/desktop-battle-combatant-inspect.tsx
          git commit -m 'Preserve legacy AI portrait inspect fallback'
          git push origin HEAD:fix/desktop-six-combatant-rails-20260823
