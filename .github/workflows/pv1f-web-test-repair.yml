name: PV-1F temporary web test repair

on:
  push:
    branches:
      - agent/pv-1f-character-hub-turn-budget

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pv-1f-character-hub-turn-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Align web tests with PV-1F contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_section(text, start_marker, end_marker, replacement):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'start marker not found: {start_marker}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'end marker not found: {end_marker}')
              return text[:start] + replacement + text[end:]

          preview_path = Path('apps/web/src/server/battle/battle-preview-service.test.ts')
          preview = preview_path.read_text()
          preview = preview.replace(
              "import { moveCurrentCombatant, selectCurrentFinalFacing } from '@aurevane/game-core/combat/board'",
              "import { moveCurrentCombatant } from '@aurevane/game-core/combat/board'\nimport { finishPv1fTurn } from '@aurevane/game-core/combat/pv1f-action-economy'",
              1,
          )
          helper_start = preview.find('\nfunction withFinalFacing(')
          if helper_start >= 0:
              helper_end = preview.find("\ndescribe('P2.5 authoritative battle preview service'", helper_start)
              if helper_end < 0:
                  raise SystemExit('preview describe marker missing')
              preview = preview[:helper_start] + '\n' + preview[helper_end:]
          preview = preview.replace(
              'movementRemainingAfter: 3,',
              'movementRemainingAfter: 9,\n      actionEconomyCost: 10,\n      actionEconomyBefore: 100,\n      actionEconomyAfter: 90,',
              1,
          )
          preview = preview.replace(
              "code: 'command-not-legal',\n          message: expect.stringContaining('Final facing'),",
              "code: 'choose-final-facing',\n          message: expect.stringContaining('Choose North, East, South, or West'),",
              1,
          )

          end_test = '''  it('previews final facing as the turn-ending command without mutating stored state', async () => {
            const { battles, service } = await createFixture()

            const result = await service.previewIntent({
              userId: USER_ID,
              battleSessionId: SESSION_ID,
              expectedBattleVersion: 1,
              intent: { kind: 'face', facing: 'east' },
            })

            expect(result.preview).toEqual({
              kind: 'face',
              legal: true,
              facing: 'east',
              endsTurn: true,
              issues: [],
            })
            expect(battles.commitBattleIntent).not.toHaveBeenCalled()
          })

'''
          preview = replace_section(
              preview,
              "  it('allows End Turn preview after final facing exists without mutating the stored state'",
              "  it('rejects a stale preview with the current authoritative version'",
              end_test,
          )

          opponent_start = preview.find("  it('does not provide planning authority during an opponent-controlled turn'")
          if opponent_start < 0:
              raise SystemExit('opponent test marker missing')
          describe_close = preview.rfind('\n})')
          if describe_close < opponent_start:
              raise SystemExit('preview describe close missing')
          opponent_test = '''  it('does not provide planning authority during an opponent-controlled turn', async () => {
            const { battles, service, snapshot, record } = await createFixture()
            const opponentTurn = finishPv1fTurn(snapshot, 'east').state
            expect(opponentTurn.tactical.battle.currentTurn?.combatantId).toBe('recruit:p2-4-1')
            battles.findBattleSession.mockResolvedValue({ ...record, snapshot: opponentTurn })

            await expect(
              service.previewIntent({
                userId: USER_ID,
                battleSessionId: SESSION_ID,
                expectedBattleVersion: 1,
                intent: { kind: 'face', facing: 'west' },
              }),
            ).rejects.toMatchObject({ code: 'FORBIDDEN' })
          })'''
          preview = preview[:opponent_start] + opponent_test + preview[describe_close:]
          preview_path.write_text(preview)

          recruit_path = Path('apps/web/src/server/battle/battle-recruit-ai-service.test.ts')
          recruit = recruit_path.read_text()
          recruit = recruit.replace('expect(seed).toBe(2_083_297_977)', 'expect(seed).toBe(-578_671_629)', 1)
          recruit = recruit.replace("profileId: 'recruit-weak-v1',", "profileId: 'recruit-standard-v2',", 1)
          recruit = recruit.replace('profileVersion: 1,', 'profileVersion: 2,', 1)
          recruit = recruit.replace('rulesVersion: 1,', 'rulesVersion: 2,', 1)
          recruit_path.write_text(recruit)

          session_path = Path('apps/web/src/server/battle/battle-session-service.test.ts')
          session = session_path.read_text()
          session = session.replace(
              'rulesVersion: 1,\n      contentVersion: 1,',
              'rulesVersion: 2,\n      contentVersion: 2,',
              1,
          )
          session = session.replace('baseMovementBudget: 4,', 'baseMovementBudget: 10,', 2)
          session_path.write_text(session)
          PY
      - name: Canonical format
        run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-preview-service.test.ts \
            apps/web/src/server/battle/battle-recruit-ai-service.test.ts \
            apps/web/src/server/battle/battle-session-service.test.ts
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/server/battle/battle-preview-service.test.ts \
            apps/web/src/server/battle/battle-recruit-ai-service.test.ts \
            apps/web/src/server/battle/battle-session-service.test.ts
          if git diff --cached --quiet; then
            echo 'No web-test repairs needed.'
            exit 0
          fi
          git commit -m 'test: align battle expectations with PV-1F contracts'
          git push origin HEAD:agent/pv-1f-character-hub-turn-budget
