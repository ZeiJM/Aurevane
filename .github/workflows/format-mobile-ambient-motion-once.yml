name: One-shot format mobile ambient motion

on:
  push:
    branches:
      - agent/mobile-ambient-motion-final-pass-20260918

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ambient-motion-final-pass-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/web/src/components/account/account-entry-shell.module.css \
            apps/web/src/components/character/character-select-shell.module.css
          rm .github/workflows/format-mobile-ambient-motion-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/account/account-entry-shell.module.css \
            apps/web/src/components/character/character-select-shell.module.css \
            .github/workflows/format-mobile-ambient-motion-once.yml
          git commit -m "chore: format final ambient motion pass"
          git push origin HEAD:agent/mobile-ambient-motion-final-pass-20260918
