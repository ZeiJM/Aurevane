name: A07 Render Foundation Discipline Audio

on:
  push:
    branches:
      - agent/a07-foundation-discipline-audio-20260922
    paths:
      - '.github/workflows/a07-render-foundation-audio.yml'
      - 'scripts/media/render_phase4_audio.py'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/a07-foundation-discipline-audio-20260922

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install synthesis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Render missing foundation Discipline cues
        run: |
          python scripts/media/render_phase4_audio.py \
            --family vanguard \
            --family farstrider \
            --family shadehand \
            --family aetherist \
            --family lifebinder \
            --output content/media-candidates/phase4-foundation-audio

      - name: Stage runtime cues
        run: |
          mkdir -p apps/web/public/media/audio/sfx/phase4
          cp content/media-candidates/phase4-foundation-audio/audio/runtime/*.mp3 \
            apps/web/public/media/audio/sfx/phase4/

      - name: Commit deterministic audio outputs
        run: |
          git config user.name "Aurevane Audio Renderer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            content/media-candidates/phase4-foundation-audio \
            apps/web/public/media/audio/sfx/phase4
          if git diff --cached --quiet; then
            echo "No generated audio changes to commit."
            exit 0
          fi
          git commit -m "audio: render foundation Discipline cues"
          git push origin HEAD:agent/a07-foundation-discipline-audio-20260922
