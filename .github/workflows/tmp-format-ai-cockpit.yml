name: Temporary AI cockpit formatter

on:
  pull_request:
    branches:
      - fix/ai-cockpit-pvp-button-format-20260828

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/format-ai-cockpit-pvp-button-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format AI cockpit parity file
        run: |
          pnpm exec prettier --write apps/web/src/components/battle/ai-cockpit-pvp-button-format.module.css
          if git diff --quiet -- apps/web/src/components/battle/ai-cockpit-pvp-button-format.module.css; then
            echo 'AI cockpit parity CSS already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/battle/ai-cockpit-pvp-button-format.module.css
          git commit -m 'Format AI cockpit PvP parity CSS'
          git push origin HEAD:tmp/format-ai-cockpit-pvp-button-20260828
