name: Fix and Validate Dark Fantasy Artwork

on:
  push:
    branches:
      - art/dark-fantasy-technique-art-20260907
    paths:
      - '.github/workflows/tmp-dark-art-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/dark-fantasy-technique-art-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Replace truncated resonance art and update presentation expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          artwork_path = Path('apps/web/src/components/battle/dark-fantasy-art/resonance-dark-fantasy-artwork-1.ts')
          artwork = artwork_path.read_text()
          replacement = 'data:image/webp;base64,'
          pattern = r'  "resonance\.shadehand-vanguard\.broken-line": ".*?",\n'
          updated, count = re.subn(
              pattern,
              f'  "resonance.shadehand-vanguard.broken-line": "{replacement}",\n',
              artwork,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'broken-line artwork replacement count was {count}')
          artwork_path.write_text(updated)

          test_path = Path('apps/web/src/components/battle/battle-skill-presentation.test.ts')
          test = test_path.read_text()
          test = test.replace("startsWith('data:image/svg+xml,')", "startsWith('data:image/webp;base64,')")
          test = test.replace('non-missing generated artwork', 'non-missing curated artwork')
          test_path.write_text(test)
          PY
      - name: Format focused files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-skill-presentation.test.ts \
            apps/web/src/components/battle/dark-fantasy-art/resonance-dark-fantasy-artwork-1.ts
      - name: Artwork and presentation tests
        run: |
          pnpm --filter @aurevane/web exec vitest run \
            src/components/battle/dark-fantasy-art/index.test.ts \
            src/components/battle/battle-skill-presentation.test.ts
      - name: Web typecheck
        run: pnpm --filter @aurevane/web typecheck
      - name: Production build
        run: pnpm build
      - name: Commit validated fixes
        run: |
          git config user.name "Aurevane Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-skill-presentation.test.ts \
            apps/web/src/components/battle/dark-fantasy-art/resonance-dark-fantasy-artwork-1.ts
          git diff --cached --quiet || git commit -m "Validate dark-fantasy artwork payloads"
          git push origin HEAD:art/dark-fantasy-technique-art-20260907
