name: Scan Dark Fantasy Artwork Payloads

on:
  push:
    branches:
      - art/dark-fantasy-technique-art-20260907
    paths:
      - '.github/workflows/tmp-dark-art-fix.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/dark-fantasy-technique-art-20260907
      - name: Scan embedded WebP payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import re
          import struct

          art_dir = Path('apps/web/src/components/battle/dark-fantasy-art')
          entry_re = re.compile(
              r"['\"]([^'\"]+)['\"]\s*:\s*['\"]data:image/webp;base64,([^'\"]+)['\"]",
              re.S,
          )
          bad = []
          total = 0
          valid = 0
          repairable = 0

          for path in sorted(art_dir.glob('*-dark-fantasy-artwork*.ts')):
              text = path.read_text()
              for artwork_id, payload in entry_re.findall(text):
                  total += 1
                  try:
                      raw = base64.b64decode(payload, validate=True)
                  except binascii.Error as exc:
                      bad.append((artwork_id, path.name, f'base64: {exc}'))
                      continue

                  if len(raw) < 12 or raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                      bad.append((artwork_id, path.name, 'invalid WebP header'))
                      continue

                  expected = struct.unpack('<I', raw[4:8])[0] + 8
                  if expected > len(raw):
                      bad.append((artwork_id, path.name, f'truncated RIFF: {len(raw)} < {expected}'))
                      continue
                  if expected < len(raw):
                      repairable += 1
                      print(f'REPAIRABLE trailing bytes: {artwork_id} ({path.name}) {len(raw)} -> {expected}')
                  valid += 1

          print(f'TOTAL={total} VALID={valid} REPAIRABLE={repairable} BAD={len(bad)}')
          for artwork_id, filename, reason in bad:
              print(f'BAD {artwork_id} | {filename} | {reason}')

          if bad:
              raise SystemExit(2)
          PY
