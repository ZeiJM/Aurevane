name: P2.6 format apply

on:
  push:
    branches:
      - agent/p2-6-recruit-ai-tactical-hall

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-6-recruit-ai-tactical-hall
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply exact P2.6 formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-recruit-ai-service.ts \
            packages/game-core/src/combat/recruit-ai.ts \
            packages/game-core/src/combat/recruit-ai.test.ts
          if git diff --quiet -- \
            apps/web/src/server/battle/battle-recruit-ai-service.ts \
            packages/game-core/src/combat/recruit-ai.ts \
            packages/game-core/src/combat/recruit-ai.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/server/battle/battle-recruit-ai-service.ts \
            packages/game-core/src/combat/recruit-ai.ts \
            packages/game-core/src/combat/recruit-ai.test.ts
          git commit -m "chore: format P2.6 Recruit AI slice"
          git push origin HEAD:agent/p2-6-recruit-ai-tactical-hall
