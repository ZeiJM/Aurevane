name: K3 Bleed Regression Formatter

on:
  push:
    branches:
      - agent/combat-k3-bleed-provenance-format-20260915

permissions:
  contents: write

jobs:
  format-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out formatter branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve workflow and check out exact RED test head
        shell: bash
        run: |
          git fetch origin agent/combat-k3-bleed-provenance-review-fix-20260915
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "12a724e51fe3cb092197adc8c35492883ac4a320"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format regression test
        run: pnpm exec prettier --write packages/game-core/src/combat/combat-persistent-provenance-bleed-replacement.test.ts
      - name: Verify only test formatting changed
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "packages/game-core/src/combat/combat-persistent-provenance-bleed-replacement.test.ts"
      - name: Commit and push formatted RED test
        shell: bash
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add packages/game-core/src/combat/combat-persistent-provenance-bleed-replacement.test.ts
          git commit -m "style: format Bleed provenance regression test"
          git push origin HEAD:agent/combat-k3-bleed-provenance-review-fix-20260915
