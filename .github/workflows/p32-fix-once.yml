name: P3.2 one-shot fix

on:
  push:
    branches:
      - agent/p3-2-secondary-attunement
    paths:
      - '.github/workflows/p32-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply focused P3.2 corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260903140500_p32_secondary_attunement.sql')
          text = path.read_text()
          old = '  on conflict (character_id, discipline_id) do nothing;'
          new = '  on conflict on constraint character_discipline_masteries_pkey do nothing;'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one mastery ON CONFLICT clause.')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts
          git diff --check

      - name: Commit durable fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add \
            supabase/migrations/20260903140500_p32_secondary_attunement.sql \
            apps/web/src/components/character/character-discipline-build-panel.tsx \
            apps/web/src/server/character/character-build-service.ts \
            apps/web/src/server/character/character-build-service.test.ts
          git commit -m 'Harden P3.2 mastery conflict and formatting'
          git push origin HEAD:agent/p3-2-secondary-attunement
