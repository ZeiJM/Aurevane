name: Cleanup PvP CPU fix once

on:
  push:
    branches:
      - fix/pvp-high-cpu-surgical-20260824

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cpu-cleanup-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pvp-high-cpu-surgical-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Preserve spectator authorization while preventing overlapping refreshes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path('apps/web/src/components/battle/pvp-spectator-experience.tsx')
          text = path.read_text()
          text = text.replace(
              "import { useEffect, useMemo, useRef, useState, type CSSProperties } from 'react'",
              "import { useEffect, useMemo, useState, type CSSProperties } from 'react'",
              1,
          )
          text = text.replace(
              "const SPECTATOR_REFRESH_MS = 850\nconst SPECTATOR_HEARTBEAT_MS = 10_000",
              "const SPECTATOR_REFRESH_MS = 850",
              1,
          )
          text = text.replace("  const lastHeartbeatAt = useRef(Date.now())\n", "", 1)

          start = "  useEffect(() => {\n    let cancelled = false\n    let timer: number | null = null\n    let controller: AbortController | null = null\n\n    const schedule = () => {"
          end = "  }, [spectator.battleKey])"
          first = text.find(start)
          if first < 0:
              raise SystemExit('spectator refresh start marker not found')
          last = text.find(end, first)
          if last < 0:
              raise SystemExit('spectator refresh end marker not found')
          last += len(end)

          replacement = indent(dedent("""\
          useEffect(() => {
            let cancelled = false
            let timer: number | null = null
            let controller: AbortController | null = null

            const schedule = () => {
              if (cancelled) return
              timer = window.setTimeout(() => void refresh(), SPECTATOR_REFRESH_MS)
            }

            const refresh = async () => {
              controller = new AbortController()

              try {
                const response = await fetch(
                  `/api/pvp/spectate/${encodeURIComponent(spectator.battleKey)}`,
                  { cache: 'no-store', signal: controller.signal },
                )
                const body = (await response.json()) as ApiBody
                if (!response.ok || !body.spectator || cancelled || controller.signal.aborted) {
                  if (!cancelled) {
                    setConnectionNote(body.error?.message ?? 'Arena link interrupted. Retrying…')
                  }
                  return
                }
                setSpectator(body.spectator)
                if (body.participantTitles) setParticipantTitles(body.participantTitles)
                setConnectionNote(null)
              } catch (refreshError) {
                if (
                  !cancelled &&
                  !(refreshError instanceof DOMException && refreshError.name === 'AbortError')
                ) {
                  setConnectionNote('Arena link interrupted. Retrying…')
                }
              } finally {
                controller = null
                schedule()
              }
            }

            schedule()
            return () => {
              cancelled = true
              controller?.abort()
              if (timer !== null) window.clearTimeout(timer)
            }
          }, [spectator.battleKey])"""), '  ')
          path.write_text(text[:first] + replacement + text[last:])
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format touched file
        run: pnpm exec prettier --write apps/web/src/components/battle/pvp-spectator-experience.tsx
      - name: Typecheck web app
        run: pnpm --filter @aurevane/web typecheck
      - name: Commit cleanup
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/battle/pvp-spectator-experience.tsx
          git diff --cached --check
          git commit -m "fix: preserve spectator authorization semantics [cpu-cleanup-applied]"
          git push origin HEAD:fix/pvp-high-cpu-surgical-20260824
