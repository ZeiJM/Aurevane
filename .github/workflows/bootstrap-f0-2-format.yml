name: Bootstrap F0.2 formatting

on:
  push:
    branches:
      - agent/ticket-0-2-infrastructure-persistence
    paths:
      - '.github/workflows/bootstrap-f0-2-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format reported files
        run: pnpm exec prettier --write packages/db/src/migration-policy.ts packages/validation/src/env/public.ts packages/validation/src/env/server.ts

      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/migration-policy.ts packages/validation/src/env/public.ts packages/validation/src/env/server.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Format F0.2 infrastructure source"
          git push
