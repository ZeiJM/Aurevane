name: Format battle target once

on:
  push:
    branches:
      - "agent/fix-pvp-lobby-refresh-build"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[battle-target-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-pvp-lobby-refresh-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Format target polish
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-map-token-polish.tsx \
            apps/web/src/components/battle/battle-map-token-polish.test.ts
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-map-token-polish.tsx \
            apps/web/src/components/battle/battle-map-token-polish.test.ts
      - name: Commit formatting
        run: |
          git config user.name "Nicholas JM"
          git config user.email "283436098+ZeiJM@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-map-token-polish.tsx apps/web/src/components/battle/battle-map-token-polish.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Confirm battle target formatting [battle-target-format]"
          else
            git commit -m "Format battle target polish [battle-target-format]"
          fi
          git push origin HEAD:agent/fix-pvp-lobby-refresh-build
