name: A2 Movement Input Fix

on:
  push:
    branches:
      - "agent/a2-feedback-holistic"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a2-feedback-holistic
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply movement input patch
        shell: python
        run: |
          from pathlib import Path

          battle = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = battle.read_text()

          old_effect = """  useEffect(() => {
              function handleKeyDown(event: KeyboardEvent) {
                if (isTextEntryTarget(event.target)) return
                if (event.key === 'Escape') {
                  event.preventDefault()
                  setOverlay(null)
                  clearPlanning()
                  setNotice('Selection cleared. Choose any action when you are ready.')
                } else if (event.key === '0') {
                  event.preventDefault()
                  chooseMode('inspect')
                } else if (event.key === 'Enter' && pendingIntent && preview?.preview.legal) {
                  event.preventDefault()
                  void commitIntent()
                }
              }
              window.addEventListener('keydown', handleKeyDown)
              return () => window.removeEventListener('keydown', handleKeyDown)
            }, [chooseMode, clearPlanning, commitIntent, pendingIntent, preview])
          """
          new_effect = old_effect + """

            useEffect(() => {
              function handleMoveTarget(event: Event) {
                if (!(event instanceof CustomEvent)) return
                const detail = event.detail as { x?: unknown; y?: unknown }
                if (!Number.isSafeInteger(detail.x) || !Number.isSafeInteger(detail.y)) return
                handleTileClick({ x: Number(detail.x), y: Number(detail.y) })
              }
              window.addEventListener('aurevane:battle-move-target', handleMoveTarget)
              return () => window.removeEventListener('aurevane:battle-move-target', handleMoveTarget)
            }, [handleTileClick])
          """
          if old_effect not in text:
              raise SystemExit('Battle keyboard effect anchor not found')
          text = text.replace(old_effect, new_effect, 1)

          old_tile = """                      onClick={() => handleTileClick(tile.position)}
                        onDoubleClick={requestQuickCommit}
                        onPointerUp={(event) => {
                          if (event.pointerType === 'touch')
                            handleTouchQuickCommit(
                              `tile:${positionKey(tile.position)}`,
                              event.timeStamp,
                            )
                        }}
          """
          new_tile = """                      onPointerDown={(event) => {
                          if (mode === 'move' && event.pointerType !== 'keyboard') {
                            handleTileClick(tile.position)
                          }
                        }}
                        onClick={(event) => {
                          if (mode !== 'move' || event.detail === 0) handleTileClick(tile.position)
                        }}
                        onDoubleClick={requestQuickCommit}
                        onPointerUp={(event) => {
                          if (event.pointerType === 'touch')
                            handleTouchQuickCommit(
                              `tile:${positionKey(tile.position)}`,
                              event.timeStamp,
                            )
                        }}
          """
          if old_tile not in text:
              raise SystemExit('Battle tile event anchor not found')
          text = text.replace(old_tile, new_tile, 1)
          text = text.replace("style={{ width: `${playerEconomy} AP` }}", "style={{ width: `${playerEconomy}%` }}", 1)
          battle.write_text(text)

          assist = Path('apps/web/src/components/battle/battle-keyboard-assist.tsx')
          text = assist.read_text()
          old_click = """  target.focus({ preventScroll: true })
            target.click()
            return true
          """
          new_click = """  target.focus({ preventScroll: true })
            window.dispatchEvent(
              new CustomEvent('aurevane:battle-move-target', {
                detail: { x: targetX - 1, y: targetY - 1 },
              }),
            )
            return true
          """
          if old_click not in text:
              raise SystemExit('Keyboard movement click anchor not found')
          assist.write_text(text.replace(old_click, new_click, 1))
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-experience-v2.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-experience-v2.tsx \
            apps/web/src/components/battle/battle-keyboard-assist.tsx
          git commit -m "fix: unify battle movement input path"
          git push origin HEAD:agent/a2-feedback-holistic
