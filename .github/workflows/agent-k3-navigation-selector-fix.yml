name: Apply K3 navigation selector correction

on:
  push:
    branches:
      - agent/combat-k3-reconciled-green-20260914
    paths:
      - .github/workflows/agent-k3-navigation-selector-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace retired modal navigation selectors
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k3-reconciled-green-20260914
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('apps/web/e2e/mixed-build-battle-entry.pw.ts'),
              Path('apps/web/e2e/p3-8-representative-buildcraft.pw.ts'),
          ]
          old = """  await page.getByRole('button', { name: 'Navigation' }).click()\n  await page\n    .getByRole('navigation', { name: 'Game navigation', exact: true })\n    .getByRole('link', { name: /Battle Hall/ })\n    .click()"""
          new = """  await page\n    .getByRole('navigation', { name: 'Primary game navigation', exact: true })\n    .getByRole('link', { name: 'Battle Hall', exact: true })\n    .click()"""
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one retired navigation selector, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          grep -Fq "name: 'Primary game navigation', exact: true" apps/web/e2e/mixed-build-battle-entry.pw.ts
          grep -Fq "name: 'Primary game navigation', exact: true" apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          ! grep -Fq "getByRole('button', { name: 'Navigation' })" apps/web/e2e/mixed-build-battle-entry.pw.ts
          ! grep -Fq "getByRole('button', { name: 'Navigation' })" apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git diff --check

      - name: Commit only the test-selector correction
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/combat-k3-reconciled-green-20260914
          git rm .github/workflows/agent-k3-navigation-selector-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/mixed-build-battle-entry.pw.ts apps/web/e2e/p3-8-representative-buildcraft.pw.ts
          git diff --cached --check
          git commit -m 'test: follow persistent game navigation rail'
          git fetch origin "$branch"
          test "$(git rev-parse "origin/$branch")" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$branch"
