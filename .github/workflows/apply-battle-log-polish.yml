name: Apply battle log lifecycle polish

on:
  push:
    branches:
      - agent/status-lifecycle-bullet-v4

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/status-lifecycle-bullet-v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply requested battle log polish
        run: |
          python - <<'PY'
          from pathlib import Path

          presentation = Path('apps/web/src/components/battle/battle-log-presentation.ts')
          text = presentation.read_text()
          old_timeout = """    primary = [\n      segment(actor, 'actor'),\n      segment(' hesitates — '),\n      segment('the moment passes', 'outcome', 'warning'),\n    ]"""
          new_timeout = """    primary = [\n      segment(actor, 'actor'),\n      segment(' hesitates... '),\n      segment('the moment passes!', 'outcome', 'warning'),\n    ]"""
          assert old_timeout in text, 'timeout presentation changed unexpectedly'
          text = text.replace(old_timeout, new_timeout, 1)

          old_expired = """    primary = [\n      segment(`${target}'s `, 'target'),\n      segment(name, 'action'),\n      segment(' fades as their turn begins'),\n    ]"""
          new_expired = """    primary = [\n      segment('* '),\n      segment(`${target}'s `, 'target'),\n      segment(name, 'action'),\n      segment(' fades as their turn begins'),\n    ]"""
          assert old_expired in text, 'status-expired presentation changed unexpectedly'
          text = text.replace(old_expired, new_expired, 1)
          presentation.write_text(text)

          tests = Path('apps/web/src/components/battle/battle-log-presentation.test.ts')
          text = tests.read_text()
          assert "'Zei hesitates — the moment passes'" in text
          text = text.replace(
              "'Zei hesitates — the moment passes'",
              "'Zei hesitates... the moment passes!'",
              1,
          )
          assert '"Zei\'s Lowered Guard fades as their turn begins"' in text
          text = text.replace(
              '"Zei\'s Lowered Guard fades as their turn begins"',
              '"* Zei\'s Lowered Guard fades as their turn begins"',
              1,
          )
          tests.write_text(text)

          feed = Path('apps/web/src/components/battle/battle-log-feed.tsx')
          text = feed.read_text()
          old_title = """        const roundTitle =\n          !battleFinished && round.key === rounds[0]?.key && round.round !== null\n            ? `${roundLabel} · In progress`\n            : roundLabel"""
          new_title = """        const inProgress =\n          !battleFinished && round.key === rounds[0]?.key && round.round !== null"""
          assert old_title in text, 'round title presentation changed unexpectedly'
          text = text.replace(old_title, new_title, 1)
          old_render = """              <strong className={styles.roundTitle}>{roundTitle}</strong>"""
          new_render = """              <strong className={styles.roundTitle}>\n                {roundLabel}\n                {inProgress ? (\n                  <>\n                    {' · '}\n                    <span className={styles.inProgress}>In progress</span>\n                  </>\n                ) : null}\n              </strong>"""
          assert old_render in text, 'round title render changed unexpectedly'
          text = text.replace(old_render, new_render, 1)
          feed.write_text(text)

          css = Path('apps/web/src/components/battle/battle-log-feed.module.css')
          text = css.read_text()
          anchor = """.roundHeader time {\n  color: rgba(190, 204, 214, 0.62);"""
          replacement = """.inProgress {\n  color: var(--av-brass-300);\n}\n\n.roundHeader time {\n  color: rgba(190, 204, 214, 0.62);"""
          assert anchor in text, 'round header CSS changed unexpectedly'
          text = text.replace(anchor, replacement, 1)
          css.write_text(text)
          PY
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/battle-log-presentation.ts \
            apps/web/src/components/battle/battle-log-presentation.test.ts \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-feed.module.css
      - name: Commit requested changes and remove helper
        run: |
          rm .github/workflows/apply-battle-log-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/battle-log-presentation.ts \
            apps/web/src/components/battle/battle-log-presentation.test.ts \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-feed.module.css \
            .github/workflows/apply-battle-log-polish.yml
          git commit -m "Polish battle log lifecycle cues"
          git push origin HEAD:agent/status-lifecycle-bullet-v4
