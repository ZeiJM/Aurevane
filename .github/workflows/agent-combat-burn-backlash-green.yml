name: Implement and verify Burn backlash GREEN

on:
  push:
    branches:
      - agent/combat-burn-backlash-verify-20260914
    paths:
      - .github/workflows/agent-combat-burn-backlash-green.yml

permissions:
  contents: write

concurrency:
  group: combat-burn-backlash-green-20260914
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WORK_BRANCH: agent/combat-burn-backlash-work-20260914
      EXPECTED_HEAD: 96cd7a4832fd3b975983a4ccb421675141271196
    steps:
      - name: Checkout exact backlash RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Verify isolated work head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Implement command-boundary Burn backlash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              file.write_text(text.replace(old, new, 1))

          dots = 'packages/game-core/src/combat/combat-dots.ts'
          replace_once(
              dots,
              "export const CURRENT_BURN_DAMAGE_BY_STAGE = [4, 3, 2] as const\n",
              "export const CURRENT_BURN_DAMAGE_BY_STAGE = [4, 3, 2] as const\n"
              "export const CURRENT_BURN_BACKLASH_DAMAGE = 2 as const\n",
          )

          actions = 'packages/game-core/src/combat/actions.ts'
          replace_once(
              actions,
              "import {\n  CURRENT_POISON_DAMAGE,\n",
              "import {\n  CURRENT_BURN_BACKLASH_DAMAGE,\n  CURRENT_POISON_DAMAGE,\n",
          )

          helper = '''export function shouldApplyCurrentBurnBacklash(
            state: CombatEncounterState,
            actorId: string,
            action: CombatActionDefinition,
          ): boolean {
            return (
              hasCurrentBurn(state, actorId) &&
              (action.sourceType === 'basic-attack' ||
                action.effects.some((effect) => effect.type === 'damage' && effect.amount > 0))
            )
          }

          export function applyCurrentBurnBacklash(
            state: CombatEncounterState,
            actorId: string,
          ): CombatResolutionTransition {
            const actor = getCombatant(state.tactical.battle, actorId)
            if (actor.hp <= 0) return { state, events: [] }

            const hpAfter = Math.max(0, actor.hp - CURRENT_BURN_BACKLASH_DAMAGE)
            const damageEvent: CombatResolutionEvent = {
              event: 'damage_applied',
              actionId: 'status.burn.backlash.current.v1',
              sourceCombatantId: actorId,
              targetCombatantId: actorId,
              amount: actor.hp - hpAfter,
              hpBefore: actor.hp,
              hpAfter,
            }

            if (hpAfter === 0) {
              const defeated = defeatCurrentCombatant(state.tactical.battle, actorId)
              return {
                state: withBattle(state, defeated.state),
                events: [damageEvent, ...defeated.events],
              }
            }

            return {
              state: withUpdatedCombatant(state, actorId, { ...actor, hp: hpAfter }),
              events: [damageEvent],
            }
          }

          '''
          replace_once(
              actions,
              'export function executeCombatAction(\n',
              helper + 'export function executeCombatAction(\n',
          )
          replace_once(
              actions,
              "  const actorId = evaluation.actorId\n  let nextState = state\n",
              "  const actorId = evaluation.actorId\n"
              "  const burnBacklashApplies = shouldApplyCurrentBurnBacklash(state, actorId, action)\n"
              "  let nextState = state\n",
          )
          replace_once(
              actions,
              "  const completion = completeBattleIfResolved(nextState)\n",
              "  if (burnBacklashApplies) {\n"
              "    const backlash = applyCurrentBurnBacklash(nextState, actorId)\n"
              "    nextState = backlash.state\n"
              "    events.push(...backlash.events)\n"
              "  }\n\n"
              "  const completion = completeBattleIfResolved(nextState)\n",
          )

          stat = 'packages/game-core/src/combat/stat-driven-combat.ts'
          replace_once(
              stat,
              "import {\n  evaluateCombatAction,\n",
              "import {\n  applyCurrentBurnBacklash,\n  evaluateCombatAction,\n",
          )
          replace_once(
              stat,
              "  executeCombatAction,\n  validateCombatEncounterState,\n",
              "  executeCombatAction,\n  shouldApplyCurrentBurnBacklash,\n  validateCombatEncounterState,\n",
          )
          replace_once(
              stat,
              "  const draw = advanceBattleRng(state.tactical.battle.rng)\n",
              "  const burnBacklashApplies = shouldApplyCurrentBurnBacklash(\n"
              "    state,\n"
              "    forecast.evaluation.actorId,\n"
              "    action,\n"
              "  )\n"
              "  const draw = advanceBattleRng(state.tactical.battle.rng)\n",
          )
          replace_once(
              stat,
              "  const nextState: StatDrivenCombatEncounterState = {\n",
              "  let nextState: StatDrivenCombatEncounterState = {\n",
          )
          old_return = (
              "  assertValidStatDrivenCombatEncounterState(nextState)\n"
              "  return {\n"
              "    state: nextState,\n"
              "    events: [\n"
              "      resolutionEvent,\n"
              "      ...spent.events,\n"
              "      ...revealed.events,\n"
              "      {\n"
              "        event: 'combat_action_used',\n"
              "        actionId: action.id,\n"
              "        actorId: forecast.evaluation.actorId,\n"
              "      },\n"
              "    ],\n"
              "  }\n"
          )
          new_return = (
              "  const events: StatDrivenCombatResolutionEvent[] = [\n"
              "    resolutionEvent,\n"
              "    ...spent.events,\n"
              "    ...revealed.events,\n"
              "    {\n"
              "      event: 'combat_action_used',\n"
              "      actionId: action.id,\n"
              "      actorId: forecast.evaluation.actorId,\n"
              "    },\n"
              "  ]\n"
              "  if (burnBacklashApplies) {\n"
              "    const backlash = applyCurrentBurnBacklash(nextState, forecast.evaluation.actorId)\n"
              "    nextState = reattachStatDrivenCombatBridge(backlash.state, state.statBridge)\n"
              "    events.push(...backlash.events)\n"
              "  }\n"
              "  assertValidStatDrivenCombatEncounterState(nextState)\n"
              "  return { state: nextState, events }\n"
          )
          replace_once(stat, old_return, new_return)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed ticket files
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/combat-dots.ts \
            packages/game-core/src/combat/actions.ts \
            packages/game-core/src/combat/stat-driven-combat.ts \
            packages/game-core/src/combat/combat-burn-backlash.test.ts

      - name: Run focused Burn backlash contract
        run: pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-burn-backlash.test.ts

      - name: Run repository quality gates
        run: pnpm check

      - name: Verify ticket diff hygiene
        run: |
          git diff --check
          git status --short

      - name: Commit verified GREEN ticket
        run: |
          git add \
            packages/game-core/src/combat/combat-dots.ts \
            packages/game-core/src/combat/actions.ts \
            packages/game-core/src/combat/stat-driven-combat.ts \
            packages/game-core/src/combat/combat-burn-backlash.test.ts
          git diff --cached --check
          git commit -m 'feat: implement Burn damaging-command backlash'
          git fetch origin "$WORK_BRANCH"
          test "$(git rev-parse origin/$WORK_BRANCH)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          echo "Verified backlash commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
