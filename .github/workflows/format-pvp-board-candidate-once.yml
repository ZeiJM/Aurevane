name: One-shot PvP board candidate formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/fix-pvp-board-scale-collapse'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format candidate files
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/battle/ai-terrain-legend-pvp-parity.module.css
          apps/web/src/components/battle/pvp-battle-board-scale-authority.test.ts
      - name: Commit formatting to branch
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/components/battle/ai-terrain-legend-pvp-parity.module.css apps/web/src/components/battle/pvp-battle-board-scale-authority.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format PvP board release candidate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
