              display: grid !important;
              grid-template-columns: minmax(0, 1fr) !important;
              grid-template-rows: auto auto auto !important;
              height: auto !important;
              min-height: 0 !important;
              gap: 0.5rem !important;
              padding: 0 !important;
              overflow: visible !important;
            }

            .heading {
              grid-column: 1 !important;
              grid-row: 1 !important;
              padding: 0.45rem 0.25rem !important;
            }

            .heading > p {
              display: none;
            }

            .categoryGrid[data-hall-mode-rail='true'] {
              position: sticky;
              z-index: 20;
              top: 0;
              grid-column: 1 !important;
              grid-row: 2 !important;
              grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
              gap: 0.3rem !important;
              padding: 0.35rem !important;
              border-block: 1px solid var(--av-border-strong);
              background: rgba(5, 13, 21, 0.96);
              backdrop-filter: blur(0.8rem);
            }

            .categoryGrid[data-hall-mode-rail='true'] button {
              min-height: 3.5rem !important;
              padding: 0.4rem 0.25rem !important;
              border-radius: 0 !important;
              text-align: center !important;
            }

            .categoryGrid[data-hall-mode-rail='true'] button small {
              display: none !important;
            }

            .workspace[data-hall-active-workspace='true'] {
              grid-column: 1 !important;
              grid-row: 3 !important;
              min-height: 0 !important;
              margin: 0 !important;
              padding: 0.55rem !important;
              overflow: visible !important;
              border-radius: 0 !important;
            }

            .arenaVista,
            .spectateVista {
              min-height: 10rem !important;
              order: -1;
            }
          }
          ''',
          )

          # Passive Training: scene + planner split.
          replace_once(
              'apps/web/src/components/wayfarers-practice/offline-training-shell.tsx',
              '<Surface className={styles.hero} tone="elevated" data-av-surface="ink">',
              '<Surface\n          className={styles.hero}\n          tone="elevated"\n          data-av-surface="ink"\n          data-training-scene="true"\n        >',
          )
          replace_once(
              'apps/web/src/components/wayfarers-practice/offline-training-shell.tsx',
              '<div className={styles.practiceGrid} data-has-report={trainingReport ? true : undefined}>',
              '<div\n          className={styles.practiceGrid}\n          data-training-workspace="true"\n          data-has-report={trainingReport ? true : undefined}\n        >',
          )
          append_once(
              'apps/web/src/components/wayfarers-practice/offline-training-shell.module.css',
              'composition-v3 training split',
              r'''
