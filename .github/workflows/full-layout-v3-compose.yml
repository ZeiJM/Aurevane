name: Full layout v3 composer

on:
  push:
    branches:
      - agent/full-layout-composition-v3

permissions:
  contents: write

jobs:
  compose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-layout-composition-v3
      - name: Apply composition v3
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          def replace_all_required(path: str, old: str, new: str, minimum: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'expected at least {minimum} anchors in {path}, found {count}: {old[:100]}')
              p.write_text(text.replace(old, new))

          def append_once(path: str, marker: str, block: str) -> None:
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return
              p.write_text(text.rstrip() + '\n\n' + block.strip() + '\n')

          # Shared mobile primary dock.
          replace_once(
              'apps/web/src/components/shell/game-rail.tsx',
              '<aside className={styles.rail} data-av-game-rail data-av-surface="ink">',
              '<aside\n      className={styles.rail}\n      data-av-game-rail\n      data-av-primary-dock="true"\n      data-av-surface="ink"\n    >',
          )

          append_once(
              'apps/web/src/components/shell/authenticated-game-shell.module.css',
              'composition-v3 mobile primary dock',
              r'''
          /* composition-v3 mobile primary dock */
          @media (max-width: 760px) {
            .shell {
              grid-template-rows: auto auto minmax(0, 1fr) auto;
              padding-bottom: calc(4.25rem + env(safe-area-inset-bottom));
            }

            .rail {
              position: fixed;
              z-index: 1400;
              right: 0;
              bottom: 0;
              left: 0;
              grid-row: auto;
              width: 100%;
              min-height: calc(4rem + env(safe-area-inset-bottom));
              padding-bottom: env(safe-area-inset-bottom);
              overflow: visible;
              border-top: 1px solid var(--av-gold-rule);
              border-bottom: 0;
              background: rgba(5, 13, 21, 0.98);
              box-shadow: 0 -0.8rem 2rem rgba(0, 0, 0, 0.32);
              backdrop-filter: blur(1rem);
            }

            .railNavigation {
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .railLink {
              min-height: 4rem;
              border-top: 2px solid transparent;
              border-bottom: 0;
            }

            .railLink[aria-current='page'] {
              border-top-color: var(--av-teal-bright);
              border-bottom-color: transparent;
              background: linear-gradient(180deg, rgba(31, 111, 117, 0.4), rgba(5, 13, 21, 0.98));
            }

            .main {
              grid-row: 3;
              padding-bottom: 0.75rem;
            }

            .footer {
              grid-row: 4;
              margin-bottom: 0;
            }
          }
          ''',
          )

          # Character Profile: convert the existing three primary surfaces into a dossier composition.
          replace_once(
              'apps/web/src/components/character/character-profile-shell.tsx',
              '<Surface className={styles.characterCard} tone="quiet" data-av-surface="ink">',
              '<Surface\n          className={styles.characterCard}\n          tone="quiet"\n          data-av-surface="ink"\n          data-profile-identity-banner="true"\n        >',
          )
          replace_once(
              'apps/web/src/components/character/character-profile-shell.tsx',
              '<Surface className={styles.profile} tone="elevated" data-av-surface="moonstone">',
              '<Surface\n          className={styles.profile}\n          tone="elevated"\n          data-av-surface="moonstone"\n          data-profile-sheet="true"\n        >',
          )
          replace_once(
              'apps/web/src/components/character/character-profile-shell.tsx',
              '<aside className={styles.sidebar} aria-label="Combat loadout workspace">',
              '<aside\n          className={styles.sidebar}\n          data-profile-loadout="true"\n          aria-label="Combat loadout workspace"\n        >',
          )
          append_once(
              'apps/web/src/components/character/character-profile-shell.module.css',
              'composition-v3 profile dossier',
              r'''
          /* composition-v3 profile dossier */
          @media (min-width: 761px) {
            .layout[data-profile-workspace] {
              grid-template-columns: minmax(0, 1.6fr) minmax(19rem, 0.72fr) !important;
              grid-template-rows: auto minmax(0, 1fr) !important;
              height: 100% !important;
              min-height: 0 !important;
              gap: 0.7rem !important;
              align-items: stretch !important;
            }

            .characterCard[data-profile-identity-banner='true'] {
              display: grid !important;
              grid-column: 1 / -1 !important;
              grid-row: 1 !important;
              grid-template-columns: minmax(0, 1.55fr) minmax(15rem, 0.55fr) !important;
              min-height: 0 !important;
              padding: 0.55rem 0.7rem !important;
              border-radius: 0 !important;
            }

            .characterCard[data-profile-identity-banner='true'] .hero {
              display: grid !important;
              grid-template-columns: 6.6rem minmax(0, 1fr) !important;
              min-height: 0 !important;
              gap: 0.8rem !important;
              align-items: center !important;
            }

            .characterCard[data-profile-identity-banner='true'] .portrait {
              width: 6.6rem !important;
              height: 6.6rem !important;
              min-height: 0 !important;
              aspect-ratio: 1 !important;
              border: 1px solid var(--av-brass-500);
              border-radius: 0 !important;
            }

            .characterCard[data-profile-identity-banner='true'] .identity {
              align-self: center !important;
              padding: 0 !important;
            }

            .characterCard[data-profile-identity-banner='true'] .nameLine h1 {
              margin: 0 0 0.35rem !important;
              font-size: clamp(1.8rem, 3vw, 2.55rem) !important;
            }

            .characterCard[data-profile-identity-banner='true'] .characterSummary {
              align-self: stretch !important;
              align-content: center !important;
              margin: 0 !important;
              padding: 0.45rem 0.2rem 0.45rem 0.85rem !important;
              border-top: 0 !important;
              border-left: 1px solid var(--av-border-strong);
            }

            .profile[data-profile-sheet='true'] {
              grid-column: 1 !important;
              grid-row: 2 !important;
              height: 100% !important;
              min-height: 0 !important;
              overflow: auto !important;
              border-radius: 0 !important;
              scrollbar-width: thin;
            }

            .sidebar[data-profile-loadout='true'] {
              grid-column: 2 !important;
              grid-row: 2 !important;
              height: 100% !important;
              min-height: 0 !important;
              overflow: auto !important;
              scrollbar-width: thin;
            }
          }

          @media (max-width: 760px) {
            .layout[data-profile-workspace] {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) !important;
              grid-template-rows: auto auto auto !important;
              height: auto !important;
              gap: 0.55rem !important;
              padding: 0 !important;
            }

            .characterCard[data-profile-identity-banner='true'] {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) !important;
              min-height: 0 !important;
              padding: 0.55rem !important;
              border-radius: 0 !important;
            }

            .characterCard[data-profile-identity-banner='true'] .hero {
              display: grid !important;
              grid-template-columns: 5.4rem minmax(0, 1fr) !important;
              min-height: 0 !important;
              gap: 0.7rem !important;
              align-items: center !important;
            }

            .characterCard[data-profile-identity-banner='true'] .portrait {
              width: 5.4rem !important;
              height: 5.4rem !important;
              min-height: 0 !important;
              aspect-ratio: 1 !important;
              border: 1px solid var(--av-brass-500);
              border-radius: 0 !important;
            }

            .characterCard[data-profile-identity-banner='true'] .identity {
              padding: 0 !important;
            }

            .characterCard[data-profile-identity-banner='true'] .nameLine h1 {
              margin: 0 0 0.25rem !important;
              font-size: clamp(1.45rem, 7vw, 1.9rem) !important;
            }

            .characterCard[data-profile-identity-banner='true'] .characterSummary {
              margin-top: 0.45rem !important;
              padding-top: 0.5rem !important;
              border-top: 1px solid var(--av-border-strong) !important;
            }

            .profile[data-profile-sheet='true'],
            .sidebar[data-profile-loadout='true'] {
              grid-column: 1 !important;
              height: auto !important;
              min-height: 0 !important;
              overflow: visible !important;
              border-radius: 0 !important;
            }
          }
          ''',
          )

          # Battle Hall: actual left mode rail on desktop, compact mode strip on mobile.
          replace_once(
              'apps/web/src/components/battle/battle-launch.tsx',
