name: Branch Primary Core Format

on:
  push:
    branches:
      - agent/profile-testing-polish-v2
    paths:
      - .github/workflows/branch-primary-core-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/profile-testing-polish-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format branch-owned files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/api/character/attributes/route.ts \
            apps/web/src/app/api/character/build/disciplines/route.ts \
            apps/web/src/components/character/character-attribute-allocation-panel.module.css \
            apps/web/src/components/character/character-attribute-allocation-panel.tsx \
            apps/web/src/components/character/character-creation-experience.tsx \
            apps/web/src/server/character/supabase-character-build-repository-v3.ts \
            packages/game-core/src/character/attribute-allocation.test.ts \
            packages/game-core/src/character/attribute-allocation.ts \
            packages/game-core/src/character/creation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- \
            apps/web/src/app/api/character/attributes/route.ts \
            apps/web/src/app/api/character/build/disciplines/route.ts \
            apps/web/src/components/character/character-attribute-allocation-panel.module.css \
            apps/web/src/components/character/character-attribute-allocation-panel.tsx \
            apps/web/src/components/character/character-creation-experience.tsx \
            apps/web/src/server/character/supabase-character-build-repository-v3.ts \
            packages/game-core/src/character/attribute-allocation.test.ts \
            packages/game-core/src/character/attribute-allocation.ts \
            packages/game-core/src/character/creation.test.ts; then
            echo "No branch-owned formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/src/app/api/character/attributes/route.ts \
            apps/web/src/app/api/character/build/disciplines/route.ts \
            apps/web/src/components/character/character-attribute-allocation-panel.module.css \
            apps/web/src/components/character/character-attribute-allocation-panel.tsx \
            apps/web/src/components/character/character-creation-experience.tsx \
            apps/web/src/server/character/supabase-character-build-repository-v3.ts \
            packages/game-core/src/character/attribute-allocation.test.ts \
            packages/game-core/src/character/attribute-allocation.ts \
            packages/game-core/src/character/creation.test.ts
          git commit -m "Format Primary Core profile branch files"
          git push origin HEAD:agent/profile-testing-polish-v2
