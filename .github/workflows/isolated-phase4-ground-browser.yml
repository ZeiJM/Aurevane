name: Isolated Phase 4 ground browser gate

on:
  push:
    branches:
      - agent/phase4-rebalance-browser-helper-20260918

permissions:
  contents: read

jobs:
  ground:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @aurevane/web exec playwright install --with-deps chromium
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Build, activate and run ground targeting
        shell: bash
        run: |
          set -euo pipefail
          status_env="$(pnpm exec supabase status -o env)"
          eval "$(printf '%s\n' "$status_env" | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          server_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          api_url='http://127.0.0.1:54321'
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web build
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
            set role service_role;
            select public.activate_phase4_combat_interactions_v2();
            select public.activate_phase4_discipline_rebalance_v1();
          "
          AUREVANE_ENV=local \
          NEXT_PUBLIC_AUREVANE_ENV=local \
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$server_key" \
          pnpm --filter @aurevane/web exec playwright test e2e/phase4-ground-targeting.pw.ts \
            --project=desktop-chromium --project=mobile-chromium
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
