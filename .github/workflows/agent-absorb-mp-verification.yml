name: Absorb MP isolated verification

on:
  push:
    branches:
      - agent/absorb-mp-verification-20260915

permissions:
  contents: read

jobs:
  compatibility-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a681375b4f3fdd5b1a1de2913e25a220c1831383
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable repository package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Compare the shared implementation with the previous verified HP helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a681375b4f3fdd5b1a1de2913e25a220c1831383
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('packages/game-core/src/combat')
          test = root / 'combat-absorb-mp.test.ts'
          original = test.read_bytes()
          baseline = root / 'combat-absorb-hp-compat-probe.ts'
          assert not baseline.exists()
          baseline.write_bytes(subprocess.check_output([
              'git', 'show', 'HEAD^:packages/game-core/src/combat/combat-absorb-hp.ts'
          ]))
          additions = '''
          import * as compatibilityLegacy from './actions-legacy'
          import { applyCommittedAbsorbHp as previousAbsorbHp } from './combat-absorb-hp-compat-probe'
          import { applyCommittedAbsorbRecovery as currentAbsorb } from './combat-absorb-recovery'

          it('diagnostic: 315 HP compatibility and independent MP cap scenarios', () => {
            let scenarios = 0
            for (const rate of [1, 1_000, 2_500, 6_000, 10_000]) {
              for (const damage of [0, 1, 2, 7, 20, 99, 100]) {
                for (const hp of [1, 37, 100]) {
                  for (const stacks of [1, 2, 3]) {
                    const hpStatus = { ...HP25, maximumStacks: 3, absorbHpBasisPoints: rate }
                    const mpStatus = absorbMpStatus(rate)
                    const statuses = [hpStatus, mpStatus]
                    const initial = encounter({ hp, mp: scenarios % 101, stacks, statuses })
                    const before = JSON.stringify(initial)
                    const action = hit(damage)
                    const committed = compatibilityLegacy.executeCombatAction(
                      initial, action, { kind: 'unit', combatantId: 'target' }, { statuses },
                    )
                    const command = { sourceCombatantId: 'actor', actionId: action.id }
                    const previous = previousAbsorbHp(committed.state, committed.events, { statuses }, command)
                    const current = currentAbsorb(committed.state, committed.events, { statuses }, command)
                    expect(unit(current).hp).toBe(unit(previous).hp)
                    expect(current.events.filter((event) => event.event !== 'resource_changed')).toEqual(previous.events)
                    const actualDamage = Math.min(hp, damage)
                    const expectedMpGain = hp > damage && actualDamage > 0
                      ? Math.min(100 - unit(committed).mp, Math.max(1, Math.floor(actualDamage * Math.min(10_000, rate * stacks) / 10_000)))
                      : 0
                    expect(unit(current).mp).toBe(unit(committed).mp + expectedMpGain)
                    expect(JSON.stringify(initial)).toBe(before)
                    expect(currentAbsorb(committed.state, committed.events, { statuses }, command)).toEqual(current)
                    scenarios += 1
                  }
                }
              }
            }
            expect(scenarios).toBe(315)
          })

          it('diagnostic: command identity excludes unrelated or reactive damage-shaped events', () => {
            const statuses = [HP25, MP25]
            const initial = encounter({ statuses })
            const action = hit()
            const committed = compatibilityLegacy.executeCombatAction(
              initial, action, { kind: 'unit', combatantId: 'target' }, { statuses },
            )
            const direct = committed.events.find((event) => event.event === 'damage_applied')
            if (!direct || direct.event !== 'damage_applied') throw new Error('Missing committed fixture damage')
            const excluded = [
              { ...direct, actionId: 'test.reflect-output' },
              { ...direct, actionId: 'test.system-output' },
              { ...direct, sourceCombatantId: 'missing-source' },
              { ...direct, targetCombatantId: 'missing-target' },
              { ...direct, targetCombatantId: 'actor' },
              { ...direct, amount: 0 },
            ]
            const command = { sourceCombatantId: 'actor', actionId: action.id }
            const result = currentAbsorb(committed.state, [...committed.events, ...excluded], { statuses }, command)
            expect(unit(result)).toMatchObject({ hp: 85, mp: 15 })
            expect(result.events.slice(committed.events.length + excluded.length)).toEqual([
              expect.objectContaining({ event: 'healing_applied', amount: 5 }),
              expect.objectContaining({ event: 'resource_changed', delta: 5 }),
            ])
            const reactionEvents = result.events.filter((event) =>
              event.event === 'healing_applied' || event.event === 'resource_changed')
            const noRecursion = currentAbsorb(result.state, reactionEvents, { statuses }, command)
            expect(noRecursion.state).toBe(result.state)
            expect(noRecursion.events).toBe(reactionEvents)
          })
          '''
          try:
              test.write_bytes(original + additions.encode())
              subprocess.run(['pnpm', '--filter', '@aurevane/game-core', 'exec', 'vitest', 'run',
                              'src/combat/combat-absorb-mp.test.ts'], check=True)
          finally:
              test.write_bytes(original)
              baseline.unlink()
          PY
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify the unchanged exact source tree
        run: |
          test "$(git rev-parse HEAD)" = a681375b4f3fdd5b1a1de2913e25a220c1831383
          test "$(git rev-parse HEAD^{tree})" = 3a2d0e476eec5048ee6626be8e07212ae9f7ffe9
          pnpm --filter @aurevane/game-core typecheck
          git diff --exit-code
