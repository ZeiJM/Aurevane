name: Creation subject format diagnostic

on:
  push:
    branches:
      - agent/creation-discipline-subject-reconciliation

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier apps/web/e2e/creation-subject-layout-regression.pw.ts > /tmp/formatted.ts
          diff -u apps/web/e2e/creation-subject-layout-regression.pw.ts /tmp/formatted.ts
