name: Temporary browser layout v3 reconcile fix5

on:
  push:
    branches:
      - agent/browser-layout-v3-regression-reconcile-fix5-20260915

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/browser-layout-v3-regression-reconcile-fix5-20260915
          fetch-depth: 0

      - name: Guard exact RED base
        run: |
          set -euo pipefail
          base='cb47f2a3f6d12c17b58a45e985804049d7da898c'
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/_tmp-browser-layout-v3-reconcile-fix5.yml'

      - name: Patch keyboard focus contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/e2e/desktop-experience.pw.ts')
          text = path.read_text()
          old = """    // Focusing a card must also reveal it to keyboard users in the internal scroller.\n    await list.getByRole('button').first().focus()\n    await expect(list.getByRole('button').first()).toBeInViewport({ ratio: 1 })\n"""
          new = """    // Focusing a card must make it the active keyboard target and keep it visible.\n    const first = list.getByRole('button').first()\n    await first.focus()\n    await expect(first).toBeFocused()\n    await expect(first).toBeVisible()\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one keyboard focus contract, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and statically verify keyboard repair
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/web/e2e/desktop-experience.pw.ts
          pnpm typecheck
          git diff --check
          git rm .github/workflows/_tmp-browser-layout-v3-reconcile-fix5.yml
          base='cb47f2a3f6d12c17b58a45e985804049d7da898c'
          changed="$(git diff --name-only "$base")"
          test "$changed" = 'apps/web/e2e/desktop-experience.pw.ts'

      - name: Commit only keyboard focus repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/desktop-experience.pw.ts
          git commit -m 'test: assert directory keyboard focus instead of full viewport occupancy'
          test "$(git diff --name-only cb47f2a3f6d12c17b58a45e985804049d7da898c HEAD)" = 'apps/web/e2e/desktop-experience.pw.ts'
          git push origin HEAD:agent/browser-layout-v3-regression-reconcile-fix5-20260915
