name: P2.6 cockpit integration

on:
  push:
    branches:
      - agent/p2-6-recruit-ai-tactical-hall

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-6-recruit-ai-tactical-hall
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Wire authoritative Recruit turn into cockpit and browser journey
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode(''))"
          pnpm exec prettier --write apps/web/src/components/battle/battle-experience.tsx apps/web/e2e/battle-experience.pw.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/battle/battle-experience.tsx apps/web/e2e/battle-experience.pw.ts
          if git diff --cached --quiet; then
            echo "P2.6 cockpit integration already applied."
            exit 0
          fi
          git commit -m "P2.6 auto-resolve authoritative Recruit turns in cockpit"
          git push origin HEAD:agent/p2-6-recruit-ai-tactical-hall
