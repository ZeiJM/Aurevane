name: Copy provenance workbench

on:
  push:
    branches:
      - review/copy-provenance-workbench-20260916

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bafd424a49e3494942ffa40b767f6dbf03130bb7
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Locked exact-candidate setup
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = bafd424a49e3494942ffa40b767f6dbf03130bb7
          test "$(git rev-parse HEAD^{tree})" = 8bc41d2922d89eb76a38cba6381746f95f0d6e8b
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Copied identities survive snapshot validation in every supported persistent family
        shell: bash
        run: |
          set -euo pipefail
          file=packages/game-core/src/combat/combat-effect-provenance-state.test.ts
          trap 'git restore --source=HEAD -- "$file"' EXIT
          cat >> "$file" <<'TEST'

          import { createCombatActionProvenance, createCombatEffectInstanceProvenance } from './combat-kernel-types'

          type CopyReviewFamily = PersistentFamily | 'barrier'
          const copyReviewFamilies: CopyReviewFamily[] = ['status', 'recovery', 'poison', 'bleed', 'burn', 'barrier']
          function numberedCopySnapshot(family: CopyReviewFamily, mismatch = false): CombatEncounterState {
            const state = historicalPersistentState()
            const actionIds = { status: 'test.k3.status', recovery: 'test.k3.recovery', poison: 'test.k3.poison',
              bleed: 'test.k3.bleed', burn: 'test.k3.burn', barrier: 'test.k3.barrier' }
            const action = createCombatActionProvenance({
              rulesetVersion: state.tactical.battle.rulesVersion, sourceKind: 'discipline-skill',
              actionDefinitionId: actionIds[family], actionVersion: 1,
              sourceCombatantId: 'actor', controllerCombatantId: 'actor', triggerChainId: 'chain:copy-snapshot-review',
            })
            const good = createCombatEffectInstanceProvenance({ action, targetCombatantId: 'target',
              effectOrdinal: 0, copyOrdinal: copyReviewFamilies.indexOf(family),
              createdRound: state.tactical.battle.round, createdTurn: state.tactical.battle.turnNumber,
              copiedFromInstanceId: 'effect:known-immediate-donor',
            })
            const provenance = mismatch ? { ...good, copyOrdinal: 99 } : good
            if (family === 'status') return { ...state, statusState: state.statusState.map((row) =>
              row.combatantId === 'target' ? { ...row, statuses: row.statuses.map((entry) => ({ ...entry, provenance })) } : row) }
            const effects = normalizeCombatEffectState(state.effectState)
            if (family === 'recovery') return { ...state, effectState: { ...effects,
              ongoingRecovery: effects.ongoingRecovery.map((entry) => ({ ...entry, provenance })) } }
            if (family === 'poison') return { ...state, effectState: { ...effects,
              poison: effects.poison.map((entry) => ({ ...entry, provenance })) } }
            if (family === 'bleed') return { ...state, effectState: { ...effects,
              bleed: effects.bleed.map((entry) => ({ ...entry, provenance })) } }
            if (family === 'burn') return { ...state, effectState: { ...effects,
              burn: effects.burn.map((entry) => ({ ...entry, provenance })) } }
            return { ...state, effectState: { ...effects, barriers: [{
              sourceCombatantId: 'actor', targetCombatantId: 'target', sourceActionId: actionIds.barrier,
              amount: 3, provenance,
            }] } }
          }

          describe('Review-only copied provenance snapshot integration', () => {
            it.each(copyReviewFamilies)('accepts numbered %s provenance without modifying its state', (family) => {
              const state = numberedCopySnapshot(family)
              const before = JSON.stringify(state)
              expect(validateCombatEncounterState(state)).toEqual([])
              expect(JSON.stringify(state)).toBe(before)
            })
            it.each(copyReviewFamilies)('preserves numbered %s provenance after saved JSON reload', (family) => {
              const state = numberedCopySnapshot(family)
              const restored = JSON.parse(JSON.stringify(state)) as CombatEncounterState
              expect(validateCombatEncounterState(restored)).toEqual([])
              expect(restored).toEqual(state)
              expect(JSON.stringify(restored)).toContain('copyOrdinal')
              expect(JSON.stringify(restored)).toContain('effect-copy:')
            })
            it.each(copyReviewFamilies)('rejects changed copy identity in persisted %s provenance', (family) => {
              expect(validateCombatEncounterState(numberedCopySnapshot(family, true))).toEqual(
                expect.arrayContaining([expect.objectContaining({ field: expect.stringMatching(/provenance/i) })]))
            })
          })
          TEST
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-copy-provenance.test.ts src/combat/combat-kernel-types.test.ts src/combat/combat-effect-provenance.test.ts src/combat/combat-effect-provenance-state.test.ts src/combat/combat-persistent-provenance-threading.test.ts src/combat/combat-persistent-provenance-bleed-replacement.test.ts src/combat/combat-resolution-provenance.test.ts src/combat/combat-reflect.test.ts src/combat/combat-mark-blind.contract.test.ts src/combat/combat-barrier.test.ts
          git restore --source=HEAD -- "$file"
          trap - EXIT
      - name: Verify historical source isolation and unchanged permanent RED contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code ab8ea1586c9da14baca2244195557600d4d70219 HEAD -- packages/game-core/src/combat/combat-copy-provenance.test.ts
          git diff --exit-code 0eecf1f5f776b8b3b9151f503ff7396b8715ec07 HEAD -- apps .github package.json pnpm-lock.yaml packages/game-core/src/combat/actions.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/status-content.ts packages/game-core/src/combat/phase4-roster.ts
          test "$(git diff --name-only 0eecf1f5f776b8b3b9151f503ff7396b8715ec07 HEAD | wc -l)" = 3
          git diff --check 0eecf1f5f776b8b3b9151f503ff7396b8715ec07 HEAD
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'REVIEWED_SOURCE=bafd424a49e3494942ffa40b767f6dbf03130bb7'
