name: Hall continuation source

on:
  push:
    branches: [agent/battle-hall-concept-ui]
    paths: [.github/workflows/hall-continuation-source.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: |
          mkdir -p /tmp/hall-source
          git rev-parse HEAD > /tmp/hall-source/commit.txt
          git archive --format=tar.gz HEAD > /tmp/hall-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hall-continuation-source
          path: /tmp/hall-source
          retention-days: 1
