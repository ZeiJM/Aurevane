name: Validate battle log sequence

on:
  push:
    branches:
      - agent/fix-battle-log-sequence

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        run: |
          pnpm exec prettier --check \
            apps/web/src/components/battle/battle-log-feed.tsx \
            apps/web/src/components/battle/battle-log-feed.test.tsx
      - name: Lint changed files
        working-directory: apps/web
        run: |
          pnpm exec eslint \
            src/components/battle/battle-log-feed.tsx \
            src/components/battle/battle-log-feed.test.tsx \
            --max-warnings=0
      - name: Run sequence regression test
        run: pnpm --filter @aurevane/web exec vitest run src/components/battle/battle-log-feed.test.tsx
      - name: Typecheck web app
        run: pnpm --filter @aurevane/web typecheck
