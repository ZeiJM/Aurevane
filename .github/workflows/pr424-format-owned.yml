name: PR424 owned-file formatter

on:
  push:
    branches:
      - agent/profile-testing-polish-v2

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ZeiJM/Aurevane' && github.ref == 'refs/heads/agent/profile-testing-polish-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/profile-testing-polish-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only PR-owned files
        run: |
          pnpm exec prettier --write \
            apps/web/e2e/battle-move-preview-polish.pw.ts \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/e2e/character-secondary-build.pw.ts \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/character/character-discipline-build-panel.module.css \
            apps/web/src/components/character/foundation-discipline-sigil.tsx \
            apps/web/src/media/disciplines.ts \
            apps/web/src/media/disciplines.test.ts \
            apps/web/src/media/registry.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'PR-owned files are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/e2e/battle-move-preview-polish.pw.ts \
            apps/web/e2e/character-primary-build.pw.ts \
            apps/web/e2e/character-secondary-build.pw.ts \
            apps/web/src/components/battle/battle-experience.tsx \
            apps/web/src/components/character/character-discipline-build-panel.module.css \
            apps/web/src/components/character/foundation-discipline-sigil.tsx \
            apps/web/src/media/disciplines.ts \
            apps/web/src/media/disciplines.test.ts \
            apps/web/src/media/registry.ts
          git commit -m 'Format PR-owned profile and battle files'
          git push origin HEAD:agent/profile-testing-polish-v2
