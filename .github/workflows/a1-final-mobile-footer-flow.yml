name: A1 final mobile footer flow fix

on:
  push:
    branches:
      - agent/a1-feedback-holistic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/a1-feedback-holistic

      - name: Keep the mobile battle footer in normal document flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/battle/battle-experience-v2.module.css')
          text = path.read_text()
          old = """  .battleFooter {\n    position: sticky;\n    bottom: 0;\n  }\n"""
          new = """  .battleFooter {\n    position: relative;\n    bottom: auto;\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected one mobile sticky battle footer block')
          path.write_text(text.replace(old, new))
          PY

          git rm .github/workflows/a1-final-mobile-footer-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep mobile battle footer below command deck"
          git push origin HEAD:agent/a1-feedback-holistic
