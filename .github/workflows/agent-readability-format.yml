name: Agent readability format

on:
  push:
    branches:
      - agent/desktop-readability

permissions:
  contents: read

jobs:
  format:
    name: Format readability files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/desktop-readability.css \
            apps/web/e2e/a1-layout-fit.pw.ts \
            apps/web/src/app/layout.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: readability-formatted
          path: |
            apps/web/src/app/desktop-readability.css
            apps/web/e2e/a1-layout-fit.pw.ts
            apps/web/src/app/layout.tsx
