name: CSR4 Prettier Diagnostic

on:
  push:
    branches:
      - agent/csr4-presentation-acceptance-20260917

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        run: |
          pnpm exec prettier apps/web/src/components/battle/battle-action-preview.test.tsx --write
          echo '===CSR4_FORMATTED_FILE_BEGIN==='
          cat apps/web/src/components/battle/battle-action-preview.test.tsx
          echo '===CSR4_FORMATTED_FILE_END==='
