name: Poison copy exact-candidate review
on:
  push:
    branches: [review/poison-copy-reconciled-green-20260916]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d7ec7968c0f7ad67aa614e3dc34d763ee4cf774
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve review assertions and omit the unsupported diagnostic logger
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          text = Path('.github/workflows/poison-copy-reconciled-green.yml').read_text()
          steps = text.split('        run: |\n')[1:]
          assert len(steps) == 4
          for index, block in enumerate(steps):
              script = dedent(block.split('\n      - name:')[0])
              if index == 1:
                  lines = script.splitlines()
                  diagnostic = [line for line in lines if "console.log('OPTIONAL_PROPERTY_OBSERVATION'" in line]
                  assert len(diagnostic) == 1
                  script = '\n'.join(line for line in lines if line not in diagnostic) + '\n'
              Path(f'/tmp/poison-candidate-review-{index}.sh').write_text(script)
          PY
          git fetch --depth=5 origin ed25b6d42bfc15943fde16e217e4d152c350833f
          git checkout --detach ed25b6d42bfc15943fde16e217e4d152c350833f
          bash /tmp/poison-candidate-review-0.sh
      - name: Actual-candidate typecheck and additional behavioral review
        run: bash /tmp/poison-candidate-review-1.sh
      - name: Complete historical baseline-versus-candidate comparisons
        run: bash /tmp/poison-candidate-review-2.sh
      - name: Verify source identity, scope and clean tracked/untracked tree
        run: bash /tmp/poison-candidate-review-3.sh
