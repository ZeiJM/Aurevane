name: Temporary K4 truth-sync patch

on:
  push:
    branches:
      - agent/combat-k4-truth-sync-20260916

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@v4
        with:
          ref: agent/combat-k4-truth-sync-20260916
          fetch-depth: 0

      - name: Apply approved truth sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tasks_path = Path('TASKS.md')
          tasks = tasks_path.read_text()
          old = '- [ ] New DoTs, Copy, reactions, generalized accuracy, Amplify/Curse, Covert/Sensory/Revealed and Master Panel authoring.'
          new = '''- [x] New Poison/Bleed/Burn runtime identities plus the landed K4 Absorb HP/MP, Reflect, Vengeance and generalized Skill-accuracy kernel slices are implemented and verified at their current engine boundaries.
          - [x] Staged Amplify/Curse integration now covers authoritative status-copy legality/commit/provenance, Recruit AI forecast utility and player-facing clone forecasts; no clone Skill is published.
          - [ ] Implement the separate `Copy` mechanic that grants a random eligible regular battle Skill for the remainder of battle at half AP cost, including encounter state/RNG, UI, AI and persistence integration.
          - [ ] Implement Covert/Sensory/Revealed at their approved authority and presentation boundaries.
          - [ ] Ship the real protected Master Panel Combat Content editor with typed validation, diff/preview and immutable publication; do not substitute hard-coded source edits or speculative UI.
          - [ ] Resolve the Owner rule for consecutive-use Amplify/Curse clone transfer. Until then keep `effects.status-copy-staged` and do not publish clone Skills.'''
          if tasks.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale K4 task line, found {tasks.count(old)}')
          tasks_path.write_text(tasks.replace(old, new))

          combat_path = Path('docs/COMBAT.md')
          combat = combat_path.read_text()
          heading = '## P4.K4 player-facing Amplify/Curse forecast boundary — 2026-09-16'
          if heading in combat:
              raise SystemExit('K4 forecast boundary already exists')
          anchor = '# AUREVANE Combat Design Bible\n\n'
          if not combat.startswith(anchor):
              raise SystemExit('Unexpected COMBAT.md heading')
          section = '''## P4.K4 player-facing Amplify/Curse forecast boundary — 2026-09-16

          The shared battle forecast now presents the authoritative `copy-statuses` projections already produced by the staged Amplify/Curse kernel. Ordinary status rows are humanized from their pinned before/after state, Poison shows its current movement-counter state, Burn shows its current stage transition and Bleed projections remain in the authoritative stable order. These clone projections stay alongside any later authored damage, healing or resource projections in a composed command.

          A composed command whose clone block explicitly permits an empty eligible donor produces no clone forecast for that block while retaining independently meaningful later outcomes. Malformed or unsupported copy projection strings fail closed instead of exposing machine projection text. Existing blocked-target and hit-chance behavior is preserved; the presentation does not mutate preview state, consume RNG or replace server legality/commit authority.

          Amplify/Curse status cloning is distinct from the separate `Copy` effect approved in the Combat Authoring/DoT/Copy revision. `Copy` grants a random eligible regular battle Skill for the rest of the encounter at half AP cost and requires its own encounter-state, RNG, command-picker, AI and persistence work. The status-clone forecast slice does not implement or publish that mechanic.

          Mature Skill publication still rejects `copy-statuses` through `effects.status-copy-staged`. Consecutive-use falloff for clone transfer remains an unresolved Owner rule, so no quantitative/discrete half-clone behavior is invented and no Amplify/Curse Skill is published or deployed by this boundary.

          '''
          combat_path.write_text(combat.replace(anchor, anchor + section, 1))
          PY

          rm .github/workflows/temp-k4-truth-sync-patch.yml

          git config user.name "Aurevane Automation"
          git config user.email "actions@users.noreply.github.com"
          git add TASKS.md docs/COMBAT.md .github/workflows/temp-k4-truth-sync-patch.yml
          git diff --cached --check
          git commit -m "docs: synchronize K4 combat truth"
          git push origin HEAD:agent/combat-k4-truth-sync-20260916
