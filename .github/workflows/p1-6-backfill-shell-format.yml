name: P1.6 backfill shell format

on:
  push:
    branches:
      - agent/p1-6-wayfarers-practice-backfill

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-6-wayfarers-practice-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Wire shell and format changed files
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode(''))"
          pnpm exec prettier --write \
            packages/game-core/src/character/wayfarers-practice.ts \
            packages/game-core/src/character/wayfarers-practice.test.ts \
            packages/db/src/wayfarers-practice.ts \
            packages/validation/src/player/wayfarers-practice.ts \
            apps/web/src/server/wayfarers-practice/*.ts \
            apps/web/src/app/api/wayfarers-practice/plan/route.ts \
            apps/web/src/app/game/page.tsx \
            apps/web/src/components/shell/authenticated-game-shell.tsx \
            apps/web/src/components/wayfarers-practice/*.tsx \
            apps/web/src/components/wayfarers-practice/*.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/game-core/src/character/wayfarers-practice.ts \
            packages/game-core/src/character/wayfarers-practice.test.ts \
            packages/db/src/wayfarers-practice.ts \
            packages/validation/src/player/wayfarers-practice.ts \
            apps/web/src/server/wayfarers-practice \
            apps/web/src/app/api/wayfarers-practice/plan/route.ts \
            apps/web/src/app/game/page.tsx \
            apps/web/src/components/shell/authenticated-game-shell.tsx \
            apps/web/src/components/wayfarers-practice
          if git diff --cached --quiet; then
            echo "No formatting or shell changes."
            exit 0
          fi
          git commit -m "P1.6 wire Practice planner into game entry"
          git push origin HEAD:agent/p1-6-wayfarers-practice-backfill
