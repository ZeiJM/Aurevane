name: A1 temporary battle completion

on:
  push:
    branches:
      - agent/a1-feedback-holistic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/a1-feedback-holistic

      - name: Complete AP language, quick commit and browser proof
        run: |
          python - <<'PY'
          from pathlib import Path

          battle = Path('apps/web/src/components/battle/battle-experience-v2.tsx')
          text = battle.read_text()

          replacements = {
            "`Movement committed. ${remainingEconomy}% Action Economy remains.`": "`Movement committed. ${remainingEconomy} AP remains.`",
            "`Basic Attack dealt ${damage} damage. ${remainingEconomy}% Action Economy remains.`": "`Basic Attack dealt ${damage} damage. ${remainingEconomy} AP remains.`",
            "`Basic Attack resolved without damage. ${remainingEconomy}% Action Economy remains.`": "`Basic Attack resolved without damage. ${remainingEconomy} AP remains.`",
            "`Guarded for 2 turns at -15% incoming damage. ${remainingEconomy}% Action Economy remains.`": "`Guarded for 2 turns at -15% incoming damage. ${remainingEconomy} AP remains.`",
            "`Recovered ${healed} HP. ${remainingEconomy}% Action Economy remains.`": "`Recovered ${healed} HP. ${remainingEconomy} AP remains.`",
            "`${selectedTerrainCost * MOVE_COST_PER_TERRAIN_POINT}% Action Economy`": "`${selectedTerrainCost * MOVE_COST_PER_TERRAIN_POINT} AP`",
            "Cost {preview.preview.actionEconomyCost}% · leaves{' '}\n              {preview.preview.actionEconomyAfter}% Action Economy · terrain weight{' '}": "Cost {preview.preview.actionEconomyCost} AP · leaves{' '}\n              {preview.preview.actionEconomyAfter} AP · terrain weight{' '}",
            "30% cost · {percentFromBasisPoints(preview.preview.hitChanceBasisPoints)} hit chance ·{' '}": "30 AP cost · {percentFromBasisPoints(preview.preview.hitChanceBasisPoints)} hit chance ·{' '}",
            "<strong>Basic Attack · 30%</strong>": "<strong>Basic Attack · 30 AP</strong>",
            "<strong>Guard · 30%</strong>": "<strong>Guard · 30 AP</strong>",
            "<strong>Recover · 50%</strong>": "<strong>Recover · 50 AP</strong>",
            "{playerEconomy}%": "{playerEconomy} AP",
            "<small> − {proposedEconomyCost}% proposed</small>": "<small> − {proposedEconomyCost} AP proposed</small>",
            "cost=\"30%\"": "cost=\"30 AP\"",
            "cost=\"50%\"": "cost=\"50 AP\"",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing battle replacement: {old!r}')
              text = text.replace(old, new)

          old_touch = """  function handleTouchCommit(position: GridPosition, at: number) {\n    const key = positionKey(position)\n    if (lastTouch.current?.key === key && at - lastTouch.current.at <= 360) {\n      lastTouch.current = null\n      requestQuickCommit()\n      return\n    }\n    lastTouch.current = { key, at }\n  }\n"""
          new_touch = """  function handleTouchQuickCommit(key: string, at: number) {\n    if (lastTouch.current?.key === key && at - lastTouch.current.at <= 360) {\n      lastTouch.current = null\n      requestQuickCommit()\n      return\n    }\n    lastTouch.current = { key, at }\n  }\n"""
          if text.count(old_touch) != 1:
              raise SystemExit('touch helper mismatch')
          text = text.replace(old_touch, new_touch)

          old_board = """                        if (event.pointerType === 'touch')\n                          handleTouchCommit(tile.position, event.timeStamp)\n"""
          new_board = """                        if (event.pointerType === 'touch')\n                          handleTouchQuickCommit(`tile:${positionKey(tile.position)}`, event.timeStamp)\n"""
          if text.count(old_board) != 1:
              raise SystemExit('board touch call mismatch')
          text = text.replace(old_board, new_board)

          old_guard = """              <CommandButton\n                number=\"03\"\n                label=\"Guard\"\n                cost=\"30 AP\"\n                active={mode === 'guard'}\n                disabled={planningDisabled || playerEconomy < GUARD_COST}\n                onClick={() => chooseMode('guard')}\n              />\n"""
          new_guard = """              <CommandButton\n                number=\"03\"\n                label=\"Guard\"\n                cost=\"30 AP\"\n                active={mode === 'guard'}\n                disabled={planningDisabled || playerEconomy < GUARD_COST}\n                onClick={() => chooseMode('guard')}\n                onDoubleClick={requestQuickCommit}\n                onPointerUp={(event) => {\n                  if (event.pointerType === 'touch')\n                    handleTouchQuickCommit('command:guard', event.timeStamp)\n                }}\n              />\n"""
          if text.count(old_guard) != 1:
              raise SystemExit('guard command mismatch')
          text = text.replace(old_guard, new_guard)

          old_recover = """              <CommandButton\n                number=\"04\"\n                label=\"Recover\"\n                cost=\"50 AP\"\n                active={mode === 'recover'}\n                disabled={\n                  planningDisabled ||\n                  playerEconomy < RECOVER_COST ||\n                  !playerCombatant ||\n                  playerCombatant.hp >= playerCombatant.maxHp\n                }\n                onClick={() => chooseMode('recover')}\n              />\n"""
          new_recover = """              <CommandButton\n                number=\"04\"\n                label=\"Recover\"\n                cost=\"50 AP\"\n                active={mode === 'recover'}\n                disabled={\n                  planningDisabled ||\n                  playerEconomy < RECOVER_COST ||\n                  !playerCombatant ||\n                  playerCombatant.hp >= playerCombatant.maxHp\n                }\n                onClick={() => chooseMode('recover')}\n                onDoubleClick={requestQuickCommit}\n                onPointerUp={(event) => {\n                  if (event.pointerType === 'touch')\n                    handleTouchQuickCommit('command:recover', event.timeStamp)\n                }}\n              />\n"""
          if text.count(old_recover) != 1:
              raise SystemExit('recover command mismatch')
          text = text.replace(old_recover, new_recover)

          old_signature = """function CommandButton({\n  number,\n  label,\n  cost,\n  active,\n  disabled,\n  onClick,\n}: {\n  number: string\n  label: string\n  cost: string\n  active: boolean\n  disabled: boolean\n  onClick: () => void\n}) {\n"""
          new_signature = """function CommandButton({\n  number,\n  label,\n  cost,\n  active,\n  disabled,\n  onClick,\n  onDoubleClick,\n  onPointerUp,\n}: {\n  number: string\n  label: string\n  cost: string\n  active: boolean\n  disabled: boolean\n  onClick: () => void\n  onDoubleClick?: () => void\n  onPointerUp?: (event: React.PointerEvent<HTMLButtonElement>) => void\n}) {\n"""
          if text.count(old_signature) != 1:
              raise SystemExit('CommandButton signature mismatch')
          text = text.replace(old_signature, new_signature)

          old_button = """      disabled={disabled}\n      onClick={onClick}\n    >\n"""
          new_button = """      disabled={disabled}\n      onClick={onClick}\n      onDoubleClick={onDoubleClick}\n      onPointerUp={onPointerUp}\n    >\n"""
          if text.count(old_button) != 1:
              raise SystemExit('CommandButton button mismatch')
          text = text.replace(old_button, new_button)

          battle.write_text(text)

          test = Path('apps/web/e2e/battle-experience.pw.ts')
          t = test.read_text()
          t = t.replace("  const attackButton = commandDeck.getByRole('button', { name: /Basic Attack/ })\n", "  const attackButton = commandDeck.getByRole('button', { name: /Basic Attack/ })\n  const guardButton = commandDeck.getByRole('button', { name: /Guard/ })\n")
          t = t.replace("  await expect(page.getByTestId('combat-mode-instruction')).toContainText('Choose your action')\n", "  await expect(page.getByTestId('combat-mode-instruction')).toContainText('Choose your action')\n  await expect(page.getByText(/100 AP/).first()).toBeVisible()\n\n  await page.getByRole('button', { name: /Chat Self/ }).click()\n  await page.getByLabel('Battle chat message').fill('Testing solo battle chat')\n  await page.getByRole('button', { name: 'Send' }).click()\n  await expect(page.getByText('Testing solo battle chat', { exact: true })).toBeVisible()\n  await page.getByRole('button', { name: /Chat Self/ }).click()\n\n  await page.getByRole('button', { name: `Show ${characterName} combat details` }).click()\n  await expect(page.getByText(`${characterName} · combat details`)).toBeVisible()\n  await expect(page.getByText('Initiative', { exact: true })).toBeVisible()\n  await page.getByRole('button', { name: 'Close combatant details' }).click()\n")
          t = t.replace("    'leaves 0% Action Economy',\n", "    'leaves 0 AP',\n")
          t = t.replace("  await expect(confirmButton).toBeEnabled()\n  await confirmButton.click()\n", "  await expect(confirmButton).toBeEnabled()\n  await expect(page.getByText(/100 AP proposed/)).toBeVisible()\n  await confirmButton.click()\n", 1)
          t = t.replace("    'Movement committed. 0% Action Economy remains.',\n", "    'Movement committed. 0 AP remains.',\n")

          attack_marker = """  await attackButton.click()\n  await page.getByRole('button', { name: /occupied by Recruit/ }).click()\n"""
          quick_commit = """  if (testInfo.project.name === 'mobile-chromium') {\n    await guardButton.tap()\n    await guardButton.tap()\n  } else {\n    await guardButton.dblclick()\n  }\n  await expect(page.getByTestId('combat-mode-instruction')).toContainText('Guarded for 2 turns', {\n    timeout: 10_000,\n  })\n  await expect(page.getByRole('progressbar', { name: 'Action Economy remaining' })).toHaveAttribute(\n    'aria-valuenow',\n    '70',\n  )\n\n  await attackButton.click()\n  await page.getByRole('button', { name: /occupied by Recruit/ }).click()\n"""
          if t.count(attack_marker) != 1:
              raise SystemExit('attack marker mismatch in browser test')
          t = t.replace(attack_marker, quick_commit)
          old_final = """  await expect(page.getByRole('progressbar', { name: 'Action Economy remaining' })).toHaveAttribute(\n    'aria-valuenow',\n    '70',\n  )\n\n  const roundButton"""
          new_final = """  await expect(page.getByRole('progressbar', { name: 'Action Economy remaining' })).toHaveAttribute(\n    'aria-valuenow',\n    '40',\n  )\n\n  const roundButton"""
          if t.count(old_final) != 1:
              raise SystemExit('post-attack economy assertion mismatch')
          t = t.replace(old_final, new_final)
          test.write_text(t)

          usability = Path('apps/web/e2e/battle-usability.pw.ts')
          u = usability.read_text().replace("'50% Action Economy'", "'50 AP'")
          usability.write_text(u)
          PY

          git rm .github/workflows/a1-temporary-battle-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete A1 battle interaction feedback"
          git push origin HEAD:agent/a1-feedback-holistic
