name: One-shot format cinematic entry

on:
  push:
    branches:
      - agent/ambient-motion-visibility-tune-20260917

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ambient-motion-visibility-tune-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/web/e2e/account-layout-regression.pw.ts \
            apps/web/e2e/character-roster-layout-regression.pw.ts \
            apps/web/src/components/account/account-entry-shell.module.css \
            apps/web/src/components/character/character-select-shell.module.css
          rm .github/workflows/format-cinematic-entry-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/e2e/account-layout-regression.pw.ts \
            apps/web/e2e/character-roster-layout-regression.pw.ts \
            apps/web/src/components/account/account-entry-shell.module.css \
            apps/web/src/components/character/character-select-shell.module.css \
            .github/workflows/format-cinematic-entry-once.yml
          git commit -m "chore: format cinematic entry and roster changes"
          git push origin HEAD:agent/ambient-motion-visibility-tune-20260917
