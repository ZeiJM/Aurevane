name: Sitewide v2 formatter

on:
  push:
    branches:
      - agent/sitewide-layout-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sitewide-layout-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format shell CSS
        run: pnpm exec prettier --write apps/web/src/components/shell/authenticated-game-shell.module.css
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/shell/authenticated-game-shell.module.css
          git commit -m "style: format compact game frame"
          git push origin HEAD:agent/sitewide-layout-v2
