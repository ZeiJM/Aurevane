name: Temporary Battle Log full-history integration

on:
  push:
    branches:
      - fix/battle-log-full-history-20260825

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-log-full-history-20260825
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply surgical Battle Log history changes
        shell: bash
        run: |
          python - <<'PY'
