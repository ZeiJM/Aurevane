name: Poison copy boundary audit
on:
  push:
    branches: [review/poison-copy-boundary-audit-20260916]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1855ac00c9a808beb27e4feeda4201ad5e3b902
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve unchanged review probe and check out exact test-first source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/poison-copy-boundary-audit.yml /tmp/probe-workflow.txt
          git fetch --depth=4 origin 22705eb75ebad809586e570c103b73b46fe73be2
          git checkout --detach 22705eb75ebad809586e570c103b73b46fe73be2
          test "$(git rev-parse HEAD)" = 22705eb75ebad809586e570c103b73b46fe73be2
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          git fetch --depth=1 origin 6e3d5146b84c29f6ff2d11a12d0a7fc91d91bed7
          git show 6e3d5146b84c29f6ff2d11a12d0a7fc91d91bed7:scripts/poison-copy-implementation.py > /tmp/poison-recipe.py
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          source = Path('packages/game-core/src/combat/combat-poison-copy.test.ts').read_text()
          header = source.split("describe('Curse Poison: explicit authored and persisted copy policy'")[0]
          workflow = Path('/tmp/probe-workflow.txt').read_text()
          probe = workflow.split("cat >> packages/game-core/src/combat/combat-poison-copy-independent.test.ts <<'TEST'\n")[1].split('\n          TEST\n')[0]
          Path('packages/game-core/src/combat/combat-poison-copy-independent.test.ts').write_text(header + dedent(probe))
          PY
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-poison-copy-independent.test.ts
      - name: Assemble inspected recipe without changing the behavior under review
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/replace.txt <<'PY'
          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              scoped = [
                  '  sourceActionId: string,\n): CombatEncounterState {',
                  '  const effectState = normalizeCombatEffectState(state.effectState)\n  const existing = effectState.poison.find(',
              ]
              if path.endswith('/combat-dots.ts') and old in scoped:
                  start = text.index('export function applyCurrentPoisonState(')
                  end = text.index('export function removeCurrentPoisonState(', start)
                  section = text[start:end]
                  assert section.count(old) == 1
                  text = text[:start] + section.replace(old, new) + text[end:]
                  print('RECIPE_MATCH_CORRECTION: Poison-specific site', old[:90])
              else:
                  if path.endswith('/actions-legacy.ts') and '.copies.length ===\n        0' in old:
                      old = old.replace('.copies.length ===\n        0', '.copies\n        .length === 0')
                  actual = text.count(old)
                  assert actual == count, (path, old[:140], actual, count)
                  text = text.replace(old, new)
              file.write_text(text)
          PY
          python3 <<'PY'
          from pathlib import Path
          recipe = Path('/tmp/poison-recipe.py').read_text()
          start = recipe.index('def replace(')
          end = recipe.index('\n\nstate =', start)
          recipe = recipe[:start] + Path('/tmp/replace.txt').read_text() + recipe[end:]
          exec(compile(recipe, '/tmp/poison-recipe-reviewed.py', 'exec'))
          file = Path('packages/game-core/src/combat/combat-status-copy.ts')
          text = file.read_text()
          assert text.count("effectType: 'copy-statuses',") == 2
          file.write_text(text.replace("effectType: 'copy-statuses',", "effectType: 'copy-statuses' as const,"))
          PY
          pnpm exec prettier --write packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/combat-status-copy.ts
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-poison-copy.test.ts src/combat/combat-status-copy.test.ts src/combat/combat-status-copy-publication.test.ts src/combat/combat-poison-edges.test.ts src/combat/combat-poison-movement.test.ts
      - name: Diagnose compatibility and test the smallest isolated correction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-poison-copy-independent.test.ts --reporter=json --outputFile=/tmp/compat.json > /tmp/compat.log 2>&1
          outcome=$?
          set -e
          python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/compat.json').read_text())
          print('BEFORE_CORRECTION:', data['numPassedTests'], 'passed;', data['numFailedTests'], 'failed')
          assert data['numFailedTests'] == 2 and data['numTotalTests'] == 2
          for suite in data['testResults']:
              for case in suite['assertionResults']:
                  if case['status'] == 'failed': print(case['fullName'], '\n'.join(case.get('failureMessages', []))[:800])
          file = Path('packages/game-core/src/combat/combat-status-copy.ts')
          text = file.read_text()
          old = 'state: { ...state, statusState, effectState: nextEffectState }'
          assert text.count(old) == 1
          file.write_text(text.replace(old, 'state: { ...state, statusState, ...(nextPoison ? { effectState: nextEffectState } : {}) }'))
          PY
          test "$outcome" -ne 0
          pnpm --filter @aurevane/game-core typecheck
          pnpm --filter @aurevane/game-core exec vitest run src/combat/combat-poison-copy-independent.test.ts src/combat/combat-poison-copy.test.ts src/combat/combat-status-copy.test.ts src/combat/combat-status-copy-publication.test.ts src/combat/combat-poison-edges.test.ts src/combat/combat-poison-movement.test.ts
          git restore --source=HEAD -- docs/COMBAT.md packages/game-core/src/combat/combat-effect-state.ts packages/game-core/src/combat/combat-dots.ts packages/game-core/src/combat/actions-legacy.ts packages/game-core/src/combat/combat-authoring-validation.ts packages/game-core/src/combat/combat-status-copy.ts
          rm packages/game-core/src/combat/combat-poison-copy-independent.test.ts
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'READ_ONLY_DIAGNOSIS_COMPLETE: no production commit, push, merge or deployment'
