name: Format Foundation Trio Content

on:
  push:
    branches:
      - content/foundation-trio-skills-20260907
    paths:
      - '.github/workflows/tmp-format-foundation-trio.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/foundation-trio-skills-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format owned files
        run: |
          pnpm exec prettier --write \
            packages/game-core/src/combat/foundation-trio-skills.ts \
            packages/game-core/src/combat/foundation-trio-essences.ts \
            packages/game-core/src/combat/foundation-trio-resonances.ts \
            packages/game-core/src/combat/foundation-trio-content.test.ts \
            apps/web/src/components/battle/battle-skill-presentation.ts \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-profile-shell.module.css \
            apps/web/src/components/character/character-profile-details.module.css
          git config user.name "Aurevane Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            packages/game-core/src/combat/foundation-trio-skills.ts \
            packages/game-core/src/combat/foundation-trio-essences.ts \
            packages/game-core/src/combat/foundation-trio-resonances.ts \
            packages/game-core/src/combat/foundation-trio-content.test.ts \
            apps/web/src/components/battle/battle-skill-presentation.ts \
            apps/web/src/components/character/character-profile-shell.tsx \
            apps/web/src/components/character/character-profile-shell.module.css \
            apps/web/src/components/character/character-profile-details.module.css
          git diff --cached --quiet || git commit -m "Format expanded class content"
          git push origin HEAD:content/foundation-trio-skills-20260907
