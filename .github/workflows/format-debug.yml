name: Format debug

on:
  push:
    branches:
      - agent/hq-concept-ui-v11

permissions:
  contents: write

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/character/character-creation-experience.module.css \
            apps/web/src/components/character/character-creation-experience.tsx \
            packages/game-core/src/character/starter-options.test.ts
          git diff --check
          if git diff --quiet -- \
            apps/web/src/components/character/character-creation-experience.module.css \
            apps/web/src/components/character/character-creation-experience.tsx \
            packages/game-core/src/character/starter-options.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/character/character-creation-experience.module.css \
            apps/web/src/components/character/character-creation-experience.tsx \
            packages/game-core/src/character/starter-options.test.ts
          git commit -m "chore: format HQ character creation"
          git push origin HEAD:agent/hq-concept-ui-v11
