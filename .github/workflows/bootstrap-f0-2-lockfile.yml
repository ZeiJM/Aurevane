name: Bootstrap F0.2 lockfile

on:
  push:
    branches:
      - agent/ticket-0-2-infrastructure-persistence
    paths:
      - '.github/workflows/bootstrap-f0-2-lockfile.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Resolve F0.2 dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json packages/db/package.json packages/validation/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Lock F0.2 infrastructure dependencies"
          git push
