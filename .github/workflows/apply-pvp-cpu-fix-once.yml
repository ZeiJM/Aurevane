name: Apply PvP CPU fix once

on:
  push:
    branches:
      - fix/pvp-high-cpu-surgical-20260824

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cpu-fix-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pvp-high-cpu-surgical-20260824
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Apply surgical PvP CPU reductions
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/web/src/components/battle/pvp-battle-experience.tsx",
              "const WAITING_PLAYER_POLL_MS = 350",
              "const WAITING_PLAYER_POLL_MS = 1000",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-battle-quality-controls.tsx",
              "const CLOCK_POLL_MS = 1000\nconst MAX_RECONNECT_DELAY_MS = 5000",
              """const CLOCK_WATCHDOG_MS = 5000
          const CLOCK_RECONNECT_BASE_MS = 1000
          const CLOCK_DEADLINE_GRACE_MS = 150
          const CLOCK_MIN_DELAY_MS = 250
          const MAX_RECONNECT_DELAY_MS = 5000

          function nextClockRefreshDelay(clock: ClockView): number | null {
            if (!clock.active || !clock.deadlineAt) return null
            const deadline = new Date(clock.deadlineAt).getTime()
            if (!Number.isFinite(deadline)) return CLOCK_RECONNECT_BASE_MS
            const untilDeadline = deadline - Date.now() + CLOCK_DEADLINE_GRACE_MS
            return Math.min(CLOCK_WATCHDOG_MS, Math.max(CLOCK_MIN_DELAY_MS, untilDeadline))
          }""",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-battle-quality-controls.tsx",
              """  const battleIsActive = battle?.snapshot.tactical.battle.lifecycle === 'active'
          const localTurn = Boolean(""",
              """  const battleIsActive = battle?.snapshot.tactical.battle.lifecycle === 'active'
          const battleTurnNumber = battle?.snapshot.tactical.battle.turnNumber ?? null
          const battleTurnCombatantId = battle?.snapshot.tactical.battle.currentTurn?.combatantId ?? null
          const localTurn = Boolean(""",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-battle-quality-controls.tsx",
              """  useEffect(() => {
            let cancelled = false
            let timer: number | null = null
            let reconnectDelay = CLOCK_POLL_MS
            let completed = false

            async function refresh() {
              try {
                const clockResponse = await fetch(`/api/pvp/battles/${battleSessionId}/turn-clock`, {
                  method: 'POST',
                  cache: 'no-store',
                })
                const clockBody = (await clockResponse.json()) as TickResponse
                if (cancelled) return

                if (clockResponse.ok && clockBody.tick) {
                  setClock(clockBody.tick.clock)
                  setError(null)
                  reconnectDelay = CLOCK_POLL_MS

                  if (clockBody.tick.battle) {
                    setBattle(clockBody.tick.battle)
                    completed = clockBody.tick.battle.snapshot.tactical.battle.lifecycle === 'completed'
                  }
                } else {
                  setError(clockBody.error?.message ?? 'Turn clock unavailable.')
                  reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY_MS)
                }
              } catch {
                if (!cancelled) {
                  setError('Turn clock reconnecting…')
                  reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY_MS)
                }
              } finally {
                if (!cancelled && !completed) timer = window.setTimeout(refresh, reconnectDelay)
              }
            }

            void refresh()
            return () => {
              cancelled = true
              if (timer !== null) window.clearTimeout(timer)
            }
          }, [battleSessionId])""",
              """  useEffect(() => {
            if (!battleIsActive) return

            let cancelled = false
            let timer: number | null = null
            let controller: AbortController | null = null
            let inFlight = false
            let reconnectDelay = CLOCK_RECONNECT_BASE_MS
            let completed = false

            const schedule = (delay: number) => {
              if (cancelled || completed) return
              if (timer !== null) window.clearTimeout(timer)
              timer = window.setTimeout(() => void refresh(), delay)
            }

            async function refresh() {
              if (cancelled || completed || inFlight) return
              inFlight = true
              timer = null
              controller = new AbortController()
              let nextDelay: number | null = null

              try {
                const clockResponse = await fetch(`/api/pvp/battles/${battleSessionId}/turn-clock`, {
                  method: 'POST',
                  cache: 'no-store',
                  signal: controller.signal,
                })
                const clockBody = (await clockResponse.json()) as TickResponse
                if (cancelled || controller.signal.aborted) return

                if (clockResponse.ok && clockBody.tick) {
                  const nextClock = clockBody.tick.clock
                  setClock(nextClock)
                  setError(null)
                  reconnectDelay = CLOCK_RECONNECT_BASE_MS

                  if (clockBody.tick.battle) {
                    setBattle(clockBody.tick.battle)
                    completed = clockBody.tick.battle.snapshot.tactical.battle.lifecycle === 'completed'
                  }

                  nextDelay = nextClockRefreshDelay(nextClock)
                } else {
                  setError(clockBody.error?.message ?? 'Turn clock unavailable.')
                  reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY_MS)
                  nextDelay = reconnectDelay
                }
              } catch (refreshError) {
                if (
                  !cancelled &&
                  !(refreshError instanceof DOMException && refreshError.name === 'AbortError')
                ) {
                  setError('Turn clock reconnecting…')
                  reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY_MS)
                  nextDelay = reconnectDelay
                }
              } finally {
                controller = null
                inFlight = false
                if (!cancelled && !completed && nextDelay !== null) schedule(nextDelay)
              }
            }

            const wake = () => {
              if (cancelled || document.visibilityState === 'hidden') return
              if (timer !== null) {
                window.clearTimeout(timer)
                timer = null
              }
              void refresh()
            }

            const handleVisibilityChange = () => {
              if (document.visibilityState === 'visible') wake()
            }

            void refresh()
            document.addEventListener('visibilitychange', handleVisibilityChange)
            window.addEventListener('focus', wake)

            return () => {
              cancelled = true
              if (timer !== null) window.clearTimeout(timer)
              controller?.abort()
              document.removeEventListener('visibilitychange', handleVisibilityChange)
              window.removeEventListener('focus', wake)
            }
          }, [
            battleIsActive,
            battleSessionId,
            battleTurnCombatantId,
            battleTurnNumber,
          ])""",
          )

          replace_once(
              "apps/web/src/components/battle/desktop-battle-log-dock.tsx",
              """export function DesktopBattleLogDock({
            battleSessionId,
            playerName,
          }: {
            battleSessionId: string
            playerName?: string
          }) {""",
              """export function DesktopBattleLogDock({
            battleSessionId,
            playerName,
            eventDriven = false,
          }: {
            battleSessionId: string
            playerName?: string
            eventDriven?: boolean
          }) {""",
          )

          replace_once(
              "apps/web/src/components/battle/desktop-battle-log-dock.tsx",
              """  useEffect(() => {
            if (!desktop || !open) return
            const timer = window.setInterval(() => setRefreshTick((value) => value + 1), LOG_REFRESH_MS)
            return () => window.clearInterval(timer)
          }, [desktop, open])""",
              """  useEffect(() => {
            if (!desktop || !open) return

            if (eventDriven) {
              const refreshFromBattleState = (event: Event) => {
                if (!(event instanceof CustomEvent)) return
                const next = event.detail as
                  | { battleSessionId?: unknown; battleVersion?: unknown }
                  | undefined
                if (next?.battleSessionId !== battleSessionId) return
                if (typeof next.battleVersion !== 'number') return
                setRefreshTick(next.battleVersion)
              }
              window.addEventListener('aurevane:pvp-battle-state', refreshFromBattleState)
              return () =>
                window.removeEventListener('aurevane:pvp-battle-state', refreshFromBattleState)
            }

            const timer = window.setInterval(() => setRefreshTick((value) => value + 1), LOG_REFRESH_MS)
            return () => window.clearInterval(timer)
          }, [battleSessionId, desktop, eventDriven, open])""",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-battle-client-boundary.tsx",
              """      <DesktopBattleLogDock
                battleSessionId={initialBattle.battleSessionId}
                playerName={playerName}
              />""",
              """      <DesktopBattleLogDock
                battleSessionId={initialBattle.battleSessionId}
                playerName={playerName}
                eventDriven
              />""",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-spectator-experience.tsx",
              "import { useEffect, useMemo, useState, type CSSProperties } from 'react'",
              "import { useEffect, useMemo, useRef, useState, type CSSProperties } from 'react'",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-spectator-experience.tsx",
              "const MOVE_COST_PER_TERRAIN_POINT = 25",
              """const MOVE_COST_PER_TERRAIN_POINT = 25
          const SPECTATOR_REFRESH_MS = 850
          const SPECTATOR_HEARTBEAT_MS = 10_000""",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-spectator-experience.tsx",
              """  const [inspectMode, setInspectMode] = useState(false)
            const [selectedPosition, setSelectedPosition] = useState<GridPosition | null>(null)""",
              """  const [inspectMode, setInspectMode] = useState(false)
            const [selectedPosition, setSelectedPosition] = useState<GridPosition | null>(null)
            const lastHeartbeatAt = useRef(Date.now())""",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-spectator-experience.tsx",
              """  useEffect(() => {
            let cancelled = false
            const refresh = async () => {
              try {
                const response = await fetch(
                  `/api/pvp/spectate/${encodeURIComponent(spectator.battleKey)}`,
                  { cache: 'no-store' },
                )
                const body = (await response.json()) as ApiBody
                if (!response.ok || !body.spectator || cancelled) {
                  if (!cancelled) {
                    setConnectionNote(body.error?.message ?? 'Arena link interrupted. Retrying…')
                  }
                  return
                }
                setSpectator(body.spectator)
                if (body.participantTitles) setParticipantTitles(body.participantTitles)
                setConnectionNote(null)
              } catch {
                if (!cancelled) setConnectionNote('Arena link interrupted. Retrying…')
              }
            }
            const timer = window.setInterval(() => void refresh(), 850)
            return () => {
              cancelled = true
              window.clearInterval(timer)
            }
          }, [spectator.battleKey])""",
              """  useEffect(() => {
            let cancelled = false
            let timer: number | null = null
            let controller: AbortController | null = null

            const schedule = () => {
              if (cancelled) return
              timer = window.setTimeout(() => void refresh(), SPECTATOR_REFRESH_MS)
            }

            const refresh = async () => {
              controller = new AbortController()
              const heartbeat = Date.now() - lastHeartbeatAt.current >= SPECTATOR_HEARTBEAT_MS

              try {
                const params = heartbeat ? '?heartbeat=1' : ''
                const response = await fetch(
                  `/api/pvp/spectate/${encodeURIComponent(spectator.battleKey)}${params}`,
                  { cache: 'no-store', signal: controller.signal },
                )
                const body = (await response.json()) as ApiBody
                if (!response.ok || !body.spectator || cancelled || controller.signal.aborted) {
                  if (!cancelled) {
                    setConnectionNote(body.error?.message ?? 'Arena link interrupted. Retrying…')
                  }
                  return
                }
                if (heartbeat) lastHeartbeatAt.current = Date.now()
                setSpectator(body.spectator)
                if (body.participantTitles) setParticipantTitles(body.participantTitles)
                setConnectionNote(null)
              } catch (refreshError) {
                if (
                  !cancelled &&
                  !(refreshError instanceof DOMException && refreshError.name === 'AbortError')
                ) {
                  setConnectionNote('Arena link interrupted. Retrying…')
                }
              } finally {
                controller = null
                schedule()
              }
            }

            schedule()
            return () => {
              cancelled = true
              controller?.abort()
              if (timer !== null) window.clearTimeout(timer)
            }
          }, [spectator.battleKey])""",
          )

          replace_once(
              "apps/web/src/components/battle/pvp-spectator-experience.tsx",
              """  useEffect(() => {
            let cancelled = false
            let timer: number | null = null

            const refreshLog = async () => {
              try {
                const params = new URLSearchParams({ after: '0', includeLog: '1' })
                const response = await fetch(
                  `/api/pvp/battles/${encodeURIComponent(battle.battleSessionId)}/chat?${params.toString()}`,
                  { cache: 'no-store' },
                )
                const body = (await response.json()) as ApiBody
                if (cancelled) return
                if (!response.ok) {
                  setBattleLogError(body.error?.message ?? 'Battle log is temporarily unavailable.')
                  return
                }
                if (body.battleLog) setBattleLog(body.battleLog)
                setBattleLogError(null)
              } catch {
                if (!cancelled) setBattleLogError('Battle log interrupted. Retrying…')
              }
            }

            void refreshLog()
            timer = window.setInterval(() => void refreshLog(), 1200)
            return () => {
              cancelled = true
              if (timer !== null) window.clearInterval(timer)
            }
          }, [battle.battleSessionId])""",
              """  useEffect(() => {
            let cancelled = false
            const controller = new AbortController()

            const refreshLog = async () => {
              try {
                const params = new URLSearchParams({ after: '0', includeLog: '1' })
                const response = await fetch(
                  `/api/pvp/battles/${encodeURIComponent(battle.battleSessionId)}/chat?${params.toString()}`,
                  { cache: 'no-store', signal: controller.signal },
                )
                const body = (await response.json()) as ApiBody
                if (cancelled || controller.signal.aborted) return
                if (!response.ok) {
                  setBattleLogError(body.error?.message ?? 'Battle log is temporarily unavailable.')
                  return
                }
                if (body.battleLog) setBattleLog(body.battleLog)
                setBattleLogError(null)
              } catch (refreshError) {
                if (
                  !cancelled &&
                  !(refreshError instanceof DOMException && refreshError.name === 'AbortError')
                ) {
                  setBattleLogError('Battle log interrupted. Retrying…')
                }
              }
            }

            void refreshLog()
            return () => {
              cancelled = true
              controller.abort()
            }
          }, [battle.battleSessionId, battle.battleVersion])""",
          )

          replace_once(
              "apps/web/src/app/api/pvp/spectate/[battleKey]/route.ts",
              """import {
            joinPvpSpectation,
            leavePvpSpectation,
          } from '@/server/battle/pvp-battle-communication-service'""",
              """import {
            heartbeatPvpSpectation,
            joinPvpSpectation,
            leavePvpSpectation,
          } from '@/server/battle/pvp-battle-communication-service'""",
          )

          replace_once(
              "apps/web/src/app/api/pvp/spectate/[battleKey]/route.ts",
              "export async function GET(_request: Request, context: { params: Promise<{ battleKey: string }> }) {",
              "export async function GET(request: Request, context: { params: Promise<{ battleKey: string }> }) {",
          )

          replace_once(
              "apps/web/src/app/api/pvp/spectate/[battleKey]/route.ts",
              """    const battleSessionId = await joinPvpSpectation(actor.userId, battleKey)
            if (!battleSessionId || battleSessionId !== spectator.battle.battleSessionId) {
              throw new AurevaneError('INVALID_REQUEST', 'That battle is no longer available to spectate.')
            }""",
              """    const heartbeat = new URL(request.url).searchParams.get('heartbeat') === '1'
            if (heartbeat) {
              const battleSessionId = spectator.battle.battleSessionId
              const alive = await heartbeatPvpSpectation(actor.userId, battleSessionId)
              if (!alive) {
                const joinedBattleSessionId = await joinPvpSpectation(actor.userId, battleKey)
                if (!joinedBattleSessionId || joinedBattleSessionId !== battleSessionId) {
                  throw new AurevaneError(
                    'INVALID_REQUEST',
                    'That battle is no longer available to spectate.',
                  )
                }
              }
            }""",
          )

          replace_once(
              "apps/web/src/app/api/pvp/battles/[battleSessionId]/chat/route.ts",
              "  getPvpSpectatorCount,\n",
              "",
          )

          replace_once(
              "apps/web/src/app/api/pvp/battles/[battleSessionId]/chat/route.ts",
              """    const [messages, spectators, spectatorCount, battleLog] = await Promise.all([
              listPvpBattleChat(actor.userId, battleSessionId, parseAfterId(request)),
              listPvpSpectators(actor.userId, battleSessionId),
              getPvpSpectatorCount(actor.userId, battleSessionId),
              includeLog ? getPvpBattleLog(actor.userId, battleSessionId) : Promise.resolve(null),
            ])""",
              """    const [messages, spectators, battleLog] = await Promise.all([
              listPvpBattleChat(actor.userId, battleSessionId, parseAfterId(request)),
              listPvpSpectators(actor.userId, battleSessionId),
              includeLog ? getPvpBattleLog(actor.userId, battleSessionId) : Promise.resolve(null),
            ])
            const spectatorCount = spectators.length""",
          )

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-battle-quality-controls.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            'apps/web/src/app/api/pvp/spectate/[battleKey]/route.ts' \
            'apps/web/src/app/api/pvp/battles/[battleSessionId]/chat/route.ts'

      - name: Typecheck web app
        run: pnpm --filter @aurevane/web typecheck

      - name: Commit source fix
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/components/battle/pvp-battle-experience.tsx \
            apps/web/src/components/battle/pvp-battle-quality-controls.tsx \
            apps/web/src/components/battle/desktop-battle-log-dock.tsx \
            apps/web/src/components/battle/pvp-battle-client-boundary.tsx \
            apps/web/src/components/battle/pvp-spectator-experience.tsx \
            'apps/web/src/app/api/pvp/spectate/[battleKey]/route.ts' \
            'apps/web/src/app/api/pvp/battles/[battleSessionId]/chat/route.ts'
          git diff --cached --check
          git commit -m "fix: reduce PvP polling pressure [cpu-fix-applied]"
          git push origin HEAD:fix/pvp-high-cpu-surgical-20260824
