name: Temporary battle log e2e assertion fix

on:
  push:
    branches:
      - feat/rich-streamlined-battle-log-20260822

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rich-streamlined-battle-log-20260822
          fetch-depth: 0
      - name: Align browser assertion with Battle Log title
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/battle-experience.pw.ts')
          text = path.read_text()
          old = "name: 'Close combat log'"
          new = "name: 'Close battle log'"
          if old not in text:
              raise SystemExit('Expected old browser assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-fix-battle-log-e2e.yml
      - name: Commit e2e alignment and remove temporary workflow
        run: |
          git config user.name "AUREVANE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/e2e/battle-experience.pw.ts .github/workflows/tmp-fix-battle-log-e2e.yml
          git commit -m "Align battle log browser assertion"
          git push origin HEAD:feat/rich-streamlined-battle-log-20260822
