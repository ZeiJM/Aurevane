name: Format art pass once

on:
  push:
    paths:
      - '.github/workflows/format-art-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format art pass
        run: |
          pnpm exec prettier --write \
            apps/web/src/media/generated-dark-fantasy-art.ts \
            apps/web/src/media/generated-dark-fantasy-art.test.ts \
            apps/web/src/components/battle/battle-skill-presentation.ts \
            apps/web/src/components/battle/battle-skill-presentation.test.ts \
            apps/web/src/media/registry.ts \
            apps/web/src/media/battle-audio.test.ts
      - name: Commit formatting and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/media/generated-dark-fantasy-art.ts apps/web/src/media/generated-dark-fantasy-art.test.ts apps/web/src/components/battle/battle-skill-presentation.ts apps/web/src/components/battle/battle-skill-presentation.test.ts apps/web/src/media/registry.ts apps/web/src/media/battle-audio.test.ts
          git rm .github/workflows/format-art-once.yml
          git commit -m "style: format dark fantasy art integration"
          git push origin HEAD:main
