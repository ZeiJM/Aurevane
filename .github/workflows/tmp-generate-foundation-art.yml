name: Generate Foundation Class Artwork

on:
  push:
    branches:
      - content/foundation-trio-skills-20260907
    paths:
      - '.github/workflows/tmp-generate-foundation-art.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/foundation-trio-skills-20260907
      - name: Generate unique Technique, Essence, and Resonance artwork
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import hashlib
          import html
          import re

          action_ids = [
              'lifebinder.vital-sever',
              'lifebinder.searing-bloom',
              'essence.lifebinder.verdant-rupture',
              'aetherist.arc-bolt', 'aetherist.mana-burst', 'aetherist.ward-pierce',
              'aetherist.arcane-field', 'aetherist.channel', 'aetherist.mana-shield',
              'aetherist.chain-spark', 'aetherist.overchannel',
              'farstrider.aimed-shot', 'farstrider.pinning-shot', 'farstrider.volley',
              'farstrider.scouts-mark', 'farstrider.longshot', 'farstrider.piercing-barrage',
              'farstrider.fieldcraft', 'farstrider.keen-focus',
              'shadehand.backstab', 'shadehand.feint', 'shadehand.smoke-vial',
              'shadehand.crippling-cut', 'shadehand.exploit-opening', 'shadehand.fan-of-knives',
              'shadehand.quick-hands', 'shadehand.execution-cut',
              'essence.aetherist.aether-nova',
              'essence.farstrider.deadeye-barrage',
              'essence.shadehand.perfect-opening',
          ]

          resonance_ids = [
              'resonance.aetherist-farstrider.arcane-hunt',
              'resonance.aetherist-lifebinder.vital-circuit',
              'resonance.aetherist-shadehand.veiled-conduit',
              'resonance.aetherist-vanguard.spellsteel-rhythm',
              'resonance.farstrider-lifebinder.guided-renewal',
              'resonance.farstrider-shadehand.marked-opening',
              'resonance.farstrider-vanguard.covering-break',
              'resonance.lifebinder-shadehand.mercy-in-shadow',
              'resonance.shadehand-vanguard.broken-line',
          ]

          palette = {
              'vanguard': ('#d9784d', '#6d2d1e', '#ffc08d'),
              'lifebinder': ('#5fcf95', '#1c6745', '#d3ffb7'),
              'aetherist': ('#a47cf5', '#4b318a', '#8deaff'),
              'farstrider': ('#74c368', '#315d2b', '#f0d36c'),
              'shadehand': ('#ca68b5', '#5d2b55', '#bc8cff'),
          }

          out = Path('apps/web/public/media/skills/phase3/generated')
          out.mkdir(parents=True, exist_ok=True)

          def slug(value: str) -> str:
              return value.replace('.', '-').replace('_', '-').replace('/', '-')

          def discipline_for(action_id: str) -> str:
              parts = action_id.split('.')
              return parts[1] if parts[0] in ('essence', 'resonance') else parts[0]

          def art_svg(item_id: str, colors, label: str, resonance=False) -> str:
              digest = hashlib.sha256(item_id.encode()).digest()
              c1, c2, c3 = colors
              points = []
              for i in range(6):
                  x = 18 + digest[i] % 93
                  y = 18 + digest[i + 6] % 93
                  points.append((x, y))
              path = ' '.join(f'{x},{y}' for x, y in points)
              ring = 22 + digest[15] % 22
              rot = digest[16] % 180
              rays = []
              for i in range(6):
                  x1 = 18 + digest[17+i] % 92
                  y1 = 18 + digest[23+i] % 92
                  x2 = 18 + digest[29+i] % 92
                  y2 = 18 + digest[35+i] % 92
                  rays.append(f'<path d="M{x1} {y1} L{x2} {y2}"/>')
              sigil = ''.join(rays)
              title = html.escape(label)
              resonance_layer = ''
              if resonance:
                  resonance_layer = f'<circle cx="64" cy="64" r="43" fill="none" stroke="{c3}" stroke-width="2" stroke-dasharray="5 7" opacity=".62"/>'
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="{title}">
<defs>
  <radialGradient id="bg" cx="30%" cy="25%" r="90%"><stop offset="0" stop-color="{c1}" stop-opacity=".42"/><stop offset=".58" stop-color="{c2}" stop-opacity=".32"/><stop offset="1" stop-color="#03070a"/></radialGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="{c3}"/><stop offset="1" stop-color="{c1}"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="128" height="128" rx="18" fill="#05090d"/>
<rect x="4" y="4" width="120" height="120" rx="15" fill="url(#bg)" stroke="{c1}" stroke-opacity=".38"/>
<g fill="none" stroke="url(#stroke)" stroke-linecap="round" filter="url(#glow)" opacity=".9" transform="rotate({rot} 64 64)">
  <circle cx="64" cy="64" r="{ring}" stroke-width="3" opacity=".9"/>
  <polyline points="{path}" stroke-width="4" stroke-linejoin="round"/>
  {sigil}
</g>
{resonance_layer}
<circle cx="64" cy="64" r="7" fill="{c3}" opacity=".88" filter="url(#glow)"/>
<circle cx="64" cy="64" r="3" fill="#f7fff9"/>
</svg>'''

          action_map = {}
          for action_id in action_ids:
              d = discipline_for(action_id)
              colors = palette[d]
              file_name = slug(action_id) + '.svg'
              (out / file_name).write_text(art_svg(action_id, colors, action_id), encoding='utf-8')
              action_map[action_id] = f'/media/skills/phase3/generated/{file_name}'

          resonance_map = {}
          for resonance_id in resonance_ids:
              pair = resonance_id.split('.')[1].split('-')
              left = palette[pair[0]]
              right = palette[pair[1]]
              colors = (left[0], right[1], right[2])
              file_name = slug(resonance_id) + '.svg'
              (out / file_name).write_text(art_svg(resonance_id, colors, resonance_id, True), encoding='utf-8')
              resonance_map[resonance_id] = f'/media/skills/phase3/generated/{file_name}'

          target = Path('apps/web/src/components/battle/battle-skill-presentation.ts')
          text = target.read_text(encoding='utf-8')
          marker = "const ACTION_ARTWORK = new Map<string, string>(["
          if marker not in text:
              raise SystemExit('ACTION_ARTWORK marker not found')

          def ts_record(name, mapping):
              lines = [f'const {name}: Readonly<Record<string, string>> = {{']
              for key, value in mapping.items():
                  lines.append(f"  '{key}': '{value}',")
              lines.append('}')
              return '\n'.join(lines)

          block = ts_record('GENERATED_ACTION_ARTWORK', action_map) + '\n\n' + ts_record('GENERATED_RESONANCE_ARTWORK', resonance_map) + '\n\n'
          text = text.replace(marker, block + marker, 1)
          text = text.replace(
              "export function battleSkillArtwork(actionId: string): string {\n  return ACTION_ARTWORK.get(actionId) ?? BATTLE_MISSING_ARTWORK\n}",
              "export function battleSkillArtwork(actionId: string): string {\n  return GENERATED_ACTION_ARTWORK[actionId] ?? ACTION_ARTWORK.get(actionId) ?? BATTLE_MISSING_ARTWORK\n}",
              1,
          )
          text = text.replace(
              "export function battleResonanceArtwork(resonanceId: string): string {\n  return RESONANCE_ARTWORK.get(resonanceId) ?? BATTLE_MISSING_ARTWORK\n}",
              "export function battleResonanceArtwork(resonanceId: string): string {\n  return GENERATED_RESONANCE_ARTWORK[resonanceId] ?? RESONANCE_ARTWORK.get(resonanceId) ?? BATTLE_MISSING_ARTWORK\n}",
              1,
          )
          target.write_text(text, encoding='utf-8')
          PY

          git config user.name "Aurevane Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/media/skills/phase3/generated apps/web/src/components/battle/battle-skill-presentation.ts
          git commit -m "Add unique artwork for expanded class content"
          git push origin HEAD:content/foundation-trio-skills-20260907
