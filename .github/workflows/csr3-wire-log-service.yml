name: CSR3 Wire Log Service

on:
  push:
    branches:
      - agent/combat-csr3-historical-privacy-20260917
    paths:
      - .github/workflows/csr3-wire-log-service.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr3-historical-privacy-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - run: python .github/scripts/csr3-wire-log-service.py
      - run: |
          pnpm exec prettier --write \
            apps/web/src/server/battle/battle-log-service.ts \
            apps/web/src/server/battle/battle-log-service.privacy.test.ts \
            apps/web/src/app/api/battles/[battleSessionId]/events/route.ts
      - run: pnpm --filter @aurevane/web typecheck
      - run: pnpm --filter @aurevane/web exec vitest run src/server/battle/battle-log-service.privacy.test.ts
      - name: Commit tested log wiring
        run: |
          rm .github/scripts/csr3-wire-log-service.py .github/workflows/csr3-wire-log-service.yml
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add apps/web/src/server/battle/battle-log-service.ts \
            apps/web/src/server/battle/battle-log-service.privacy.test.ts \
            apps/web/src/app/api/battles/[battleSessionId]/events/route.ts \
            .github/scripts/csr3-wire-log-service.py \
            .github/workflows/csr3-wire-log-service.yml
          git diff --cached --check
          git commit -m 'feat(combat): project CSR-3 battle logs by viewer'
          git push origin HEAD:agent/combat-csr3-historical-privacy-20260917

# rerun from consolidated CSR-3 authority head
