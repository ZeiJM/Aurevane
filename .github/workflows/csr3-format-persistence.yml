name: CSR3 Format Persistence

on:
  push:
    branches:
      - agent/combat-csr3-historical-privacy-20260917
    paths:
      - .github/workflows/csr3-format-persistence.yml

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combat-csr3-historical-privacy-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format persistence files
        run: |
          pnpm exec prettier --write \
            packages/db/src/battle-session.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.privacy.test.ts
      - name: Focused persistence test
        run: pnpm --filter @aurevane/web exec vitest run src/server/battle/supabase-battle-session-repository.privacy.test.ts
      - name: Commit formatter output
        run: |
          rm .github/workflows/csr3-format-persistence.yml
          git config user.name 'Nicholas JM'
          git config user.email '283436098+ZeiJM@users.noreply.github.com'
          git add packages/db/src/battle-session.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.ts \
            apps/web/src/server/battle/supabase-battle-session-repository.privacy.test.ts \
            .github/workflows/csr3-format-persistence.yml
          git diff --cached --check
          git commit -m 'style(combat): normalize CSR-3 privacy persistence'
          git push origin HEAD:agent/combat-csr3-historical-privacy-20260917
